<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <defs>
    <pattern id="disc-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#555555"/>
      <circle cx="5" cy="5" r="0.9" fill="#555555"/>
    </pattern>
    <marker id="axis-arrow21" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Left segment of x-axis behind disc -->
  <line class="movable" x1="20" y1="150" x2="160" y2="150" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical Circular Disc (drawn in perspective as vertical ellipse) -->
  <ellipse class="movable" cx="160" cy="150" rx="65" ry="130" fill="url(#disc-stipple)" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Right segment of x-axis piercing through center O to +x direction -->
  <line class="movable" x1="160" y1="150" x2="380" y2="150" stroke="#000000" stroke-width="1.8" marker-end="url(#axis-arrow21)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Center point O -->
  <circle class="movable" cx="160" cy="150" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- O (Center Origin) -->
  <g class="movable text-wrap" transform="translate(160, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- 면적 S -->
  <g class="movable text-wrap" transform="translate(160, 225) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-24" width="52" height="48" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-10" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">면적</text>
    <text class="text-el" x="0" y="12" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">S</text>
  </g>

  <!-- x 축 -->
  <g class="movable text-wrap" transform="translate(390, 180) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-24" y="-14" width="48" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000"><tspan font-style="italic">x</tspan><tspan font-family="'Malgun Gothic', sans-serif" font-size="18"> 축</tspan></text>
  </g>
</svg>
</body>
</html>
