<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-52-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Horizontal Axis: 시간 t -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="35" y1="270" x2="380" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-52-2)"/>
  <g class="movable text-wrap" transform="translate(330, 280)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" text-anchor="start">시간 <tspan font-family="Times New Roman, serif" font-style="italic">t</tspan></text>
  </g>

  <!-- Vertical Axis: V1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="320" x2="80" y2="40" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-52-2)"/>
  <g class="movable text-wrap" transform="translate(35, 30)">
    <text class="text-el" x="20" y="20" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan dy="3" font-size="14">1</tspan></text>
  </g>

  <!-- Origin 0 -->
  <g class="movable text-wrap" transform="translate(48, 275)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">0</text>
  </g>

  <!-- Ticks -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="74" y1="130" x2="80" y2="130" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(35, 118)">
    <text class="text-el" x="20" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan dy="3" font-size="14">0</tspan></text>
  </g>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="270" x2="200" y2="276" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(190, 278)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">T</text>
  </g>

  <!-- Pulse Curve -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="270" x2="80" y2="130" stroke="#000000" stroke-width="3.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="130" x2="200" y2="130" stroke="#000000" stroke-width="3.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="130" x2="200" y2="270" stroke="#000000" stroke-width="3.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="270" x2="305" y2="270" stroke="#000000" stroke-width="3.5"/>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(210, 385)">
    <text class="text-el" x="0" y="20" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2 - 2</text>
  </g>
</svg>
</body>
</html>
