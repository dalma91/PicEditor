<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-65" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="stipple-65" width="6" height="6" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#64748b"/>
    </pattern>
  </defs>

  <!-- Cylinder Body (안쪽 단면적 S) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="80" x2="490" y2="80" stroke="#000000" stroke-width="4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="310" x2="490" y2="310" stroke="#000000" stroke-width="4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="490" y1="80" x2="490" y2="310" stroke="#000000" stroke-width="5"/>
  <g class="movable text-wrap" transform="translate(500, 185)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">S</text>
  </g>

  <!-- Piston at equilibrium (질량 M) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="180" y="82" width="35" height="226" fill="url(#stipple-65)" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(185, 140)">
    <rect class="text-bg-rect" x="0" y="0" width="25" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="12" y="20" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">M</text>
  </g>

  <!-- Displaced Piston (dashed block) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="235" y="82" width="35" height="226" fill="url(#stipple-65)" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- Displacement x arrow -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="215" y1="220" x2="235" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-65)"/>
  <g class="movable text-wrap" transform="translate(220, 195)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">x</text>
  </g>

  <!-- x-axis label -->
  <g class="movable text-wrap" transform="translate(280, 330)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16"><tspan font-family="Times New Roman, serif" font-style="italic">x</tspan>축</text>
  </g>

  <!-- Length L dimension -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="215" y1="55" x2="490" y2="55" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-65)" marker-end="url(#arrow-65)"/>
  <g class="movable text-wrap" transform="translate(345, 25)">
    <rect class="text-bg-rect" x="0" y="0" width="22" height="24" fill="#FFFFFF"/>
    <text class="text-el" x="11" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">L</text>
  </g>

  <!-- Projectile (질량 m, 속력 v) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="45" cy="195" r="10" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(35, 160)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">m</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="70" y1="195" x2="155" y2="195" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-65)"/>
  <g class="movable text-wrap" transform="translate(105, 198)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">v</text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(280, 395)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>
</svg>
</body>
</html>
