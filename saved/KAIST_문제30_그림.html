<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="100%" height="100%">
  <defs>
    <marker id="v-arr30" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Circular Orbit of Electron (radius a=140) -->
  <circle class="movable" cx="160" cy="180" r="140" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Nucleus +e at center -->
  <circle class="movable" cx="160" cy="180" r="6" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius line from center to electron at (260, 80) -->
  <line class="movable" x1="160" y1="180" x2="260" y2="80" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius dimension a arc -->
  <path class="movable" d="M 166 186 C 210 200 245 150 263 85" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Electron -e (black dot) -->
  <circle class="movable" cx="260" cy="80" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Tangential velocity vector v (perpendicular to radius, pointing up-left) -->
  <!-- Vector dx=-70, dy=-70 (angle 135 deg) -->
  <line class="movable" x1="260" y1="80" x2="205" y2="25" stroke="#000000" stroke-width="2" marker-end="url(#v-arr30)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Out-of-page Magnetic Field symbol ⊙ -->
  <circle class="movable" cx="50" cy="380" r="12" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="50" cy="380" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- +e (Nucleus) -->
  <g class="movable text-wrap" transform="translate(160, 208) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-18" y="-12" width="36" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">+<tspan font-style="italic">e</tspan></text>
  </g>

  <!-- -e (Electron) -->
  <g class="movable text-wrap" transform="translate(225, 70) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-12" width="32" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">−<tspan font-style="italic">e</tspan></text>
  </g>

  <!-- a (Radius) -->
  <g class="movable text-wrap" transform="translate(230, 130) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">a</text>
  </g>

  <!-- v (Velocity) -->
  <g class="movable text-wrap" transform="translate(255, 38) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">v</text>
  </g>

  <!-- Magnetic field description: B (종이면 뒤에서 앞으로) -->
  <g class="movable text-wrap" transform="translate(175, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-100" y="-20" width="200" height="40" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-8" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B<tspan font-family="'Malgun Gothic', sans-serif" font-size="16" font-style="normal"> (종이면 뒤에서</tspan></text>
    <text class="text-el" x="0" y="14" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">앞으로)</text>
  </g>
</svg>
</body>
</html>
