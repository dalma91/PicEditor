<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0039_2003.145.2.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 650 750" width="650" height="750" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 3D 직육면체 도체 블록 -->
    <!-- 전면: K(70, 440), L(70, 580), Q(340, 580), P(340, 440) -->
    <!-- 후면: N(290, 160), M(290, 300), R(560, 300), S(560, 160) -->
    
    <!-- 뒷면 숨은선 점선들 -->
    <line class="movable" x1="70" y1="580" x2="290" y2="300" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="290" y1="300" x2="290" y2="160" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="290" y1="300" x2="560" y2="300" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 블록 실선 외곽선 -->
    <!-- 상면 -->
    <polygon class="movable" points="70,440 290,160 560,160 340,440" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 전면 -->
    <polygon class="movable" points="70,440 340,440 340,580 70,580" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 우측면 -->
    <polygon class="movable" points="340,440 560,160 560,300 340,580" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 전류 I 입사선 (전면 중심 관통 입사) -->
    <line class="movable" x1="80" y1="680" x2="190" y2="520" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 내부 전류 경로 점선 -->
    <line class="movable" x1="190" y1="520" x2="425" y2="230" stroke="#000000" stroke-width="2" stroke-dasharray="5,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 후면 전류 출사선 -->
    <line class="movable" x1="425" y1="230" x2="550" y2="65" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 자기장 B 거대 상향 화살표 -->
    <polygon class="movable" points="330,320 370,320 370,220 400,220 350,100 300,220 330,220" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 전압계 회로 (좌측면 ~ 우측면 연결) -->
    <path class="movable" d="M 180,300 L 80,300 L 80,380 L 160,380" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 450,370 L 485,370 L 485,420 L 450,420" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 전압계 원 및 V -->
    <circle class="movable" cx="135" cy="285" r="38" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 치수선 d (전면 좌측 높이 호) -->
    <path class="movable" d="M 70,440 Q 15,510 70,580" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 치수선 w (전면 하단 폭 호) -->
    <path class="movable" d="M 70,580 Q 205,640 340,580" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 3D 좌표축계 O-xyz (우측 하단) -->
    <line class="movable" x1="470" y1="640" x2="620" y2="640" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="470" y1="640" x2="470" y2="500" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="470" y1="640" x2="545" y2="540" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="340" y="80" font-family="'Times New Roman', serif" font-size="34" font-style="italic" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="495" y="110" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="bold" text-anchor="start">I</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="660" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="bold" text-anchor="start">I</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="90" y="240" font-family="'Malgun Gothic', sans-serif" font-size="24" font-style="normal" font-weight="normal" text-anchor="start">전압계</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="125" y="295" font-family="'Times New Roman', serif" font-size="34" font-style="normal" font-weight="bold" text-anchor="start">V</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="50" y="435" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">K</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="45" y="605" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="315" y="435" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">P</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="350" y="605" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">Q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="270" y="150" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">N</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="265" y="320" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">M</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="535" y="150" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">S</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="565" y="320" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">R</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="5" y="520" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">d</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="195" y="645" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">w</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="440" y="660" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="625" y="645" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="555" y="535" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="465" y="485" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">z</text></g>
