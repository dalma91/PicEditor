<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.140.2.파동_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1530 920" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 고정벽 해칭 패턴 -->
    <pattern id="wall-pattern" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="2.0"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wave-line { stroke: #000000; stroke-width: 3.5; fill: none; }
    .string-line { stroke: #000000; stroke-width: 3.0; fill: none; }
    .pointer { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 우상단: 펄스 진행 개요도 -->
    <!-- ========================================== -->
    <!-- 고정벽 (우측 끝) -->
    <line class="movable" x1="1420" y1="210" x2="1420" y2="520" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="1420" y="210" width="35" height="310" fill="url(#wall-pattern)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 줄 및 파동 펄스 -->
    <!-- 좌측 줄: (780, 330) -> (960, 330) -->
    <line class="movable string-line" x1="780" y1="330" x2="960" y2="330" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 펄스 볼록 부분: (960, 330) -> 정점 (1025, 260) -> (1090, 330) -->
    <path class="movable wave-line" d="M 960 330 C 975 330, 995 260, 1025 260 C 1055 260, 1075 330, 1090 330" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 줄: (1090, 330) -> (1420, 330) -->
    <line class="movable string-line" x1="1090" y1="330" x2="1420" y2="330" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 장력 F 화살표 (좌향) -->
    <line class="movable" x1="845" y1="305" x2="735" y2="305" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="790" y="275" transform="translate(0,0) scale(1,1) rotate(0)">F</text>

    <!-- 속도 v 화살표 (우향) -->
    <line class="movable" x1="975" y1="250" x2="1085" y2="250" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1030" y="215" transform="translate(0,0) scale(1,1) rotate(0)">v</text>

    <!-- 좌표축 (x, y) -->
    <line class="movable" x1="1160" y1="260" x2="1350" y2="260" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1380" y="260" transform="translate(0,0) scale(1,1) rotate(0)">x</text>
    <line class="movable" x1="1160" y1="260" x2="1160" y2="80" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1160" y="50" transform="translate(0,0) scale(1,1) rotate(0)">y</text>

    <!-- 펄스 선단 확대 원 (점선 원) -->
    <circle class="movable" cx="1090" cy="330" r="50" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 확대 지시선 -->
    <line class="movable" x1="1065" y1="385" x2="1065" y2="445" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1100" y1="385" x2="1100" y2="445" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-bold" x="1060" y="485">확대도</text>
    </g>
    <!-- 확대도 연결 화살표 (두 줄 굽은 화살표) -->
    <path class="movable pointer" d="M 1050 515 C 960 550, 910 600, 860 670" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 좌하단: 확대도 (t=T, t=T+ΔT 전파) -->
    <!-- ========================================== -->
    <!-- 기준 수평선 -->
    <line class="movable" x1="40" y1="650" x2="780" y2="650" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- t = T 순간 파면 (실선) -->
    <line class="movable" x1="170" y1="460" x2="380" y2="650" stroke="#000000" stroke-width="5.5" stroke-linecap="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- t = T 지시 화살표 -->
    <path class="movable pointer" d="M 155 545 C 205 545, 230 545, 245 538" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="65" y="545">t</text>
      <text class="roman" x="90" y="545">=</text>
      <text class="math" x="120" y="545">T</text>
    </g>

    <!-- 점 P 및 각도 theta -->
    <text class="movable roman" x="380" y="690" style="font-size: 34px;">P</text>
    <path class="movable" d="M 330 650 A 50 50 0 0 1 345 618" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="310" y="630">θ</text>

    <!-- t = T + ΔT 순간 파면 (점선) -->
    <!-- P에서 수직 상향 점선: (380, 650) -> (380, 465) -->
    <line class="movable" x1="380" y1="650" x2="380" y2="465" stroke="#000000" stroke-width="2.0" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 점 P' 레이블 및 점 -->
    <circle class="movable" cx="380" cy="465" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="395" y="435" style="font-size: 34px;">P′</text>

    <!-- 점 Q 레이블 및 점 -->
    <circle class="movable" cx="575" cy="650" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="575" y="690" style="font-size: 34px;">Q</text>

    <!-- P'에서 Q로 이어지는 경사 점선 파면 -->
    <line class="movable" x1="380" y1="465" x2="575" y2="650" stroke="#000000" stroke-width="3.5" stroke-dasharray="6,4" stroke-linecap="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- t = T + ΔT 지시 화살표 -->
    <path class="movable pointer" d="M 525 490 C 490 490, 470 505, 455 520" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="615" y="490">t</text>
      <text class="roman" x="640" y="490">=</text>
      <text class="math" x="670" y="490">T</text>
      <text class="roman" x="700" y="490">+</text>
      <text class="roman" x="725" y="490">Δ</text>
      <text class="math" x="755" y="490">T</text>
    </g>

    <!-- 구간 ΔL (P와 Q 사이 밑줄 괄호형 치수) -->
    <path class="movable" d="M 395 665 Q 477 690 477 690 Q 477 690 560 665" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="460" y="705">Δ</text>
      <text class="math" x="495" y="705">L</text>
    </g>

    <!-- 중괄호 K -->
    <path class="movable" d="M 390 750 Q 435 750 455 765 Q 475 750 565 750" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="475" y="805" style="font-size: 36px;">K</text>

    <!-- ========================================== -->
    <!-- 3. 하단 캡션: 그림 1 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="675" y="860" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="765" y="885">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
