<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제74_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" height="100%">
  <defs>
    <marker id="arrow-74" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="ground-pat-74" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ground Line and Hatching -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="15" y1="390" x2="465" y2="390" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="15" y="390" width="450" height="25" fill="url(#ground-pat-74)" stroke="none"/>

  <!-- Observer O (Stick figure) on left -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="45" cy="330" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="35" y1="330" x2="58" y2="322" stroke="#000000" stroke-width="1.5"/> <!-- Eye / Glasses -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="340" x2="45" y2="370" stroke="#000000" stroke-width="1.8"/> <!-- Torso -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="352" x2="58" y2="362" stroke="#000000" stroke-width="1.5"/> <!-- Arm -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="370" x2="35" y2="390" stroke="#000000" stroke-width="1.8"/> <!-- Left Leg -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="370" x2="55" y2="390" stroke="#000000" stroke-width="1.8"/> <!-- Right Leg -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="25" y="335" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">O</text>
  </g>

  <!-- Vertical dashed line along axis of A -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="390" x2="165" y2="50" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Motion arrows for A (moving vertically upwards) -->
  <!-- A at ground (165, 390) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="390" x2="165" y2="330" stroke="#000000" stroke-width="3" marker-end="url(#arrow-74)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="150" y="380" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- String on ground when A at origin -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="388" x2="435" y2="388" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="435" cy="384" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="450" y="375" font-family="'Times New Roman', serif" font-size="18" text-anchor="middle">P</text>
  </g>

  <!-- A at intermediate height (165, 205) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="205" x2="165" y2="155" stroke="#000000" stroke-width="3" marker-end="url(#arrow-74)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="180" y="200" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- String from intermediate A to P on ground at (360, 384) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="205" x2="360" y2="388" stroke="#000000" stroke-width="2"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="360" cy="384" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="375" y="375" font-family="'Times New Roman', serif" font-size="18" text-anchor="middle">P</text>
  </g>

  <!-- Angle theta arc at intermediate A -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 165 240 A 35 35 0 0 0 190 230" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="185" y="255" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">θ</text>
  </g>

  <!-- Length L label along string -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="268" y="275" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="277" y="292" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">L</text>
  </g>

  <!-- A at highest point (165, 80) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="80" x2="165" y2="20" stroke="#000000" stroke-width="3" marker-end="url(#arrow-74)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="180" y="80" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- Pendulum swung left to P at (105, 345) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="165" y1="80" x2="105" y2="345" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="105" cy="345" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="88" y="340" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">P</text>
  </g>
</svg>
  </div>
</body>
</html>
