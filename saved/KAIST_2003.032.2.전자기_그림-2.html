<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.032.2.전자기_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1224 670" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1.5 L 0 5 L 9 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 자기장 스티플 패턴 -->
    <pattern id="stipple-bg" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.0" fill="#888888"/>
      <circle cx="9" cy="3" r="1.0" fill="#888888"/>
      <circle cx="6" cy="6" r="1.0" fill="#888888"/>
      <circle cx="3" cy="9" r="1.0" fill="#888888"/>
      <circle cx="9" cy="9" r="1.0" fill="#888888"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; fill: #000000; text-anchor: start; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 자기장 영역 (우측 스티플 영역) -->
    <rect class="movable" x="340" y="25" width="845" height="495" fill="url(#stipple-bg)" stroke="#888888" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 지면 수직 입사 자기장 기호 (원 안의 X) 및 기호 B -->
    <circle class="movable" cx="750" cy="190" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="727" y1="167" x2="773" y2="213" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="727" y1="213" x2="773" y2="167" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 평행 도체 레일 (상단 W-W', 하단 Z-Z') -->
    <!-- 상단 레일 -->
    <rect class="movable" x="100" y="85" width="960" height="25" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상단 레일 우측 점선 연장 (W') -->
    <rect class="movable" x="1060" y="85" width="90" height="25" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 하단 레일 -->
    <rect class="movable" x="100" y="490" width="960" height="25" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 하단 레일 우측 점선 연장 (Z') -->
    <rect class="movable" x="1060" y="490" width="90" height="25" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 좌측 회로 연결 도선 및 소자 -->
    <!-- 레일 W와 축전기 상판 연결 도선 -->
    <rect class="movable" x="90" y="85" width="20" height="90" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 축전기 두 극판 (C) -->
    <rect class="movable" x="35" y="175" width="130" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="35" y="205" width="130" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 축전기 하판에서 저항 상단 연결선 -->
    <line class="movable" x1="100" y1="213" x2="100" y2="280" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 저항 R (지그재그 기호) -->
    <polyline class="movable" points="100,280 120,295 80,320 120,345 80,370 120,395 80,420 100,435" fill="none" stroke="#000000" stroke-width="5.0" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 저항 하단에서 레일 Z 연결 도선 -->
    <rect class="movable" x="90" y="435" width="20" height="80" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 도체봉 XY (원통형 도체 막대) -->
    <!-- 밑면 타원 -->
    <ellipse class="movable" cx="625" cy="530" rx="30" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 기둥 사각형 몸통 -->
    <rect class="movable" x="595" y="75" width="60" height="455" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 밑면 둥근 호 가림 보정 -->
    <path class="movable" d="M 595 530 A 30 12 0 0 0 655 530" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 윗면 타원 -->
    <ellipse class="movable" cx="625" cy="75" rx="30" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 속도 벡터 v 화살표 및 직각 표시 -->
    <line class="movable" x1="655" y1="300" x2="825" y2="300" stroke="#000000" stroke-width="5.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polyline class="movable" points="595,145 560,145 560,110" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 레일 간격 치수 d 양방향 화살표 -->
    <line class="movable" x1="495" y1="115" x2="495" y2="485" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 단자 W, Z -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="75" y="40" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="90" y="55">W</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="75" y="545" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="90" y="560">Z</text>
    </g>

    <!-- 단자 W', Z' -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1090" y="40" width="40" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="1110" y="55">W′</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1090" y="545" width="40" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="1110" y="560">Z′</text>
    </g>

    <!-- 도체봉 단자 X, Y -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="610" y="25" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="625" y="40">X</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="610" y="548" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="625" y="563">Y</text>
    </g>

    <!-- 한국어 라벨 '축전기' 및 기호 C (원본 コンデンサー C 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="175" y="175" width="85" height="32" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="180" y="191">축전기</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="215" y="220" width="30" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="230" y="239">C</text>
    </g>

    <!-- 한국어 라벨 '저항' 및 기호 R (원본 抵抗 R 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="135" y="340" width="60" height="32" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="140" y="356">저항</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="155" y="395" width="30" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="170" y="414">R</text>
    </g>

    <!-- 치수 라벨 d -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="480" y="280" width="30" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="495" y="299">d</text>
    </g>

    <!-- 자기장 라벨 B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="800" y="170" width="35" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="818" y="190">B</text>
    </g>

    <!-- 속도 기호 v -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="740" y="330" width="30" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="755" y="349">v</text>
    </g>

    <!-- 캡션 '그림 2' (원본 図 2 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="550" y="605" width="114" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="607" y="626">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
