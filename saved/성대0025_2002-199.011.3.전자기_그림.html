<!DOCTYPE html>
<html lang="ko">
<head>

  <title>성대0025_2002-199.011.3.전자기_그림</title>

<body>

    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 상부/하부 금속 평행판 -->
    <line class="movable" x1="40" y1="260" x2="520" y2="260" stroke="#000000" stroke-width="5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <line class="movable" x1="260" y1="260" x2="600" y2="260" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="260" y1="30" x2="260" y2="650" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <line class="movable" x1="55" y1="260" x2="55" y2="325" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <line class="movable" x1="115" y1="260" x2="115" y2="410" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 전자 입사 궤적 및 속도 v 화살표 -->
    <line class="movable" x1="105" y1="65" x2="260" y2="260" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="150" y1="122" x2="168" y2="145" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <circle class="movable" cx="105" cy="65" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 입사각 i 호 -->
    <path class="movable" d="M 260,195 A 65 65 0 0 0 220,210" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 굴절 출사 궤적 (영역 III) -->
    <line class="movable" x1="330" y1="410" x2="415" y2="620" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 법선 점선 (굴절각 기준) -->
    <line class="movable" x1="330" y1="410" x2="330" y2="670" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 굴절각 r 호 -->
    <path class="movable" d="M 330,470 A 60 60 0 0 0 354,468" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)" />

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="60" y="85" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">m</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="185" y="125" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">v</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="230" y="185" font-family="'Times New Roman', serif" font-size="24" font-style="italic" font-weight="normal" text-anchor="start">i</text></g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="610" y="268" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="250" y="690" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="10" y="268" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="start">0</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="130" y="345" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">d</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="10" y="420" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">V</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="338" y="495" font-family="'Times New Roman', serif" font-size="24" font-style="italic" font-weight="normal" text-anchor="start">r</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="500" y="190" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">Ⅰ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="500" y="345" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">Ⅱ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="500" y="495" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">Ⅲ</text></g>
  </g>
