<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0053_2003.215.2.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 650 850" width="650" height="850" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- [상단부: 측면도] -->
    <!-- 지면 수평선 -->
    <line class="movable" x1="20" y1="460" x2="550" y2="460" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 경사 레일 막대 (각도 θ 약 30도) -->
    <rect class="movable" x="50" y="210" width="500" height="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(28, 510, 460)" />
    <!-- 각도 θ 호 -->
    <path class="movable" d="M 400,460 A 70 70 0 0 1 420,415" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 금속봉 m (경사면 위 검은 사각형) -->
    <rect class="movable" x="100" y="215" width="22" height="16" fill="#000000" transform="translate(0,0) scale(1,1) rotate(28, 111, 223)" />
    
    <!-- 자기장 B 화살표들 (경사면에 수직 입사) -->
    <line class="movable" x1="190" y1="40.0" x2="120" y2="160.0" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="290" y1="80.0" x2="220" y2="200.0" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="390" y1="120.0" x2="320" y2="240.0" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="490" y1="160.0" x2="420" y2="280.0" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="590" y1="200.0" x2="520" y2="320.0" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- [하단부: 평면도] -->
    <!-- 평행 도선 레일 2개 -->
    <rect class="movable" x="60" y="550" width="450" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <rect class="movable" x="60" y="765" width="450" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 금속 도체봉 (가로질러 놓임: 검은 두꺼운 막대) -->
    <rect class="movable" x="110" y="540" width="16" height="245" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 레일 간격 L 치수선 -->
    <line class="movable" x1="80" y1="562" x2="80" y2="765" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 우측 회로 배선 -->
    <!-- 상부 레일에서 스위치/커패시터로 분기 -->
    <path class="movable" d="M 510,556 L 550,556 L 550,580 L 460,580 L 460,650" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 550,580 L 550,600" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 축전기 C (550, 600) -->
    <line class="movable" x1="530" y1="600" x2="570" y2="600" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="530" y1="612" x2="570" y2="612" stroke="#000000" stroke-width="5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="550" y1="612" x2="550" y2="650" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 스위치 접점 1, 2 -->
    <circle class="movable" cx="460" cy="650" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="550" cy="650" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 스위치 블레이드 S (510, 680 에서 1로 연결) -->
    <line class="movable" x1="510" y1="680" x2="465" y2="655" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="510" cy="680" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 저항 R (510, 680 -> 510, 770) -->
    <line class="movable" x1="510" y1="680" x2="510" y2="715" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 510,715 L 498,721.25 L 510,727.5 L 498,733.75 L 510,740.0 L 498,746.25 L 510,752.5 L 498,758.75 L 510,765.0" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="510" y1="765" x2="510" y2="771" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="135" y="195" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">m</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="400" y="115" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="350" y="440" font-family="'Times New Roman', serif" font-size="24" font-style="italic" font-weight="normal" text-anchor="start">θ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="555" y="465" font-family="'Malgun Gothic', sans-serif" font-size="24" font-style="normal" font-weight="normal" text-anchor="start">수평</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="505" font-family="'Malgun Gothic', sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start">빗면을 옆에서 본 그림</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="70" y="675" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="435" y="685" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">S</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="645" font-family="'Times New Roman', serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start">1</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="520" y="645" font-family="'Times New Roman', serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start">2</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="580" y="610" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">C</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="535" y="745" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">R</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="140" y="835" font-family="'Malgun Gothic', sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start">빗면을 위에서 본 그림</text></g>
  </g>
</svg>
</body>
</html>
