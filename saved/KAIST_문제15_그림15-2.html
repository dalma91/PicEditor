<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제15_그림15-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 900 350" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 15px; font-style: normal; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 19px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .plate-line { stroke: #000000; stroke-width: 4.5; stroke-linecap: butt; }
    .wire-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
    .traj-line { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 중심 수평 점선 및 보조 수직 점선 -->
    <!-- ========================================== -->
    <!-- 중심 수평 기준선 (y=195) -->
    <line class="movable dash-line" x1="85" y1="195" x2="570" y2="195" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 단절선 후 수평선 -->
    <line class="movable dash-line" x1="600" y1="195" x2="715" y2="195" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 수직 보조 점선들 -->
    <!-- P 지점 (x=105) -->
    <line class="movable dash-line" x1="105" y1="115" x2="105" y2="275" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C-D 지점 (x=240) -->
    <line class="movable dash-line" x1="240" y1="115" x2="240" y2="275" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- Q 지점 (x=375) -->
    <line class="movable dash-line" x1="375" y1="115" x2="375" y2="275" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 평행평판 전극 1 및 2 (수평 극판) -->
    <!-- 간격 d: y=130(상), y=260(하) -->
    <!-- ========================================== -->
    <!-- 전극 1 (x=105 ~ 235) -->
    <line class="movable plate-line" x1="105" y1="130" x2="235" y2="130" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable plate-line" x1="105" y1="260" x2="235" y2="260" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 2 (x=245 ~ 375) -->
    <line class="movable plate-line" x1="245" y1="130" x2="375" y2="130" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable plate-line" x1="245" y1="260" x2="375" y2="260" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 1 전원 회로 (V1) -->
    <path class="movable wire-line" d="M 135 130 C 80 130, 55 160, 55 190" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable wire-line" d="M 135 260 C 80 260, 55 230, 55 200" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 V1 -->
    <line class="movable" x1="45" y1="190" x2="65" y2="190" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="49" y1="195" x2="61" y2="195" stroke="#000000" stroke-width="1.4" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="45" y1="200" x2="65" y2="200" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 2 전원 회로 (V2) -->
    <path class="movable wire-line" d="M 350 130 C 375 110, 400 135, 400 170" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable wire-line" d="M 350 260 C 375 280, 400 255, 400 220" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 V2 -->
    <line class="movable" x1="390" y1="175" x2="410" y2="175" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="394" y1="180" x2="406" y2="180" stroke="#000000" stroke-width="1.4" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="390" y1="185" x2="410" y2="185" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 입자 궤적 (P -> C -> Q) -->
    <!-- P(105, 195), v0 벡터 및 각도 alpha -->
    <!-- ========================================== -->
    <circle class="movable" cx="105" cy="195" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="240" cy="170" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="240" cy="195" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="375" cy="195" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 발사 속도 v0 화살표 (각도 약 35도 상향) -->
    <line class="movable" x1="105" y1="195" x2="148" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 각도 alpha 호 -->
    <path class="movable" d="M 125 195 A 20 20 0 0 0 122 181" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 궤적 곡선: P(105, 195) -> 정점 (180, 155) -> 변곡점 C(240, 170) -> Q(375, 195)로 완만하게 접선 연결 -->
    <path class="movable traj-line" d="M 105 195 C 145 160, 190 155, 240 170 C 290 185, 335 195, 375 195" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- Q에서 우측 진행 화살표 (수평) -->
    <line class="movable" x1="375" y1="195" x2="435" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 평행평판 전극 3 (수직 극판) -->
    <!-- ========================================== -->
    <line class="movable" x1="480" y1="150" x2="480" y2="185" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="480" y1="205" x2="480" y2="240" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="510" y1="150" x2="510" y2="185" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="510" y1="205" x2="510" y2="240" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 3 전원 회로 (V3) -->
    <path class="movable wire-line" d="M 480 240 C 455 250, 455 295, 480 295 L 488 295" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable wire-line" d="M 510 240 C 535 250, 535 295, 510 295 L 502 295" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 V3 -->
    <line class="movable" x1="488" y1="288" x2="488" y2="302" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="495" y1="291" x2="495" y2="299" stroke="#000000" stroke-width="1.4" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="502" y1="288" x2="502" y2="302" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 생략 파단선 & 원형 챔버 입구 A 및 중심 O -->
    <!-- ========================================== -->
    <!-- 물결 생략 기호 (x=575 ~ 595) -->
    <path class="movable" d="M 578 185 Q 583 195, 580 205 M 586 185 Q 591 195, 588 205" stroke="#000000" stroke-width="1.5" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 원형 챔버 입구 A: (650, 195) -->
    <circle class="movable" cx="650" cy="195" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="715" cy="195" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 챔버 외벽 원호 -->
    <path class="movable" d="M 725 125 A 70 70 0 0 0 650 185" stroke="#000000" stroke-width="2.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 650 205 A 70 70 0 0 0 725 265" stroke="#000000" stroke-width="2.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 치수선 (l, l, d) -->
    <!-- ========================================== -->
    <!-- 전극 1 길이 l 치수선 (x=105 ~ 235) -->
    <line class="movable dim-line" x1="107" y1="280" x2="233" y2="280" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전극 2 길이 l 치수선 (x=245 ~ 375) -->
    <line class="movable dim-line" x1="247" y1="280" x2="373" y2="280" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 극판 간격 d 치수선 (x=325, y=133 ~ 257) -->
    <line class="movable dim-line" x1="325" y1="133" x2="325" y2="257" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 7. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- 평행평판 전극 1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="120" y="45" width="100" height="50" fill="#FFFFFF"/>
      <text class="korean" x="170" y="58">평행평판</text>
      <text class="korean" x="170" y="82">전극 1</text>
    </g>

    <!-- 평행평판 전극 2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="255" y="45" width="100" height="50" fill="#FFFFFF"/>
      <text class="korean" x="305" y="58">평행평판</text>
      <text class="korean" x="305" y="82">전극 2</text>
    </g>

    <!-- 평행평판 전극 3 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="450" y="45" width="100" height="50" fill="#FFFFFF"/>
      <text class="korean" x="500" y="58">평행평판</text>
      <text class="korean" x="500" y="82">전극 3</text>
    </g>

    <!-- V1, V2, V3 -->
    <text class="math movable" x="25" y="195" transform="translate(0,0) scale(1,1) rotate(0)">V<tspan class="sub" dy="4">1</tspan></text>
    <text class="math movable" x="428" y="155" transform="translate(0,0) scale(1,1) rotate(0)">V<tspan class="sub" dy="4">2</tspan></text>
    <text class="math movable" x="495" y="325" transform="translate(0,0) scale(1,1) rotate(0)">V<tspan class="sub" dy="4">3</tspan></text>

    <!-- P, C, D, Q, A, O -->
    <text class="roman movable" x="120" y="215" transform="translate(0,0) scale(1,1) rotate(0)">P</text>
    <text class="roman movable" x="255" y="165" transform="translate(0,0) scale(1,1) rotate(0)">C</text>
    <text class="roman movable" x="255" y="215" transform="translate(0,0) scale(1,1) rotate(0)">D</text>
    <text class="roman movable" x="362" y="215" transform="translate(0,0) scale(1,1) rotate(0)">Q</text>
    <text class="roman movable" x="635" y="180" transform="translate(0,0) scale(1,1) rotate(0)">A</text>
    <text class="roman movable" x="715" y="175" transform="translate(0,0) scale(1,1) rotate(0)">O</text>

    <!-- v0, alpha -->
    <text class="math movable" x="120" y="152" transform="translate(0,0) scale(1,1) rotate(0)">v<tspan class="sub" dy="4">0</tspan></text>
    <text class="math movable" x="135" y="190" transform="translate(0,0) scale(1,1) rotate(0)">α</text>

    <!-- l, l, d -->
    <text class="math movable" x="170" y="302" transform="translate(0,0) scale(1,1) rotate(0)">l</text>
    <text class="math movable" x="310" y="302" transform="translate(0,0) scale(1,1) rotate(0)">l</text>
    <text class="math movable" x="306" y="195" transform="translate(0,0) scale(1,1) rotate(0)">d</text>
  </g>
</svg>
</body>
</html>
