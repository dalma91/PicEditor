<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제2_그림2-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 450 660" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 지면 해칭 패턴 -->
    <pattern id="ground-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777777" stroke-width="1.2"/>
    </pattern>
    <!-- 도선 해칭 패턴 -->
    <pattern id="loop-pattern" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#444444" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .field-line { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 지면 해칭 블록 및 x축, z축 -->
    <!-- ========================================== -->
    <rect class="movable" x="15" y="560" width="410" height="80" fill="url(#ground-pattern)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- x축 -->
    <line class="movable" x1="15" y1="560" x2="435" y2="560" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="435" y="545" transform="translate(0,0) scale(1,1) rotate(0)">x</text>

    <!-- z축 -->
    <line class="movable" x1="200" y1="560" x2="200" y2="25" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="220" y="25" transform="translate(0,0) scale(1,1) rotate(0)">z</text>

    <!-- ========================================== -->
    <!-- 2. 상향 수렴 자기력선군 (B 벡터) -->
    <!-- ========================================== -->
    <!-- 좌측 자기력선들 (서로 교차하지 않는 부드러운 곡선) -->
    <path class="movable field-line" d="M 15 490 C 70 480, 160 300, 170 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 25 520 C 100 510, 170 300, 178 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 65 545 C 130 535, 180 300, 185 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 115 555 C 160 545, 190 300, 192 40" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 우측 자기력선들 -->
    <path class="movable field-line" d="M 385 490 C 330 480, 240 300, 230 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 375 520 C 300 510, 230 300, 222 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 335 545 C 270 535, 220 300, 215 40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable field-line" d="M 285 555 C 240 545, 210 300, 208 40" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 자기력선 화살표들 (z=360 부근) -->
    <line class="movable" x1="140" y1="365" x2="142" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="157" y1="365" x2="159" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="172" y1="365" x2="173" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="187" y1="365" x2="187" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="200" y1="365" x2="200" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="213" y1="365" x2="213" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="228" y1="365" x2="227" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="243" y1="365" x2="241" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="260" y1="365" x2="258" y2="350" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 자기장 벡터 레이블 B (화살표 포함) -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <line x1="285" y1="345" x2="305" y2="345" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-end)"/>
      <text class="math" x="295" y="365">B</text>
    </g>

    <!-- ========================================== -->
    <!-- 3. 정사각형 도선 (수평 단면 투영) -->
    <!-- ========================================== -->
    <rect class="movable" x="160" y="150" width="80" height="8" fill="url(#loop-pattern)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 지시 화살표 및 레이블 -->
    <line class="movable" x1="310" y1="95" x2="245" y2="145" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="355" y="70">정사각형 도선</text>
    </g>
  </g>
</svg>
</body>
</html>
