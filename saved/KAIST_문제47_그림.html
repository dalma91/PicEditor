<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-47" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Origin at (90, 200) -->
  <!-- Position vector r pointing right to (310, 200) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="90" y1="200" x2="310" y2="200" stroke="#000000" stroke-width="3" marker-end="url(#arrow-47)"/>

  <!-- Momentum vector p at angle 45 deg up-right to (235, 55) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="90" y1="200" x2="235" y2="55" stroke="#000000" stroke-width="3" marker-end="url(#arrow-47)"/>

  <!-- Angle theta arc between r and p -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 175 200 A 85 85 0 0 0 150 140" fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- Angular momentum vector l symbol at origin: circle with dot (pointing out of page) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="90" cy="200" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="90" cy="200" r="4.5" fill="#000000"/>

  <!-- LABELS -->
  <!-- ec{l} -->
  <g class="movable text-wrap" transform="translate(48, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-18" width="28" height="34" rx="2" fill="#FFFFFF"/>
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-47)"/>
    <text class="text-el" x="0" y="5" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">l</text>
  </g>

  <!-- ec{p} -->
  <g class="movable text-wrap" transform="translate(205, 50) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-18" width="28" height="34" rx="2" fill="#FFFFFF"/>
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-47)"/>
    <text class="text-el" x="0" y="5" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">p</text>
  </g>

  <!-- ec{r} -->
  <g class="movable text-wrap" transform="translate(270, 235) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-18" width="28" height="34" rx="2" fill="#FFFFFF"/>
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-47)"/>
    <text class="text-el" x="0" y="5" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">r</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(195, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- 그림 4-1 -->
  <g class="movable text-wrap" transform="translate(190, 285) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 4-1</text>
  </g>
</svg>
</body>
</html>
