<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.260.1.역학_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 640 900" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .tube-wall { stroke: #000000; stroke-width: 2.2; fill: none; }
    .guide-dash { stroke: #000000; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. U자관 내부 액체 채움 (변위 y 상태) -->
    <!-- ========================================== -->
    <!-- 좌측 수면 y=330, 우측 수면 y=440 (평형 y=385) -->
    <!-- 외경 215 (x: 210 ~ 640), 내경 160 (x: 265 ~ 585), 중심 (425, 555) -->
    <path class="movable" d="M 210 330 L 265 330 L 265 555 A 160 160 0 0 0 585 555 L 585 440 L 640 440 L 640 555 A 215 215 0 0 1 210 555 Z" fill="#B0B0B0" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. U자관 유리벽 -->
    <!-- ========================================== -->
    <!-- 외벽 -->
    <path class="movable tube-wall" d="M 210 125 L 210 555 A 215 215 0 0 0 640 555 L 640 125" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내벽 -->
    <path class="movable tube-wall" d="M 265 125 L 265 555 A 160 160 0 0 0 585 555 L 585 125" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 관 입구 상단 닫힘선 -->
    <line class="movable" x1="210" y1="125" x2="265" y2="125" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="585" y1="125" x2="640" y2="125" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 기준선 및 눈금/레이블 (y=0, B, y) -->
    <!-- ========================================== -->
    <!-- 평형 수면 기준 점선 y = 0 -->
    <line class="movable guide-dash" x1="210" y1="385" x2="640" y2="385" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- y = 0 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="125" y="385">y</text>
      <text class="roman" x="160" y="385">=</text>
      <text class="roman" x="185" y="385">0</text>
    </g>

    <!-- 좌측 변위 수면 B 및 변위 y 레이블 -->
    <text class="movable roman" x="237" y="305">B</text>
    <text class="movable math" x="175" y="330">y</text>

    <!-- ========================================== -->
    <!-- 4. 중심 O, 반경 R, 각도 theta, 원판 -->
    <!-- ========================================== -->
    <!-- U자관 중심선 점선 (반지름 R=187.5) -->
    <path class="movable guide-dash" d="M 237.5 555 A 187.5 187.5 0 0 0 612.5 555" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 중심점 O 표시 (십자 마크) -->
    <line class="movable" x1="418" y1="555" x2="432" y2="555" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="425" y1="548" x2="425" y2="562" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 중심 O 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="400" y="515">중심</text>
      <text class="roman" x="455" y="515">O</text>
    </g>

    <!-- 중심 O에서 수직 하향 기준선 -->
    <line class="movable" x1="425" y1="555" x2="425" y2="770" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta 및 반경 R 화살표 (각도 약 18도) -->
    <!-- (425, 555) -> 18도 회전 (sin 18=0.309, cos 18=0.951) -> R=187.5 -> dx=-58, dy=178 -> (367, 733) -->
    <line class="movable" x1="425" y1="555" x2="367" y2="733" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="355" y="635" transform="translate(0,0) scale(1,1) rotate(0)">R</text>

    <!-- 각도 theta 호 및 레이블 -->
    <path class="movable" d="M 425 615 A 60 60 0 0 1 406 612" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="410" y="635" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>

    <!-- 원판 (관 단면을 가로지르는 얇은 판) -->
    <!-- 중심 (367, 733)에서 내외경 폭 55px 관통 (수직 법선 방향으로 뻗음) -->
    <!-- (375, 707) -> (358, 760) 폭 6px 사각형 -->
    <polygon class="movable" points="377,706 373,705 356,758 360,759" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 원판 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-bold" x="280" y="795">원판</text>
    </g>

    <!-- ========================================== -->
    <!-- 5. 캡션: 그림 2 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="240" y="825" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="330" y="850">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
