<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-v0" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dim-s27" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e27" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="arr-traj27" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Ceiling and Floor Lines -->
  <line class="movable" x1="25" y1="25" x2="515" y2="25" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="25" y1="300" x2="515" y2="300" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical dashed line from ceiling through O -->
  <line class="movable" x1="260" y1="25" x2="260" y2="300" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Suspended Target M (circle at initial height) -->
  <circle class="movable" cx="260" cy="75" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Line of sight (dotted line from launch to M) -->
  <line class="movable" x1="70" y1="300" x2="260" y2="75" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Fall vector arrow of M -->
  <line class="movable" x1="260" y1="82" x2="260" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-traj27)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Bullet m initial position -->
  <circle class="movable" cx="70" cy="300" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Launch velocity vector v0 -->
  <line class="movable" x1="70" y1="300" x2="90" y2="276" stroke="#000000" stroke-width="2" marker-end="url(#arrow-v0)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Launch angle theta arc -->
  <path class="movable" d="M 115 300 A 45 45 0 0 0 105 260" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Parabolic Trajectory of bullet to collision point (260, 160) -->
  <path class="movable" d="M 70 300 Q 170 150 252 160" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-traj27)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Collision Point (260, 160) - Target M at collision -->
  <circle class="movable" cx="260" cy="160" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Trajectory of M after collision: parabolic curve to (340, 300) -->
  <path class="movable" d="M 267 160 Q 300 160 320 220" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-traj27)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 320 220 Q 330 250 338 296" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Target M landing position (circle) -->
  <circle class="movable" cx="340" cy="300" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Trajectory of bullet after collision: flatter parabolic curve to (420, 300) -->
  <path class="movable" d="M 267 160 Q 340 160 380 230" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-traj27)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 380 230 Q 405 270 420 300" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Bullet landing point -->
  <circle class="movable" cx="420" cy="300" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension lM (from O to M landing position) -->
  <line class="movable" x1="260" y1="315" x2="340" y2="315" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s27)" marker-end="url(#dim-e27)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Pointer to Bullet Landing Point -->
  <line class="movable" x1="420" y1="330" x2="420" y2="306" stroke="#000000" stroke-width="1.2" marker-end="url(#arr-traj27)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- M (Initial target) -->
  <g class="movable text-wrap" transform="translate(290, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">M</text>
  </g>

  <!-- m (Bullet) -->
  <g class="movable text-wrap" transform="translate(70, 325) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- v0 -->
  <g class="movable text-wrap" transform="translate(52, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">v<tspan font-size="14" dy="4">0</tspan></text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(128, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(242, 315) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- lM -->
  <g class="movable text-wrap" transform="translate(300, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">l<tspan font-size="14" dy="4">M</tspan></text>
  </g>

  <!-- 탄환 낙하지점 -->
  <g class="movable text-wrap" transform="translate(420, 345) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-45" y="-12" width="90" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">탄환 낙하지점</text>
  </g>
</svg>
</body>
</html>
