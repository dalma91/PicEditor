<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0011_2002-1.057.4.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 700 200" width="700" height="200" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <g class="main-diagram">
    <!-- 중심 수평 점선축 -->
    <line class="movable" x1="10" y1="90" x2="690" y2="90" stroke="#000000" stroke-width="2.2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 구 A 및 속도 화살표 v -->
    <circle class="movable" cx="170" cy="90" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="185" y1="90" x2="250" y2="90" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 구 B -->
    <circle class="movable" cx="510" cy="90" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="200" y="55" font-family="'Times New Roman', serif" font-size="44" font-style="italic" font-weight="bold">v</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="170" y="150" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="510" y="155" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">B</text></g>
  </g>
</svg>
</body>
</html>
