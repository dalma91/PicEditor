    let currentTag = '전체';

    function renderGrid(list) {
      const container = document.getElementById('gridContainer');
      const countEl = document.getElementById('resultCount');
      countEl.textContent = list.length;

      if (list.length === 0) {
        container.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 font-medium">검색된 도면이 없습니다.</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition flex flex-col justify-between group">
          <!-- 썸네일 영역 -->
          <div class="h-44 bg-slate-100 p-2 flex items-center justify-center border-b border-slate-100 relative overflow-hidden">
            <img src="${item.png}" alt="${item.name}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-200" loading="lazy">
            <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded bg-white/90 backdrop-blur shadow-sm text-slate-700">
              ${item.w} × ${item.h}
            </span>
            <span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">
              ${item.tag}
            </span>
          </div>

          <!-- 정보 영역 -->
          <div class="p-3.5 space-y-2 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="text-xs font-bold text-slate-800 line-clamp-2" title="${item.name}">
                ${item.name}
              </h3>
              <p class="text-[11px] text-slate-400 mt-0.5">용량: ${item.size_kb} KB</p>
            </div>

            <!-- 버튼 영역 -->
            <div class="pt-2 border-t border-slate-100 flex items-center gap-1.5">
              <a href="${item.html}" target="_blank" class="flex-1 text-center py-1.5 px-2 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold transition">
                HTML 열기
              </a>
              <a href="${item.html}" download="${item.html}" class="py-1.5 px-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition" title="HTML 다운로드">
                ⬇️
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = items.filter(item => {
        const matchesQuery = query === '' || item.name.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
        const matchesTag = currentTag === '전체' || item.tag === currentTag || (currentTag === '모의문항' && item.name.startsWith('문제'));
        return matchesQuery && matchesTag;
      });
      renderGrid(filtered);
    }

    function setTag(tag) {
      currentTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.textContent === tag) {
          btn.className = 'tag-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white';
        } else {
          btn.className = 'tag-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200';
        }
      });
      filterCards();
    }

    // Initial render
    renderGrid(items);
  </script>
