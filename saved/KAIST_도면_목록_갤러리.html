    let currentTag = '전체';
    let currentQuery = '';

    function renderGrid() {
      const grid = document.getElementById('grid');
      const filtered = items.filter(it => {
        const matchTag = (currentTag === '전체' || it.tag === currentTag);
        const matchQuery = !currentQuery || it.name.toLowerCase().includes(currentQuery.toLowerCase());
        return matchTag && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 font-medium">검색 결과가 없습니다.</div>';
        return;
      }

      grid.innerHTML = filtered.map(it => `
        <div class="bg-white rounded-xl overflow-hidden border border-slate-200 hover:border-blue-400 hover:shadow-md transition group flex flex-col">
          <div class="h-44 card-thumb border-b border-slate-100 p-2 flex items-center justify-center relative group-hover:scale-102 transition" style="background-image: url('${it.png}')">
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900/70 text-white backdrop-blur-sm">${it.tag}</span>
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between space-y-2">
            <div>
              <h3 class="font-bold text-slate-900 text-sm truncate" title="${it.name}">${it.name}</h3>
              <p class="text-[11px] text-slate-400 mt-0.5">순수 벡터 SVG · 편집 가능</p>
            </div>
            <div class="flex items-center gap-1.5 pt-2 border-t border-slate-100">
              <a href="${it.file}" target="_blank" class="flex-1 text-center py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded text-xs transition">
                미리보기
              </a>
              <a href="../PicEditor.html?load=${encodeURIComponent(it.file)}" target="_blank" class="flex-1 text-center py-1.5 px-2 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold rounded text-xs transition">
                편집하기
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCards() {
      currentQuery = document.getElementById('searchInput').value.trim();
      renderGrid();
    }

    function setTag(tag) {
      currentTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.dataset.tag === tag) {
          btn.className = 'tag-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-blue-600 text-white';
        } else {
          btn.className = 'tag-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200';
        }
      });
      renderGrid();
    }

    renderGrid();
  </script>
