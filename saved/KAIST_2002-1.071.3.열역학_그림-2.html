<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.071.3.열역학_그림-2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-113-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Central Partition Plane A -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="50" x2="190" y2="250" stroke="#000000" stroke-width="2.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="190" y="38" font-family="'Times New Roman', serif" font-size="24" text-anchor="middle">A</text>
  </g>

  <!-- Left dashed line at distance lambda_L -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="90" y1="40" x2="90" y2="255" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Left particle with arrow to A -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="90" cy="135" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="95" y1="135" x2="185" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#arrow-113-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="65" y="225" font-family="'Malgun Gothic', sans-serif" font-size="20" text-anchor="middle">온도</text>
    <text class="text-el" x="115" y="225" font-family="'Times New Roman', serif" font-style="italic" font-size="24" text-anchor="middle">T<tspan font-size="16" dy="4">L</tspan></text>
  </g>

  <!-- Right dashed line at distance lambda_R -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="290" y1="40" x2="290" y2="255" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Right particle with arrow to A -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="290" cy="190" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="285" y1="190" x2="195" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#arrow-113-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="325" y="225" font-family="'Times New Roman', serif" font-style="italic" font-size="24" text-anchor="middle">T<tspan font-size="16" dy="4">R</tspan></text>
  </g>

  <!-- Dimension Arrows lambda_L and lambda_R at top -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="90" y1="75" x2="190" y2="75" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-113-2)" marker-end="url(#arrow-113-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="130" y="42" width="25" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="140" y="60" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">λ<tspan font-size="14" dy="4">L</tspan></text>
  </g>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="75" x2="290" y2="75" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-113-2)" marker-end="url(#arrow-113-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="230" y="42" width="25" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="240" y="60" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">λ<tspan font-size="14" dy="4">R</tspan></text>
  </g>

  <!-- Caption 그림 6 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="190" y="305" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">그림 6</text>
  </g>
</svg>
  </div>
</body>
</html>
