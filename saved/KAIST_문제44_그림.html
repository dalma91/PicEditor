<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-44" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="hatch-44" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#555555" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Coordinate Axes: Origin O at (75, 250) -->
  <!-- x-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="250" x2="560" y2="250" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-44)"/>
  <!-- y-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="270" x2="75" y2="55" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-44)"/>

  <!-- Opponent Court hatching: x = 275 to x = 475 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="275" y="250" width="200" height="10" fill="url(#hatch-44)"/>

  <!-- Net at x=275, height b: from y=250 up to y=180 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="275" y1="250" x2="275" y2="180" stroke="#000000" stroke-width="3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 275 180 Q 262 215 275 250" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- Point P at height b/2: y = 215 on y-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="215" x2="80" y2="215" stroke="#000000" stroke-width="2"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 75 215 Q 63 232 75 250" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- Initial velocity vector from P (75, 215) at angle theta (28 deg) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="215" x2="140" y2="181" stroke="#000000" stroke-width="2" marker-end="url(#arrow-44)"/>
  <!-- Horizontal velocity component u0 arrow -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="215" x2="140" y2="215" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-44)"/>

  <!-- Angle theta arc at P -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 98 215 A 24 24 0 0 0 95 204" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Parabolic dashed trajectory: from P (75, 215), peak at (210, 150), over net at (275, 168), lands at (410, 250) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 75 215 Q 210 120 410 250" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- Dimension brackets/curves for distances a below floor -->
  <!-- Left court distance a: (75, 250) to (275, 250) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 75 250 Q 175 285 275 250" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Right court distance a: (275, 250) to (475, 250) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 275 250 Q 375 285 475 250" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Pointer lines to Net and Opponent Court -->
  <!-- Net pointer line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="365" y1="125" x2="278" y2="182" stroke="#000000" stroke-width="1.2"/>
  <!-- Opponent court pointer line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="435" y1="180" x2="415" y2="245" stroke="#000000" stroke-width="1.2"/>

  <!-- LABELS -->
  <!-- y, x, O -->
  <g class="movable text-wrap" transform="translate(55, 62) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">y</text>
  </g>
  <g class="movable text-wrap" transform="translate(565, 268) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>
  <g class="movable text-wrap" transform="translate(58, 268) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>

  <!-- P -->
  <g class="movable text-wrap" transform="translate(58, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">P</text>
  </g>

  <!-- b/2 -->
  <g class="movable text-wrap" transform="translate(30, 235) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">b/2</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(105, 192) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- u0 -->
  <g class="movable text-wrap" transform="translate(160, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">u₀</text>
  </g>

  <!-- b (net height) -->
  <g class="movable text-wrap" transform="translate(258, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">b</text>
  </g>

  <!-- Distance a, a -->
  <g class="movable text-wrap" transform="translate(175, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" font-weight="bold" fill="#000000">a</text>
  </g>
  <g class="movable text-wrap" transform="translate(375, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" font-weight="bold" fill="#000000">a</text>
  </g>

  <!-- Korean Translations: 네트, 상대 코트 -->
  <g class="movable text-wrap" transform="translate(390, 115) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-22" y="-12" width="44" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">네트</text>
  </g>
  <g class="movable text-wrap" transform="translate(465, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-38" y="-12" width="76" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">상대 코트</text>
  </g>
</svg>
</body>
</html>
