<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0009_2002-100.056.2.파동_그림</title>
</head>
<body>
<svg viewBox="0 0 800 360" width="800" height="360" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="2" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 지면 수평선 -->
    <line class="movable" x1="10" y1="275" x2="790" y2="275" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 우측 반사벽 -->
    <rect class="movable" x="710" y="50" width="38" height="225" fill="url(#wall-hatch)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 관측자 (사람 형상) -->
    <g class="movable" transform="translate(60,110) scale(1,1) rotate(0)">
      <!-- 머리 및 모자 -->
      <circle cx="25" cy="25" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <path d="M 5,20 L 45,15" stroke="#000000" stroke-width="3" />
      <circle cx="23" cy="24" r="2.5" fill="#000000" />
      <!-- 몸통 및 팔 -->
      <path d="M 25,41 L 10,95 L 42,95 L 35,41" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <path d="M 25,50 L 52,65 L 48,72" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
      <!-- 다리 및 발 -->
      <line x1="18" y1="95" x2="18" y2="155" stroke="#000000" stroke-width="2.5" />
      <line x1="32" y1="95" x2="32" y2="155" stroke="#000000" stroke-width="2.5" />
      <path d="M 12,165 L 40,165" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- 음원 수레 (발음체) -->
    <g class="movable" transform="translate(340,150) scale(1,1) rotate(0)">
      <!-- 바퀴 및 프레임 -->
      <rect x="0" y="98" width="110" height="12" fill="#E0E0E0" stroke="#000000" stroke-width="2" />
      <circle cx="25" cy="113" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
      <circle cx="25" cy="113" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <circle cx="85" cy="113" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
      <circle cx="85" cy="113" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <!-- 기둥 -->
      <line x1="55" y1="98" x2="55" y2="20" stroke="#000000" stroke-width="3.5" />
      <!-- 스피커 확성기 -->
      <polygon points="35,10 50,16 50,24 35,30" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <polygon points="75,10 60,16 60,24 75,30" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <rect x="50" y="14" width="10" height="12" fill="#000000" />
      <!-- 음파 파면 호 (좌우) -->
      <path d="M 22,2 A 25 25 0 0 0 22,38" fill="none" stroke="#000000" stroke-width="2.2" />
      <path d="M 10,-8 A 40 40 0 0 0 10,48" fill="none" stroke="#000000" stroke-width="2.2" />
      <path d="M 88,2 A 25 25 0 0 1 88,38" fill="none" stroke="#000000" stroke-width="2.2" />
      <path d="M 100,-8 A 40 40 0 0 1 100,48" fill="none" stroke="#000000" stroke-width="2.2" />
    </g>

    <!-- 속도 u 화살표 -->
    <line class="movable" x1="510" y1="215" x2="545" y2="215" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="80" y="45" font-family="'Batang', serif" font-size="36" font-weight="bold">관측자</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="395" y="45" font-family="'Batang', serif" font-size="36" font-weight="bold" text-anchor="middle">음원</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="730" y="35" font-family="'Batang', serif" font-size="36" font-weight="bold" text-anchor="middle">반사벽</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="225" font-family="'Times New Roman', serif" font-size="44" font-style="italic" font-weight="bold">u</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="400" y="340" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 Ⅱ</text></g>
  </g>
</svg>
</body>
</html>
