<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0005_2002-100.009.3.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 740 480" width="740" height="480" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#555555" />
      <circle cx="6" cy="6" r="1.2" fill="#555555" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 극판 A 상단 도선 -->
    <line class="movable" x1="320" y1="0" x2="320" y2="70" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 극판 A (상단 두꺼운 선) -->
    <line class="movable" x1="110" y1="70" x2="510" y2="70" stroke="#000000" stroke-width="7" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 유전체 블록 (두께 0.8d) -->
    <rect class="movable" x="110" y="115" width="400" height="115" fill="url(#dots)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 극판 B (하단 두꺼운 선) -->
    <line class="movable" x1="110" y1="230" x2="510" y2="230" stroke="#000000" stroke-width="7" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 극판 B 하단 도선 -->
    <line class="movable" x1="320" y1="230" x2="320" y2="310" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 두께 0.8d 치수 화살표 -->
    <line class="movable" x1="15" y1="120" x2="88" y2="120" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="15" y1="230" x2="88" y2="230" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="75" x2="50" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="275" x2="50" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- y축 좌표 화살표 (y=0 -> y=d) -->
    <line class="movable" x1="520" y1="70" x2="545" y2="70" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="545" y1="70" x2="545" y2="225" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="55" font-family="'Times New Roman', serif" font-size="40" font-weight="bold">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="275" font-family="'Times New Roman', serif" font-size="40" font-weight="bold">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="280" y="105" font-family="'Times New Roman', serif" font-size="34" font-style="italic">ε<tspan font-size="22" dy="8">0</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="280" y="180" font-family="'Times New Roman', serif" font-size="36" font-style="italic">ε<tspan font-size="24" dy="8">2</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="45" y="185" font-family="'Times New Roman', serif" font-size="38" font-style="italic" text-anchor="middle">0.8d</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="575" y="78" font-family="'Times New Roman', serif" font-size="38" font-style="italic">y=0</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="575" y="225" font-family="'Times New Roman', serif" font-size="38" font-style="italic">y=d</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="220" y="340" font-family="'Batang', serif" font-size="38" font-weight="bold">그림 3b</text></g>
  </g>
</svg>
</body>
</html>
