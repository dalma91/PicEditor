<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.048.3.파동_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1170 756" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 방위계 화살표 마커 -->
    <marker id="compass-arrow" viewBox="0 0 12 12" refX="6" refY="2" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 11 L 6 1 L 11 11 L 6 8 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .road-line { stroke: #000000; stroke-width: 3.0; fill: none; stroke-linecap: square; }
    .traj-line { stroke: #000000; stroke-width: 3.2; stroke-dasharray: 8,8; fill: none; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 방위계 (North Arrow) -->
    <line class="movable" x1="210" y1="460" x2="210" y2="190" stroke="#000000" stroke-width="2.5" marker-end="url(#compass-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="155" y1="375" x2="265" y2="375" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 도로 외곽선 (삼거리 도로) -->
    <!-- 하단 경계선 -->
    <line class="movable road-line" x1="20" y1="640" x2="1150" y2="640" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상단 경계선 좌측 -->
    <line class="movable road-line" x1="20" y1="540" x2="870" y2="540" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상단 경계선 우측 -->
    <line class="movable road-line" x1="970" y1="540" x2="1150" y2="540" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 북쪽 갈림길 좌측선 -->
    <line class="movable road-line" x1="870" y1="540" x2="870" y2="80" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 북쪽 갈림길 우측선 -->
    <line class="movable road-line" x1="970" y1="540" x2="970" y2="80" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 주행 궤적선 (점선 화살표) -->
    <!-- 차 b의 차 a 후방 궤적선 -->
    <line class="movable traj-line" x1="115" y1="590" x2="400" y2="590" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 차 a의 교차로 진입 및 북쪽 꺾임 궤적선 -->
    <path class="movable traj-line" d="M 495 590 L 920 590 L 920 100" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 차 b의 동쪽 직진 궤적선 -->
    <line class="movable traj-line" x1="920" y1="590" x2="1100" y2="590" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 자동차 A, B (사각형 박스) -->
    <!-- 차 B -->
    <rect class="movable" x="22" y="555" width="93" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 차 A -->
    <rect class="movable" x="400" y="555" width="93" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 방위 N 기호 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="190" y="130" width="40" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="210" y="150" font-weight="bold">N</text>
    </g>

    <!-- 차량 내부 문자 A, B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="68" y="590">B</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="446" y="590">A</text>
    </g>

    <!-- 하단 차량 라벨 '차 b', '차 a' (원본 車 b, 車 a 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="30" y="680" width="80" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="70" y="700">차 b</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="405" y="680" width="80" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="445" y="700">차 a</text>
    </g>

    <!-- 진행 방향 라벨 '차 a의 진행 방향' (원본 車aの進む方向 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="780" y="35" width="280" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="920" y="56">차 a의 진행 방향</text>
    </g>

    <!-- 진행 방향 라벨 '차 b의 진행 방향' (원본 車bの進む方向 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="790" y="680" width="280" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="930" y="701">차 b의 진행 방향</text>
    </g>
  </g>
</svg>
</body>
</html>
