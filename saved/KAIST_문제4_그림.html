<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제4_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 650 360" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>

    <!-- 빗면 빗금 패턴 -->
    <pattern id="rough-floor" width="8" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
    .thick-line { stroke: #000000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 사면 1 및 바닥 레일 -->
    <!-- ========================================== -->
    <path class="movable thick-line" d="M 50 30 L 122 184 C 135 211, 150 245, 175 245 L 390 245" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 사면 2: P(390, 245)에서 우하향 (약 18도 경사) -->
    <line class="movable thick-line" x1="390" y1="245" x2="610" y2="315" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 P 및 점 Q -->
    <circle class="movable" cx="390" cy="245" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="510" cy="283" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 발사 궤적 P -> Q (점선 곡선) -->
    <path class="movable" d="M 390 245 Q 460 245, 510 283" stroke="#000000" stroke-width="1.4" stroke-dasharray="4,3" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 벽, 용수철, 블록 A, B (사면 위 그룹) -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(50, 30) rotate(65)">
      <!-- 고정 벽: y=5 에서 y=-32 -->
      <line x1="0" y1="5" x2="0" y2="-32" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
      <!-- 벽 해치(빗금) -->
      <line x1="0" y1="3" x2="-8" y2="-5" stroke="#000000" stroke-width="1.4"/>
      <line x1="0" y1="-5" x2="-8" y2="-13" stroke="#000000" stroke-width="1.4"/>
      <line x1="0" y1="-13" x2="-8" y2="-21" stroke="#000000" stroke-width="1.4"/>
      <line x1="0" y1="-21" x2="-8" y2="-29" stroke="#000000" stroke-width="1.4"/>
      <line x1="0" y1="-29" x2="-8" y2="-37" stroke="#000000" stroke-width="1.4"/>

      <!-- 용수철 (길이 56, 중심 y=-12) -->
      <path d="M 0 -12 L 8 -12 L 12 -19 L 17 -5 L 22 -19 L 27 -5 L 32 -19 L 37 -5 L 42 -19 L 47 -5 L 51 -12 L 56 -12" stroke="#000000" stroke-width="1.8" fill="none" stroke-linejoin="round"/>

      <!-- 블록 A(M): 사면 위(y=0 ~ -24)에 안착 -->
      <rect x="56" y="-24" width="28" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

      <!-- A, B 사이 연결부 -->
      <line x1="84" y1="-16" x2="92" y2="-16" stroke="#000000" stroke-width="1.5"/>
      <line x1="84" y1="-8" x2="92" y2="-8" stroke="#000000" stroke-width="1.5"/>

      <!-- 블록 B(m): x=92 ~ 118, y=0 ~ -24 -->
      <rect x="92" y="-24" width="26" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- ========================================== -->
    <!-- 3. 마찰면 (수평면 구간 d) -->
    <!-- ========================================== -->
    <rect class="movable" x="235" y="245" width="110" height="12" fill="url(#rough-floor)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable dash-line" x1="235" y1="257" x2="345" y2="257" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 구간 d 양방향 화살표 -->
    <line class="movable dim-line" x1="237" y1="272" x2="343" y2="272" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 치수선 및 보조선 -->
    <!-- ========================================== -->
    <!-- 높이 h 보조선: 블록 B 하단 y level (137)에서 좌측으로 -->
    <line class="movable dash-line" x1="38" y1="137" x2="100" y2="137" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 수평면 보조선 좌측 연장 -->
    <line class="movable dash-line" x1="38" y1="245" x2="175" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 높이 h 양방향 화살표 -->
    <line class="movable dim-line" x1="48" y1="139" x2="48" y2="243" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta_1 보조선 및 호 -->
    <line class="movable" x1="70" y1="208" x2="133" y2="208" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 120 208 A 18 18 0 0 1 127 192" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta_2 보조선 및 호 -->
    <line class="movable" x1="440" y1="300" x2="515" y2="300" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 505 300 A 32 32 0 0 0 496 279" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- 벽 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="30" y="-1" width="26" height="20" fill="#FFFFFF"/>
      <text class="korean" x="43" y="9">벽</text>
    </g>

    <!-- 사면 1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="2" y="116" width="68" height="24" fill="#FFFFFF"/>
      <text class="korean" x="36" y="128">사면 1</text>
    </g>

    <!-- A(M) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="122" y="66" width="65" height="26" fill="#FFFFFF"/>
      <text class="math" x="154" y="79">A(M)</text>
    </g>

    <!-- B(m) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="136" y="114" width="62" height="26" fill="#FFFFFF"/>
      <text class="math" x="167" y="127">B(m)</text>
    </g>

    <!-- h -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="20" y="180" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="30" y="192">h</text>
    </g>

    <!-- theta_1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="84" y="184" width="26" height="22" fill="#FFFFFF"/>
      <text class="math" x="97" y="195">θ<tspan font-size="14" dy="4">1</tspan></text>
    </g>

    <!-- d -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="280" y="260" width="20" height="22" fill="#FFFFFF"/>
      <text class="math" x="290" y="271">d</text>
    </g>

    <!-- 수평면 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="255" y="294" width="70" height="24" fill="#FFFFFF"/>
      <text class="korean" x="290" y="306">수평면</text>
    </g>

    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="372" y="218" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="383" y="230">P</text>
    </g>

    <!-- Q -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="515" y="260" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="526" y="272">Q</text>
    </g>

    <!-- theta_2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="460" y="287" width="26" height="22" fill="#FFFFFF"/>
      <text class="math" x="473" y="298">θ<tspan font-size="14" dy="4">2</tspan></text>
    </g>

    <!-- 사면 2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="488" y="322" width="68" height="24" fill="#FFFFFF"/>
      <text class="korean" x="522" y="334">사면 2</text>
    </g>
  </g>
</svg>
</body>
</html>
