<!DOCTYPE html>

  <g class="main-diagram">

    <!-- 지지 모서리 O (465, 50) -->

    <!-- 각도 θ 및 θ' 호 (벽면 기준) -->
    <path class="movable" d="M 465,150 A 100 100 0 0 0 415,138" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 진동 원호 궤적들 화살표 -->
    <path class="movable" d="M 240,335 Q 360,420 465,430" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="210" y="325" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="start">D</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="340" y="365" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="start">E</text></g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="210" y="490" font-family="'Malgun Gothic', sans-serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">그림 3</text></g>
