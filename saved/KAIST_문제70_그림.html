<!DOCTYPE html>
<html lang="ko">
<head>

  <title>문제70_그림</title>
  <style>
    body {
      margin: 0;

      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }

      padding: 20px;

</head>
<body>

  <!-- ================= PANEL 1: 그림 1 ================= -->

  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="765" y="150" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">G</text>
