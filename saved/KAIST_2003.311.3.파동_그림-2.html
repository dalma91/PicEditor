<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.311.3.파동_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1248 576" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="ray-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#000000"/>
    </marker>
    <marker id="object-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .axis-line { stroke: #000000; stroke-width: 2.0; fill: none; }
    .normal-dash { stroke: #000000; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .ray-line { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 원형 구체 및 광축 -->
    <!-- ========================================== -->
    <!-- 구체 (원, 중심 640, 265, 반경 210) -->
    <circle class="movable" cx="640" cy="265" r="210" fill="#FFFFFF" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 광축 수평선 -->
    <line class="movable axis-line" x1="30" y1="265" x2="1140" y2="265" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 구체 중심 O 표시 및 레이블 -->
    <circle class="movable" cx="640" cy="265" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="640" y="305">O</text>

    <!-- ========================================== -->
    <!-- 2. 광선 경로 (입사선 -> 내부 굴절선 -> 출사선) -->
    <!-- ========================================== -->
    <!-- 수평 입사 광선 (y=135) -->
    <line class="movable ray-line" x1="55" y1="135" x2="465" y2="135" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 구 내부 굴절선: (465, 135) -> (850, 205) -->
    <line class="movable ray-line" x1="465" y1="135" x2="850" y2="205" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 출사 광선: (850, 205) -> (1030, 290) 화살표 -->
    <line class="movable ray-line" x1="850" y1="205" x2="1030" y2="290" marker-end="url(#ray-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 출사선 접선 점선 연장: (850, 205) -> (1120, 265) -->
    <line class="movable normal-dash" x1="850" y1="205" x2="1120" y2="265" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 구 내부 장애물 (물체, 수직 상향 화살표) -->
    <!-- ========================================== -->
    <line class="movable" x1="720" y1="265" x2="720" y2="182" stroke="#000000" stroke-width="3.5" marker-end="url(#object-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-bold" x="785" y="225">물체</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 캡션: 그림 2 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="500" y="475" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="590" y="500">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
