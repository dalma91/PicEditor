<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0022_2002-199.005.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 600 680" width="600" height="680" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 패턴 정의 (점묘/해치 그라데이션) -->
    <pattern id="dotPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#555555" />
    </pattern>
    <!-- 좌표축 x, y -->
    <line class="movable" x1="30" y1="430" x2="570" y2="430" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="250" y1="670" x2="250" y2="30" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 구 B (중심 250, 430, 반지름 100) -->
    <circle class="movable" cx="250" cy="430" r="100" fill="url(#dotPattern)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 구 A (중심 250, 255, 반지름 75) - 위에서 접촉 -->
    <circle class="movable" cx="250" cy="255" r="75" fill="url(#dotPattern)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 입사 충돌선 (A 중심을 통과하는 대각선 약 30도) -->
    <line class="movable" x1="20" y1="80" x2="390" y2="370" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 입사 속도 벡터 v0 (굵은 화살표) -->
    <line class="movable" x1="60" y1="112" x2="165" y2="195" stroke="#000000" stroke-width="5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 충돌각 α 호 (y축과 충돌선 사이) -->
    <path class="movable" d="M 250,175 A 80 80 0 0 0 185,204" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 산란 속도 벡터 A (우측 상단 굵은 화살표) -->
    <line class="movable" x1="250" y1="255" x2="510" y2="180" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="330" y1="232" x2="440" y2="200" stroke="#000000" stroke-width="5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 구 B 하향 속도 벡터 (음의 y방향) -->
    <line class="movable" x1="250" y1="530" x2="250" y2="630" stroke="#000000" stroke-width="4.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="225" y="55" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="normal" text-anchor="start">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="565" y="415" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="normal" text-anchor="start">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="225" y="455" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="260" font-family="'Times New Roman', serif" font-size="34" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="550" font-family="'Times New Roman', serif" font-size="34" font-style="normal" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="45" y="170" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="bold" text-anchor="start">v⃗₀</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="205" y="165" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">α</text></g>
  </g>
</svg>
</body>
</html>
