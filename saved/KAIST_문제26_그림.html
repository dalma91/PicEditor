<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="100%">
  <defs>
    <pattern id="piston-stipple26" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#777777"/>
      <circle cx="5" cy="5" r="0.9" fill="#777777"/>
    </pattern>
    <marker id="dim-s26" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e26" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Cylinder Container -->
  <rect class="movable" x="70" y="40" width="180" height="280" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Piston (stippled rect) -->
  <rect class="movable" x="70" y="115" width="180" height="45" fill="url(#piston-stipple26)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension h on left -->
  <line class="movable" x1="45" y1="162" x2="45" y2="318" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s26)" marker-end="url(#dim-e26)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="25" y1="160" x2="70" y2="160" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="25" y1="320" x2="70" y2="320" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Resistor 1 (inside cylinder) -->
  <path class="movable" d="M 115 320 L 115 300 L 125 308 L 140 292 L 155 308 L 170 292 L 185 308 L 195 300 L 205 300 L 205 320" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- External Circuit Wires -->
  <line class="movable" x1="115" y1="320" x2="115" y2="370" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  
  <!-- Resistor 2 (on left wire) -->
  <path class="movable" d="M 115 370 L 123 378 L 107 390 L 123 402 L 107 414 L 115 422" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="115" y1="422" x2="115" y2="490" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="115" y1="490" x2="153" y2="490" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Right wire with Switch -->
  <line class="movable" x1="205" y1="320" x2="205" y2="385" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="205" cy="385" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="205" cy="420" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="205" y1="420" x2="216" y2="390" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="205" y1="420" x2="205" y2="490" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="205" y1="490" x2="167" y2="490" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Battery -->
  <!-- Long thin plate (positive) -->
  <line class="movable" x1="153" y1="475" x2="153" y2="505" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Short thick plate (negative) -->
  <line class="movable" x1="167" y1="482" x2="167" y2="498" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- 단면적 S -->
  <g class="movable text-wrap" transform="translate(160, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-45" y="-12" width="90" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">단면적 <tspan font-family="'Times New Roman', serif" font-size="20" font-style="italic">S</tspan></text>
  </g>

  <!-- 진공 -->
  <g class="movable text-wrap" transform="translate(160, 80) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">진공</text>
  </g>

  <!-- 피스톤 -->
  <g class="movable text-wrap" transform="translate(280, 137) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">피스톤</text>
  </g>

  <!-- 기체 -->
  <g class="movable text-wrap" transform="translate(160, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">기체</text>
  </g>

  <!-- h -->
  <g class="movable text-wrap" transform="translate(32, 240) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">h</text>
  </g>

  <!-- 저항 1 -->
  <g class="movable text-wrap" transform="translate(160, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-28" y="-12" width="56" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">저항 1</text>
  </g>

  <!-- 저항 2 -->
  <g class="movable text-wrap" transform="translate(65, 395) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-28" y="-12" width="56" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">저항 2</text>
  </g>

  <!-- 스위치 -->
  <g class="movable text-wrap" transform="translate(255, 405) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">스위치</text>
  </g>

  <!-- 전지 -->
  <g class="movable text-wrap" transform="translate(160, 530) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">전지</text>
  </g>
</svg>
</body>
</html>
