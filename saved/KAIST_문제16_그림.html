<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="100%">
  <defs>
    <pattern id="mountain-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <pattern id="ground-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow-traj" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Ground Line & Hatch -->
  <line class="movable" x1="40" y1="175" x2="580" y2="175" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Ground hatching blocks -->
  <polygon class="movable" points="40,175 140,175 125,195 40,195" fill="url(#ground-hatch)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <polygon class="movable" points="460,175 580,175 580,195 475,195" fill="url(#ground-hatch)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Plateau Mountain Contour & Hatch -->
  <!-- Outline: from x=140 y=175 up to x=210 y=90, across to x=410 y=90, down to x=480 y=175 -->
  <path class="movable" d="M 120 175 C 160 175 180 90 230 90 L 390 90 C 440 90 460 175 500 175" fill="none" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
  
  <!-- Plateau underside support hatching (three clusters like original) -->
  <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
    <!-- under left slope -->
    <line x1="265" y1="92" x2="285" y2="115" stroke="#000000" stroke-width="2"/>
    <line x1="275" y1="92" x2="260" y2="115" stroke="#000000" stroke-width="2"/>
    <line x1="260" y1="105" x2="285" y2="105" stroke="#000000" stroke-width="2"/>
    <!-- under middle plateau -->
    <line x1="365" y1="92" x2="385" y2="115" stroke="#000000" stroke-width="2"/>
    <line x1="375" y1="92" x2="360" y2="115" stroke="#000000" stroke-width="2"/>
    <line x1="360" y1="105" x2="385" y2="105" stroke="#000000" stroke-width="2"/>
    <!-- ground left -->
    <line x1="70" y1="175" x2="90" y2="198" stroke="#000000" stroke-width="2"/>
    <line x1="80" y1="175" x2="65" y2="198" stroke="#000000" stroke-width="2"/>
    <!-- ground center under slope -->
    <line x1="160" y1="175" x2="180" y2="198" stroke="#000000" stroke-width="2"/>
    <line x1="170" y1="175" x2="155" y2="198" stroke="#000000" stroke-width="2"/>
    <!-- ground right -->
    <line x1="470" y1="175" x2="490" y2="198" stroke="#000000" stroke-width="2"/>
    <line x1="480" y1="175" x2="465" y2="198" stroke="#000000" stroke-width="2"/>
    <line x1="540" y1="175" x2="560" y2="198" stroke="#000000" stroke-width="2"/>
    <line x1="550" y1="175" x2="535" y2="198" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Isobar PB (upper dashed line) -->
  <line class="movable" x1="50" y1="62" x2="270" y2="62" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="410" y1="62" x2="580" y2="62" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Isobar PA (lower dashed line) -->
  <line class="movable" x1="50" y1="140" x2="135" y2="140" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="475" y1="146" x2="580" y2="146" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Air Parcel Trajectory (A -> B -> C -> D) -->
  <!-- Ascent A to B with arrow -->
  <path class="movable" d="M 160 140 C 180 140 195 105 215 80" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow-traj)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 215 80 C 235 55 260 62 285 62" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Horizontal B to C with arrow -->
  <line class="movable" x1="313" y1="62" x2="370" y2="62" stroke="#000000" stroke-width="2" marker-end="url(#arrow-traj)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Descent C to D with arrow -->
  <path class="movable" d="M 405 65 C 435 65 460 115 480 140" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow-traj)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 480 140 C 495 152 510 146 525 146" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Air parcels (circles) -->
  <!-- Parcel A -->
  <circle class="movable" cx="150" cy="140" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Parcel B -->
  <circle class="movable" cx="300" cy="62" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Parcel C -->
  <circle class="movable" cx="390" cy="62" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Parcel D -->
  <circle class="movable" cx="538" cy="146" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- PB label -->
  <g class="movable text-wrap" transform="translate(125, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-75" y="-14" width="150" height="28" rx="3" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">P<tspan font-size="14" dy="4">B</tspan><tspan dy="-4"> = 일정 (&lt; </tspan>P<tspan font-size="14" dy="4">A</tspan><tspan dy="-4">)</tspan></text>
  </g>

  <!-- PA label -->
  <g class="movable text-wrap" transform="translate(90, 110) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-45" y="-14" width="90" height="28" rx="3" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">P<tspan font-size="14" dy="4">A</tspan><tspan dy="-4"> = 일정</tspan></text>
  </g>

  <!-- Point A label -->
  <g class="movable text-wrap" transform="translate(185, 148) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- Point B label -->
  <g class="movable text-wrap" transform="translate(275, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- Point C label -->
  <g class="movable text-wrap" transform="translate(415, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">C</text>
  </g>

  <!-- Point D label -->
  <g class="movable text-wrap" transform="translate(565, 155) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">D</text>
  </g>

  <!-- Mountain label: 대지 형태의 산악 -->
  <g class="movable text-wrap" transform="translate(330, 152) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-75" y="-14" width="150" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">대지 형태의 산악</text>
  </g>
</svg>
</body>
</html>
