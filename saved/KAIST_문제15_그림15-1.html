<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제15_그림15-1</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 400 300" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .num { font-family: 'Times New Roman', serif; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .chamber-line { stroke: #000000; stroke-width: 2.2; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 원형 챔버 (중심 O=(200, 145), r=115) -->
    <!-- ========================================== -->
    <!-- 원호 상단 (각도 175도 ~ 5도) -->
    <path class="movable chamber-line" d="M 87 135 A 115 115 0 0 1 313 135" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 원호 하단 (각도 185도 ~ 355도) -->
    <path class="movable chamber-line" d="M 87 155 A 115 115 0 0 0 313 155" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 기준선 및 슬릿 점 (A, O, Z, Y) -->
    <!-- ========================================== -->
    <!-- 수평 기준 점선 (A - O - Z) -->
    <line class="movable dash-line" x1="15" y1="145" x2="385" y2="145" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 120도 반경 점선 (O -> Y) -->
    <!-- Y 점: (200 + 57.5, 145 + 99.6) = (258, 245) -->
    <line class="movable dash-line" x1="200" y1="145" x2="258" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 기준점 점 마커 (A, O, Z, Y) -->
    <circle class="movable" cx="85" cy="145" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="200" cy="145" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="315" cy="145" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="258" cy="245" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 반경 r 화살표 (O -> 좌상단 원호) -->
    <line class="movable" x1="200" y1="145" x2="112" y2="83" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 120도 호 (O 중심, 반경 28) -->
    <path class="movable" d="M 172 145 A 28 28 0 0 0 214 169" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 자기장 기호 B (지면 수직 상향: ⊙) -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(245, 75)">
      <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="2.5" fill="#000000"/>
    </g>

    <!-- ========================================== -->
    <!-- 4. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="52" y="152" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="63" y="164">A</text>
    </g>

    <!-- Z -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="328" y="152" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="339" y="164">Z</text>
    </g>

    <!-- Y -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="265" y="242" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="276" y="254">Y</text>
    </g>

    <!-- O -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="205" y="118" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="216" y="130">O</text>
    </g>

    <!-- r -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="155" y="96" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="165" y="108">r</text>
    </g>

    <!-- 120도 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="135" y="172" width="55" height="24" fill="#FFFFFF"/>
      <text class="num" x="162" y="184">120°</text>
    </g>

    <!-- B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="210" y="63" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="221" y="75">B</text>
    </g>
  </g>
</svg>
</body>
</html>
