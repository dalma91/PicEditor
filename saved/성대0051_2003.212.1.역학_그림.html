<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0051_2003.212.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 800 560" width="800" height="560" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 중심선 수평 점선 (A-O-B) -->
    <line class="movable" x1="20" y1="280" x2="780" y2="280" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 중심 지구 (원점 O: 260, 280, 반경 R: 75) 점묘 패턴 -->
    <circle class="movable" cx="260" cy="280" r="75" fill="#AAAAAA" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="260" cy="280" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 반경 R 곡선 치수호 -->
    <path class="movable" d="M 260,280 Q 285,255 295,270" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 원궤도 (중심 260, 280, 반지름 2R = 150) -->
    <circle class="movable" cx="260" cy="280" r="150" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 타원 궤도 (근지점 A: 110, 280, 원지점 B: 740, 280, 중심: 425, 280, 장반경: 315, 단반경: 215) -->
    <ellipse class="movable" cx="425" cy="280" rx="315" ry="215" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 점 A (110, 280) 및 접선 속도 v 상향 -->
    <circle class="movable" cx="110" cy="280" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="110" y1="280" x2="110" y2="150" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 속도 v0 화살표 좌향 (A에서 원궤도 속도) -->
    <line class="movable" x1="190" y1="280" x2="125" y2="280" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 점 B (740, 280) 및 접선 속도 V 하향 -->
    <circle class="movable" cx="740" cy="280" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="740" y1="280" x2="740" y2="350" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 거리 2R 치수호 (A -> O) -->
    <path class="movable" d="M 110,280 Q 185,320 260,280" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 거리 6R 치수호 (O -> B) -->
    <path class="movable" d="M 260,280 Q 500,350 740,280" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="75" y="160" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">v</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="75" y="305" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="145" y="265" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">v₀</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="225" y="235" font-family="'Malgun Gothic', sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start">지구</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="305" y="265" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">R</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="245" y="315" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="145" y="335" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">2R</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="500" y="345" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">6R</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="755" y="265" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="760" y="335" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">V</text></g>
  </g>
</svg>
</body>
</html>
