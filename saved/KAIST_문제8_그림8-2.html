<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제8_그림8-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 525 570" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 일반 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 굵은 속도 화살표 마커 -->
    <marker id="bold-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 16px; font-style: normal; }
    .orbit-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 중심 수직선 (P -> C -> Q) -->
    <!-- ========================================== -->
    <line class="movable dash-line" x1="270" y1="65" x2="270" y2="490" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 행성 (중심 C=(270, 300), 반경 75) -->
    <!-- ========================================== -->
    <circle class="movable" cx="270" cy="300" r="75" fill="#DCDCDC" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="270" cy="300" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 외곽 원형 궤도 (반경 a = 235, 중심 (270, 300)) -->
    <!-- ========================================== -->
    <circle class="movable orbit-line" cx="270" cy="300" r="235" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 원형 궤도 속도 V2 화살표 (우상단, 접선방향 반시계 회전) -->
    <!-- 위치: x = 270 + 235*cos(-30)=473, y = 300 + 235*sin(-30)=182, 접선각: -120도 -->
    <g class="movable" transform="translate(470, 175) rotate(-120)">
      <line x1="-15" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="5" marker-end="url(#bold-arrow)"/>
    </g>

    <!-- ========================================== -->
    <!-- 4. 타원 천이 궤도 (호만 궤도) -->
    <!-- 원지점 P(270, 65), 근지점 Q(270, 490) -->
    <!-- 중심: (270, 277.5), rx=180, ry=212.5 -->
    <!-- ========================================== -->
    <ellipse class="movable orbit-line" cx="270" cy="277.5" rx="180" ry="212.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 P 및 속도 V3 (원지점) -->
    <circle class="movable" cx="270" cy="65" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="270" y1="65" x2="215" y2="65" stroke="#000000" stroke-width="5" marker-end="url(#bold-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 Q 및 속도 V4 (근지점) -->
    <circle class="movable" cx="270" cy="490" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="270" y1="490" x2="325" y2="490" stroke="#000000" stroke-width="5" marker-end="url(#bold-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 거리 a 및 b 표시 곡선 호 -->
    <!-- ========================================== -->
    <!-- 거리 a (C에서 P까지 좌측으로 휘는 호) -->
    <path class="movable" d="M 270 300 C 230 280, 215 150, 270 65" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 거리 b (C에서 Q까지 좌측으로 휘는 호) -->
    <path class="movable" d="M 270 300 C 230 320, 225 430, 270 490" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="264" y="30" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="275" y="42">P</text>
    </g>

    <!-- V3 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="200" y="32" width="30" height="24" fill="#FFFFFF"/>
      <text class="math" x="215" y="44">V<tspan class="sub" dy="4">3</tspan></text>
    </g>

    <!-- V2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="480" y="125" width="30" height="24" fill="#FFFFFF"/>
      <text class="math" x="495" y="137">V<tspan class="sub" dy="4">2</tspan></text>
    </g>

    <!-- a -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="200" y="172" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="210" y="184">a</text>
    </g>

    <!-- C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="282" y="288" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="293" y="300">C</text>
    </g>

    <!-- b -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="208" y="395" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="218" y="407">b</text>
    </g>

    <!-- Q -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="258" y="508" width="24" height="24" fill="#FFFFFF"/>
      <text class="roman" x="270" y="520">Q</text>
    </g>

    <!-- V4 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="312" y="458" width="30" height="24" fill="#FFFFFF"/>
      <text class="math" x="327" y="470">V<tspan class="sub" dy="4">4</tspan></text>
    </g>
  </g>
</svg>
</body>
</html>
