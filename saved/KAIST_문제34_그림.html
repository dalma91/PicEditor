<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-34" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Circular Electron Orbit in 3D Perspective (ellipse centered at (190, 235)) -->
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="190" cy="235" rx="155" ry="70" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- z-axis: straight up from center (190, 235) to (190, 45) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="235" x2="190" y2="45" stroke="#000000" stroke-width="2" marker-end="url(#arrow-34)"/>

  <!-- Radius a: dashed line from center (190, 235) to front-left (82, 284) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="235" x2="82" y2="284" stroke="#000000" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- Upward Magnetic Field Ba at perimeter (92, 175) up to (92, 105) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="92" y1="175" x2="92" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#arrow-34)"/>

  <!-- Upward Average Magnetic Field B_bar inside loop at (265, 235) up to (265, 115) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="265" y1="235" x2="265" y2="115" stroke="#000000" stroke-width="2" marker-end="url(#arrow-34)"/>

  <!-- LABELS -->
  <!-- z -->
  <g class="movable text-wrap" transform="translate(170, 52) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#000000">z</text>
  </g>

  <!-- a -->
  <g class="movable text-wrap" transform="translate(140, 260) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">a</text>
  </g>

  <!-- Ba -->
  <g class="movable text-wrap" transform="translate(92, 90) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-12" width="32" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B<tspan font-size="16" dy="4">a</tspan></text>
  </g>

  <!-- B_bar -->
  <g class="movable text-wrap" transform="translate(265, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-14" width="32" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B̅</text>
  </g>
</svg>
</body>
</html>
