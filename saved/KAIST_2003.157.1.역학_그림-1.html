<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.157.1.역학_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1170 600" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 지면 해칭 패턴 -->
    <pattern id="ground-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .track-line { stroke: #000000; stroke-width: 3.5; fill: none; }
    .dim-line { stroke: #000000; stroke-width: 1.8; fill: none; }
    .guide-dash { stroke: #000000; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 지면 해칭 블록 및 하프파이프 트랙 -->
    <!-- ========================================== -->
    <!-- 해칭 지면 (트랙 하부) -->
    <path class="movable" d="M 15 275 L 100 275 A 220 220 0 0 0 320 495 L 820 495 A 220 220 0 0 0 1040 275 L 1155 275 L 1155 580 L 15 580 Z" fill="url(#ground-pattern)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 트랙 경계선 (A -> B -> C -> D) -->
    <path class="movable track-line" d="M 15 275 L 100 275 A 220 220 0 0 0 320 495 L 820 495 A 220 220 0 0 0 1040 275 L 1155 275" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 트랙 주요 지점 레이블 (A, B, C, D) -->
    <text class="movable roman" x="65" y="305">A</text>
    <text class="movable roman" x="320" y="530">B</text>
    <text class="movable roman" x="820" y="530">C</text>
    <text class="movable roman" x="1075" y="305">D</text>

    <!-- ========================================== -->
    <!-- 2. 기하 치수 (r, d, 중심 O) -->
    <!-- ========================================== -->
    <!-- 좌측 원호 보조선 및 중심 O -->
    <line class="movable guide-dash" x1="100" y1="275" x2="320" y2="275" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable guide-dash" x1="320" y1="275" x2="320" y2="495" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="350" y="245">O</text>

    <!-- 직각 기호들 -->
    <rect class="movable" x="100" y="275" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="308" y="275" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="308" y="483" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 좌측 수평 반경 r -->
    <line class="movable dim-line" x1="105" y1="245" x2="315" y2="245" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="210" y="225" transform="translate(0,0) scale(1,1) rotate(0)">r</text>

    <!-- 좌측 연직 반경 r -->
    <line class="movable dim-line" x1="350" y1="280" x2="350" y2="490" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="350" y="385" transform="translate(0,0) scale(1,1) rotate(0)">r</text>

    <!-- 바닥 직선 구간 d -->
    <line class="movable dim-line" x1="325" y1="460" x2="815" y2="460" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="570" y="445" transform="translate(0,0) scale(1,1) rotate(0)">d</text>

    <!-- 우측 원호 보조선 -->
    <line class="movable guide-dash" x1="820" y1="275" x2="1040" y2="275" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable guide-dash" x1="820" y1="275" x2="820" y2="495" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 우측 직각 기호들 -->
    <rect class="movable" x="820" y="275" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="1028" y="275" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="820" y="483" width="12" height="12" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 우측 수평 반경 r -->
    <line class="movable dim-line" x1="825" y1="245" x2="1035" y2="245" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="930" y="225" transform="translate(0,0) scale(1,1) rotate(0)">r</text>

    <!-- 우측 연직 반경 r -->
    <line class="movable dim-line" x1="790" y1="280" x2="790" y2="490" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="790" y="385" transform="translate(0,0) scale(1,1) rotate(0)">r</text>

    <!-- ========================================== -->
    <!-- 3. 스케이터 1 (좌측 곡면 활강) -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <!-- 스케이트보드 데크 -->
      <line x1="145" y1="445" x2="195" y2="480" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 몸체/사람 (선화) -->
      <!-- 머리 -->
      <circle cx="215" cy="385" r="12" fill="#000000"/>
      <!-- 상체 -->
      <polygon points="195,400 215,400 205,430 185,430" fill="#FFFFFF" stroke="#000000" stroke-width="2.0"/>
      <!-- 다리 -->
      <polyline points="185,430 160,455 170,462" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="205,430 185,465 195,472" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 팔 -->
      <polyline points="195,405 170,410 160,400" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="215,405 210,425 215,435" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 활강 속도 화살표 -->
      <line x1="230" y1="420" x2="265" y2="455" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)"/>
    </g>

    <!-- ========================================== -->
    <!-- 4. 스케이터 2 (우측 공중 턴 및 U턴 궤적) -->
    <!-- ========================================== -->
    <!-- D점 수직 연장선 (가상 벽면) -->
    <line class="movable guide-dash" x1="1040" y1="275" x2="1040" y2="120" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <!-- 공중 스케이트보드 (수직 벽면 착지 형태) -->
      <line x1="1038" y1="160" x2="1038" y2="230" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 사람 선화 (수평 돌출) -->
      <circle cx="945" cy="195" r="12" fill="#000000"/>
      <!-- 상체 -->
      <polygon points="960,185 995,185 995,205 960,205" fill="#FFFFFF" stroke="#000000" stroke-width="2.0"/>
      <!-- 다리 -->
      <polyline points="995,190 1030,175" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="995,200 1030,215" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 팔 -->
      <polyline points="965,185 980,165 990,175" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="965,205 980,225 990,215" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 공중 U턴 화살표 -->
      <path d="M 1015 130 L 1015 70 A 20 20 0 0 0 975 70 L 975 105" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow-end)"/>
    </g>

    <!-- ========================================== -->
    <!-- 5. 캡션: 그림 1 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="25" y="180" width="160" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="75" y="210">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
