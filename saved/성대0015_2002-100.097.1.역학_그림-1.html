<!DOCTYPE html>

<head>

<body>
<svg viewBox="0 0 650 500" width="650" height="500" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />

    <pattern id="block-dot" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#333333" />

  <g class="main-diagram">

    <polygon class="movable" points="15,410 590,410 590,80" fill="none" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 빗면 각도 30도 호 -->

    <!-- 상단 도르래 원 및 축 -->
    <circle class="movable" cx="602" cy="70" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="602" cy="70" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 빗면 위 실 (물체 -> 도르래) -->
    <line class="movable" x1="310" y1="240" x2="595" y2="70" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 빗면 위 물체 (기울어진 사각형) -->
    <rect class="movable" x="250" y="200" width="75" height="55" fill="url(#block-dot)" stroke="#000000" stroke-width="2.5" transform="rotate(-30 287 227)" />

    <!-- 도르래 하단 실 (도르래 -> 용수철) -->

    <!-- 수직 용수철 코일 (루프형 스프링) -->
    <path class="movable" d="M 616,150 C 635,160 635,180 616,190 C 597,200 597,220 616,230 C 635,240 635,260 616,270 C 597,280 597,300 616,310 C 635,320 635,340 616,350 L 616,370" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 용수철 끝을 쥔 손 형상 -->
    <g class="movable" transform="translate(605,370) scale(1,1) rotate(0)">
      <path d="M 11,0 L 11,15 Q 25,25 22,45 L 20,65 L 0,65 L 0,45 Q -5,30 11,15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="100" y="405" font-family="'Times New Roman', serif" font-size="44">30°</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="320" y="465" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 1</text></g>
