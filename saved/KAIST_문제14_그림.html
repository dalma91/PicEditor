<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제14_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 445 460" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 천장 격자/패턴 -->
    <pattern id="ceiling-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .unit { font-family: 'Times New Roman', serif; font-style: normal; font-size: 20px; }
    .ceiling-line { stroke: #000000; stroke-width: 2.5; fill: none; }
    .rope-line { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 천장 (Ceiling) -->
    <!-- ========================================== -->
    <rect class="movable" x="40" y="20" width="340" height="24" fill="url(#ceiling-pattern)" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable ceiling-line" x1="40" y1="44" x2="380" y2="44" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 좌측 고정도르래 (x=130, y=105, r=38) -->
    <!-- ========================================== -->
    <polygon class="movable" points="105,44 155,44 140,110 120,110" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="130" cy="105" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="130" cy="105" r="38" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="130" cy="105" r="28" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 우측 고정도르래 (x=285, y=105, r=38) -->
    <!-- ========================================== -->
    <polygon class="movable" points="260,44 310,44 295,110 275,110" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="285" cy="105" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="285" cy="105" r="38" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="285" cy="105" r="28" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 중앙 동도르래 (x=207, y=240, r=38) -->
    <!-- ========================================== -->
    <circle class="movable" cx="207" cy="240" r="38" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="207" cy="240" r="28" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <rect class="movable" x="200" y="235" width="14" height="60" rx="7" ry="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="207" cy="240" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="207" cy="285" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 연결 로프 (줄) -->
    <!-- ========================================== -->
    <path class="movable rope-line" d="M 92 325 L 92 105 A 38 38 0 0 1 168 105 L 169 240 A 38 38 0 0 0 245 240 L 247 105 A 38 38 0 0 1 323 105 L 323 325" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable rope-line" x1="207" y1="289" x2="207" y2="330" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 추 A, B, C (원통형 추) -->
    <!-- ========================================== -->
    <!-- 추 A -->
    <g class="movable" transform="translate(92, 330)">
      <circle cx="0" cy="-5" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M -35 0 L -35 40 A 35 10 0 0 0 35 40 L 35 0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="35" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <text class="korean" x="0" y="22" font-size="18">추 A</text>
    </g>

    <!-- 추 B -->
    <g class="movable" transform="translate(207, 335)">
      <circle cx="0" cy="-5" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M -41 0 L -41 60 A 41 12 0 0 0 41 60 L 41 0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="41" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <text class="korean" x="0" y="32" font-size="20">추 B</text>
    </g>

    <!-- 추 C -->
    <g class="movable" transform="translate(323, 330)">
      <circle cx="0" cy="-5" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M -38 0 L -38 48 A 38 11 0 0 0 38 48 L 38 0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="38" ry="11" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <text class="korean" x="0" y="26" font-size="19">추 C</text>
    </g>

    <!-- ========================================== -->
    <!-- 7. 질량 단위 라벨 (m [kg], M [kg], 2m [kg]) -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="50" y="392" width="85" height="26" fill="#FFFFFF"/>
      <text class="math" x="92" y="405">m<tspan class="unit">[kg]</tspan></text>
    </g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="165" y="415" width="85" height="26" fill="#FFFFFF"/>
      <text class="math" x="207" y="428">M<tspan class="unit">[kg]</tspan></text>
    </g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="275" y="400" width="95" height="26" fill="#FFFFFF"/>
      <text class="math" x="323" y="413">2m<tspan class="unit">[kg]</tspan></text>
    </g>

    <!-- ========================================== -->
    <!-- 8. 도르래 명칭 라벨 (한글 번역) -->
    <!-- ========================================== -->
    <!-- 좌측 고정도르래 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="42" y="70" width="40" height="90" fill="#FFFFFF"/>
      <text class="korean" x="62" y="86">고</text>
      <text class="korean" x="62" y="110">정</text>
      <text class="korean" x="62" y="134">도</text>
      <text class="korean" x="62" y="158">르</text>
      <text class="korean" x="62" y="182">래</text>
    </g>

    <!-- 우측 고정도르래 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="338" y="70" width="40" height="90" fill="#FFFFFF"/>
      <text class="korean" x="358" y="86">고</text>
      <text class="korean" x="358" y="110">정</text>
      <text class="korean" x="358" y="134">도</text>
      <text class="korean" x="358" y="158">르</text>
      <text class="korean" x="358" y="182">래</text>
    </g>

    <!-- 중앙 동도르래 (좌측 여백 x=165에 배치하여 도르래와 겹침 방지) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="145" y="130" width="26" height="75" fill="#FFFFFF"/>
      <text class="korean" x="158" y="146" font-size="18">동</text>
      <text class="korean" x="158" y="170" font-size="18">도</text>
      <text class="korean" x="158" y="194" font-size="18">르</text>
      <text class="korean" x="158" y="218" font-size="18">래</text>
    </g>
  </g>
</svg>
</body>
</html>
