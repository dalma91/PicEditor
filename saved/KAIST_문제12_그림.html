<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제12_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 620 260" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 양방향 치수 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .incline-line { stroke: #000000; stroke-width: 2.2; fill: none; }
    .wall-line { stroke: #000000; stroke-width: 2.5; fill: none; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 사면 및 수평 바닥면, 수직 벽 -->
    <!-- ========================================== -->
    <!-- 빗면 (각도 30도): (15, 73)에서 P(200, 180)까지 -->
    <!-- dx: 185, dy: 107 -> tan 30 = 0.577 -->
    <line class="movable incline-line" x1="15" y1="73" x2="200" y2="180" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 수평 바닥면: P(200, 180)에서 Q(570, 180)까지 -->
    <line class="movable incline-line" x1="200" y1="180" x2="570" y2="180" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- P 좌측 수평 기준선 (각도 30도 표시용) -->
    <line class="movable" x1="15" y1="180" x2="200" y2="180" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 수직 벽 (Q(570, 180)에서 상향 y=15까지) -->
    <line class="movable wall-line" x1="570" y1="180" x2="570" y2="15" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 블록 A (빗면 위, 각도 30도) -->
    <!-- 위치: x=65, y=102, 빗면 상에 안착 -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(65, 102) rotate(30)">
      <rect x="-13" y="-26" width="26" height="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <text class="roman" x="0" y="-13">A</text>
    </g>

    <!-- 블록 A 질량 m -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="70" y="44" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="81" y="56">m</text>
    </g>

    <!-- ========================================== -->
    <!-- 3. 블록 B (수평면 위, 점 O=(385, 180)) -->
    <!-- ========================================== -->
    <rect class="movable" x="372" y="154" width="26" height="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="roman movable" x="385" y="167" transform="translate(0,0) scale(1,1) rotate(0)">B</text>

    <!-- 블록 B 질량 M -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="373" y="128" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="385" y="140">M</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 치수선 (h, 30도, P-O-Q 구간 l) -->
    <!-- ========================================== -->
    <!-- 높이 h 보조선 (블록 A 바닥면 y=102에서 좌측으로) -->
    <line class="movable dash-line" x1="15" y1="102" x2="65" y2="102" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 높이 h 양방향 화살표 -->
    <line class="movable dim-line" x1="36" y1="104" x2="36" y2="178" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 30도 호 (P=(200, 180) 부근) -->
    <path class="movable" d="M 160 180 A 40 40 0 0 1 165 160" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- P, O, Q 수직 눈금선 -->
    <line class="movable" x1="200" y1="180" x2="200" y2="198" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="385" y1="180" x2="385" y2="198" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="570" y1="180" x2="570" y2="198" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- P-O 구간 치수 호 l (하향 볼록 호) -->
    <path class="movable" d="M 200 180 C 240 215, 345 215, 385 180" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- O-Q 구간 치수 호 l (하향 볼록 호) -->
    <path class="movable" d="M 385 180 C 425 215, 530 215, 570 180" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- h -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="25" y="128" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="36" y="140">h</text>
    </g>

    <!-- 30도 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="110" y="158" width="45" height="24" fill="#FFFFFF"/>
      <text class="num" x="132" y="170">30°</text>
    </g>

    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="189" y="205" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="200" y="217">P</text>
    </g>

    <!-- O -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="374" y="205" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="385" y="217">O</text>
    </g>

    <!-- Q -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="559" y="205" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="570" y="217">Q</text>
    </g>

    <!-- l (좌측 구간) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="282" y="195" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="292" y="207">l</text>
    </g>

    <!-- l (우측 구간) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="468" y="195" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="478" y="207">l</text>
    </g>

    <!-- 벽 (한글 번역: 壁 -> 벽) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="578" y="44" width="28" height="24" fill="#FFFFFF"/>
      <text class="korean" x="592" y="56">벽</text>
    </g>
  </g>
</svg>
</body>
</html>
