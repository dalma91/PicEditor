<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.036.1.열역학_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1374 760" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1.5 L 0 5 L 9 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 실린더 벽면 빗금 해치 패턴 -->
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#777777" stroke-width="1.8"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-vert { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 실린더 1 벽면 (좌측 실린더, 폭 S1) -->
    <!-- 외벽 및 바닥 두께 해치 -->
    <path class="movable" d="M 210 230 L 230 230 L 230 550 L 450 550 L 450 230 L 470 230 L 470 530 L 470 570 L 210 570 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내부 기체 영역 경계선 -->
    <line class="movable" x1="230" y1="230" x2="230" y2="550" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="230" y1="550" x2="450" y2="550" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="450" y1="230" x2="450" y2="530" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 실린더 2 벽면 (우측 실린더, 폭 S2) -->
    <path class="movable" d="M 970 230 L 990 230 L 990 530 L 970 530 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 970 570 L 970 550 L 990 550 L 1170 550 L 1170 230 L 1190 230 L 1190 570 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내부 경계선 -->
    <line class="movable" x1="990" y1="230" x2="990" y2="530" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="990" y1="550" x2="1170" y2="550" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1170" y1="230" x2="1170" y2="550" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 하단 연결관 -->
    <line class="movable" x1="450" y1="530" x2="990" y2="530" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="450" y1="550" x2="990" y2="550" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 밸브(콕) 기호 -->
    <polygon class="movable" points="710,518 730,518 720,540" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="710,562 730,562 720,540" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="720" y1="510" x2="720" y2="570" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 피스톤 1 (좌측, 두꺼운 밑판 + 뾰족한 기둥) -->
    <path class="movable" d="M 230 360 L 450 360 L 450 395 L 230 395 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 320 360 L 320 60 L 340 20 L 360 60 L 360 360 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 피스톤 2 (우측, 두꺼운 밑판 + 뾰족한 기둥) -->
    <path class="movable" d="M 990 420 L 1170 420 L 1170 455 L 990 455 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 1060 420 L 1060 80 L 1080 40 L 1100 80 L 1100 420 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 치수 보조선 및 h1, h2 양방향 화살표 -->
    <!-- h1 치수선 (좌측) -->
    <line class="movable" x1="230" y1="395" x2="140" y2="395" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="210" y1="550" x2="140" y2="550" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="160" y1="399" x2="160" y2="546" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- h2 치수선 (우측) -->
    <line class="movable" x1="1170" y1="455" x2="1260" y2="455" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1190" y1="550" x2="1260" y2="550" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1240" y1="459" x2="1240" y2="546" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 피스톤 1 라벨 (원본 ピストン 1 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="140" y="70" width="130" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="205" y="88">피스톤 1</text>
    </g>

    <!-- 피스톤 2 라벨 (원본 ピストン 2 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1110" y="70" width="130" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="1175" y="88">피스톤 2</text>
    </g>

    <!-- 실린더 1 세로 라벨 (원본 シリンダー 1 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-vert" x="75" y="320">실</text>
      <text class="korean-vert" x="75" y="355">린</text>
      <text class="korean-vert" x="75" y="390">더</text>
      <text class="korean-vert" x="75" y="425">1</text>
    </g>

    <!-- 실린더 2 세로 라벨 (원본 シリンダー 2 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-vert" x="1310" y="320">실</text>
      <text class="korean-vert" x="1310" y="355">린</text>
      <text class="korean-vert" x="1310" y="390">더</text>
      <text class="korean-vert" x="1310" y="425">2</text>
    </g>

    <!-- 치수 라벨 h1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="100" y="450" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="125" y="470">h<tspan dy="6" font-size="24">1</tspan></text>
    </g>

    <!-- 치수 라벨 h2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1255" y="480" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1280" y="500">h<tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 단면적 S1, S2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="315" y="430" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="340" y="450">S<tspan dy="6" font-size="24">1</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1055" y="480" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1080" y="500">S<tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 내부 기압 P0 (실린더 내부) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="250" y="495" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="275" y="515">P<tspan dy="6" font-size="24">0</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1005" y="495" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1030" y="515">P<tspan dy="6" font-size="24">0</tspan></text>
    </g>

    <!-- 외부 대기압 P0 (상단 중앙) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="695" y="225" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="720" y="245">P<tspan dy="6" font-size="24">0</tspan></text>
    </g>

    <!-- 밸브 라벨 (원본 コック 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="680" y="460" width="80" height="35" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="720" y="478">밸브</text>
    </g>

    <!-- 캡션 '그림 1' (원본 図 1 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="660" y="670" width="120" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="720" y="692">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
