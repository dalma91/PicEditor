<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제75_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-75" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="plane-pat-75" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8"/>
      <circle cx="6" cy="6" r="0.8" fill="#94a3b8"/>
    </pattern>
  </defs>

  <!-- Perspective Plane (Trapezoid) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="20,295 400,295 320,120 100,120"
           fill="url(#plane-pat-75)" stroke="#94a3b8" stroke-width="1"/>

  <!-- Orbit Ellipse (center X at (200, 205), rx=125, ry=50) -->
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="200" cy="205" rx="125" ry="50"
           fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- Central Body X -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="200" cy="205" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="180" y="212" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">X</text>
  </g>

  <!-- Normal Axis to Orbital Plane (straight up from X) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="205" x2="200" y2="60" stroke="#000000" stroke-width="1.8"/>

  <!-- Line of Sight towards Earth (angled up-right to (480, 30)) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="205" x2="480" y2="30" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="480" cy="30" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="460" y="45" width="55" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="488" y="65" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">지구</text>
  </g>

  <!-- Angle theta arc between normal and line to Earth -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 200 135 A 70 70 0 0 1 245 150" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="232" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">θ</text>
  </g>

  <!-- Satellite S on orbit (e.g. angle around -35 deg => x = 200 + 125*cos(-35) = 302, y = 205 + 50*sin(-35) = 176) -->
  <!-- In the drawing S is at lower right of orbit, moving CCW -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="280" cy="242" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="280" y1="242" x2="305" y2="230" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-75)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="285" y="270" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">S</text>
  </g>
</svg>
  </div>
</body>
</html>
