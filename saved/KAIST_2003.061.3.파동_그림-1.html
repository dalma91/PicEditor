<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.061.3.파동_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 810 870" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 28px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .boundary-line { stroke: #000000; stroke-width: 4.0; fill: none; }
    .normal-line { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; fill: none; }
    .ray-line { stroke: #000000; stroke-width: 2.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 지표면 및 경계면 (수평선) -->
    <!-- 지표면 (하단) -->
    <line class="movable boundary-line" x1="10" y1="700" x2="790" y2="700" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 경계면 (중간) -->
    <line class="movable boundary-line" x1="10" y1="280" x2="790" y2="280" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 지표면 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="590" y="725" width="100" height="40" fill="#FFFFFF"/>
      <text class="korean" x="640" y="745">지표</text>
    </g>

    <!-- 경계면 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="600" y="305" width="140" height="40" fill="#FFFFFF"/>
      <text class="korean" x="670" y="325">경계면</text>
    </g>

    <!-- 2. 풍속 V (외곽선 블록 화살표) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="80" y="70">풍속</text>
      <text class="math" x="145" y="70">V</text>
      <!-- 블록 화살표 -->
      <polygon points="180,55 240,55 240,40 285,70 240,100 240,85 180,85" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- 3. 음속 레이블 -->
    <!-- 위쪽: 음속 v2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="85" y="215">음속</text>
      <text class="math" x="145" y="215">v<tspan class="sub" dy="6">2</tspan></text>
    </g>
    <!-- 아래쪽: 음속 v1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="85" y="445">음속</text>
      <text class="math" x="145" y="445">v<tspan class="sub" dy="6">1</tspan></text>
    </g>

    <!-- 4. 음원 A 및 입사 광선/음파선 -->
    <!-- 지표 위의 음원 A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="110" y="745">음원</text>
      <text class="roman" x="175" y="745">A</text>
    </g>

    <!-- 입사 지점 법선 (A 위치: x=145, y=700) -->
    <line class="movable normal-line" x1="145" y1="700" x2="145" y2="630" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 직각 기호 -->
    <polyline class="movable" points="115,700 115,665 145,665" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta1 호 & 레이블 -->
    <path class="movable" d="M 145 660 A 40 40 0 0 1 168 668" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="180" y="635" transform="translate(0,0) scale(1,1) rotate(0)">θ<tspan class="sub" dy="6">1</tspan></text>

    <!-- 5. 음파 진행 경로 (A -> 경계면 점 P(385, 280)) -->
    <!-- 입사선: (145, 700) -> (385, 280) -->
    <line class="movable ray-line" x1="145" y1="700" x2="385" y2="280" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 입사선 위 화살표 -->
    <line class="movable ray-line" x1="240" y1="534" x2="265" y2="490" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 경계면 굴절점 법선 (P: x=385) -->
    <line class="movable normal-line" x1="385" y1="130" x2="385" y2="490" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 경계면 법선 직각 기호 (좌상단) -->
    <polyline class="movable" points="385,245 350,245 350,280" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 굴절각 theta2 호 & 레이블 -->
    <path class="movable" d="M 385 180 A 100 100 0 0 1 450 205" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="435" y="160" transform="translate(0,0) scale(1,1) rotate(0)">θ<tspan class="sub" dy="6">2</tspan></text>

    <!-- 6. 굴절선 및 관측점 E -->
    <!-- 실선 구간: (385, 280) -> (535, 115) -->
    <line class="movable ray-line" x1="385" y1="280" x2="535" y2="115" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 점선 연장 구간: (535, 115) -> (580, 65) -->
    <line class="movable normal-line" x1="535" y1="115" x2="580" y2="65" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 관측점 E 점 및 레이블 -->
    <circle class="movable" cx="585" cy="60" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="625" y="55" transform="translate(0,0) scale(1,1) rotate(0)">E</text>

    <!-- 7. 하단 캡션: 그림 1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="320" y="810" width="170" height="48" fill="#FFFFFF"/>
      <text class="korean" style="font-weight: bold; font-size: 32px;" x="405" y="834">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
