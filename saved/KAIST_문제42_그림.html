<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-42" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="hatch-42" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Floor line at y=260 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="30" y1="260" x2="510" y2="260" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="30" y="260" width="480" height="15" fill="url(#hatch-42)"/>

  <!-- Semicircle: center at (270, 260), radius R = 180 -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 90 260 A 180 180 0 0 1 450 260" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Top Point H at (270, 80) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="260" x2="270" y2="80" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="270" cy="80" r="3" fill="#000000"/>

  <!-- Arc indicator R on right: curve from (270, 260) to (270, 80) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 270 260 Q 295 170 270 80" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- Point A at height 3/4 R = 135 -> yA = 260 - 135 = 125 -->
  <!-- xA = 270 - sqrt(180^2 - 135^2) = 270 - 119.06 = 150.9 -->
  <!-- Horizontal reference line from A to left x=40 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="125" x2="151" y2="125" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Height 3/4 R double arrow -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="127" x2="75" y2="258" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-42)" marker-end="url(#arrow-42)"/>

  <!-- Small Mass at Point A -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="151" cy="125" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Tangent velocity arrow v0 at A: tangent angle to circle at (-119, -135) is dx=135, dy=-119 -> angle = -41.4 deg -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="156" y1="120" x2="188" y2="92" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-42)"/>

  <!-- Point B on semicircle at angle theta = 18 deg from vertical -->
  <!-- xB = 270 - 180*sin(18 deg) = 214.4, yB = 260 - 180*cos(18 deg) = 88.8 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="260" x2="214" y2="89" stroke="#000000" stroke-width="2"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="214" cy="89" r="3" fill="#000000"/>

  <!-- Angle theta arc at center -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 270 205 A 55 55 0 0 0 253 208" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- LABELS -->
  <!-- 3/4 R -->
  <g class="movable text-wrap" transform="translate(35, 192) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-18" y="-14" width="36" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">¾<tspan font-style="italic">R</tspan></text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(162, 142) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- v0 -->
  <g class="movable text-wrap" transform="translate(150, 92) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">v₀</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(195, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- H -->
  <g class="movable text-wrap" transform="translate(270, 58) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">H</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(252, 212) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- R -->
  <g class="movable text-wrap" transform="translate(300, 170) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>
</svg>
</body>
</html>
