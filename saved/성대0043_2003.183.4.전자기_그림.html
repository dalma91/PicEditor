<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0043_2003.183.4.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 650 550" width="650" height="550" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- y축 및 x축 -->
    <line class="movable" x1="160" y1="500" x2="160" y2="40" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="40" y1="270" x2="600" y2="270" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 점 P (160, 120), 원점 O (160, 270), 점 Q (160, 420) -->
    <circle class="movable" cx="160" cy="120" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="160" cy="270" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="160" cy="420" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 점 A at x = 160 + 260 = 420 -->
    <circle class="movable" cx="440" cy="270" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 거리 a 치수호 (O -> P) -->
    <path class="movable" d="M 160,270 Q 195,195 160,120" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 거리 a 치수호 (O -> Q) -->
    <path class="movable" d="M 160,270 Q 195,345 160,420" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 거리 sqrt(3)a 치수호 (O -> A) -->
    <path class="movable" d="M 160,270 Q 300,325 440,270" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="115" y="130" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="180" y="130" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">P</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="185" y="200" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">a</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="295" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="185" y="355" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">a</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="115" y="435" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="180" y="435" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">Q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="425" y="250" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="280" y="335" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">√3 a</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="610" y="280" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="normal" text-anchor="start">x</text></g>
  </g>
</svg>
</body>
</html>
