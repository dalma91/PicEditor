<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제3_그림3-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 650 240" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 16px; fill: #000000; }
    .screen-line { stroke: #000000; stroke-width: 2.2; fill: none; }
    .axis-dash { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 광원 V 및 필터 F -->
    <!-- ========================================== -->
    <!-- 전구 외곽 이중 원 -->
    <circle class="movable" cx="45" cy="115" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="45" cy="115" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 필라멘트 (꼬불꼬불 선) -->
    <path class="movable" d="M 38 135 L 38 120 C 38 108, 43 108, 45 115 C 47 108, 52 108, 52 120 L 52 135" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="40" y1="135" x2="40" y2="155" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="50" y1="135" x2="50" y2="155" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 광원 V 레이블 및 지시선 -->
    <text class="movable roman" x="75" y="45">V</text>
    <line class="movable" x1="70" y1="55" x2="52" y2="92" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 필터 F 레이블 및 지시선 -->
    <text class="movable roman" x="90" y="145">F</text>
    <line class="movable" x1="82" y1="138" x2="68" y2="125" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 광축 (중심 점선) -->
    <!-- ========================================== -->
    <line class="movable axis-dash" x1="80" y1="115" x2="615" y2="115" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 스크린 A (단일 슬릿 S0) -->
    <!-- ========================================== -->
    <!-- 스크린 A 상단/하단 차광판 -->
    <line class="movable screen-line" x1="195" y1="10" x2="195" y2="108" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable screen-line" x1="195" y1="122" x2="195" y2="200" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 슬릿 중심점 M -->
    <circle class="movable" cx="195" cy="115" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="175" y="95">M</text>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="175" y="135">S<tspan class="sub" dy="4">0</tspan></text>
    </g>
    <text class="movable roman" x="195" y="225">A</text>

    <!-- ========================================== -->
    <!-- 4. 스크린 B (이중 슬릿 S1, S2) -->
    <!-- ========================================== -->
    <!-- 스크린 B 세 구간 차광판 -->
    <line class="movable screen-line" x1="385" y1="10" x2="385" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable screen-line" x1="385" y1="110" x2="385" y2="120" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable screen-line" x1="385" y1="130" x2="385" y2="200" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 슬릿 S1, S2 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="365" y="95">S<tspan class="sub" dy="4">1</tspan></text>
    </g>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="365" y="135">S<tspan class="sub" dy="4">2</tspan></text>
    </g>
    <text class="movable roman" x="385" y="225">B</text>

    <!-- 거리 L (A와 B 사이) -->
    <line class="movable" x1="200" y1="175" x2="380" y2="175" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="290" y="155" transform="translate(0,0) scale(1,1) rotate(0)">L</text>

    <!-- ========================================== -->
    <!-- 5. 스크린 C (관측 스크린, x축, 점 O, P) -->
    <!-- ========================================== -->
    <!-- x축 (수직 상향 화살표) -->
    <line class="movable screen-line" x1="565" y1="200" x2="565" y2="15" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="545" y="20" transform="translate(0,0) scale(1,1) rotate(0)">x</text>

    <!-- 중심점 O -->
    <circle class="movable" cx="565" cy="115" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="585" y="105">O</text>

    <!-- 관측점 P -->
    <circle class="movable" cx="565" cy="35" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="585" y="35">P</text>
    <text class="movable roman" x="565" y="225">C</text>

    <!-- 거리 R (B와 C 사이) -->
    <line class="movable" x1="390" y1="175" x2="560" y2="175" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="475" y="155" transform="translate(0,0) scale(1,1) rotate(0)">R</text>
  </g>
</svg>
</body>
</html>
