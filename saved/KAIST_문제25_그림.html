<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <pattern id="ground-hatch25" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <marker id="rot-arrow25" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dim-s25" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e25" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="axis-arr25" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Ground Line & Hatch -->
  <line class="movable" x1="70" y1="235" x2="490" y2="235" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <polygon class="movable" points="70,235 490,235 470,265 70,265" fill="url(#ground-hatch25)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Left Triangular Stand A -->
  <polygon class="movable" points="160,160 125,235 195,235" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Right Triangular Stand B -->
  <polygon class="movable" points="420,160 385,235 455,235" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Circular Discs A and B -->
  <circle class="movable" cx="160" cy="160" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="420" cy="160" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Axle pins -->
  <circle class="movable" cx="160" cy="160" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="420" cy="160" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Rotation Arc Arrows -->
  <!-- Disc A (clockwise, top moves right) -->
  <path class="movable" d="M 190 138 A 38 38 0 0 1 180 198" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#rot-arrow25)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Disc B (counter-clockwise, top moves left) -->
  <path class="movable" d="M 390 138 A 38 38 0 0 0 400 198" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#rot-arrow25)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Long Uniform Horizontal Rod -->
  <rect class="movable" x="50" y="112" width="520" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Center of Mass G of Rod -->
  <circle class="movable" cx="330" cy="120" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Midpoint O Reference Lines -->
  <line class="movable" x1="290" y1="80" x2="290" y2="165" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="330" y1="120" x2="330" y2="165" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Coordinate x arrow from 290 to 330 -->
  <line class="movable" x1="290" y1="165" x2="328" y2="165" stroke="#000000" stroke-width="1.5" marker-end="url(#axis-arr25)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension 2L between disc centers -->
  <line class="movable" x1="160" y1="48" x2="420" y2="48" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s25)" marker-end="url(#dim-e25)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="160" y1="38" x2="160" y2="128" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="420" y1="38" x2="420" y2="128" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- 2L -->
  <g class="movable text-wrap" transform="translate(290, 32) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-18" y="-12" width="36" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">2L</text>
  </g>

  <!-- G -->
  <g class="movable text-wrap" transform="translate(330, 98) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">G</text>
  </g>

  <!-- x -->
  <g class="movable text-wrap" transform="translate(308, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(275, 180) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- A (Disc) -->
  <g class="movable text-wrap" transform="translate(142, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- B (Disc) -->
  <g class="movable text-wrap" transform="translate(438, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- omega (left) -->
  <g class="movable text-wrap" transform="translate(210, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">ω</text>
  </g>

  <!-- omega (right) -->
  <g class="movable text-wrap" transform="translate(370, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">ω</text>
  </g>
</svg>
</body>
</html>
