<!DOCTYPE html>
<html lang="ko">
<head>

  <title>성대0032_2003.165.2.파동_그림</title>

<body>

      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 유리판 G2 (하부 수평 직사각형) -->
    <rect class="movable" x="40" y="240" width="700" height="60" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <polygon class="movable" points="38,180 735,140 738,198 42,238" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 광선 입사 및 반사 (a, b) -->
    <!-- 입사광 (수직 하향) -->
    <line class="movable" x1="485" y1="70" x2="485" y2="225" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- G1 하면(A) 반사광 a -->
    <path class="movable" d="M 485,225 Q 470,240 455,220 L 455,100" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- G2 상면(B) 반사광 b -->
    <path class="movable" d="M 470,223 L 470,240 Q 455,255 440,235 L 440,110" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 치수선 x (좌단 ~ 광선 입사점) -->
    <line class="movable" x1="40" y1="300" x2="40" y2="345" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="470" y1="245" x2="470" y2="345" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="40" y1="325" x2="470" y2="325" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 치수선 l (좌단 ~ 스페이서 좌단) -->
    <line class="movable" x1="40" y1="345" x2="40" y2="395" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="695" y1="300" x2="695" y2="395" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="40" y1="375" x2="695" y2="375" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="200" y="205" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">G₁</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="200" y="280" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">G₂</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="525" y="205" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="525" y="280" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="450" y="85" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">a</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="425" y="110" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">b</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="245" y="320" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="365" y="370" font-family="'Times New Roman', serif" font-size="28" font-style="italic" font-weight="normal" text-anchor="start">l</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="370" y="450" font-family="'Malgun Gothic', sans-serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">그림 3</text></g>
