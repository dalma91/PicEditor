<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <marker id="traj-arr29" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-s29" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e29" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Ceiling Line -->
  <line class="movable" x1="20" y1="40" x2="520" y2="40" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Pivot O -->
  <circle class="movable" cx="265" cy="40" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical Reference dashed line from O to M -->
  <line class="movable" x1="265" y1="40" x2="265" y2="300" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Initial line to P (dashed guideline) -->
  <line class="movable" x1="265" y1="40" x2="450" y2="200" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Angle 60 deg arc at O -->
  <path class="movable" d="M 265 110 A 70 70 0 0 0 310 88" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Pendulum string OP (solid line) -->
  <line class="movable" x1="265" y1="40" x2="425" y2="195" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Mass A at position P -->
  <circle class="movable" cx="425" cy="195" r="13" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Trajectory arc 1: from P(425, 195) down to M(265, 300) (radius R=260) -->
  <path class="movable" d="M 425 195 A 260 260 0 0 1 265 300" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Shortened string trajectory from M(265, 300) toward R: radius shortened to 234 -->
  <line class="movable" x1="265" y1="300" x2="238" y2="274" stroke="#000000" stroke-width="1.8" marker-end="url(#traj-arr29)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 238 274 A 234 234 0 0 1 155 240" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#traj-arr29)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 155 240 A 234 234 0 0 1 80 120" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Expansion/contraction double arrow at R -->
  <line class="movable" x1="80" y1="120" x2="80" y2="185" stroke="#000000" stroke-width="1.5" marker-start="url(#dim-s29)" marker-end="url(#dim-e29)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 80 185 A 260 260 0 0 0 210 285" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- O -->
  <g class="movable text-wrap" transform="translate(250, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- 60 deg -->
  <g class="movable text-wrap" transform="translate(300, 115) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-10" width="32" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">60°</text>
  </g>

  <!-- l [m] -->
  <g class="movable text-wrap" transform="translate(330, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000"><tspan font-style="italic">l</tspan> [m]</text>
  </g>

  <!-- P -->
  <g class="movable text-wrap" transform="translate(458, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">P</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(450, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- 시작점 -->
  <g class="movable text-wrap" transform="translate(505, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-28" width="30" height="56" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-14" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">시</text>
    <text class="text-el" x="0" y="4" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">작</text>
    <text class="text-el" x="0" y="22" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">점</text>
  </g>

  <!-- m [kg] -->
  <g class="movable text-wrap" transform="translate(450, 250) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-30" y="-12" width="60" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000"><tspan font-style="italic">m</tspan> [kg]</text>
  </g>

  <!-- M (Lowest point) -->
  <g class="movable text-wrap" transform="translate(265, 320) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">M</text>
  </g>

  <!-- R (Highest swing point) -->
  <g class="movable text-wrap" transform="translate(80, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>
</svg>
</body>
</html>
