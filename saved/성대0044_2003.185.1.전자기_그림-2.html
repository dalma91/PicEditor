<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0044_2003.185.1.전자기_그림-2</title>
</head>
<body>
<svg viewBox="0 0 650 480" width="650" height="480" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 자기장 B 선들 -->
    <line class="movable" x1="50" y1="70" x2="520" y2="70" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="130" x2="520" y2="130" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="190" x2="520" y2="190" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="250" x2="520" y2="250" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="310" x2="520" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="50" y1="370" x2="520" y2="370" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 중심 기준축 (O-Q 축 y=190) -->
    <line class="movable" x1="50" y1="190" x2="600" y2="190" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 점 O (140, 190), 초기 속도 v 및 각도 θ -->
    <line class="movable" x1="140" y1="190" x2="198" y2="135" stroke="#000000" stroke-width="2.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 175,190 A 35 35 0 0 0 170,162" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 나선형 궤적 (O -> 상부 루프 -> 하부 루프 -> Q: 330, 190) -->
    <path class="movable" d="M 140,190 C 180,100 280,100 350,170 C 390,210 405,310 350,350 C 300,380 290,250 330,190" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="330" cy="190" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 궤적 방향 화살표들 -->
    <polygon class="movable" points="390,265 400,285 410,265" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <polygon class="movable" points="300,285 310,265 320,285" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="555" y="115" font-family="'Times New Roman', serif" font-size="34" font-style="italic" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="225" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="110" y="175" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">v</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="205" y="180" font-family="'Times New Roman', serif" font-size="26" font-style="italic" font-weight="normal" text-anchor="start">θ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="325" y="225" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">Q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="250" y="440" font-family="'Malgun Gothic', sans-serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">그림 2</text></g>
  </g>
</svg>
</body>
</html>
