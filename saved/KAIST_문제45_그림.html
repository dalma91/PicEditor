<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <pattern id="hatch-45" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8898A8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ================= PANEL 1-1: 그림 1-1 ================= -->
  <!-- Wedge Body: x: 50..230, y: 55..235 -->
  <!-- Arc center O at (230, 55), Radius R = 180. Arc from top-left (70, 75) to bottom (230, 235) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
        d="M 50 55 L 70 55 Q 70 180 230 235 L 50 235 Z" 
        fill="url(#hatch-45)" stroke="#000000" stroke-width="2"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 85 65 A 180 180 0 0 0 230 235" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Reference rectangle & horizontal line from O (230, 55) to (50, 55) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="55" x2="230" y2="55" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="230" y1="55" x2="230" y2="235" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Pulleys at top-left: (50, 60) and (80, 60) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="50" cy="60" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="80" cy="60" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

  <!-- Mass A at equilibrium: angle theta0 = 55 deg from horizontal -->
  <!-- xA = 230 - 180*cos(55 deg) = 126.8, yA = 55 + 180*sin(55 deg) = 202.4 -->
  <!-- String from Weight B (45, 270) up to pulley (50, 60), across to (80, 60), down to Mass A (127, 202) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="270" x2="45" y2="60" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="55" x2="80" y2="55" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="85" y1="60" x2="127" y2="202" stroke="#000000" stroke-width="1.8"/>

  <!-- Mass A and Weight B -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="127" cy="202" r="8" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="45" cy="275" r="8" fill="#000000"/>

  <!-- Radius line from O (230, 55) to Mass A (127, 202) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="230" y1="55" x2="127" y2="202" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Angle theta0 arc at O -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 190 55 A 40 40 0 0 1 207 88" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension arc R -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 230 55 Q 160 170 127 202" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- LABELS Panel 1-1 -->
  <g class="movable text-wrap" transform="translate(242, 55) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>
  <g class="movable text-wrap" transform="translate(155, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="15" fill="#000000">수평선</text>
  </g>
  <g class="movable text-wrap" transform="translate(210, 80) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ₀</text>
  </g>
  <g class="movable text-wrap" transform="translate(195, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">R</text>
  </g>
  <g class="movable text-wrap" transform="translate(142, 185) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(28, 265) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(140, 310) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" font-weight="bold" fill="#000000">그림 1-1</text>
  </g>

  <!-- ================= PANEL 1-2: 그림 1-2 ================= -->
  <!-- Shifted by dx=230: Center O at (460, 55) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
        d="M 280 55 L 300 55 Q 300 180 460 235 L 280 235 Z" 
        fill="url(#hatch-45)" stroke="#000000" stroke-width="2"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 315 65 A 180 180 0 0 0 460 235" fill="none" stroke="#000000" stroke-width="2.5"/>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="280" y1="55" x2="460" y2="55" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="55" x2="460" y2="235" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="280" cy="60" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="310" cy="60" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

  <!-- Displaced Mass A: at angle 42 deg (theta0 - delta) -> x=326, y=175 -->
  <!-- Equilibrium position (dashed): x=357, y=202 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="370" cy="185" r="7" fill="#C0C8D0" stroke="#444444" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Displaced Mass A at x=390, y=212 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="390" cy="212" r="8" fill="#000000"/>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="275" y1="280" x2="275" y2="60" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="280" y1="55" x2="310" y2="55" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="315" y1="60" x2="390" y2="212" stroke="#000000" stroke-width="1.8"/>

  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="275" cy="280" r="8" fill="#000000"/>

  <!-- Radial lines for angles -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="55" x2="370" y2="185" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="55" x2="390" y2="212" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Angles theta0 and delta -->
  <g class="movable text-wrap" transform="translate(472, 55) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>
  <g class="movable text-wrap" transform="translate(385, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="15" fill="#000000">수평선</text>
  </g>
  <g class="movable text-wrap" transform="translate(425, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ₀</text>
  </g>
  <g class="movable text-wrap" transform="translate(415, 142) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">δ</text>
  </g>
  <g class="movable text-wrap" transform="translate(412, 212) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(258, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(370, 310) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" font-weight="bold" fill="#000000">그림 1-2</text>
  </g>

  <!-- ================= PANEL 1-3: 그림 1-3 ================= -->
  <!-- Convex sector OPQ: Center O at (570, 225). R = 170. Horizontal baseline OP to (740, 225), vertical OQ to (570, 55) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
        d="M 570 225 L 740 225 A 170 170 0 0 0 570 55 Z" 
        fill="url(#hatch-45)" stroke="#000000" stroke-width="2"/>

  <!-- Pulley Q at (570, 55) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="570" cy="55" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

  <!-- Mass A on convex outer rim: at angle theta0 = 55 deg above horizontal OP -->
  <!-- xA = 570 + 170*cos(55 deg) = 667.5, yA = 225 - 170*sin(55 deg) = 85.8 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="668" cy="86" r="8" fill="#000000"/>
  <!-- Displaced A (dashed) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="692" cy="105" r="7" fill="#C0C8D0" stroke="#444444" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- String along outer rim from Pulley Q to Mass A -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 570 50 A 170 170 0 0 1 668 86" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Hanging weight B below Q -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="565" y1="55" x2="565" y2="280" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="565" cy="285" r="8" fill="#000000"/>

  <!-- Radial lines from O (570, 225) to Mass positions -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="570" y1="225" x2="668" y2="86" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="570" y1="225" x2="692" y2="105" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- LABELS Panel 1-3 -->
  <g class="movable text-wrap" transform="translate(552, 50) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">Q</text>
  </g>
  <g class="movable text-wrap" transform="translate(668, 62) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(552, 225) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>
  <g class="movable text-wrap" transform="translate(755, 225) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">P</text>
  </g>
  <g class="movable text-wrap" transform="translate(655, 245) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="15" fill="#000000">수평선</text>
  </g>
  <g class="movable text-wrap" transform="translate(545, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(650, 310) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" font-weight="bold" fill="#000000">그림 1-3</text>
  </g>
</svg>
</body>
</html>
