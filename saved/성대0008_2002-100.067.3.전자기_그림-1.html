<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0008_2002-100.067.3.전자기_그림-1</title>
</head>
<body>
<svg viewBox="0 0 600 650" width="600" height="650" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <g class="main-diagram">
    <!-- x축 및 y축 화살표 -->
    <line class="movable" x1="10" y1="315" x2="550" y2="315" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="275" y1="570" x2="275" y2="55" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 점 C 표시 (X자 기호) -->
    <path class="movable" d="M 265,135 L 285,155 M 285,135 L 265,155" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 전하 점 A (-a, 0), 점 B (a, 0) -->
    <circle class="movable" cx="65" cy="315" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="485" cy="315" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 원점 O(0,0)에 놓인 전하 Q (빈 원) -->
    <circle class="movable" cx="275" cy="315" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="565" y="325" font-family="'Times New Roman', serif" font-size="44" font-style="italic">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="275" y="45" font-family="'Times New Roman', serif" font-size="44" font-style="italic" text-anchor="middle">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="305" y="155" font-family="'Times New Roman', serif" font-size="40">C (0, <tspan font-style="italic">y</tspan>)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="65" y="295" font-family="'Times New Roman', serif" font-size="42" font-style="italic" text-anchor="middle">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="80" y="370" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">A (-<tspan font-style="italic">a</tspan>, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="290" y="305" font-family="'Times New Roman', serif" font-size="42" font-style="italic">Q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="340" y="370" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">O (0, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="485" y="295" font-family="'Times New Roman', serif" font-size="42" font-style="italic" text-anchor="middle">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="485" y="370" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">B (<tspan font-style="italic">a</tspan>, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="275" y="625" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 1</text></g>
  </g>
</svg>
</body>
</html>
