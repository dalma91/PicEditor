<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제69_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-69" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="ground-pat-69" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#94a3b8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ================= LEFT PANEL: 그림 1 ================= -->
  <!-- Ground base -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="210" x2="430" y2="210" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="20" y="210" width="410" height="40" fill="url(#ground-pat-69)" stroke="#94a3b8" stroke-width="0.5"/>

  <!-- Track BAC (center O=(180, 80), r=130) -->
  <!-- B=(50, 80), A=(180, 210), C: angle 30 deg below horiz => (293, 145) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 50 80 A 130 130 0 0 0 180 210 A 130 130 0 0 0 293 145"
        fill="none" stroke="#000000" stroke-width="2.8"/>

  <!-- Center O -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="180" cy="80" r="3" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="172" y="55" width="18" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="180" y="70" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">O</text>
  </g>

  <!-- Vertical dashed line OA -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="80" x2="180" y2="210" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Small sphere at A (dotted/initial position) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="180" cy="202" r="8" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Small sphere displaced by theta (e.g. theta = 35 deg => x = 180 + 130*sin(35) = 254.5, y = 80 + 130*cos(35) = 186.5) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="80" x2="254" y2="186" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="250" cy="182" r="8" fill="#000000"/>

  <!-- Angle theta arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 180 135 A 55 55 0 0 1 211 125" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="202" y="152" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">θ</text>
  </g>

  <!-- Radius r curved arrow/bracket along OA -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 178 85 C 160 115, 160 175, 178 205" fill="none" stroke="#000000" stroke-width="1"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="150" y="135" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="158" y="151" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">r</text>
  </g>

  <!-- Horizontal displacement x -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="190" x2="250" y2="230" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="210" x2="180" y2="230" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="225" x2="250" y2="225" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="206" y="215" width="16" height="18" fill="#FFFFFF"/>
    <text class="text-el" x="214" y="229" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">x</text>
  </g>

  <!-- Height r on left of panel 1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="35" y1="80" x2="50" y2="80" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="80" x2="45" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="28" y="135" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="36" y="151" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">r</text>
  </g>

  <!-- Height r/2 on right of panel 1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="293" y1="145" x2="335" y2="145" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="328" y1="145" x2="328" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="334" y="165" width="22" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="345" y="176" font-family="'Times New Roman', serif" font-style="italic" font-size="16" text-anchor="middle">r</text>
    <line x1="337" y1="181" x2="353" y2="181" stroke="#000000" stroke-width="1.2"/>
    <text class="text-el" x="345" y="195" font-family="'Times New Roman', serif" font-size="16" text-anchor="middle">2</text>
  </g>

  <!-- Labels B, C, A -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="48" y="70" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="280" y="160" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="180" y="232" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- Caption 그림 1 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="215" y="295" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">그림 1</text>
  </g>


  <!-- ================= RIGHT PANEL: 그림 2 ================= -->
  <!-- Ground base -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="470" y1="210" x2="860" y2="210" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="470" y="210" width="390" height="40" fill="url(#ground-pat-69)" stroke="#94a3b8" stroke-width="0.5"/>

  <!-- Track BAC (center O=(600, 80), r=130) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 510 80 A 130 130 0 0 0 640 210 A 130 130 0 0 0 753 145"
        fill="none" stroke="#000000" stroke-width="2.8"/>

  <!-- Center O -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="640" cy="80" r="3" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="632" y="55" width="18" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="640" y="70" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">O</text>
  </g>

  <!-- Spheres along motion: B, A, C -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="520" cy="80" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="640" cy="202" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="747" cy="140" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

  <!-- Parabolic flight: from C=(753, 145) to peak D=(795, 65) to landing E=(845, 210) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 753 145 Q 775 60 795 65 Q 825 70 845 210"
        fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="3,3"/>

  <!-- Peak point D -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="795" cy="65" r="2.5" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="795" y="52" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">D</text>
  </g>

  <!-- Dimension h from D to ground -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="795" y1="65" x2="795" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="782" y="130" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="790" y="147" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">h</text>
  </g>

  <!-- Landing point E -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="852" y="202" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">E</text>
  </g>

  <!-- Horizontal distance l from D to E -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="795" y1="210" x2="795" y2="235" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="845" y1="210" x2="845" y2="235" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="795" y1="230" x2="845" y2="230" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="814" y="220" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="822" y="235" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">l</text>
  </g>

  <!-- Height r on left of panel 2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="485" y1="80" x2="510" y2="80" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="495" y1="80" x2="495" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="480" y="135" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="488" y="151" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">r</text>
  </g>

  <!-- Height r/2 on right of track in panel 2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="753" y1="145" x2="775" y2="145" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="770" y1="145" x2="770" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-69)" marker-end="url(#arrow-69)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="752" y="168" width="22" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="762" y="178" font-family="'Times New Roman', serif" font-style="italic" font-size="16" text-anchor="middle">r</text>
    <line x1="754" y1="183" x2="770" y2="183" stroke="#000000" stroke-width="1.2"/>
    <text class="text-el" x="762" y="197" font-family="'Times New Roman', serif" font-size="16" text-anchor="middle">2</text>
  </g>

  <!-- Labels B, C, A in panel 2 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="508" y="70" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="725" y="112" width="18" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="734" y="128" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="640" y="232" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- Caption 그림 2 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="660" y="295" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">그림 2</text>
  </g>
</svg>
  </div>
</body>
</html>
