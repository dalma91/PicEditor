<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제72_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-72" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="ground-pat-72" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="12" y2="0" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <pattern id="block-pat-72" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#cbd5e1"/>
      <circle cx="3" cy="3" r="1" fill="#000000"/>
    </pattern>
  </defs>

  <!-- Ground Line and Hatching -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="280" x2="760" y2="280" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="20" y="280" width="740" height="25" fill="url(#ground-pat-72)" stroke="none"/>

  <!-- Table Legs -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="65" y="205" width="25" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="475" y="205" width="25" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Table Top Frame -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="60" y="180" width="455" height="25" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Curved Ramp Structure -->
  <!-- Left back wall x=60 from y=50 to 180, curved slope to horizontal -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 60 50 L 60 180 H 260 C 200 180, 120 120, 60 50 Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>

  <!-- Incline angle beta guide lines -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="180" x2="210" y2="180" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="60" y1="50" x2="210" y2="190" stroke="#000000" stroke-width="1.2"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 120 180 A 50 50 0 0 0 145 130" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="110" y="160" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">β</text>
  </g>

  <!-- Point P at height h -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="40" y1="75" x2="85" y2="75" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="45" y1="75" x2="45" y2="180" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-72)" marker-end="url(#arrow-72)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="32" y="115" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="40" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">h</text>
  </g>

  <!-- Object 1 on Incline at P -->
  <g class="movable" transform="translate(98, 70) rotate(-42)">
    <rect x="-10" y="-10" width="20" height="20" fill="url(#block-pat-72)" stroke="#000000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#000000"/>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="80" y="98" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">P</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="115" y="45" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">물체 1</text>
  </g>

  <!-- Object 2 on table at Q -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="335" y="160" width="20" height="20" fill="url(#block-pat-72)" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="345" cy="170" r="2" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="345" y="145" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">물체 2</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="345" y="200" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">Q</text>
  </g>

  <!-- Object 3 at edge R -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="440" y="160" width="20" height="20" fill="url(#block-pat-72)" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="450" cy="170" r="2" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="445" y="145" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">물체 3</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="450" y="200" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">R</text>
  </g>

  <!-- Parabolic flight trajectory from edge R to floor -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 515 180 C 580 180, 680 210, 710 275"
        fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-72)"/>

  <!-- Caption 그림 1 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="380" y="325" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">그림 1</text>
  </g>
</svg>
  </div>
</body>
</html>
