<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.036.1.열역학_그림-3</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1596 980" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1.5 L 0 5 L 9 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 실린더 벽면 빗금 해치 패턴 -->
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#777777" stroke-width="1.8"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 실린더 1 벽면 (좌측 실린더) -->
    <path class="movable" d="M 320 540 L 340 540 L 340 860 L 560 860 L 560 540 L 580 540 L 580 840 L 580 880 L 320 880 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="340" y1="540" x2="340" y2="860" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="340" y1="860" x2="560" y2="860" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="560" y1="540" x2="560" y2="840" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 실린더 2 벽면 (우측 실린더) -->
    <path class="movable" d="M 1020 540 L 1040 540 L 1040 840 L 1020 840 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 1020 880 L 1020 860 L 1040 860 L 1220 860 L 1220 540 L 1240 540 L 1240 880 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1040" y1="540" x2="1040" y2="840" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1040" y1="860" x2="1220" y2="860" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1220" y1="540" x2="1220" y2="860" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 하단 연결관 -->
    <line class="movable" x1="560" y1="840" x2="1040" y2="840" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="560" y1="860" x2="1040" y2="860" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 밸브 기호 -->
    <polygon class="movable" points="790,828 810,828 800,850" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="790,872 810,872 800,850" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="800" y1="820" x2="800" y2="880" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 피스톤 1 (상승한 위치: y=685) -->
    <path class="movable" d="M 340 685 L 560 685 L 560 720 L 340 720 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 430 685 L 430 355 L 450 315 L 470 355 L 470 685 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 피스톤 2 (더 하강한 위치: y=795) -->
    <path class="movable" d="M 1040 795 L 1220 795 L 1220 830 L 1040 830 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 1110 795 L 1110 415 L 1130 375 L 1150 415 L 1150 795 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 기울어진 상단 강체 막대 (피스톤1 끝(450, 315)과 피스톤2 끝(1130, 375)에 얹힘) -->
    <!-- 각도 대략 5도 기울어짐 -->
    <polygon class="movable" points="400,285 1180,352 1178,374 398,307" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 8. 수직 항력 화살표 F1, F2 (피스톤 끝에서 막대를 위로 받침) -->
    <line class="movable" x1="450" y1="315" x2="450" y2="205" stroke="#000000" stroke-width="4.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1130" y1="375" x2="1130" y2="295" stroke="#000000" stroke-width="4.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 9. 무게중심 중력 mg 화살표 (L/2 지점: x=790) -->
    <line class="movable" x1="790" y1="328" x2="790" y2="425" stroke="#000000" stroke-width="4.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 10. 외력 하중 화살표 (3L/4 지점: x=960) - 막대를 누르는 화살표 -->
    <line class="movable" x1="960" y1="120" x2="960" y2="340" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="950,370 970,370 960,350" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 11. 상단 치수선: L, 3L/4, L/2 -->
    <!-- 기준 연장선 (좌측 피스톤 끝 x=450) -->
    <line class="movable" x1="450" y1="300" x2="450" y2="45" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 기준 연장선 (우측 피스톤 끝 x=1130) -->
    <line class="movable" x1="1130" y1="365" x2="1130" y2="45" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전체 L 치수선 (y=55) -->
    <line class="movable" x1="454" y1="55" x2="1126" y2="55" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3L/4 치수선 (y=120) -->
    <line class="movable" x1="454" y1="120" x2="956" y2="120" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- L/2 치수선 (y=190) -->
    <line class="movable" x1="790" y1="328" x2="790" y2="175" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="454" y1="190" x2="786" y2="190" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 12. 피스톤 높이 치수선 (좌측: h1'+Delta h1', 우측: h2'-Delta h2') -->
    <line class="movable" x1="340" y1="720" x2="250" y2="720" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="320" y1="860" x2="250" y2="860" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="270" y1="724" x2="270" y2="856" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <line class="movable" x1="1220" y1="830" x2="1310" y2="830" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1240" y1="860" x2="1310" y2="860" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1290" y1="834" x2="1290" y2="856" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 상단 치수 라벨 L -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="775" y="15" width="30" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="790" y="33">L</text>
    </g>

    <!-- 상단 치수 라벨 3L/4 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="660" y="80" width="85" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="702" y="98">3L/4</text>
    </g>

    <!-- 상단 치수 라벨 L/2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="585" y="150" width="70" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="620" y="168">L/2</text>
    </g>

    <!-- 수직 항력 F1, F2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="375" y="210" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="400" y="230">F<tspan dy="6" font-size="24">1</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1145" y="300" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1170" y="320">F<tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 중력 mg -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="715" y="390" width="60" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="745" y="408">mg</text>
    </g>

    <!-- 외부 기압 P0 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="765" y="535" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="790" y="555">P<tspan dy="6" font-size="24">0</tspan></text>
    </g>

    <!-- 단면적 S1, S2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="425" y="795" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="450" y="815">S<tspan dy="6" font-size="24">1</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1105" y="855" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1130" y="875">S<tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 좌측 높이 공식: h1' + Delta h1' -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="35" y="775" width="200" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="135" y="797">h<tspan dy="6" font-size="24">1</tspan><tspan dy="-10" font-size="28">′</tspan><tspan dy="4"> + Δh</tspan><tspan dy="6" font-size="24">1</tspan><tspan dy="-10" font-size="28">′</tspan></text>
    </g>

    <!-- 우측 높이 공식: h2' - Delta h2' -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1320" y="830" width="200" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1420" y="852">h<tspan dy="6" font-size="24">2</tspan><tspan dy="-10" font-size="28">′</tspan><tspan dy="4"> − Δh</tspan><tspan dy="6" font-size="24">2</tspan><tspan dy="-10" font-size="28">′</tspan></text>
    </g>

    <!-- 밸브 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="760" y="775" width="80" height="35" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="800" y="793">밸브</text>
    </g>

    <!-- 캡션 '그림 4' (원본 図 4 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="740" y="930" width="120" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="800" y="952">그림 4</text>
    </g>
  </g>
</svg>
</body>
</html>
