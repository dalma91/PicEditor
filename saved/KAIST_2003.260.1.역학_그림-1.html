<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.260.1.역학_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 680 900" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 액체 점박이/해치 패턴 -->
    <pattern id="liquid-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#666666" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .tube-wall { stroke: #000000; stroke-width: 2.2; fill: none; }
    .guide-dash { stroke: #000000; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. U자관 내부 액체 채움 (불균형 진동 상태) -->
    <!-- ========================================== -->
    <!-- 좌측 상단 수면 y=275, 우측 상단 수면 y=495 -->
    <!-- 외경 R=215 (x: 230 ~ 660), 내경 r=160 (x: 285 ~ 605), 중심 (445, 555) -->
    <path class="movable" d="M 230 275 L 285 275 L 285 555 A 160 160 0 0 0 605 555 L 605 495 L 660 495 L 660 555 A 215 215 0 0 1 230 555 Z" fill="#B0B0B0" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. U자관 유리벽 (외벽 및 내벽) -->
    <!-- ========================================== -->
    <!-- 외벽 (좌측 상단 125 -> 바닥 U턴 -> 우측 상단 125) -->
    <path class="movable tube-wall" d="M 230 125 L 230 555 A 215 215 0 0 0 660 555 L 660 125" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내벽 (좌측 상단 125 -> 바닥 U턴 -> 우측 상단 125) -->
    <path class="movable tube-wall" d="M 285 125 L 285 555 A 160 160 0 0 0 605 555 L 605 125" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 관 입구 상단 닫힘선 -->
    <line class="movable" x1="230" y1="125" x2="285" y2="125" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="605" y1="125" x2="660" y2="125" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 기준선 및 눈금/치수 (y=0, y=ymax, 2r) -->
    <!-- ========================================== -->
    <!-- 평형 수면 기준 점선 y = 0 -->
    <line class="movable guide-dash" x1="230" y1="385" x2="660" y2="385" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- y = 0 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="145" y="385">y</text>
      <text class="roman" x="180" y="385">=</text>
      <text class="roman" x="205" y="385">0</text>
    </g>

    <!-- 좌측 최대 변위 y = ymax -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="105" y="275">y</text>
      <text class="roman" x="140" y="275">=</text>
      <text class="math" x="175" y="275">y<tspan class="sub" dy="6">max</tspan></text>
    </g>
    <!-- 좌측 수면 A 레이블 -->
    <text class="movable roman" x="257" y="250">A</text>

    <!-- 관 내경 2r 치수선 -->
    <line class="movable guide-dash" x1="230" y1="125" x2="230" y2="75" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable guide-dash" x1="285" y1="125" x2="285" y2="75" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="233" y1="100" x2="282" y2="100" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="245" y="50">2</text>
      <text class="math" x="270" y="50">r</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 중심 O 및 곡률 반경 R -->
    <!-- ========================================== -->
    <!-- U자관 중심선 점선 (반지름 R=187.5) -->
    <path class="movable guide-dash" d="M 257.5 555 A 187.5 187.5 0 0 0 632.5 555" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 중심점 O 표시 (십자 마크) -->
    <line class="movable" x1="438" y1="555" x2="452" y2="555" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="445" y1="548" x2="445" y2="562" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 중심 O 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="420" y="515">중심</text>
      <text class="roman" x="475" y="515">O</text>
    </g>

    <!-- 반경 R 화살표 (중심 O에서 중심선으로) -->
    <!-- (445, 555) -> (380, 715) -->
    <line class="movable" x1="445" y1="555" x2="380" y2="715" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="380" y="640" transform="translate(0,0) scale(1,1) rotate(0)">R</text>

    <!-- ========================================== -->
    <!-- 5. 캡션: 그림 1 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="250" y="825" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="340" y="850">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
