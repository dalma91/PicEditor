<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0006_2002-100.008.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 420 780" width="420" height="780" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <pattern id="hatch-m" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333333" stroke-width="1.5" />
    </pattern>
    <pattern id="dot-ball" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#555555" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 도르래 원 및 중심 축 -->
    <circle class="movable" cx="200" cy="115" r="70" fill="#FFFFFF" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="200" cy="115" r="9" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 왼쪽 실 (도르래 -> 물체 M) -->
    <line class="movable" x1="130" y1="115" x2="130" y2="520" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 오른쪽 실 (도르래 -> 용수철) -->
    <line class="movable" x1="270" y1="115" x2="270" y2="245" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 용수철 (지그재그 스프링) -->
    <path class="movable" d="M 270,245 L 315,260 L 225,290 L 315,320 L 225,350 L 315,380 L 225,410 L 315,440 L 225,470 L 270,485" fill="none" stroke="#000000" stroke-width="2.8" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 용수철 하단 실 및 구 m -->
    <line class="movable" x1="270" y1="485" x2="270" y2="550" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="270" cy="570" r="23" fill="url(#dot-ball)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 물체 M (빗금 사각형) -->
    <rect class="movable" x="80" y="520" width="95" height="50" fill="url(#hatch-m)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 받침대 台 -->
    <path class="movable" d="M 5,570 L 190,570 L 190,715 Q 150,685 100,690 L 5,570" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="90" y="125" font-family="'Batang', serif" font-size="34" font-weight="bold">도르래</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="350" y="350" font-family="'Batang', serif" font-size="32" font-weight="bold">용수철</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="60" y="545" font-family="'Times New Roman', serif" font-size="44" font-weight="bold">M</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="325" y="575" font-family="'Times New Roman', serif" font-size="44" font-style="italic">m</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="135" y="640" font-family="'Batang', serif" font-size="34" font-weight="bold">받침대</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="200" y="760" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 1</text></g>
  </g>
</svg>
</body>
</html>
