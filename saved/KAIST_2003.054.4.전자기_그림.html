<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.054.4.전자기_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1446 612" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1.5 L 1 5 L 10 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; }
    .wire { stroke: #000000; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .rail { stroke: #000000; stroke-width: 3.2; fill: none; stroke-linecap: round; }
  </style>

  <!-- 메인 다이어그램 그룹 -->
  <g class="main-diagram">
    <!-- 1. 자장 영역 A (파선 평행사변형) -->
    <polygon class="movable" points="360,250 1205,250 1055,445 240,445" fill="none" stroke="#000000" stroke-width="2.0" stroke-dasharray="8,6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1140" y="275" transform="translate(0,0) scale(1,1) rotate(0)">A</text>

    <!-- 2. 레일 2개 -->
    <line class="movable rail" x1="440" y1="298" x2="1065" y2="298" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable rail" x1="365" y1="362" x2="990" y2="362" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 레일 간격 l 표시 (양방향 화살표) -->
    <line class="movable" x1="495" y1="300" x2="455" y2="360" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="435" y="325" transform="translate(0,0) scale(1,1) rotate(0)">l</text>

    <!-- 3. 도체 막대 (질량 m) -->
    <!-- 둥근 긴 막대 (비스듬한 각도) -->
    <path class="movable" d="M 740 280 L 655 385 A 6 6 0 0 1 645 377 L 730 272 A 6 6 0 0 1 740 280 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="635" y="330" transform="translate(0,0) scale(1,1) rotate(0)">m</text>

    <!-- 4. 자기장 B 벡터 -->
    <line class="movable" x1="860" y1="360" x2="860" y2="270" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="895" y="315" transform="translate(0,0) scale(1,1) rotate(0)">B</text>

    <!-- 5. 내부 연결선 -->
    <!-- T1에서 아래 레일로 -->
    <polyline class="movable wire" points="360,520 435,405 435,362" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- T2에서 윗 레일로 -->
    <polyline class="movable wire" points="602,175 500,325 500,298" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 외부 회로 루프 -->
    <!-- 하단 도선 (T1 단자 포함) -->
    <line class="movable wire" x1="20" y1="520" x2="1165" y2="520" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 단자 T1 -->
    <circle class="movable" cx="360" cy="520" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="350" y="555">T<tspan class="sub" dy="8">1</tspan></text>
    </g>

    <!-- 좌측 변: 배터리 E & 저항 R -->
    <!-- 밑모서리에서 배터리까지 -->
    <line class="movable wire" x1="20" y1="520" x2="80" y2="395" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 직류 전원 E (투시 평행판) -->
    <!-- 긴 판 (+) -->
    <line class="movable" x1="56" y1="384" x2="94" y2="402" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 짧고 굵은 판 (-) -->
    <line class="movable" x1="72" y1="371" x2="98" y2="383" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전원과 저항 사이 도선 -->
    <line class="movable wire" x1="88" y1="375" x2="155" y2="240" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="50" y="380" transform="translate(0,0) scale(1,1) rotate(0)">E</text>

    <!-- 저항 R (지그재그) -->
    <path class="movable" d="M 155 240 L 175 236 L 140 216 L 180 200 L 142 180 L 182 164 L 160 152 L 180 142 L 190 120" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="125" y="195" transform="translate(0,0) scale(1,1) rotate(0)">R</text>

    <!-- 저항에서 상단 모서리까지 -->
    <line class="movable wire" x1="190" y1="120" x2="275" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상단 도선: 좌측 분기 (접점 a까지) -->
    <line class="movable wire" x1="275" y1="100" x2="575" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="575" cy="100" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="560" y="130" transform="translate(0,0) scale(1,1) rotate(0)">a</text>

    <!-- 상단 도선: 우측 분기 (접점 b부터 우상단 모서리까지) -->
    <circle class="movable" cx="695" cy="100" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="710" y="130" transform="translate(0,0) scale(1,1) rotate(0)">b</text>
    <line class="movable wire" x1="695" y1="100" x2="1410" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 단자 T2 & 스위치 날 S -->
    <circle class="movable" cx="602" cy="175" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="640" y="180">T<tspan class="sub" dy="8">2</tspan></text>
    </g>
    <!-- 스위치 레버 (두꺼운 선) -->
    <line class="movable" x1="602" y1="175" x2="665" y2="78" stroke="#000000" stroke-width="4.5" stroke-linecap="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="670" y="55" transform="translate(0,0) scale(1,1) rotate(0)">S</text>

    <!-- 우측 변: 인덕터 L (코일) -->
    <!-- 상단 모서리에서 인덕터 상단까지 -->
    <line class="movable wire" x1="1410" y1="100" x2="1310" y2="250" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 코일 나선 5턴 -->
    <path class="movable" d="M 1310 250 
             C 1335 255, 1335 285, 1300 295 C 1260 305, 1260 280, 1290 285
             C 1320 290, 1320 320, 1285 330 C 1245 340, 1245 315, 1275 320
             C 1305 325, 1305 355, 1270 365 C 1230 375, 1230 350, 1260 355
             C 1290 360, 1290 390, 1255 400 C 1215 410, 1215 385, 1245 390
             C 1275 395, 1275 425, 1240 435 C 1205 445, 1205 425, 1225 430
             L 1165 520" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1335" y="340" transform="translate(0,0) scale(1,1) rotate(0)">L</text>
  </g>
</svg>
</body>
</html>
