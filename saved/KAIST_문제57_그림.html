<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="100%" height="100%">
  <defs>
    <marker id="arrow-57" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Container walls -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="120" y1="65" x2="120" y2="520" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="540" y1="65" x2="540" y2="520" stroke="#000000" stroke-width="2.5"/>

  <!-- Container bottom ellipse -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 120 520 A 210 45 0 0 0 540 520" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 120 520 A 210 45 0 0 1 540 520" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Outer Piston at liquid surface (Area S0) -->
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="330" cy="130" rx="210" ry="45" fill="#f8fafc" stroke="#000000" stroke-width="2.5"/>
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="330" cy="136" rx="210" ry="45" fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- Area S0 label -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="420" y1="55" x2="350" y2="125" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-57)"/>
  <g class="movable text-wrap" transform="translate(425, 40)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan dy="3" font-size="14">0</tspan></text>
  </g>

  <!-- Piston label on left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="90" y1="165" x2="135" y2="135" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-57)"/>
  <g class="movable text-wrap" transform="translate(50, 180)">
    <text class="text-el" x="15" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">피</text>
    <text class="text-el" x="15" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16">스</text>
    <text class="text-el" x="15" y="60" font-family="KoPubWorld Dotum, sans-serif" font-size="16">톤</text>
  </g>

  <!-- Inverted Cylinder inside (실린더, Area S) -->
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="330" cy="220" rx="85" ry="20" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <!-- Area S label -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="165" x2="355" y2="215" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-57)"/>
  <g class="movable text-wrap" transform="translate(415, 145)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">S</text>
  </g>

  <!-- Walls of inverted cylinder -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="245" y1="220" x2="245" y2="430" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="415" y1="220" x2="415" y2="430" stroke="#000000" stroke-width="2.5"/>

  <!-- Bottom opening of inverted cylinder -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 245 430 A 85 20 0 0 0 415 430" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 245 430 A 85 20 0 0 1 415 430" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Gas Chamber inside (기체) -->
  <g class="movable text-wrap" transform="translate(305, 250)">
    <text class="text-el" x="25" y="20" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">기체</text>
  </g>

  <!-- Inner Piston inside inverted cylinder at cy=315 -->
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="330" cy="315" rx="85" ry="20" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="330" cy="320" rx="85" ry="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Leader line for Inner Piston on right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="420" x2="395" y2="322" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(560, 410)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">피스톤</text>
  </g>

  <!-- Spring (용수철) from inner piston to container floor -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 330 320 V 350
           C 355 350, 355 365, 330 365 C 305 365, 305 380, 330 380
           C 355 380, 355 395, 330 395 C 305 395, 305 410, 330 410
           C 355 410, 355 425, 330 425 C 305 425, 305 440, 330 440
           C 355 440, 355 455, 330 455 C 305 455, 305 470, 330 470
           C 355 470, 355 485, 330 485 V 535"
        fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Leader line for Spring -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="500" x2="350" y2="475" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(560, 490)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">용수철</text>
  </g>

  <!-- Dimension d -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="415" y1="220" x2="600" y2="220" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="540" y1="130" x2="600" y2="130" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="585" y1="130" x2="585" y2="220" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-57)" marker-end="url(#arrow-57)"/>
  <g class="movable text-wrap" transform="translate(595, 168)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">d</text>
  </g>

  <!-- Dimension h -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="415" y1="320" x2="455" y2="320" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="440" y1="220" x2="440" y2="320" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-57)" marker-end="url(#arrow-57)"/>
  <g class="movable text-wrap" transform="translate(450, 262)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">h</text>
  </g>

  <!-- Labels on left: 실린더, 용기, 액체 (clean placement with white bg) -->
  <g class="movable text-wrap" transform="translate(215, 290)">
    <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">실</text>
    <text class="text-el" x="12" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16">린</text>
    <text class="text-el" x="12" y="60" font-family="KoPubWorld Dotum, sans-serif" font-size="16">더</text>
  </g>
  <g class="movable text-wrap" transform="translate(70, 460)">
    <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">용</text>
    <text class="text-el" x="12" y="40" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">기</text>
  </g>
  <g class="movable text-wrap" transform="translate(140, 435)">
    <rect class="text-bg-rect" x="0" y="0" width="24" height="48" fill="#FFFFFF"/>
    <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">액</text>
    <text class="text-el" x="12" y="40" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">체</text>
  </g>
</svg>
</body>
</html>
