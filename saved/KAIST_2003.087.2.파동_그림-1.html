<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.087.2.파동_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1260 680" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="axis-arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .axis-line { stroke: #000000; stroke-width: 2.2; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 직교 좌표계 축 (x축, y축) -->
    <!-- x축 -->
    <line class="movable axis-line" x1="50" y1="510" x2="1200" y2="510" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1225" y="475" transform="translate(0,0) scale(1,1) rotate(0)">x</text>

    <!-- y축 -->
    <line class="movable axis-line" x1="580" y1="510" x2="580" y2="60" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="625" y="60" transform="translate(0,0) scale(1,1) rotate(0)">y</text>

    <!-- 원점 레이블 0 -->
    <text class="movable roman" x="580" y="550" transform="translate(0,0) scale(1,1) rotate(0)">0</text>

    <!-- 2. 점 O(0, l) -->
    <circle class="movable" cx="580" cy="250" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="625" y="215">O</text>
      <text class="roman" x="655" y="215">(</text>
      <text class="roman" x="675" y="215">0,</text>
      <text class="math" x="710" y="215">l</text>
      <text class="roman" x="730" y="215">)</text>
    </g>

    <!-- 3. 점 S(Vt, 0) -->
    <circle class="movable" cx="780" cy="510" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="800" y="465">S</text>
      <text class="roman" x="830" y="465">(</text>
      <text class="math" x="860" y="465">V</text>
      <text class="math" x="885" y="465">t</text>
      <text class="roman" x="905" y="465">,</text>
      <text class="roman" x="930" y="465">0</text>
      <text class="roman" x="950" y="465">)</text>
    </g>

    <!-- 4. 하단 캡션: 그림 3 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="500" y="615" width="160" height="48" fill="#FFFFFF"/>
      <text class="korean-bold" x="580" y="640">그림 3</text>
    </g>
  </g>
</svg>
</body>
</html>
