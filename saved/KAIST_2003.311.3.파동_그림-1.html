<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.311.3.파동_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1320 550" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="ray-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#000000"/>
    </marker>
    <marker id="pointer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .axis-line { stroke: #000000; stroke-width: 2.0; fill: none; }
    .normal-dash { stroke: #000000; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .ray-line { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 원형 구체 및 광축 Z - Z' -->
    <!-- ========================================== -->
    <!-- 구체 (원, 중심 680, 260, 반경 195) -->
    <circle class="movable" cx="680" cy="260" r="195" fill="#FFFFFF" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 광축 Z - Z' -->
    <line class="movable axis-line" x1="60" y1="260" x2="1220" y2="260" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="40" y="260">Z</text>
    <text class="movable math" x="1245" y="260">Z′</text>

    <!-- 구체 중심 O 표시 및 레이블 -->
    <circle class="movable" cx="680" cy="260" r="3" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="680" y="295">O</text>

    <!-- ========================================== -->
    <!-- 2. 입사선, 법선, 각도 alpha, 점 P -->
    <!-- ========================================== -->
    <!-- 수평 입사 광선 (y=155) -->
    <line class="movable ray-line" x1="60" y1="155" x2="500" y2="155" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 입사점 P 법선 (구 중심 O를 지나는 점선) -->
    <!-- P=(500, 155), O=(680, 260) -> 기울기 dx=180, dy=105 -> 연장선 (320, 50) -->
    <line class="movable normal-dash" x1="320" y1="50" x2="680" y2="260" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 입사점 P 레이블 -->
    <text class="movable roman" x="490" y="115">P</text>

    <!-- 중심각 alpha (법선 PO와 축 OZ 사이 각) -->
    <path class="movable" d="M 605 260 A 75 75 0 0 1 620 225" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="580" y="235">α</text>

    <!-- ========================================== -->
    <!-- 3. 구 내부 굴절선 및 출사 광선, 각도 beta, 점 Q -->
    <!-- ========================================== -->
    <!-- 구 내부 굴절선: P(500, 155) -> 출사점 (875, 215) -->
    <line class="movable ray-line" x1="500" y1="155" x2="875" y2="215" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 출사 광선 (공기 중으로 굴절): (875, 215) -> (1060, 295) 화살표 -->
    <line class="movable ray-line" x1="875" y1="215" x2="1060" y2="295" marker-end="url(#ray-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 출사점 점선 접선/보조선: (875, 215) -> 점 Q(1160, 260) -->
    <line class="movable normal-dash" x1="875" y1="215" x2="1160" y2="260" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 Q 및 레이블 -->
    <text class="movable roman" x="1165" y="230">Q</text>

    <!-- 각도 beta 호 및 지시 화살표 -->
    <path class="movable" d="M 1080 260 A 80 80 0 0 1 1088 248" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1025" y1="195" x2="1075" y2="245" stroke="#000000" stroke-width="1.6" marker-end="url(#pointer-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="1005" y="165">β</text>

    <!-- ========================================== -->
    <!-- 4. 캡션: 그림 1 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="560" y="465" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="650" y="490">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
