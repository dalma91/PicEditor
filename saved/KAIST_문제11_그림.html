<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제11_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 610 300" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 축 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 19px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .axis-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .wire-line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    .electrode { stroke: #000000; stroke-width: 3.5; stroke-linecap: square; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 좌표축 (x축, y축) -->
    <!-- ========================================== -->
    <!-- x축: (20, 140) ~ (575, 140) -->
    <line class="movable axis-line" x1="20" y1="140" x2="575" y2="140" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- y축: (120, 140) ~ (120, 35) -->
    <line class="movable axis-line" x1="120" y1="140" x2="120" y2="35" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 이온원 (Ion Source) 상자 -->
    <!-- ========================================== -->
    <!-- 상자 본체 (중심 y=140 슬릿 개구) -->
    <path class="movable" d="M 112 115 L 40 115 L 40 165 L 112 165" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="112" y1="115" x2="112" y2="134" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="112" y1="146" x2="112" y2="165" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 전극 A, B, C (슬릿 포함) -->
    <!-- ========================================== -->
    <!-- 전극 A (x = 120, x=0 위치) -->
    <line class="movable electrode" x1="120" y1="75" x2="120" y2="135" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable electrode" x1="120" y1="145" x2="120" y2="205" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="120" cy="140" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 B (x = 260) -->
    <line class="movable electrode" x1="260" y1="80" x2="260" y2="135" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable electrode" x1="260" y1="145" x2="260" y2="200" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 C (x = 270, x=l 위치) -->
    <line class="movable electrode" x1="270" y1="80" x2="270" y2="135" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable electrode" x1="270" y1="145" x2="270" y2="200" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="270" cy="140" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- x = l + L 지점 (x=485) -->
    <circle class="movable" cx="485" cy="140" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 전원 회로 및 접지 -->
    <!-- ========================================== -->
    <!-- 전원 V 회로: 이온원 하단(112, 195)에서 전지 V 거쳐 전극 A(120, 245)로 -->
    <polyline class="movable wire-line" points="112,165 112,245 101,245" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 V (x=95 ~ 105) -->
    <line class="movable" x1="95" y1="236" x2="95" y2="254" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="101" y1="230" x2="101" y2="260" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire-line" x1="88" y1="245" x2="95" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polyline class="movable wire-line" points="88,245 88,218 120,218 120,205" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 A와 전극 B-C 전원선 연결 -->
    <line class="movable wire-line" x1="120" y1="245" x2="235" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire-line" x1="120" y1="218" x2="120" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 B 연결선 -->
    <polyline class="movable wire-line" points="260,200 260,205 235,205 235,245" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전지 V' (x=247 ~ 257) -->
    <line class="movable wire-line" x1="235" y1="245" x2="247" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="247" y1="230" x2="247" y2="260" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="255" y1="236" x2="255" y2="254" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire-line" x1="255" y1="245" x2="270" y2="245" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전극 C 및 접지선 (x=270) -->
    <line class="movable wire-line" x1="270" y1="200" x2="270" y2="280" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 접지 기호 (아스) -->
    <line class="movable" x1="262" y1="280" x2="278" y2="280" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="265" y1="284" x2="275" y2="284" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="268" y1="288" x2="272" y2="288" stroke="#000000" stroke-width="1.4" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- y -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="110" y="8" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="120" y="20">y</text>
    </g>

    <!-- x -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="585" y="128" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="595" y="140">x</text>
    </g>

    <!-- 이온원 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="35" y="78" width="65" height="24" fill="#FFFFFF"/>
      <text class="korean" x="67" y="90">이온원</text>
    </g>

    <!-- 전극 A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="130" y="50" width="46" height="50" fill="#FFFFFF"/>
      <text class="korean" x="153" y="62">전극</text>
      <text class="roman" x="153" y="86">A</text>
    </g>

    <!-- x = 0 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="130" y="112" width="60" height="24" fill="#FFFFFF"/>
      <text class="math" x="160" y="124">x = 0</text>
    </g>

    <!-- 전극 B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="220" y="50" width="46" height="50" fill="#FFFFFF"/>
      <text class="korean" x="243" y="62">전극</text>
      <text class="roman" x="243" y="86">B</text>
    </g>

    <!-- 전극 C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="278" y="50" width="46" height="50" fill="#FFFFFF"/>
      <text class="korean" x="301" y="62">전극</text>
      <text class="roman" x="301" y="86">C</text>
    </g>

    <!-- x = l -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="280" y="112" width="55" height="24" fill="#FFFFFF"/>
      <text class="math" x="307" y="124">x = <tspan font-style="italic">l</tspan></text>
    </g>

    <!-- x = l + L -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="460" y="105" width="95" height="24" fill="#FFFFFF"/>
      <text class="math" x="507" y="117">x = <tspan font-style="italic">l</tspan> + L</text>
    </g>

    <!-- 전압 V -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="88" y="260" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="99" y="272">V</text>
    </g>

    <!-- 전압 V' -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="238" y="260" width="25" height="24" fill="#FFFFFF"/>
      <text class="math" x="250" y="272">V′</text>
    </g>

    <!-- 접지 (한글 번역: アース -> 접지) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="290" y="265" width="48" height="24" fill="#FFFFFF"/>
      <text class="korean" x="314" y="277">접지</text>
    </g>
  </g>
</svg>
</body>
</html>
