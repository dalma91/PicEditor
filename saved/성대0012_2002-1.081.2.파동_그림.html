<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0012_2002-1.081.2.파동_그림</title>
</head>
<body>
<svg viewBox="0 0 650 500" width="650" height="500" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <g class="main-diagram">
    <!-- x축 화살표 -->
    <line class="movable" x1="10" y1="80" x2="620" y2="80" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- O점에서 A점까지의 수직 점선 -->
    <line class="movable" x1="275" y1="80" x2="275" y2="380" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 직각 기호 -->
    <path class="movable" d="M 255,80 L 255,100 L 275,100" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- B -> A 실선 및 각도 theta -->
    <line class="movable" x1="75" y1="80" x2="275" y2="380" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 115,80 A 45 45 0 0 1 103,122" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="75" y1="80" x2="145" y2="80" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 음파 방출 원호 (B-A 선상) -->
    <path class="movable" d="M 225,290 A 30 30 0 0 0 260,340" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 210,270 A 50 50 0 0 0 265,355" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 195,250 A 70 70 0 0 0 270,370" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 우측 대칭 점선 및 각도 theta -->
    <line class="movable" x1="275" y1="380" x2="475" y2="80" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 445,125 A 45 45 0 0 0 510,80" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="475" y1="80" x2="545" y2="80" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 점 B, A, 우측 이동점 -->
    <circle class="movable" cx="75" cy="80" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="475" cy="80" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="275" cy="380" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="45" y="60" font-family="'Times New Roman', serif" font-size="40">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="275" y="60" font-family="'Times New Roman', serif" font-size="40" text-anchor="middle">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="625" y="70" font-family="'Times New Roman', serif" font-size="42" font-style="italic">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="140" y="55" font-family="'Times New Roman', serif" font-size="38" font-style="italic">v</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="115" y="130" font-family="'Times New Roman', serif" font-size="34" font-style="italic">θ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="500" y="145" font-family="'Times New Roman', serif" font-size="34" font-style="italic">θ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="300" y="405" font-family="'Times New Roman', serif" font-size="40">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="275" y="465" font-family="'Batang', serif" font-size="36" font-weight="bold" text-anchor="middle">그림 2 - 1</text></g>
  </g>
</svg>
</body>
</html>
