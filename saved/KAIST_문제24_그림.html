<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <pattern id="cyl-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#777777"/>
      <circle cx="5" cy="5" r="0.8" fill="#777777"/>
    </pattern>
    <marker id="pointer24" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Base Table -->
  <rect class="movable" x="40" y="470" width="460" height="25" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Left Stand Pole -->
  <line class="movable" x1="130" y1="35" x2="130" y2="470" stroke="#000000" stroke-width="4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Stand Clamps and Arms holding cylinder -->
  <!-- Upper clamp at y=110 -->
  <rect class="movable" x="120" y="100" width="20" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="140" y1="108" x2="215" y2="108" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="140" y1="116" x2="215" y2="116" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Lower clamp at y=260 -->
  <rect class="movable" x="120" y="250" width="20" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="140" y1="258" x2="215" y2="258" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="140" y1="266" x2="215" y2="266" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Insulated Cylinder Body (thick stippled walls) -->
  <!-- Path of U-shaped inverted container: outer box minus inner cavity -->
  <path class="movable" d="M 215 315 L 215 55 L 385 55 L 385 315 L 365 315 L 365 75 L 235 75 L 235 315 Z" fill="url(#cyl-stipple)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical Spring inside cylinder -->
  <path class="movable" d="M 300.0 75.0 Q 300.0 85.0 292.0 87.4 Q 300.0 92.5 308.0 92.1 Q 300.0 91.7 292.0 96.9 Q 300.0 102.0 308.0 101.6 Q 300.0 101.2 292.0 106.4 Q 300.0 111.5 308.0 111.1 Q 300.0 110.7 292.0 115.9 Q 300.0 121.0 308.0 120.6 Q 300.0 120.2 292.0 125.4 Q 300.0 130.6 308.0 130.1 Q 300.0 129.7 292.0 134.9 Q 300.0 140.1 308.0 139.6 Q 300.0 142.0 300.0 152.0 L 300.0 152.0" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Suspended Weight (black circle) -->
  <circle class="movable" cx="300" cy="165" r="15" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- String connecting weight to piston -->
  <line class="movable" x1="300" y1="180" x2="300" y2="225" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Piston (stippled horizontal bar inside cylinder) -->
  <rect class="movable" x="235" y="225" width="130" height="17" fill="url(#cyl-stipple)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Piston shaft down to sensor and jack -->
  <line class="movable" x1="295" y1="242" x2="295" y2="303" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="305" y1="242" x2="305" y2="303" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Force Sensor Circle F -->
  <circle class="movable" cx="300" cy="325" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <text class="movable" x="300" y="325" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#000000" text-anchor="middle" dominant-baseline="central" transform="translate(0,0) scale(1,1) rotate(0)">F</text>

  <!-- Lower shaft from sensor to jack -->
  <line class="movable" x1="295" y1="347" x2="295" y2="368" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="305" y1="347" x2="305" y2="368" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Jack (trapezoid with rotary dial) -->
  <polygon class="movable" points="268,368 332,368 352,470 248,470" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Dial knob -->
  <circle class="movable" cx="300" cy="415" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Pointer lines to labels -->
  <!-- To weight -->
  <line class="movable" x1="420" y1="165" x2="318" y2="165" stroke="#000000" stroke-width="1.2" marker-end="url(#pointer24)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- To piston -->
  <line class="movable" x1="420" y1="285" x2="345" y2="245" stroke="#000000" stroke-width="1.2" marker-end="url(#pointer24)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- 용수철 -->
  <g class="movable text-wrap" transform="translate(268, 115) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">용수철</text>
  </g>

  <!-- 실 -->
  <g class="movable text-wrap" transform="translate(282, 202) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">실</text>
  </g>

  <!-- 추 -->
  <g class="movable text-wrap" transform="translate(445, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-12" width="30" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">추</text>
  </g>

  <!-- 실린더 -->
  <g class="movable text-wrap" transform="translate(415, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">실린더</text>
  </g>

  <!-- 피스톤 -->
  <g class="movable text-wrap" transform="translate(440, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">피스톤</text>
  </g>

  <!-- 힘 검출기 -->
  <g class="movable text-wrap" transform="translate(375, 325) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-34" y="-12" width="68" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">힘 검출기</text>
  </g>

  <!-- 잭 -->
  <g class="movable text-wrap" transform="translate(230, 395) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-12" width="30" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">잭</text>
  </g>
</svg>
</body>
</html>
