<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제6_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 450 510" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 벡터 화살표 마커 -->
    <marker id="vec-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .dash-axis { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
    .cone-outline { stroke: #000000; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .vector-line { stroke: #000000; stroke-width: 2.2; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 중심축 (z축) -->
    <!-- ========================================== -->
    <!-- 꼭짓점 (240, 440)에서 상단 (240, 60)까지 -->
    <line class="movable dash-axis" x1="240" y1="440" x2="240" y2="150" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="240" y1="150" x2="240" y2="60" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 원뿔 기하 (상단 타원, 높이 h 타원, 외곽선) -->
    <!-- ========================================== -->
    <!-- 상단 타원 (반지름 R, 중심 (240, 150), rx=170, ry=42) -->
    <ellipse class="movable cone-outline" cx="240" cy="150" rx="170" ry="42" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상단 타원 직경 기준선 -->
    <line class="movable" x1="70" y1="150" x2="410" y2="150" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="185" y1="112" x2="295" y2="188" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 높이 h 수평 단면 타원 (반지름 r, 중심 (240, 245), rx=116, ry=29) -->
    <ellipse class="movable" cx="240" cy="245" rx="116" ry="29" fill="none" stroke="#000000" stroke-width="1.4" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 원뿔 외곽선 (모선: 꼭짓점 부근 홀에서 상단 타원 접선으로) -->
    <line class="movable cone-outline" x1="237" y1="440" x2="70" y2="150" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable cone-outline" x1="243" y1="440" x2="410" y2="150" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥 꼭짓점 홀 (작은 수평 개구부) -->
    <line class="movable" x1="236" y1="440" x2="244" y2="440" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 입자 S 및 속도/힘 벡터 A, B -->
    <!-- ========================================== -->
    <!-- 입자 S: (272, 271) -->
    <circle class="movable" cx="272" cy="271" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 벡터 A (수평 접선 방향, 좌측으로) -->
    <line class="movable vector-line" x1="272" y1="271" x2="195" y2="273" marker-end="url(#vec-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 벡터 B (모선 방향, 좌하향) -->
    <line class="movable vector-line" x1="272" y1="271" x2="228" y2="318" marker-end="url(#vec-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 치수선 (R, r, H, h) -->
    <!-- ========================================== -->
    <!-- R 치수선: 상단 (240, 100) ~ (80, 100) -->
    <line class="movable dim-line" x1="240" y1="100" x2="90" y2="100" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="80" y1="95" x2="80" y2="145" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- r 치수선: 높이 h 단면 위 (240, 210) ~ (132, 210) -->
    <line class="movable dim-line" x1="240" y1="210" x2="135" y2="210" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="126" y1="205" x2="126" y2="245" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 높이 H, h 보조선 (좌측 외곽) -->
    <!-- 꼭짓점 레벨 보조선 (경사진 바닥 기준선) -->
    <line class="movable" x1="35" y1="475" x2="240" y2="445" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상단 림 레벨 보조선 -->
    <line class="movable" x1="45" y1="165" x2="70" y2="150" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 높이 h 단면 레벨 보조선 -->
    <line class="movable" x1="85" y1="250" x2="126" y2="245" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 높이 H 치수선 (좌측) -->
    <line class="movable dim-line" x1="55" y1="167" x2="55" y2="470" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 높이 h 치수선 (좌측 안쪽) -->
    <line class="movable dim-line" x1="105" y1="252" x2="105" y2="463" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥 홀 '구멍' 지시선 -->
    <line class="movable" x1="280" y1="465" x2="246" y2="443" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- z -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="250" y="44" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="260" y="56">z</text>
    </g>

    <!-- R -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="150" y="70" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="162" y="82">R</text>
    </g>

    <!-- r -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="175" y="215" width="20" height="22" fill="#FFFFFF"/>
      <text class="math" x="185" y="226">r</text>
    </g>

    <!-- H -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="18" y="295" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="30" y="307">H</text>
    </g>

    <!-- h -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="115" y="335" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="125" y="347">h</text>
    </g>

    <!-- S -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="255" y="240" width="20" height="22" fill="#FFFFFF"/>
      <text class="roman" x="265" y="251">S</text>
    </g>

    <!-- A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="170" y="278" width="20" height="22" fill="#FFFFFF"/>
      <text class="roman" x="180" y="289">A</text>
    </g>

    <!-- B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="195" y="325" width="20" height="22" fill="#FFFFFF"/>
      <text class="roman" x="205" y="336">B</text>
    </g>

    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="205" y="455" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="216" y="467">P</text>
    </g>

    <!-- 구멍 (한글 번역: 孔 -> 구멍) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="286" y="460" width="46" height="24" fill="#FFFFFF"/>
      <text class="korean" x="309" y="472">구멍</text>
    </g>
  </g>
</svg>
</body>
</html>
