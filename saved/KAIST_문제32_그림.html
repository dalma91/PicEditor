<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-32" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Radial Gradients for 3D Sphere shading -->
    <radialGradient id="sphere-b-32" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0E6ED"/>
      <stop offset="50%" stop-color="#8A9BA8"/>
      <stop offset="100%" stop-color="#485B69"/>
    </radialGradient>
    <radialGradient id="sphere-a-32" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EAEFF5"/>
      <stop offset="55%" stop-color="#9AAAB8"/>
      <stop offset="100%" stop-color="#556677"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Coordinate Axes -->
  <!-- x-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="320" x2="500" y2="320" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-32)"/>
  <!-- y-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="480" x2="270" y2="40" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-32)"/>

  <!-- Sphere B (centered at Origin O (270, 320), radius 68) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="270" cy="320" r="68" fill="url(#sphere-b-32)" stroke="#000000" stroke-width="1.8"/>

  <!-- Sphere A (centered at (270, 204), radius 48, touching B at y=252) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="270" cy="204" r="48" fill="url(#sphere-a-32)" stroke="#000000" stroke-width="1.8"/>

  <!-- Incoming line for Sphere A: angle alpha to y-axis (alpha = 42 deg) -->
  <!-- Line passing through A center (270, 204) from (105, 50) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="105" y1="50" x2="270" y2="204" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Velocity arrow v0 (thick incoming arrow) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="126" y1="70" x2="218" y2="155" stroke="#000000" stroke-width="4" marker-end="url(#arrow-32)"/>

  <!-- Angle alpha arc between y-axis and incoming line at (270, 204) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 270 148 A 56 56 0 0 0 232 168" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Collision normal / tangent guide line across collision contact -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="220" y1="150" x2="365" y2="275" stroke="#333333" stroke-width="1.2"/>

  <!-- Deflected trajectory of Sphere A: going up-right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="204" x2="450" y2="140" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="325" y1="184" x2="405" y2="156" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow-32)"/>

  <!-- Velocity of Sphere B after collision: straight down along y-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="388" x2="270" y2="445" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow-32)"/>

  <!-- LABELS -->
  <!-- y -->
  <g class="movable text-wrap" transform="translate(250, 48) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">y</text>
  </g>

  <!-- x -->
  <g class="movable text-wrap" transform="translate(508, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(254, 336) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>

  <!-- v0 vector -->
  <g class="movable text-wrap" transform="translate(130, 130) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-18" width="32" height="34" rx="2" fill="#FFFFFF"/>
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-32)"/>
    <text class="text-el" x="-2" y="5" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">v<tspan font-size="14" dy="3">0</tspan></text>
  </g>

  <!-- alpha -->
  <g class="movable text-wrap" transform="translate(242, 138) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">α</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(190, 204) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(190, 395) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">B</text>
  </g>
</svg>
</body>
</html>
