<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    body {

      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;

</head>
<body>
  <div class="svg-container">

  <!-- Title: 축전기 A -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="170" y="40" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">축전기 A</text>
  </g>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="65" x2="270" y2="65" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="125" x2="270" y2="125" stroke="#000000" stroke-width="3"/>

  <!-- Dielectric Slab inserted by x -->

  </g>

  <!-- Empty Region Capacitance Cx' -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="235" y="102" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">C<tspan font-size="14" dy="4">X</tspan><tspan dy="-4">′</tspan></text>
  </g>

  <!-- Dimension x -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="125" x2="110" y2="235" stroke="#000000" stroke-width="1.2"/>

  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="136" y="142" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="145" y="160" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">x</text>
  </g>

  <!-- Total Length l -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="270" y1="125" x2="270" y2="235" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"

  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">

    <text class="text-el" x="193" y="225" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">l</text>

    <text class="text-el" x="110" y="250" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">0</text>
  </g>

  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
