<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.153.3.열역학_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1110 820" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 수조 벽면 해칭 패턴 -->
    <pattern id="tank-wall-pattern" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="2.5"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .tank-wall { stroke: #000000; stroke-width: 4.0; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 온수조 벽면 (해칭 블록) -->
    <!-- ========================================== -->
    <!-- 좌측 벽면 해칭 블록 -->
    <polygon class="movable" points="15,95 310,95 310,640 240,710 15,710" fill="url(#tank-wall-pattern)" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 벽면 해칭 블록 -->
    <polygon class="movable" points="950,95 1095,95 1095,710 870,710 950,640" fill="url(#tank-wall-pattern)" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 바닥면 해칭 블록 -->
    <polygon class="movable" points="310,640 950,640 870,710 240,710" fill="url(#tank-wall-pattern)" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 내벽 경계선 (굵은 검은선) -->
    <polyline class="movable tank-wall" points="15,95 310,95 310,640 950,640 950,95 1095,95" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥 온수조 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="480" y="655" width="160" height="45" fill="#FFFFFF"/>
      <text class="korean" x="560" y="675">온수조</text>
    </g>

    <!-- ========================================== -->
    <!-- 2. 수면 및 대기 조건 (T0, p0) -->
    <!-- ========================================== -->
    <!-- 수면 선 -->
    <line class="movable" x1="310" y1="95" x2="950" y2="95" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 수면 레이블 및 액면 기호 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="885" y="55">수면</text>
    </g>
    <!-- 액면 삼각 파선 기호 -->
    <line class="movable" x1="860" y1="120" x2="910" y2="120" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="870" y1="135" x2="900" y2="135" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="880" y1="150" x2="890" y2="150" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 대기 온도 및 압력 T0, p0 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="525" y="55">T<tspan class="sub" dy="6">0</tspan></text>
      <text class="roman" x="555" y="55">,</text>
      <text class="math" x="595" y="55">p<tspan class="sub" dy="6">0</tspan></text>
    </g>

    <!-- ========================================== -->
    <!-- 3. 수중 구체, 실, 추 -->
    <!-- ========================================== -->
    <!-- 구체 (원) -->
    <circle class="movable" cx="590" cy="365" r="40" fill="#FFFFFF" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="590" y="295">구체</text>
    </g>

    <!-- 연결 실 -->
    <line class="movable" x1="590" y1="405" x2="590" y2="570" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 장력 S 화살표 (하향) -->
    <line class="movable" x1="590" y1="435" x2="590" y2="495" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="625" y="465" transform="translate(0,0) scale(1,1) rotate(0)">S</text>
    <!-- 실 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="525" y="505">실</text>
    </g>

    <!-- 추 (검은 사각형 블록) -->
    <rect class="movable" x="555" y="570" width="75" height="70" fill="#000000" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="690" y="605">추</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 깊이 h 및 온수 온도 Th -->
    <!-- ========================================== -->
    <!-- 구체 중심 수평 보조선 -->
    <line class="movable" x1="695" y1="365" x2="795" y2="365" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 깊이 h 양방향 화살표 -->
    <line class="movable" x1="760" y1="100" x2="760" y2="360" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 깊이 h 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="685" y="150">깊이</text>
      <text class="math" x="685" y="215">h</text>
    </g>

    <!-- 온수 온도 Th 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="835" y="235">온수</text>
      <text class="korean" x="835" y="295">온도</text>
      <text class="math" x="850" y="365">T<tspan class="sub" dy="6">h</tspan></text>
    </g>

    <!-- ========================================== -->
    <!-- 5. 하단 캡션: 그림 4 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="460" y="745" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="550" y="770">그림 4</text>
    </g>
  </g>
</svg>
</body>
</html>
