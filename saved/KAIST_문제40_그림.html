<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-40" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Hatch Pattern for Floor -->
    <pattern id="hatch-40" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#777777" stroke-width="1.2"/>
    </pattern>
    <!-- Stipple / Fine hatch pattern for Wedge M -->
    <pattern id="wedge-pattern-40" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#90A4AE" stroke-width="1"/>
    </pattern>
    <pattern id="stopper-pattern-40" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#455A64" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Floor line at y=300 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="300" x2="410" y2="300" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="40" y="300" width="370" height="15" fill="url(#hatch-40)"/>

  <!-- Wedge M Geometry -->
  <!-- Arc center O is at (380, 80). Radius R = 200. -->
  <!-- Arc starts at A (180, 80) and ends at B (380, 280). -->
  <!-- Left face at x=130 from y=80 down to y=300. -->
  <!-- Top lip: from x=130 to x=180 at y=80. -->
  <!-- Right edge: from (380, 280) down to (380, 300). -->
  <!-- Bottom edge: from (380, 300) to (130, 300). -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
        d="M 130 80 L 180 80 A 200 200 0 0 0 380 280 L 380 300 L 130 300 Z" 
        fill="url(#wedge-pattern-40)" stroke="#000000" stroke-width="2.2"/>

  <!-- Stopper (고정쇠) on bottom-left corner: triangular block -->
  <!-- Touching wedge left wall: vertices at (75, 300), (130, 300), (130, 245) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
           points="75,300 130,300 130,245" 
           fill="url(#stopper-pattern-40)" stroke="#000000" stroke-width="2"/>
  <!-- Bold stopper-wedge contact line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="245" x2="130" y2="300" stroke="#000000" stroke-width="4.5"/>

  <!-- Arrow pointing to stopper -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="60" y1="225" x2="98" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrow-40)"/>

  <!-- REFERENCE LINES FROM O (380, 80) -->
  <!-- Horizontal dashed line from A (180, 80) to O (380, 80) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="180" y1="80" x2="380" y2="80" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Vertical dashed line from O (380, 80) down to B (380, 280) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="380" y1="80" x2="380" y2="280" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Dimension R above arc -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="180" y1="52" x2="380" y2="52" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-40)" marker-end="url(#arrow-40)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="180" y1="45" x2="180" y2="80" stroke="#555555" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="380" y1="45" x2="380" y2="80" stroke="#555555" stroke-width="1"/>

  <!-- Small Ball m on arc at angle theta (theta = 35 deg below horizontal) -->
  <!-- x = 380 - 200*cos(35 deg) = 216.2, y = 80 + 200*sin(35 deg) = 194.7 -->
  <!-- Dashed radius line from O to Ball center -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="380" y1="80" x2="223" y2="190" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Ball m (radius 11) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="220" cy="190" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Angle theta arc at O between horizontal dashed line and radius line -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 315 80 A 65 65 0 0 1 327 117" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- LABELS -->
  <!-- A -->
  <g class="movable text-wrap" transform="translate(162, 58) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- R -->
  <g class="movable text-wrap" transform="translate(280, 42) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(398, 80) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">O</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(295, 102) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- m -->
  <g class="movable text-wrap" transform="translate(245, 204) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- M -->
  <g class="movable text-wrap" transform="translate(180, 240) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-14" width="28" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="24" font-style="italic" font-weight="bold" fill="#000000">M</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(398, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- 고정쇠 (Korean translation of 止め金) -->
  <g class="movable text-wrap" transform="translate(52, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-28" y="-12" width="56" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">고정쇠</text>
  </g>
</svg>
</body>
</html>
