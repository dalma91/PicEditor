<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-38" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Coordinate Axes -->
  <!-- Horizontal Volume Axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="370" x2="490" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#arrow-38)"/>
  <!-- Vertical Pressure Axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="370" x2="130" y2="35" stroke="#000000" stroke-width="2" marker-end="url(#arrow-38)"/>

  <!-- Projections / Grid lines -->
  <!-- p1 to A and B -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="110" x2="310" y2="110" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- p2 to C -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="245" x2="430" y2="245" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- p3 to D -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="130" y1="340" x2="430" y2="340" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- V1 to A -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="110" x2="190" y2="370" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- V2 to B -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="310" y1="110" x2="310" y2="370" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- V3 to C and D -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="430" y1="245" x2="430" y2="370" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- DIESEL CYCLE PATHS -->
  <!-- A -> B: Isobaric expansion (190, 110) to (310, 110) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="110" x2="310" y2="110" stroke="#000000" stroke-width="2.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 240 104 L 252 110 L 240 116" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- B -> C: Adiabatic expansion curve (310, 110) to (430, 245) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 310 110 Q 355 170 430 245" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- Arrow on BC -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 364 165 L 378 181 L 360 185" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- C -> D: Isochoric cooling (430, 245) down to (430, 340) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="430" y1="245" x2="430" y2="340" stroke="#000000" stroke-width="2.5"/>
  <!-- Arrow on CD -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 424 290 L 430 304 L 436 290" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- D -> A: Adiabatic compression curve (430, 340) up-left to (190, 110) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 430 340 Q 270 290 190 110" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- Arrow on DA -->
  <path class="movable" transform="translate(285, 235) rotate(220) scale(1,1)" d="M -8 -6 L 0 0 L -8 6" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- Cycle state dots -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="190" cy="110" r="4.5" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="310" cy="110" r="4.5" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="430" cy="245" r="4.5" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="430" cy="340" r="4.5" fill="#000000"/>

  <!-- HEAT ARROWS -->
  <!-- Q1 heat input (hollow vertical arrow entering AB at x=245) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 240 68 L 240 82 L 235 82 L 245 96 L 255 82 L 250 82 L 250 68 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

  <!-- Q2 heat output (hollow horizontal arrow leaving CD at y=292) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 450 287 L 464 287 L 464 282 L 478 292 L 464 302 L 464 297 L 450 297 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

  <!-- LABELS -->
  <!-- Axis labels: Korean physics standard -->
  <!-- 압력 p [Pa] -->
  <g class="movable text-wrap" transform="translate(58, 230) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-42" y="-45" width="84" height="90" rx="3" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-24" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">압력</text>
    <text class="text-el" x="0" y="4" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">p</text>
    <text class="text-el" x="0" y="30" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">[Pa]</text>
  </g>

  <!-- 부피 V [m³] -->
  <g class="movable text-wrap" transform="translate(360, 412) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-70" y="-14" width="140" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">부피 <tspan font-family="'Times New Roman', serif" font-style="italic" font-size="20">V</tspan> [m³]</text>
  </g>

  <!-- State Points -->
  <g class="movable text-wrap" transform="translate(190, 88) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(310, 88) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(450, 245) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(450, 340) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" fill="#000000">D</text>
  </g>

  <!-- Pressures p1, p2, p3 -->
  <g class="movable text-wrap" transform="translate(108, 110) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">p<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(108, 245) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">p<tspan font-size="14" dy="3">2</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(108, 340) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">p<tspan font-size="14" dy="3">3</tspan></text>
  </g>

  <!-- Volumes V1, V2, V3 -->
  <g class="movable text-wrap" transform="translate(190, 392) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(310, 392) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">2</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(430, 392) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">3</tspan></text>
  </g>

  <!-- Heat Q1, Q2 -->
  <g class="movable text-wrap" transform="translate(245, 45) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">Q<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(502, 292) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">Q<tspan font-size="14" dy="3">2</tspan></text>
  </g>
</svg>
</body>
</html>
