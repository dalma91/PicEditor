<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.140.2.파동_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1488 520" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .string-line { stroke: #000000; stroke-width: 4.0; fill: none; stroke-linecap: round; }
    .base-dash { stroke: #000000; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 좌측 도면: t = T -->
    <!-- ========================================== -->
    <!-- 기준 점선 -->
    <line class="movable base-dash" x1="40" y1="230" x2="360" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 경사 줄 (각도 theta) -->
    <line class="movable string-line" x1="40" y1="135" x2="140" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 수평 줄 PQ -->
    <line class="movable string-line" x1="140" y1="230" x2="300" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 P 및 점 Q -->
    <circle class="movable" cx="140" cy="230" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="140" y="275">P</text>
    <circle class="movable" cx="300" cy="230" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="300" y="275">Q</text>

    <!-- 각도 theta 호 및 레이블 -->
    <path class="movable" d="M 70 230 A 70 70 0 0 1 95 185" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="65" y="200">θ</text>

    <!-- 시간 레이블 t = T -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="180" y="360">t</text>
      <text class="roman" x="215" y="360">=</text>
      <text class="math" x="250" y="360">T</text>
    </g>

    <!-- ========================================== -->
    <!-- 2. 중앙 도면: T < t < T + ΔT -->
    <!-- ========================================== -->
    <!-- 기준 점선 -->
    <line class="movable base-dash" x1="550" y1="230" x2="860" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 경사 줄 (각도 theta) -->
    <line class="movable string-line" x1="550" y1="60" x2="740" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 경사 장력 F 화살표 (좌상향) -->
    <line class="movable" x1="550" y1="60" x2="505" y2="25" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="480" y="20" transform="translate(0,0) scale(1,1) rotate(0)">F</text>

    <!-- 질점 및 연직 속도 w 화살표 -->
    <circle class="movable" cx="665" cy="163" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="710" y1="180" x2="710" y2="105" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="745" y="140" transform="translate(0,0) scale(1,1) rotate(0)">w</text>

    <!-- 점 Q 및 수평 장력 F 화살표 -->
    <circle class="movable" cx="810" cy="230" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="810" y="275">Q</text>
    <line class="movable" x1="840" y1="230" x2="930" y2="230" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="965" y="230" transform="translate(0,0) scale(1,1) rotate(0)">F</text>

    <!-- 각도 theta 호 및 레이블 -->
    <path class="movable" d="M 670 230 A 70 70 0 0 1 695 185" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="665" y="200">θ</text>

    <!-- 시간 레이블 T < t < T + ΔT -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="600" y="360">T</text>
      <text class="roman" x="635" y="360">&lt;</text>
      <text class="math" x="670" y="360">t</text>
      <text class="roman" x="705" y="360">&lt;</text>
      <text class="math" x="740" y="360">T</text>
      <text class="roman" x="775" y="360">+</text>
      <text class="roman" x="805" y="360">Δ</text>
      <text class="math" x="840" y="360">T</text>
    </g>

    <!-- ========================================== -->
    <!-- 3. 우측 도면: t = T + ΔT -->
    <!-- ========================================== -->
    <!-- 기준 점선 -->
    <line class="movable base-dash" x1="1120" y1="230" x2="1450" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 경사 줄 (각도 theta) -->
    <line class="movable string-line" x1="1160" y1="35" x2="1375" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 P' 및 레이블 -->
    <circle class="movable" cx="1235" cy="103" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="1235" y="150">P′</text>

    <!-- 연직 속도 w 화살표 -->
    <line class="movable" x1="1325" y1="165" x2="1325" y2="90" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1360" y="125" transform="translate(0,0) scale(1,1) rotate(0)">w</text>

    <!-- 점 Q 및 레이블 -->
    <circle class="movable" cx="1375" cy="230" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="1375" y="275">Q</text>

    <!-- 각도 theta 호 및 레이블 -->
    <path class="movable" d="M 1305 230 A 70 70 0 0 1 1330 185" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="1300" y="200">θ</text>

    <!-- 시간 레이블 t = T + ΔT -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="1200" y="360">t</text>
      <text class="roman" x="1235" y="360">=</text>
      <text class="math" x="1270" y="360">T</text>
      <text class="roman" x="1305" y="360">+</text>
      <text class="roman" x="1335" y="360">Δ</text>
      <text class="math" x="1370" y="360">T</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 하단 캡션: 그림 2 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="650" y="440" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="740" y="465">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
