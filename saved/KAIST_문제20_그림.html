<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" height="100%">
  <defs>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dim-start20" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-end20" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Horizontal dashed ground line for angle theta -->
  <line class="movable" x1="315" y1="335" x2="490" y2="335" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Angle theta arc -->
  <path class="movable" d="M 385 335 A 70 70 0 0 0 375 300" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-start20)" marker-end="url(#dim-end20)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Incline Rails -->
  <!-- Upper Rail L1 -->
  <line class="movable" x1="270" y1="200" x2="525" y2="52" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Lower Rail L2 -->
  <line class="movable" x1="315" y1="335" x2="570" y2="187" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Rail Perpendicular dashed connector line -->
  <line class="movable" x1="270" y1="200" x2="315" y2="335" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Perpendicular square brackets -->
  <path class="movable" d="M 260 200 L 263 210 L 273 210" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <path class="movable" d="M 310 320 L 320 323 L 315 335" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Conducting Rod of Mass M, Length L -->
  <!-- Rounded rectangle / rod shape across the rails -->
  <path class="movable" d="M 480 70 L 532 205 A 4 4 0 0 1 525 212 L 473 77 A 4 4 0 0 1 480 70 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension L along rod -->
  <line class="movable" x1="500" y1="72" x2="550" y2="202" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-start20)" marker-end="url(#dim-end20)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Magnetic Field B Vector -->
  <line class="movable" x1="405" y1="40" x2="405" y2="195" stroke="#000000" stroke-width="1.8" marker-end="url(#b-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Circuit Connections -->
  <!-- Upper horizontal line from (270, 200) to base (230, 200) -->
  <line class="movable" x1="270" y1="200" x2="225" y2="200" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  
  <!-- Switch S1 (open switch) -->
  <circle class="movable" cx="200" cy="200" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="170" cy="200" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="170" y1="200" x2="192" y2="188" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="200" y1="200" x2="225" y2="200" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Capacitor C (two parallel plates) -->
  <line class="movable" x1="170" y1="200" x2="148" y2="200" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="148" y1="185" x2="148" y2="215" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="138" y1="185" x2="138" y2="215" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="138" y1="200" x2="80" y2="200" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Down to Power Supply V -->
  <line class="movable" x1="80" y1="200" x2="88" y2="250" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Power Supply Box (parallelogram) -->
  <polygon class="movable" points="80,250 135,250 145,305 90,305" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- + and - terminals inside box -->
  <text class="movable" x="98" y="270" font-family="'Times New Roman', serif" font-size="18" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)">+</text>
  <text class="movable" x="110" y="295" font-family="'Times New Roman', serif" font-size="22" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)">−</text>

  <!-- Wire from bottom of power supply to lower rail L2 base -->
  <line class="movable" x1="117" y1="305" x2="130" y2="335" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="130" y1="335" x2="315" y2="335" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Resistor R Branch with Switch S2 -->
  <line class="movable" x1="225" y1="200" x2="235" y2="230" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Switch S2 (open switch) -->
  <circle class="movable" cx="240" cy="242" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="249" cy="268" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="249" y1="268" x2="235" y2="246" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  
  <!-- Resistor Zigzag R -->
  <path class="movable" d="M 249 268 L 253 280 L 265 285 L 243 293 L 265 301 L 243 309 L 265 317 L 257 323 L 261 335" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- B -->
  <g class="movable text-wrap" transform="translate(405, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- L1 -->
  <g class="movable text-wrap" transform="translate(545, 45) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">L<tspan font-size="14" dy="4">1</tspan></text>
  </g>

  <!-- L2 -->
  <g class="movable text-wrap" transform="translate(585, 180) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">L<tspan font-size="14" dy="4">2</tspan></text>
  </g>

  <!-- M -->
  <g class="movable text-wrap" transform="translate(460, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">M</text>
  </g>

  <!-- L (Rod length) -->
  <g class="movable text-wrap" transform="translate(535, 125) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">L</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(415, 315) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- S1 -->
  <g class="movable text-wrap" transform="translate(195, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">S<tspan font-size="14" dy="4">1</tspan></text>
  </g>

  <!-- C (Capacitor) -->
  <g class="movable text-wrap" transform="translate(122, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">C</text>
  </g>

  <!-- S2 -->
  <g class="movable text-wrap" transform="translate(220, 255) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">S<tspan font-size="14" dy="4">2</tspan></text>
  </g>

  <!-- R (Resistor) -->
  <g class="movable text-wrap" transform="translate(230, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- V (Power supply) -->
  <g class="movable text-wrap" transform="translate(50, 250) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">V</text>
  </g>

  <!-- 전원 -->
  <g class="movable text-wrap" transform="translate(45, 290) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-22" y="-12" width="44" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">전원</text>
  </g>
</svg>
</body>
</html>
