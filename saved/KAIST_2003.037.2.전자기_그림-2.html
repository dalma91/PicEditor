<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.037.2.전자기_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1056 930" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wire { stroke: #000000; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 주 회로 도선 (외곽 연결) -->
    <!-- 상단 도선: 전원(+)에서 분기점까지 -->
    <path class="movable wire" d="M 170 260 L 170 50 L 950 50 L 950 145" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 축전기 A 상판 연결 수직 도선 -->
    <line class="movable wire" x1="680" y1="50" x2="680" y2="145" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 하단 도선: 전원(-)에서 노드 a까지 -->
    <path class="movable wire" d="M 170 290 L 170 580 L 680 580" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 직류 직류 전원 기호 V -->
    <!-- 양극 (+) 긴 판 -->
    <line class="movable" x1="105" y1="260" x2="235" y2="260" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 음극 (-) 짧고 굵은 판 -->
    <line class="movable" x1="140" y1="290" x2="200" y2="290" stroke="#000000" stroke-width="7.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 접지 (Ground) 기호 (좌하단) -->
    <line class="movable wire" x1="170" y1="580" x2="170" y2="650" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="115" y1="650" x2="225" y2="650" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="135" y1="665" x2="205" y2="665" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="155" y1="680" x2="185" y2="680" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 축전기 A 극판 (좌측) -->
    <line class="movable" x1="580" y1="145" x2="780" y2="145" stroke="#000000" stroke-width="4.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="580" y1="195" x2="780" y2="195" stroke="#000000" stroke-width="4.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 축전기 A 하판에서 노드 b 연결선 -->
    <line class="movable wire" x1="680" y1="195" x2="680" y2="330" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 축전기 B 극판 (우측) -->
    <line class="movable" x1="890" y1="145" x2="1010" y2="145" stroke="#000000" stroke-width="4.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="890" y1="195" x2="1010" y2="195" stroke="#000000" stroke-width="4.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 축전기 B 하판에서 노드 b 연결선 -->
    <path class="movable wire" d="M 950 195 L 950 330 L 680 330" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 계측기 M (검류계/전류계) 및 접속점 -->
    <circle class="movable" cx="680" cy="445" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="680" y1="330" x2="680" y2="401" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="680" y1="489" x2="680" y2="580" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 접속 노드 b, a (검은색 점) -->
    <circle class="movable" cx="680" cy="330" r="7.5" fill="#000000" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="680" cy="580" r="7.5" fill="#000000" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 전압 기호 V -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="245" y="255" width="40" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="265" y="276">V</text>
    </g>

    <!-- 축전기 라벨 A, B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="750" y="220" width="40" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="770" y="241">A</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="980" y="220" width="40" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="1000" y="241">B</text>
    </g>

    <!-- 노드 라벨 b, a -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="625" y="310" width="40" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="645" y="330">b</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="625" y="535" width="40" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="645" y="555">a</text>
    </g>

    <!-- 계측기 M 기호 문자 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="680" y="445" font-size="44" font-weight="bold">M</text>
    </g>

    <!-- 캡션 '그림 2' (원본 図 2 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="460" y="835" width="136" height="50" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="528" y="860">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
