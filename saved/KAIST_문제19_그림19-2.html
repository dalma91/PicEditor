<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <defs>
    <marker id="rot-arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dim-start3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-end3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Floor Ellipse (dashed) -->
  <ellipse class="movable" cx="135" cy="155" rx="125" ry="25" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical Post from (135, 155) to (135, 15) -->
  <line class="movable" x1="135" y1="155" x2="135" y2="15" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Top Point O -->
  <circle class="movable" cx="135" cy="28" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension l0 curve on left of post -->
  <path class="movable" d="M 135 30 C 115 55 115 125 135 152" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Helical Spring from O(135, 28) to mass m(250, 95) -->
  <path class="movable" d="M 135.0 28.0 Q 141.9 32.1 142.8 41.9 Q 154.6 39.6 160.8 34.0 Q 159.0 42.2 162.6 53.7 Q 174.4 51.4 180.7 45.8 Q 178.8 54.0 182.5 65.4 Q 194.3 63.1 200.5 57.6 Q 198.7 65.8 202.3 77.2 Q 214.1 74.9 220.4 69.3 Q 218.5 77.5 222.2 89.0 Q 233.9 86.7 240.2 81.1 Q 241.1 90.9 248.0 95.0" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Mass m (solid black circle) -->
  <circle class="movable" cx="248" cy="95" r="5.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Height dimension h under mass m -->
  <line class="movable" x1="248" y1="104" x2="248" y2="138" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-start3)" marker-end="url(#dim-end3)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Rotation Direction Arrow -->
  <path class="movable" d="M 268 140 C 275 152 270 162 255 170" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#rot-arrow2)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- O -->
  <g class="movable text-wrap" transform="translate(122, 18) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- l0 -->
  <g class="movable text-wrap" transform="translate(120, 90) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">l<tspan font-size="14" dy="4">0</tspan></text>
  </g>

  <!-- k (Spring constant) -->
  <g class="movable text-wrap" transform="translate(200, 48) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">k</text>
  </g>

  <!-- m -->
  <g class="movable text-wrap" transform="translate(250, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- h -->
  <g class="movable text-wrap" transform="translate(265, 120) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">h</text>
  </g>

  <!-- 매끄러운 면 -->
  <g class="movable text-wrap" transform="translate(55, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-45" y="-14" width="90" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">매끄러운 면</text>
  </g>

  <!-- 회전 방향 -->
  <g class="movable text-wrap" transform="translate(325, 155) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-38" y="-14" width="76" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">회전 방향</text>
  </g>
</svg>
</body>
</html>
