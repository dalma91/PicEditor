<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <marker id="arrow-55-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Horizontal Axis: t -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="85" y1="330" x2="570" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(575, 320)">
    <text class="text-el" x="0" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic">t</text>
  </g>

  <!-- Vertical Axis: fR -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="110" y1="360" x2="110" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(68, 40)">
    <text class="text-el" x="20" y="20" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="14">R</tspan></text>
  </g>

  <!-- Origin 0 -->
  <g class="movable text-wrap" transform="translate(85, 335)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">0</text>
  </g>

  <!-- Ticks on Vertical Axis -->
  <!-- Upper level: fA at y=130 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="104" y1="130" x2="110" y2="130" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(68, 120)">
    <text class="text-el" x="20" y="20" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="14">A</tspan></text>
  </g>

  <!-- Lower level: c/(c+w) fA at y=230 (formatted fraction) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="104" y1="230" x2="110" y2="230" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(25, 205)">
    <text class="text-el" x="25" y="14" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle">c</text>
    <line x1="8" y1="19" x2="42" y2="19" stroke="#000000" stroke-width="1"/>
    <text class="text-el" x="25" y="34" font-family="Times New Roman, serif" font-size="15" text-anchor="middle"><tspan font-style="italic">c</tspan>+<tspan font-style="italic">w</tspan></text>
    <text class="text-el" x="52" y="24" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">f</tspan><tspan dy="2" font-size="12">A</tspan></text>
  </g>

  <!-- Dashed Guidelines -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="110" y1="230" x2="505" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="130" x2="270" y2="130" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Vertical dashed drops to horizontal axis -->
  <!-- t1 = 190 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="130" x2="190" y2="330" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="330" x2="190" y2="375" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(178, 335)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="13">1</tspan></text>
  </g>

  <!-- t2 = 270 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="270" y1="130" x2="270" y2="330" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="270" y1="330" x2="270" y2="375" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(258, 335)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="13">2</tspan></text>
  </g>

  <!-- t3 = 410 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="130" x2="410" y2="330" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="330" x2="410" y2="375" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(398, 335)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="13">3</tspan></text>
  </g>

  <!-- t4 = 490 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="490" y1="230" x2="490" y2="330" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="490" y1="330" x2="490" y2="375" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(478, 335)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="3" font-size="13">4</tspan></text>
  </g>

  <!-- Waveform (thick lines) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="110" y1="130" x2="190" y2="130" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="130" x2="190" y2="230" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="230" x2="270" y2="230" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="270" y1="230" x2="270" y2="130" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="270" y1="130" x2="410" y2="130" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="130" x2="410" y2="230" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="230" x2="490" y2="230" stroke="#000000" stroke-width="3"/>

  <!-- Dimension Intervals below axis (mathematically centered) -->
  <!-- 0 -> t1: center 150 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="110" y1="365" x2="190" y2="365" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-2)" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(150, 385)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="15" text-anchor="middle">
      <tspan font-style="italic">π /</tspan> 6 · <tspan font-style="italic">H / w</tspan>
    </text>
  </g>

  <!-- t1 -> t2: center 230 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="365" x2="270" y2="365" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-2)" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(230, 385)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="15" text-anchor="middle">
      1/2 · <tspan font-style="italic">H / w</tspan>
    </text>
  </g>

  <!-- t2 -> t3: center 340 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="270" y1="365" x2="410" y2="365" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-2)" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(340, 385)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="15" text-anchor="middle">
      <tspan font-style="italic">π /</tspan> 4 · <tspan font-style="italic">H / w</tspan>
    </text>
  </g>

  <!-- t3 -> t4: center 450 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="365" x2="490" y2="365" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-2)" marker-end="url(#arrow-55-2)"/>
  <g class="movable text-wrap" transform="translate(450, 385)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="15" text-anchor="middle">
      1/2 · <tspan font-style="italic">H / w</tspan>
    </text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(300, 465)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 5</text>
  </g>
</svg>
</body>
</html>
