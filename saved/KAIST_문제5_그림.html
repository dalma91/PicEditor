<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제5_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 460 460" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .num { font-family: 'Times New Roman', serif; font-size: 20px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .grid-line { stroke: #A0A0A0; stroke-width: 1.2; }
    .cycle-line { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 격자 (Grid 6x6) -->
    <!-- x: 80 ~ 410 (간격 55), y: 45 ~ 375 (간격 55) -->
    <!-- ========================================== -->
    <!-- 내부 세로 격자선 (V = 1 to 5) -->
    <line class="movable grid-line" x1="135" y1="45" x2="135" y2="375" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="190" y1="45" x2="190" y2="375" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="245" y1="45" x2="245" y2="375" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="300" y1="45" x2="300" y2="375" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="355" y1="45" x2="355" y2="375" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 내부 가로 격자선 (P = 1 to 5) -->
    <line class="movable grid-line" x1="80" y1="320" x2="410" y2="320" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="80" y1="265" x2="410" y2="265" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="80" y1="210" x2="410" y2="210" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="80" y1="155" x2="410" y2="155" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable grid-line" x1="80" y1="100" x2="410" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 격자 외곽 테두리 (V=0~6, P=0~6) -->
    <rect class="movable" x="80" y="45" width="330" height="330" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 열역학 순환 사이클 (A -> B -> C -> D -> A) -->
    <!-- ========================================== -->
    <!-- A -> B 구간 (화살표 포함) -->
    <line class="movable cycle-line" x1="135" y1="265" x2="135" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 130 190 L 135 175 L 140 190 Z" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- B -> C 구간 (화살표 포함) -->
    <line class="movable cycle-line" x1="135" y1="100" x2="190" y2="100" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 158 95 L 173 100 L 158 105 Z" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- C -> D 곡선 구간 (등온선 PV=10) -->
    <path class="movable cycle-line" d="M 190 100 C 220 155, 270 230, 355 265" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 곡선 진행방향 화살표 (우하향) -->
    <path class="movable" d="M 270 200 L 286 216 L 273 218 Z" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- D -> A 구간 (화살표 포함) -->
    <line class="movable cycle-line" x1="355" y1="265" x2="135" y2="265" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 250 260 L 235 265 L 250 270 Z" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상태점 마커 (A, B, C, D) -->
    <circle class="movable" cx="135" cy="265" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="135" cy="100" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="190" cy="100" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="355" cy="265" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 상태 라벨 (A, B, C, D) -->
    <!-- ========================================== -->
    <!-- A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="106" y="272" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="117" y="284">A</text>
    </g>

    <!-- B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="106" y="76" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="117" y="88">B</text>
    </g>

    <!-- C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="198" y="76" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="209" y="88">C</text>
    </g>

    <!-- D -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="363" y="272" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="374" y="284">D</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 눈금 숫자 라벨 -->
    <!-- ========================================== -->
    <!-- V 축 눈금 (0 ~ 6) -->
    <text class="num movable" x="80" y="392" transform="translate(0,0) scale(1,1) rotate(0)">0</text>
    <text class="num movable" x="135" y="392" transform="translate(0,0) scale(1,1) rotate(0)">1</text>
    <text class="num movable" x="190" y="392" transform="translate(0,0) scale(1,1) rotate(0)">2</text>
    <text class="num movable" x="245" y="392" transform="translate(0,0) scale(1,1) rotate(0)">3</text>
    <text class="num movable" x="300" y="392" transform="translate(0,0) scale(1,1) rotate(0)">4</text>
    <text class="num movable" x="355" y="392" transform="translate(0,0) scale(1,1) rotate(0)">5</text>
    <text class="num movable" x="410" y="392" transform="translate(0,0) scale(1,1) rotate(0)">6</text>

    <!-- P 축 눈금 (0 ~ 6) -->
    <text class="num movable" x="65" y="375" transform="translate(0,0) scale(1,1) rotate(0)">0</text>
    <text class="num movable" x="65" y="320" transform="translate(0,0) scale(1,1) rotate(0)">1</text>
    <text class="num movable" x="65" y="265" transform="translate(0,0) scale(1,1) rotate(0)">2</text>
    <text class="num movable" x="65" y="210" transform="translate(0,0) scale(1,1) rotate(0)">3</text>
    <text class="num movable" x="65" y="155" transform="translate(0,0) scale(1,1) rotate(0)">4</text>
    <text class="num movable" x="65" y="100" transform="translate(0,0) scale(1,1) rotate(0)">5</text>
    <text class="num movable" x="65" y="45" transform="translate(0,0) scale(1,1) rotate(0)">6</text>

    <!-- ========================================== -->
    <!-- 5. 축 라벨 -->
    <!-- ========================================== -->
    <!-- V [m^3] -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="202" y="415" width="85" height="26" fill="#FFFFFF"/>
      <text class="math" x="245" y="428">V <tspan font-style="normal" font-size="18">[m<tspan font-size="13" dy="-6">3</tspan><tspan font-size="18" dy="6">]</tspan></text>
    </g>

    <!-- P [N/m^2] (수직 회전) -->
    <g class="movable text-wrap" transform="translate(24, 210) rotate(-90)">
      <rect class="text-bg-rect" x="-45" y="-13" width="90" height="26" fill="#FFFFFF"/>
      <text class="math" x="0" y="0">P <tspan font-style="normal" font-size="18">[N/m<tspan font-size="13" dy="-6">2</tspan><tspan font-size="18" dy="6">]</tspan></text>
    </g>
  </g>
</svg>
</body>
</html>
