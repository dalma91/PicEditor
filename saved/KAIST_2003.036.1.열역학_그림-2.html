<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.036.1.열역학_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1302 850" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1.5 L 0 5 L 9 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 실린더 벽면 빗금 해치 패턴 -->
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#777777" stroke-width="1.8"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 실린더 1 벽면 (좌측 실린더) -->
    <path class="movable" d="M 170 330 L 190 330 L 190 650 L 410 650 L 410 330 L 430 330 L 430 630 L 430 670 L 170 670 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="190" y1="330" x2="190" y2="650" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="190" y1="650" x2="410" y2="650" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="410" y1="330" x2="410" y2="630" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 실린더 2 벽면 (우측 실린더) -->
    <path class="movable" d="M 930 330 L 950 330 L 950 630 L 930 630 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 930 670 L 930 650 L 950 650 L 1130 650 L 1130 330 L 1150 330 L 1150 670 Z" fill="url(#wall-hatch)" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="950" y1="330" x2="950" y2="630" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="950" y1="650" x2="1130" y2="650" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1130" y1="330" x2="1130" y2="650" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 하단 연결관 -->
    <line class="movable" x1="410" y1="630" x2="950" y2="630" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="410" y1="650" x2="950" y2="650" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 밸브(콕) 기호 -->
    <polygon class="movable" points="670,618 690,618 680,640" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="670,662 690,662 680,640" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="680" y1="610" x2="680" y2="670" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 피스톤 1 (하강한 위치) -->
    <path class="movable" d="M 190 490 L 410 490 L 410 525 L 190 525 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 280 490 L 280 200 L 300 160 L 320 200 L 320 490 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 피스톤 2 (하강한 위치) -->
    <path class="movable" d="M 950 530 L 1130 530 L 1130 565 L 950 565 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 1020 530 L 1020 200 L 1040 160 L 1060 200 L 1060 530 Z" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 상단 수평 강체 막대 (두 피스톤 끝에 얹힘) -->
    <rect class="movable" x="250" y="145" width="840" height="20" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 8. 막대 중앙 중력 화살표 mg -->
    <line class="movable" x1="670" y1="165" x2="670" y2="245" stroke="#000000" stroke-width="4.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 9. 상단 치수선 L 및 L/2 -->
    <!-- L 전체 길이 치수선 (좌측 피스톤 끝(300) ~ 우측 피스톤 끝(1040)) -->
    <line class="movable" x1="300" y1="145" x2="300" y2="70" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1040" y1="145" x2="1040" y2="70" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="304" y1="85" x2="1036" y2="85" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- L/2 절반 길이 치수선 (좌측(300) ~ 중앙(670)) -->
    <line class="movable" x1="670" y1="145" x2="670" y2="110" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="304" y1="125" x2="666" y2="125" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 10. 피스톤 높이 치수선 h1', h2' -->
    <line class="movable" x1="190" y1="525" x2="100" y2="525" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="170" y1="650" x2="100" y2="650" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="120" y1="529" x2="120" y2="646" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <line class="movable" x1="1130" y1="565" x2="1220" y2="565" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1150" y1="650" x2="1220" y2="650" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1200" y1="569" x2="1200" y2="646" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 치수 라벨 L, L/2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="655" y="45" width="30" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="670" y="63">L</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="450" y="105" width="70" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="485" y="123">L/2</text>
    </g>

    <!-- 중력 mg -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="640" y="250" width="60" height="36" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="670" y="268">mg</text>
    </g>

    <!-- 외부 기압 P0 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="645" y="450" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="670" y="470">P<tspan dy="6" font-size="24">0</tspan></text>
    </g>

    <!-- 단면적 S1, S2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="275" y="560" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="300" y="580">S<tspan dy="6" font-size="24">1</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1015" y="580" width="50" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1040" y="600">S<tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 치수 h1', h2' -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="55" y="565" width="55" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="80" y="585">h<tspan dy="6" font-size="24">1</tspan><tspan dy="-10" font-size="28">′</tspan></text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1215" y="585" width="55" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1240" y="605">h<tspan dy="6" font-size="24">2</tspan><tspan dy="-10" font-size="28">′</tspan></text>
    </g>

    <!-- 하단 공식: h1' = h1 - Delta h1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="160" y="685" width="280" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="300" y="707">h<tspan dy="6" font-size="24">1</tspan><tspan dy="-10" font-size="28">′</tspan><tspan dy="4"> = h</tspan><tspan dy="6" font-size="24">1</tspan><tspan dy="-6"> − Δh</tspan><tspan dy="6" font-size="24">1</tspan></text>
    </g>

    <!-- 하단 공식: h2' = h2 - Delta h2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="900" y="685" width="280" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="1040" y="707">h<tspan dy="6" font-size="24">2</tspan><tspan dy="-10" font-size="28">′</tspan><tspan dy="4"> = h</tspan><tspan dy="6" font-size="24">2</tspan><tspan dy="-6"> − Δh</tspan><tspan dy="6" font-size="24">2</tspan></text>
    </g>

    <!-- 밸브 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="640" y="560" width="80" height="35" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="680" y="578">밸브</text>
    </g>

    <!-- 캡션 '그림 2' (원본 図 2 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="620" y="760" width="120" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="680" y="782">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
