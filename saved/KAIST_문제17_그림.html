<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 460" width="100%" height="100%">
  <defs>
    <pattern id="stipple-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#888888"/>
      <circle cx="6" cy="6" r="1" fill="#888888"/>
    </pattern>
    <marker id="arrow-traj2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-arrow-end" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Wall & Ground Hatch polygon under trench and slope -->
  <!-- Trench wall: x=10..40, y=200..395. Floor: x=10..390, y=365..395. Under slope: arc boundary -->
  <path class="movable" d="M 15 200 L 40 200 L 40 365 L 360 365 L 360 305 A 240 240 0 0 0 568 185 L 600 205 A 270 270 0 0 1 375 335 L 390 395 L 15 395 Z" fill="url(#stipple-pattern)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Left Wall & Trench Floor -->
  <polyline class="movable" points="40,200 40,365 360,365 360,305" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Circular Incline Arc (C to A) -->
  <path class="movable" d="M 360 305 A 240 240 0 0 0 568 185" fill="none" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius Guidelines from O(360, 65) -->
  <!-- Vertical to C -->
  <line class="movable" x1="360" y1="65" x2="360" y2="305" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- To B (theta=25 deg) -->
  <line class="movable" x1="360" y1="65" x2="461" y2="282" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- To A (60 deg) -->
  <line class="movable" x1="360" y1="65" x2="568" y2="185" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Center point O -->
  <circle class="movable" cx="360" cy="65" r="2.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius dimension r curve & text -->
  <path class="movable" d="M 390 53 A 260 260 0 0 1 578 178" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Angle arc for 60 deg -->
  <path class="movable" d="M 360 115 A 50 50 0 0 1 403 90" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Angle arc for theta -->
  <path class="movable" d="M 360 160 A 95 95 0 0 1 398 150" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Small Ball B on incline -->
  <circle class="movable" cx="425" cy="290" r="7" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Trajectories from C(360, 305) -->
  <!-- Horizontal line to F(40, 305) -->
  <line class="movable" x1="360" y1="305" x2="42" y2="305" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-traj2)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Parabola to D(225, 365) -->
  <path class="movable" d="M 360 305 Q 260 305 227 363" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-traj2)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Parabola to E(290, 365) -->
  <path class="movable" d="M 360 305 Q 310 305 292 363" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-traj2)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Height dimensions h -->
  <!-- Right step height h at X -->
  <line class="movable" x1="353" y1="308" x2="353" y2="362" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Left wall height h at F -->
  <line class="movable" x1="48" y1="308" x2="48" y2="362" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Gravity Block Arrow g -->
  <g class="movable" transform="translate(135, 115) scale(1,1) rotate(0)">
    <polygon points="-7,0 7,0 7,65 17,65 0,95 -17,65 -7,65" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <text x="26" y="45" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#000000">g</text>
  </g>

  <!-- Text Labels -->
  <!-- O -->
  <g class="movable text-wrap" transform="translate(360, 42) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(575, 165) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(450, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- C -->
  <g class="movable text-wrap" transform="translate(340, 292) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">C</text>
  </g>

  <!-- D -->
  <g class="movable text-wrap" transform="translate(225, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">D</text>
  </g>

  <!-- E -->
  <g class="movable text-wrap" transform="translate(290, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">E</text>
  </g>

  <!-- X -->
  <g class="movable text-wrap" transform="translate(360, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">X</text>
  </g>

  <!-- X' -->
  <g class="movable text-wrap" transform="translate(40, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">X'</text>
  </g>

  <!-- F -->
  <g class="movable text-wrap" transform="translate(25, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">F</text>
  </g>

  <!-- 60 deg -->
  <g class="movable text-wrap" transform="translate(415, 125) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">60°</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(378, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- r -->
  <g class="movable text-wrap" transform="translate(490, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">r</text>
  </g>

  <!-- Right h -->
  <g class="movable text-wrap" transform="translate(340, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">h</text>
  </g>

  <!-- Left h -->
  <g class="movable text-wrap" transform="translate(62, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">h</text>
  </g>
</svg>
</body>
</html>
