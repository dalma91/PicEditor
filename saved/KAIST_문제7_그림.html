<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제7_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 480 480" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 각속도 회전 화살표 마커 -->
    <marker id="rot-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .hoop-line { stroke: #000000; stroke-width: 3.5; fill: none; }
    .radius-line { stroke: #000000; stroke-width: 1.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 대형 원환 (Circular hoop, R=175, center=(200, 260)) -->
    <!-- ========================================== -->
    <circle class="movable hoop-line" cx="200" cy="260" r="175" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 중심선, 반경 R, 각도 theta -->
    <!-- ========================================== -->
    <!-- 수직 하향 반경선 -->
    <line class="movable radius-line" x1="200" y1="260" x2="200" y2="435" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta=50도 반경선 (center -> 작은 고리, 화살표 포함) -->
    <!-- cos 50 = 0.6428, sin 50 = 0.7660 -->
    <!-- 끝점: 200 + 175*0.766 = 334, 260 + 175*0.643 = 372 -->
    <line class="movable radius-line" x1="200" y1="260" x2="330" y2="369" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta 호 (반경 60) -->
    <path class="movable" d="M 200 320 A 60 60 0 0 0 246 306" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 작은 고리 (Bead/Ring) -->
    <!-- 위치: (334, 372), 접선방향 약 -40도 -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(334, 372) rotate(40)">
      <!-- 고리 외형 (타원 도넛 형태) -->
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="8" ry="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- ========================================== -->
    <!-- 4. 회전 각속도 omega 화살표 -->
    <!-- 원환 우상단 외곽 회전 호 (중심 (200, 260), 반경 195, 각도 약 -15도 ~ -55도) -->
    <!-- ========================================== -->
    <path class="movable" d="M 405 210 A 210 210 0 0 0 376 135" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#rot-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 중력가속도 g 화살표 (우하단) -->
    <!-- ========================================== -->
    <line class="movable" x1="435" y1="360" x2="435" y2="430" stroke="#000000" stroke-width="2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- 원환 (한글 번역: 円環 -> 원환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="170" y="48" width="60" height="26" fill="#FFFFFF"/>
      <text class="korean" x="200" y="61">원환</text>
    </g>

    <!-- omega -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="415" y="160" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="426" y="172">ω</text>
    </g>

    <!-- R -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="264" y="295" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="275" y="307">R</text>
    </g>

    <!-- theta -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="230" y="335" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="241" y="347">θ</text>
    </g>

    <!-- 작은 고리 (한글 번역: 小輪 -> 작은 고리) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="315" y="398" width="90" height="26" fill="#FFFFFF"/>
      <text class="korean" x="360" y="411">작은 고리</text>
    </g>

    <!-- g -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="444" y="388" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="454" y="400">g</text>
    </g>
  </g>
</svg>
</body>
</html>
