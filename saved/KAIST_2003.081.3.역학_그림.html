<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.081.3.역학_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1158 560" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 지주 해칭 패턴 -->
    <pattern id="post-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555555" stroke-width="1.5"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; }
    .greek { font-family: 'Times New Roman', serif; font-style: normal; font-size: 30px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .dim-line { stroke: #000000; stroke-width: 1.8; fill: none; }
    .center-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 좌우 지주 (기둥) -->
    <!-- 좌측 지주 -->
    <rect class="movable" x="70" y="80" width="22" height="115" fill="url(#post-pattern)" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="80" y="45">지지대</text>
    </g>

    <!-- 우측 지주 -->
    <rect class="movable" x="960" y="80" width="22" height="115" fill="url(#post-pattern)" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="970" y="45">지지대</text>
    </g>

    <!-- 2. 레일 및 레일 레이블 -->
    <line class="movable" x1="92" y1="185" x2="960" y2="185" stroke="#000000" stroke-width="5.0" stroke-linecap="square" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="515" y="225">레일</text>
    </g>

    <!-- 3. 소구 (작은 공) -->
    <circle class="movable" cx="640" cy="175" r="14" fill="#888888" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="640" y="125">소구</text>
    </g>

    <!-- 4. 고무줄 1 & 고무줄 2 -->
    <!-- 고무줄 1 (좌측 지주 -> 소구) -->
    <line class="movable" x1="92" y1="162" x2="626" y2="175" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="350" y="125">고무줄 1</text>
    </g>

    <!-- 고무줄 2 (소구 -> 우측 지주) -->
    <line class="movable" x1="654" y1="175" x2="960" y2="162" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="815" y="125">고무줄 2</text>
    </g>

    <!-- 5. x축 -->
    <line class="movable" x1="10" y1="275" x2="1080" y2="275" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1115" y="275" transform="translate(0,0) scale(1,1) rotate(0)">x</text>

    <!-- 원점 x = 0 위치 및 중심선 -->
    <line class="movable center-line" x1="640" y1="190" x2="640" y2="420" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="615" y="315">x</text>
      <text class="roman" x="650" y="315">=</text>
      <text class="roman" x="675" y="315">0</text>
    </g>

    <!-- 6. 좌우 기준선 (하단 치수 보조선) -->
    <line class="movable center-line" x1="92" y1="195" x2="92" y2="525" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable center-line" x1="960" y1="195" x2="960" y2="525" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 구간 길이 l1 + Δl1 & l2 + Δl2 -->
    <!-- 좌측 구간 -->
    <line class="movable dim-line" x1="94" y1="390" x2="638" y2="390" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="330" y="355">l<tspan class="sub" dy="6">1</tspan></text>
      <text class="roman" x="365" y="355">+</text>
      <text class="greek" x="395" y="355">Δ</text>
      <text class="math" x="420" y="355">l<tspan class="sub" dy="6">1</tspan></text>
    </g>

    <!-- 우측 구간 -->
    <line class="movable dim-line" x1="642" y1="390" x2="958" y2="390" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="765" y="355">l<tspan class="sub" dy="6">2</tspan></text>
      <text class="roman" x="800" y="355">+</text>
      <text class="greek" x="830" y="355">Δ</text>
      <text class="math" x="855" y="355">l<tspan class="sub" dy="6">2</tspan></text>
    </g>

    <!-- 8. 전체 길이 L -->
    <line class="movable dim-line" x1="94" y1="495" x2="958" y2="495" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="525" y="465" transform="translate(0,0) scale(1,1) rotate(0)">L</text>
  </g>
</svg>
</body>
</html>
