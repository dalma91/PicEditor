<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.050.1.역학_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1434 450" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 바닥 및 빗면 해치 패턴 -->
    <pattern id="ground-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777777" stroke-width="1.2"/>
    </pattern>
    <pattern id="wedge-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#555555"/>
      <circle cx="6" cy="6" r="0.8" fill="#555555"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; font-size: 42px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 지면 바닥 블록 -->
    <rect class="movable" x="20" y="290" width="1394" height="140" fill="url(#ground-pattern)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 빗면 쐐기 (경사면) -->
    <!-- 쐐기 본체 (삼각형 폴리곤) -->
    <polygon class="movable" points="190,290 1260,35 1260,290" fill="url(#wedge-pattern)" stroke="#000000" stroke-width="2.8" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 경사각 theta 호 -->
    <path class="movable" d="M 470 290 A 280 280 0 0 0 462 225" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 빗면 위 발사 물체 (작은 원 구체) -->
    <circle class="movable" cx="300" cy="249" r="16" fill="#000000" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 초기 속도 벡터 v0 화살표 -->
    <line class="movable" x1="300" y1="249" x2="405" y2="85" stroke="#000000" stroke-width="4.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 발사각 alpha 호 (빗면과 속도 벡터 사이) -->
    <path class="movable" d="M 368 232 A 70 70 0 0 0 337 188" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 속도 기호 v0 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="305" y="115" width="50" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="330" y="136">v<tspan dy="6" font-size="26">0</tspan></text>
    </g>

    <!-- 발사각 alpha 기호 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="400" y="185" width="40" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="greek" x="420" y="206">α</text>
    </g>

    <!-- 경사각 theta 기호 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="500" y="240" width="40" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="greek" x="520" y="261">θ</text>
    </g>
  </g>
</svg>
</body>
</html>
