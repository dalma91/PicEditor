<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.065.3.전자기_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1554 780" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="big-arrow-end" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wire { stroke: #000000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .rail-bar { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; }
    .ref-line { stroke: #000000; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 자기장 B (수직 상향 벡터들) -->
    <!-- 주 자기장 B (좌측 대형) -->
    <line class="movable" x1="615" y1="320" x2="615" y2="55" stroke="#000000" stroke-width="3.0" marker-end="url(#big-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="665" y="105" transform="translate(0,0) scale(1,1) rotate(0)">B</text>

    <!-- 배경 분포 자기장 화살표들 -->
    <line class="movable" x1="825" y1="420" x2="825" y2="160" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1030" y1="520" x2="1030" y2="270" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="1240" y1="620" x2="1240" y2="390" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 경사 레일 3개 (3D 직육면체 각봉) -->
    <!-- 3개 레일 공통 기준 점선 (하단 단면 정렬선) -->
    <line class="movable ref-line" x1="390" y1="420" x2="1020" y2="760" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 레일 1 (좌측 레일) -->
    <!-- 윗면 -->
    <polygon class="movable rail-bar" points="495,475 1065,90 1085,98 515,483" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 옆면 -->
    <polygon class="movable rail-bar" points="485,485 505,493 515,483 495,475" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전면 단면 -->
    <polygon class="movable rail-bar" points="485,485 495,475 515,483 505,493" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 레일 1 수평 기준선 및 경사각 theta -->
    <line class="movable ref-line" x1="505" y1="490" x2="680" y2="490" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 625 490 A 130 130 0 0 0 635 400" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="665" y="445" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>

    <!-- 레일 1 전류 IA 표시 -->
    <line class="movable" x1="590" y1="365" x2="510" y2="420" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="525" y="350">I<tspan class="sub" dy="8">A</tspan></text>
    </g>

    <!-- 레일 2 (중간 레일) -->
    <!-- 윗면 -->
    <polygon class="movable rail-bar" points="720,595 1290,210 1310,218 740,603" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전면 단면 -->
    <polygon class="movable rail-bar" points="710,605 720,595 740,603 730,613" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 레일 2 수평 기준선 및 경사각 theta -->
    <line class="movable ref-line" x1="730" y1="610" x2="890" y2="610" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 850 610 A 120 120 0 0 0 860 520" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="880" y="565" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>

    <!-- 레일 2 전류 IB 표시 -->
    <line class="movable" x1="820" y1="485" x2="740" y2="540" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="770" y="470">I<tspan class="sub" dy="8">B</tspan></text>
    </g>

    <!-- 레일 3 (우측 레일) -->
    <!-- 윗면 -->
    <polygon class="movable rail-bar" points="905,685 1475,300 1495,308 925,693" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전면 단면 -->
    <polygon class="movable rail-bar" points="895,695 905,685 925,693 915,703" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 레일 3 수평 기준선 및 경사각 theta -->
    <line class="movable ref-line" x1="915" y1="700" x2="1080" y2="700" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <path class="movable" d="M 1040 700 A 125 125 0 0 0 1050 610" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="1070" y="655" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>

    <!-- 레일 3 전류 IC 표시 -->
    <line class="movable" x1="990" y1="600" x2="910" y2="655" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="930" y="585">I<tspan class="sub" dy="8">C</tspan></text>
    </g>

    <!-- 3. 가로 도체 막대 PQ (레일 위를 미끄러지는 막대) -->
    <!-- 막대 본체 (3D 평행육면체) -->
    <polygon class="movable" points="945,145 1450,335 1425,352 920,162" fill="#FFFFFF" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="920,162 1425,352 1425,365 920,175" fill="#E0E0E0" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- Q 끝단 걸쇠/브래킷 -->
    <polygon class="movable" points="1390,350 1435,367 1435,420 1390,403" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- P, Q 레이블 -->
    <text class="movable roman" x="965" y="115" transform="translate(0,0) scale(1,1) rotate(0)">P</text>
    <text class="movable roman" x="1395" y="320" transform="translate(0,0) scale(1,1) rotate(0)">Q</text>

    <!-- 속도 벡터 v (미끄러져 내려감) -->
    <line class="movable" x1="1040" y1="215" x2="975" y2="258" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="975" y="220" transform="translate(0,0) scale(1,1) rotate(0)">v</text>

    <!-- 레일 간격 l1, l2 (상단 양방향 화살표) -->
    <!-- 레일 1-2 사이 간격 l1 -->
    <line class="movable" x1="1080" y1="75" x2="1325" y2="167" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="1215" y="145">l<tspan class="sub" dy="8">1</tspan></text>
    </g>

    <!-- 레일 2-3 사이 간격 l2 -->
    <line class="movable" x1="1335" y1="172" x2="1490" y2="230" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="1410" y="230">l<tspan class="sub" dy="8">2</tspan></text>
    </g>

    <!-- 4. 하단 회로 및 스위치 S, 저항 R1, R2 -->
    <!-- 레일 1에서 좌측 수평 도선 -->
    <line class="movable wire" x1="485" y1="485" x2="40" y2="485" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 저항 R1 (좌측 경사 도선 상) -->
    <!-- 도선 구간 1 -->
    <line class="movable wire" x1="40" y1="485" x2="90" y2="520" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 저항 R1 지그재그 -->
    <polyline class="movable" points="90,520 102,510 115,535 128,510 141,535 154,510 167,535 179,525" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 도선 구간 2 (노드까지) -->
    <line class="movable wire" x1="179" y1="525" x2="270" y2="590" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="135" y="580">R<tspan class="sub" dy="8">1</tspan></text>
    </g>

    <!-- 스위치 S (중간 레일 2에서 노드로 연결) -->
    <line class="movable wire" x1="710" y1="605" x2="570" y2="605" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 스위치 우측 단자 -->
    <circle class="movable" cx="570" cy="605" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 스위치 레버 (열림 상태) -->
    <line class="movable" x1="495" y1="605" x2="540" y2="575" stroke="#000000" stroke-width="3.0" stroke-linecap="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 스위치 좌측 단자 -->
    <circle class="movable" cx="495" cy="605" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="495" y1="605" x2="270" y2="605" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="515" y="555" transform="translate(0,0) scale(1,1) rotate(0)">S</text>

    <!-- 저항 R2 (노드 270,605에서 우측 경사로) -->
    <line class="movable wire" x1="270" y1="605" x2="310" y2="635" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 저항 R2 지그재그 -->
    <polyline class="movable" points="310,635 322,625 335,650 348,625 361,650 374,625 387,650 399,640" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="399" y1="640" x2="440" y2="695" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="355" y="695">R<tspan class="sub" dy="8">2</tspan></text>
    </g>

    <!-- 레일 3에서 하단 수평 도선 (440, 695까지) -->
    <line class="movable wire" x1="895" y1="695" x2="440" y2="695" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>
</svg>
</body>
</html>
