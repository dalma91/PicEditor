<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.061.3.파동_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 996 888" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 28px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .boundary-line { stroke: #000000; stroke-width: 3.5; fill: none; }
    .normal-line { stroke: #000000; stroke-width: 2.0; stroke-dasharray: 4,4; fill: none; }
    .wave-line { stroke: #000000; stroke-width: 2.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 풍속 V 블록 화살표 (좌상단) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="70" y="90">풍속</text>
      <text class="math" x="140" y="90">V</text>
      <polygon points="175,75 235,75 235,60 280,90 235,120 235,105 175,105" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- 2. 매질 및 경계면 레이블 -->
    <!-- 경계면 선 (수평선) -->
    <line class="movable boundary-line" x1="50" y1="340" x2="840" y2="340" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="790" y="300" width="130" height="40" fill="#FFFFFF"/>
      <text class="korean" x="855" y="320">경계면</text>
    </g>
    <!-- 위쪽 매질 음속 v2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="800" y="180">음속</text>
      <text class="math" x="860" y="180">v<tspan class="sub" dy="6">2</tspan></text>
    </g>
    <!-- 아래쪽 매질 음속 v1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="800" y="560">음속</text>
      <text class="math" x="860" y="560">v<tspan class="sub" dy="6">1</tspan></text>
    </g>

    <!-- 3. 반원형 2차 파면 (중심 D: (420, 340), 반지름 R=260) -->
    <path class="movable" d="M 160 340 A 260 260 0 0 1 680 340" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 중심 D 및 법선 -->
    <text class="movable roman" x="420" y="370" transform="translate(0,0) scale(1,1) rotate(0)">D</text>
    <!-- D의 연직 법선 -->
    <line class="movable normal-line" x1="420" y1="340" x2="420" y2="40" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- D 법선의 직각 기호 -->
    <polyline class="movable" points="420,310 390,310 390,340" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. D에서 나온 굴절선 및 B', C' 접선 파면 -->
    <!-- 굴절 각도 약 48도: cos(48)=0.669, sin(48)=0.743. R=260 -> dx = 193, dy = 174 -> B'=(613, 166) -->
    <!-- D에서 B'를 지나 나아가는 굴절선 -->
    <line class="movable wave-line" x1="420" y1="340" x2="685" y2="80" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 접점 B' 레이블 -->
    <text class="movable roman" x="615" y="115" transform="translate(0,0) scale(1,1) rotate(0)">B′</text>

    <!-- 각도 theta2 (법선과 DB' 사이 호) -->
    <path class="movable" d="M 420 250 A 90 90 0 0 1 484 274" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="480" y="235" transform="translate(0,0) scale(1,1) rotate(0)">θ<tspan class="sub" dy="6">2</tspan></text>

    <!-- 접선 B'C': C'=(800, 340). B'=(613, 166) -> C' - B' = (187, 174), 기울기 약 43도. DB'와 수직! -->
    <line class="movable wave-line" x1="613" y1="166" x2="800" y2="340" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 점 C' 레이블 -->
    <text class="movable roman" x="815" y="375" transform="translate(0,0) scale(1,1) rotate(0)">C′</text>
    <!-- B'에서의 직각 기호 (DB'선과 B'C'선 사이) -->
    <polygon class="movable" points="613,166 630,182 646,165 629,149" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 입사 파동 (점 B, C 및 입사선) -->
    <!-- 점 B: (250, 340) -->
    <text class="movable roman" x="275" y="325" transform="translate(0,0) scale(1,1) rotate(0)">B</text>
    <!-- 점 B의 법선 (위/아래) -->
    <line class="movable normal-line" x1="250" y1="210" x2="250" y2="470" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- B에서의 법선-경계면 직각 기호 -->
    <polyline class="movable" points="250,310 220,310 220,340" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 입사선 1: (115, 600) -> (250, 340), 방향각 약 28도 (법선 대비) -->
    <line class="movable wave-line" x1="115" y1="600" x2="250" y2="340" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wave-line" x1="115" y1="600" x2="185" y2="465" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta1 (법선과 입사선 사이 호) -->
    <path class="movable" d="M 250 430 A 90 90 0 0 1 208 420" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="220" y="475" transform="translate(0,0) scale(1,1) rotate(0)">θ<tspan class="sub" dy="6">1</tspan></text>

    <!-- 입사 파면 선 BC (B에서 수직으로 내려오는 선): B=(250, 340) -> C=(640, 545) -->
    <line class="movable wave-line" x1="250" y1="340" x2="640" y2="545" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- B에서의 입사선과 파면 직각 기호 -->
    <polygon class="movable" points="250,340 269,350 259,369 240,359" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 점 C 레이블 -->
    <text class="movable roman" x="670" y="555" transform="translate(0,0) scale(1,1) rotate(0)">C</text>
    <!-- C에서 C'로 가는 점선 파선 연장선 -->
    <line class="movable normal-line" x1="640" y1="545" x2="800" y2="340" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 입사선 2: (505, 805) -> (640, 545) -->
    <line class="movable wave-line" x1="505" y1="805" x2="640" y2="545" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wave-line" x1="505" y1="805" x2="575" y2="670" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C에서의 직각 기호 -->
    <polygon class="movable" points="640,545 621,535 631,516 650,526" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 하단 캡션: 그림 2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="420" y="820" width="160" height="48" fill="#FFFFFF"/>
      <text class="korean" style="font-weight: bold; font-size: 32px;" x="500" y="844">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
