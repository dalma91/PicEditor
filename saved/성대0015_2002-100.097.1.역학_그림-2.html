<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0015_2002-100.097.1.역학_그림-2</title>
</head>
<body>
<svg viewBox="0 0 600 450" width="600" height="450" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <pattern id="block-dot" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#333333" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 빗면 쐐기 (30도 직각삼각형) -->
    <polygon class="movable" points="10,380 540,380 540,80" fill="none" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 빗면 각도 30도 호 -->
    <path class="movable" d="M 80,380 A 70 70 0 0 0 72,347" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 상단 핀 / 지지점 -->
    <circle class="movable" cx="548" cy="65" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="548" cy="65" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="455" y1="128" x2="540" y2="80" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 현재 위치의 물체 (빗금 사각형) -->
    <rect class="movable" x="390" y="100" width="70" height="50" fill="url(#block-dot)" stroke="#000000" stroke-width="2.5" transform="rotate(-30 425 125)" />

    <!-- 원래 위치 (점선 사각형) 및 보조선 -->
    <rect class="movable" x="120" y="255" width="70" height="50" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" transform="rotate(-30 155 280)" />
    <line class="movable" x1="165" y1="250" x2="400" y2="115" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 이동거리 s[m] 치수 화살표 -->
    <line class="movable" x1="120" y1="315" x2="145" y2="360" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="410" y1="150" x2="435" y2="195" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="420" y1="170" x2="140" y2="332" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="90" y="375" font-family="'Times New Roman', serif" font-size="44">30°</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="290" y="260" font-family="'Times New Roman', serif" font-size="40" font-style="italic">s [m]</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="270" y="430" font-family="'Batang', serif" font-size="36" font-weight="bold" text-anchor="middle">그림 2</text></g>
  </g>
</svg>
</body>
</html>
