<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.040.3.파동_그림-1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <marker id="arrow-107-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Optical Slab: (80, 90) to (510, 185) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="80" y="90" width="430" height="95" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Dimension d at right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="525" y1="90" x2="580" y2="90" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="525" y1="185" x2="580" y2="185" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="90" x2="550" y2="185" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-107-1)" marker-end="url(#arrow-107-1)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="542" y="125" width="16" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="550" y="142" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">d</text>
  </g>

  <!-- Normal at Point A -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="25" y1="140" x2="135" y2="140" stroke="#000000" stroke-width="1.2" stroke-dasharray="2,2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="98" y="160" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>

  <!-- Incident Ray to A=(80, 140) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="25" y1="190" x2="80" y2="140" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-107-1)"/>
  <!-- Angle theta0 arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 50 140 A 30 30 0 0 1 60 160" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="40" y="158" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">θ<tspan font-size="12" dy="4">0</tspan></text>
  </g>

  <!-- Reflected Ray from A up-left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="140" x2="28" y2="95" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-107-1)"/>

  <!-- Refracted Ray A -> B1=(190, 90) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="140" x2="190" y2="90" stroke="#000000" stroke-width="1.8"/>
  <!-- Angle theta1 arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 125 140 A 45 45 0 0 0 120 120" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="142" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">θ<tspan font-size="12" dy="4">1</tspan></text>
  </g>

  <!-- Point B1 Normal & Refraction -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="40" x2="190" y2="140" stroke="#000000" stroke-width="1.2" stroke-dasharray="2,2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="172" y="80" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B<tspan font-size="14" dy="4">1</tspan></text>
  </g>
  <!-- Ray exiting B1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="90" x2="295" y2="65" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-107-1)"/>
  <!-- Angle theta2 arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 190 70 A 20 20 0 0 1 210 85" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="215" y="60" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">θ<tspan font-size="12" dy="4">2</tspan></text>
  </g>

  <!-- Internal Reflection B1 -> B2=(400, 185) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="90" x2="400" y2="185" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="405" y="210" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B<tspan font-size="14" dy="4">2</tspan></text>
  </g>

  <!-- Rays from B2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="400" y1="185" x2="500" y2="140" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-107-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="400" y1="185" x2="505" y2="210" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-107-1)"/>

  <!-- Caption 그림 1 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="290" y="228" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">그림 1</text>
  </g>
</svg>
  </div>
</body>
</html>
