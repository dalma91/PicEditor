<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <defs>
    <marker id="arrow-41" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Liquid Texture Pattern -->
    <pattern id="liquid-41" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8CA0B0" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#8CA0B0" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ================= PANEL 1: 그림 1 ================= -->
  <!-- Left Vessel: width 110 (x: 75..185), top at y=55, bottom chamber floor at y=205 -->
  <!-- Right Vessel: width 65 (x: 275..340), top open at y=55, bottom chamber floor at y=205 -->
  <!-- Connecting tube: x: 120..295, y: 205..255 -->

  <!-- Liquid Path (U-tube fill) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" 
        d="M 75 162 L 185 162 L 185 205 L 140 205 L 140 235 L 295 235 L 295 205 L 275 205 L 275 125 L 340 125 L 340 205 L 320 205 L 320 255 L 115 255 L 115 205 L 75 205 Z" 
        fill="url(#liquid-41)" stroke="none"/>

  <!-- U-tube Container Outlines -->
  <!-- Left vessel walls -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="55" x2="185" y2="55" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="55" x2="75" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="55" x2="185" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="205" x2="115" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="140" y1="205" x2="185" y2="205" stroke="#000000" stroke-width="2.5"/>

  <!-- Connecting pipe walls -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="115" y1="205" x2="115" y2="255" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="140" y1="205" x2="140" y2="235" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="115" y1="255" x2="320" y2="255" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="140" y1="235" x2="295" y2="235" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="295" y1="205" x2="295" y2="235" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="320" y1="205" x2="320" y2="255" stroke="#000000" stroke-width="2.5"/>

  <!-- Right vessel walls (open top) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="275" y1="55" x2="275" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="340" y1="55" x2="340" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="275" y1="205" x2="295" y2="205" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="320" y1="205" x2="340" y2="205" stroke="#000000" stroke-width="2.5"/>

  <!-- Piston on left liquid surface: black bar at y=150..162 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="76" y="150" width="108" height="12" fill="#000000"/>

  <!-- Heater coil hanging from top plate -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="100" y1="55" x2="100" y2="90" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="160" y1="55" x2="160" y2="90" stroke="#000000" stroke-width="1.8"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 100 90 L 112 90 L 117 80 L 124 100 L 131 80 L 138 100 L 143 90 L 160 90" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Horizontal reference line through left surface: y=162 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="25" y1="162" x2="210" y2="162" stroke="#444444" stroke-width="1.2"/>
  <!-- Axis x pointing downwards from left surface -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="55" y1="162" x2="55" y2="200" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-41)"/>

  <!-- Horizontal reference line through right surface: y=125 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="210" y1="125" x2="390" y2="125" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Axis y pointing upwards from right surface -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="360" y1="125" x2="360" y2="90" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-41)"/>

  <!-- Height difference h between surfaces -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="230" y1="125" x2="230" y2="162" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-41)" marker-end="url(#arrow-41)"/>

  <!-- LABELS Panel 1 -->
  <!-- 히터 -->
  <g class="movable text-wrap" transform="translate(130, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-24" y="-12" width="48" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">히터</text>
  </g>
  <!-- 피스톤 -->
  <g class="movable text-wrap" transform="translate(130, 134) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-28" y="-12" width="56" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">피스톤</text>
  </g>
  <!-- S1 -->
  <g class="movable text-wrap" transform="translate(130, 182) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">S<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <!-- S2 -->
  <g class="movable text-wrap" transform="translate(307, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">S<tspan font-size="14" dy="3">2</tspan></text>
  </g>
  <!-- h -->
  <g class="movable text-wrap" transform="translate(210, 143) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">h</text>
  </g>
  <!-- x -->
  <g class="movable text-wrap" transform="translate(36, 192) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">x</text>
  </g>
  <!-- y -->
  <g class="movable text-wrap" transform="translate(378, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">y</text>
  </g>
  <!-- 그림 1 -->
  <g class="movable text-wrap" transform="translate(205, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-32" y="-12" width="64" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 1</text>
  </g>

  <!-- ================= PANEL 2: 그림 2 ================= -->
  <!-- p-V Graph -->
  <!-- V axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="260" x2="670" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrow-41)"/>
  <!-- p axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="260" x2="460" y2="65" stroke="#000000" stroke-width="2" marker-end="url(#arrow-41)"/>

  <!-- Process line: (505, 205) to (615, 125) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="505" y1="205" x2="615" y2="125" stroke="#000000" stroke-width="2.5"/>

  <!-- Projections -->
  <!-- p1 to 505 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="205" x2="505" y2="205" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- p2 to 615 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="460" y1="125" x2="615" y2="125" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- V1 to 505 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="505" y1="205" x2="505" y2="260" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- V2 to 615 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="615" y1="125" x2="615" y2="260" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- LABELS Panel 2 -->
  <!-- p, V, 0 -->
  <g class="movable text-wrap" transform="translate(440, 72) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">p</text>
  </g>
  <g class="movable text-wrap" transform="translate(675, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">V</text>
  </g>
  <g class="movable text-wrap" transform="translate(445, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">0</text>
  </g>

  <!-- p1, p2 -->
  <g class="movable text-wrap" transform="translate(440, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">p<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(440, 125) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">p<tspan font-size="14" dy="3">2</tspan></text>
  </g>

  <!-- V1, V2 -->
  <g class="movable text-wrap" transform="translate(505, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(615, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">2</tspan></text>
  </g>

  <!-- 그림 2 -->
  <g class="movable text-wrap" transform="translate(560, 310) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-32" y="-12" width="64" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 2</text>
  </g>
</svg>
</body>
</html>
