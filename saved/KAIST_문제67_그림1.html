<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-67-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Ground -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="30" y1="270" x2="520" y2="270" stroke="#000000" stroke-width="2"/>

  <!-- Fixed Frame (x, y) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="270" x2="50" y2="50" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-67-1)"/>
  <g class="movable text-wrap" transform="translate(42, 20)">
    <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">y</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="270" x2="450" y2="270" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-67-1)"/>
  <g class="movable text-wrap" transform="translate(455, 275)">
    <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">x</text>
  </g>

  <!-- Wedge Frame (X, Y) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="120" y1="270" x2="120" y2="40" stroke="#000000" stroke-width="2" marker-end="url(#arrow-67-1)"/>
  <g class="movable text-wrap" transform="translate(112, 10)">
    <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle">Y</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="120" y1="270" x2="510" y2="270" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-67-1)"/>
  <g class="movable text-wrap" transform="translate(520, 260)">
    <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle">X</text>
  </g>

  <!-- Triangular Wedge (질량 M, 각도 theta) -->
  <!-- Vertices: (120, 100), (120, 270), (380, 270) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="120,100 120,270 380,270" fill="#f8fafc" stroke="#000000" stroke-width="3"/>
  <g class="movable text-wrap" transform="translate(210, 195)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">M</text>
  </g>

  <!-- Incline Angle theta -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 340 270 A 40 40 0 0 1 350 250" fill="none" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(325, 245)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <!-- External Force F -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="70" y1="210" x2="115" y2="210" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-67-1)"/>
  <g class="movable text-wrap" transform="translate(85, 180)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">F</text>
  </g>

  <!-- String & Block P (질량 m) -->
  <!-- Top vertex is (120, 100), Block P at (195, 149) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="120" y1="95" x2="195" y2="144" stroke="#000000" stroke-width="1.8"/>
  <rect class="movable" transform="translate(195,149) rotate(33.2) translate(-10,-14)"
        x="0" y="0" width="20" height="14" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(200, 115)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="19">P <tspan font-style="italic">m</tspan></text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(260, 315)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>
</svg>
</body>
</html>
