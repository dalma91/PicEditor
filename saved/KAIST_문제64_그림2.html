<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-64-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Orbit (dashed circle of radius R=130) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="170" cy="160" r="130" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Sun at center -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="170" cy="160" r="7" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(100, 135)">
    <text class="text-el" x="20" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">태양</text>
    <text class="text-el" x="20" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="15">질량 <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan></text>
  </g>

  <!-- Distance R arrow from Sun to Sail -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="177" y1="160" x2="295" y2="160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-64-2)"/>
  <g class="movable text-wrap" transform="translate(230, 168)">
    <rect class="text-bg-rect" x="0" y="0" width="45" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="22" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15">거리 <tspan font-family="Times New Roman, serif" font-style="italic">R</tspan></text>
  </g>

  <!-- Solar Sail (우주 요트) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="298" y="138" width="8" height="44" fill="#cbd5e1" stroke="#000000" stroke-width="1.5"/>

  <!-- Leader line to Sail -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="335" y1="120" x2="306" y2="148" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(325, 75)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">우주 요트</text>
    <text class="text-el" x="0" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="15">질량 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan></text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(250, 335)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2</text>
  </g>
</svg>
</body>
</html>
