<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.094.3.파동_그림-2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="100%">
  <defs>
    <marker id="arrow-114-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="plate-pat-114" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#cbd5e1"/>
      <circle cx="3" cy="3" r="0.75" fill="#475569"/>
    </pattern>
  </defs>

  <!-- Incident Ray b -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="70" y1="110" x2="190" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow-114-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="45" y="116" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">광 b</text>
  </g>

  <!-- Plate 1 (tilted 45 deg right) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="275,85 245,55 145,155 175,185"
           fill="url(#plate-pat-114)" stroke="#000000" stroke-width="2"/>
  <!-- Thickness d on Plate 1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="245" y1="55" x2="275" y2="85" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-114-2)" marker-end="url(#arrow-114-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="250" y="60" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="258" y="76" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">d</text>
  </g>

  <!-- Points P and Q -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="190" cy="110" r="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="195" y="98" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">P</text>
  </g>

  <!-- Angle theta arc at P -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 160 110 A 30 30 0 0 1 170 88" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="150" y="98" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">θ</text>
  </g>

  <!-- Ray PQ inside plate 1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="110" x2="245" y2="135" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="215" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">r</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="250" y="155" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">Q</text>
  </g>

  <!-- Horizontal Ray between Q and R -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="245" y1="135" x2="445" y2="135" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="330" y1="135" x2="360" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#arrow-114-2)"/>

  <!-- Original axis dashed line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="110" x2="550" y2="110" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Plate 2 (tilted 45 deg left) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="380,85 410,55 510,155 480,185"
           fill="url(#plate-pat-114)" stroke="#000000" stroke-width="2"/>
  <!-- Thickness d on Plate 2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="380" y1="85" x2="410" y2="55" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-114-2)" marker-end="url(#arrow-114-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="390" y="60" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="398" y="76" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">d</text>
  </g>

  <!-- Points R and S -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="435" y="155" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">R</text>
  </g>
  <!-- Ray RS inside plate 2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="445" y1="135" x2="500" y2="110" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="475" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">r</text>
  </g>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="500" cy="110" r="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="500" y="98" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">S</text>
  </g>

  <!-- Exit Ray along original line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="500" y1="110" x2="560" y2="110" stroke="#000000" stroke-width="2"/>

  <!-- Angle theta arc at S -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 525 110 A 25 25 0 0 0 515 88" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="535" y="98" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">θ</text>
  </g>

  <!-- Caption 그림 2 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="290" y="245" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">그림 2</text>
  </g>
</svg>
  </div>
</body>
</html>
