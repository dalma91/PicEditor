<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.032.2.전자기_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 954 654" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1.5 L 0 5 L 9 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 자기장 스티플 패턴 -->
    <pattern id="stipple-bg" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.0" fill="#888888"/>
      <circle cx="9" cy="3" r="1.0" fill="#888888"/>
      <circle cx="6" cy="6" r="1.0" fill="#888888"/>
      <circle cx="3" cy="9" r="1.0" fill="#888888"/>
      <circle cx="9" cy="9" r="1.0" fill="#888888"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: start; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 자기장 영역 (회색 점패턴 사각형) -->
    <rect class="movable" x="35" y="25" width="884" height="475" fill="url(#stipple-bg)" stroke="#888888" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 지면 수직 입사 자기장 기호 (원 안의 X) 및 기호 B -->
    <circle class="movable" cx="640" cy="150" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="617" y1="127" x2="663" y2="173" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="617" y1="173" x2="663" y2="127" stroke="#000000" stroke-width="3.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 도체봉 XY (원통형 도체 막대) -->
    <!-- 밑면 타원 (바깥 테두리) -->
    <ellipse class="movable" cx="365" cy="475" rx="30" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 기둥 사각형 몸통 -->
    <rect class="movable" x="335" y="108" width="60" height="367" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 아랫면 둥근 호 가림 보정 -->
    <path class="movable" d="M 335 475 A 30 12 0 0 0 395 475" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 윗면 타원 -->
    <ellipse class="movable" cx="365" cy="108" rx="30" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 도체봉 내부 자유 전자 6개 (음전하 원 및 마이너스 기호) -->
    <!-- 전자 1 -->
    <circle class="movable" cx="365" cy="170" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="170" x2="375" y2="170" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전자 2 -->
    <circle class="movable" cx="365" cy="225" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="225" x2="375" y2="225" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전자 3 -->
    <circle class="movable" cx="365" cy="280" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="280" x2="375" y2="280" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전자 4 -->
    <circle class="movable" cx="365" cy="335" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="335" x2="375" y2="335" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전자 5 -->
    <circle class="movable" cx="365" cy="390" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="390" x2="375" y2="390" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전자 6 -->
    <circle class="movable" cx="365" cy="445" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="355" y1="445" x2="375" y2="445" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 속도 벡터 v 화살표 및 직각 표시 -->
    <line class="movable" x1="395" y1="285" x2="550" y2="285" stroke="#000000" stroke-width="5.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polyline class="movable" points="395,320 435,320 435,285" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 치수 보조선 및 길이 d 양방향 화살표 -->
    <line class="movable" x1="335" y1="108" x2="250" y2="108" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="335" y1="475" x2="250" y2="475" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="275" y1="112" x2="275" y2="471" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 단자 X -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="350" y="55" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="365" y="70">X</text>
    </g>

    <!-- 단자 Y -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="350" y="515" width="30" height="30" fill="#FFFFFF" stroke="none"/>
      <text class="roman" x="365" y="530">Y</text>
    </g>

    <!-- 치수 라벨 d -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="250" y="272" width="28" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="264" y="291">d</text>
    </g>

    <!-- 자기장 라벨 B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="690" y="130" width="35" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="708" y="150">B</text>
    </g>

    <!-- 한국어 라벨 '자유 전자' (원본 自由電子 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="400" y="200" width="130" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="405" y="220">자유 전자</text>
    </g>

    <!-- 속도 기호 v -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="495" y="315" width="30" height="38" fill="#FFFFFF" stroke="none"/>
      <text class="math" x="510" y="334">v</text>
    </g>

    <!-- 캡션 '그림 1' (원본 図 1 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="420" y="570" width="114" height="42" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="477" y="591">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
