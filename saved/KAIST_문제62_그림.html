<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="100%" height="100%">
  <defs>
    <marker id="arrow-62" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="hatch-62" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <pattern id="sound-layer-62" width="6" height="6" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#64748b"/>
    </pattern>
  </defs>

  <!-- Ground (지표) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="30" y1="430" x2="490" y2="430" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="30" y="430" width="460" height="15" fill="url(#hatch-62)"/>
  <g class="movable text-wrap" transform="translate(240, 400)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">지표</text>
  </g>

  <!-- Vertical Axis: 고도 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="70" y1="430" x2="70" y2="355" stroke="#000000" stroke-width="1.5"/>
  <!-- Axis break symbol (≈) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 63 355 C 67 357, 73 353, 77 355" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 63 350 C 67 352, 73 348, 77 350" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="70" y1="345" x2="70" y2="45" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-62)"/>
  <g class="movable text-wrap" transform="translate(35, 175)">
    <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">고</text>
    <text class="text-el" x="12" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">도</text>
  </g>

  <!-- Acoustic Reflection Layers (4 horizontal stippled bands) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="150" y="85" width="330" height="10" fill="url(#sound-layer-62)" stroke="#94a3b8" stroke-width="0.8"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="150" y="145" width="330" height="10" fill="url(#sound-layer-62)" stroke="#94a3b8" stroke-width="0.8"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="150" y="205" width="330" height="10" fill="url(#sound-layer-62)" stroke="#94a3b8" stroke-width="0.8"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="150" y="265" width="330" height="10" fill="url(#sound-layer-62)" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Wavelength dimension (음파의 파장) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="140" y1="150" x2="140" y2="210" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-62)" marker-end="url(#arrow-62)"/>
  <g class="movable text-wrap" transform="translate(85, 160)">
    <text class="text-el" x="0" y="14" font-family="KoPubWorld Dotum, sans-serif" font-size="13">음파의</text>
    <text class="text-el" x="0" y="30" font-family="KoPubWorld Dotum, sans-serif" font-size="13">파장</text>
  </g>

  <!-- Acoustic Pulse Arrow (발사 음파) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 180 280 V 160 H 170 L 185 80 L 200 160 H 190 V 280 Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(185, 50)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">발사 음파</text>
  </g>

  <!-- Transmitted Radio Wave (발사 전파) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="310" y1="300" x2="310" y2="45" stroke="#000000" stroke-width="2" marker-end="url(#arrow-62)"/>
  <g class="movable text-wrap" transform="translate(380, 50)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">발사 전파</text>
  </g>

  <!-- Reflected Radio Waves (반사 전파) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="345" y1="95" x2="345" y2="300" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-62)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="365" y1="155" x2="365" y2="300" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-62)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="385" y1="215" x2="385" y2="300" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-62)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="405" y1="275" x2="405" y2="300" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-62)"/>
  <g class="movable text-wrap" transform="translate(375, 315)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">반사 전파</text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(260, 480)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>
</svg>
</body>
</html>
