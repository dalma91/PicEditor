<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 550" width="100%" height="100%">
  <defs>
    <marker id="arrow-60" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="hatch-60" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Ceiling (천장) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="40" y1="70" x2="420" y2="70" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="40" y="55" width="80" height="15" fill="url(#hatch-60)"/>
  <g class="movable text-wrap" transform="translate(130, 45)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">천장</text>
  </g>

  <!-- Point O on ceiling -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="240" cy="70" r="3.5" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(230, 42)">
    <text class="text-el" x="10" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16"><tspan font-family="Times New Roman, serif" font-style="italic">O</tspan>점</text>
  </g>

  <!-- Ball B (소구 B) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="240" cy="85" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(255, 78)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">소구 <tspan font-family="Times New Roman, serif" font-style="italic">B</tspan></text>
  </g>

  <!-- Rubber Band (고무줄) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="240" y1="93" x2="240" y2="295" stroke="#000000" stroke-width="2.5"/>

  <!-- Ball A (소구 A) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="240" cy="303" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(255, 295)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">소구 <tspan font-family="Times New Roman, serif" font-style="italic">A</tspan></text>
  </g>

  <!-- Natural length l arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 235 90 C 210 135, 210 230, 235 275" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(200, 175)">
    <rect class="text-bg-rect" x="0" y="0" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="9" y="17" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">l</text>
  </g>

  <!-- Extension l/12 arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 235 275 C 220 280, 220 290, 235 295" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(180, 275)">
    <rect class="text-bg-rect" x="0" y="0" width="35" height="24" fill="#FFFFFF"/>
    <text class="text-el" x="17" y="18" font-family="Times New Roman, serif" font-size="17" text-anchor="middle"><tspan font-style="italic">l</tspan> / 12</text>
  </g>

  <!-- Floor (바닥) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="40" y1="460" x2="420" y2="460" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="40" y="460" width="80" height="15" fill="url(#hatch-60)"/>
  <g class="movable text-wrap" transform="translate(125, 470)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">바닥</text>
  </g>

  <!-- Dimension 2l between ceiling and floor -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="115" y1="70" x2="115" y2="460" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-60)" marker-end="url(#arrow-60)"/>
  <g class="movable text-wrap" transform="translate(75, 255)">
    <rect class="text-bg-rect" x="0" y="0" width="28" height="24" fill="#FFFFFF"/>
    <text class="text-el" x="14" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle">2<tspan font-style="italic">l</tspan></text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(230, 520)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>
</svg>
</body>
</html>
