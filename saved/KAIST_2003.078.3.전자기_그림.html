<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.078.3.전자기_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1314 690" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 28px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wire { stroke: #000000; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate { stroke: #000000; stroke-width: 4.5; fill: none; stroke-linecap: square; }
    .pointer-line { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 좌측 배터리 전지 -->
    <!-- 위쪽 도선 -->
    <line class="movable wire" x1="155" y1="190" x2="155" y2="350" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 긴 판 (+) -->
    <line class="movable" x1="120" y1="350" x2="190" y2="350" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전지 짧고 굵은 판 (-) -->
    <line class="movable" x1="135" y1="375" x2="175" y2="375" stroke="#000000" stroke-width="5.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 아래쪽 도선 -->
    <line class="movable wire" x1="155" y1="375" x2="155" y2="580" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전지 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="80" y="360">전지</text>
    </g>

    <!-- 2. 상단 좌측 도선 및 저항 R1 -->
    <line class="movable wire" x1="155" y1="190" x2="270" y2="190" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 저항 R1 지그재그 -->
    <polyline class="movable" points="270,190 280,180 295,200 310,180 325,200 340,180 355,200 370,180 380,190" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="380" y1="190" x2="540" y2="190" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- R1 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="325" y="145">R<tspan class="sub" dy="6">1</tspan></text>
    </g>

    <!-- 3. 스위치 (A, B, 중립 피벗) -->
    <!-- 접점 A 단자 -->
    <circle class="movable" cx="548" cy="190" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="535" y="235" transform="translate(0,0) scale(1,1) rotate(0)">A</text>

    <!-- 접점 B 단자 -->
    <circle class="movable" cx="660" cy="190" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="675" y="235" transform="translate(0,0) scale(1,1) rotate(0)">B</text>

    <!-- 피벗 단자 -->
    <circle class="movable" cx="604" cy="245" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 스위치 레버 (중립 수직) -->
    <line class="movable" x1="604" y1="238" x2="604" y2="155" stroke="#000000" stroke-width="3.5" stroke-linecap="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 스위치 레이블 및 지시 화살표 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="720" y="75">스위치</text>
    </g>
    <line class="movable pointer-line" x1="680" y1="95" x2="625" y2="145" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 상단 우측 도선 및 저항 R2 -->
    <line class="movable wire" x1="667" y1="190" x2="790" y2="190" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 저항 R2 지그재그 -->
    <polyline class="movable" points="790,190 800,180 815,200 830,180 845,200 860,180 875,200 890,180 900,190" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wire" x1="900" y1="190" x2="1060" y2="190" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- R2 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="845" y="145">R<tspan class="sub" dy="6">2</tspan></text>
    </g>

    <!-- 5. 중앙 축전기 C1 및 유전체 -->
    <!-- 피벗에서 C1 상단 극판까지 도선 -->
    <line class="movable wire" x1="604" y1="252" x2="604" y2="365" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C1 상단 극판 -->
    <line class="movable plate" x1="550" y1="365" x2="658" y2="365" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C1 하단 극판 -->
    <line class="movable plate" x1="550" y1="415" x2="658" y2="415" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C1 하단 극판에서 바닥선까지 도선 -->
    <line class="movable wire" x1="604" y1="415" x2="604" y2="580" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- C1 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="700" y="390">C<tspan class="sub" dy="6">1</tspan></text>
    </g>

    <!-- 유전체 (회색 직사각형) 및 삽입 화살표 -->
    <rect class="movable" x="390" y="365" width="105" height="50" fill="#B8B8B8" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="505" y1="390" x2="538" y2="390" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 유전체 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="445" y="455">유전체</text>
    </g>

    <!-- 6. 우측 실린더 축전기 C2 (피스톤 + 기체) -->
    <!-- 상단 도선에서 피스톤 연결선 -->
    <line class="movable wire" x1="1060" y1="190" x2="1060" y2="330" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 피스톤 (실린더 내부 슬래브) -->
    <rect class="movable" x="1010" y="330" width="100" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 실린더 본체 (U자형 용기) -->
    <!-- 좌측 벽면 -->
    <line class="movable" x1="1010" y1="280" x2="1010" y2="440" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 바닥 극판 -->
    <line class="movable" x1="1010" y1="440" x2="1110" y2="440" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 벽면 -->
    <line class="movable" x1="1110" y1="280" x2="1110" y2="440" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 실린더 바닥에서 메인 바닥선까지 도선 -->
    <line class="movable wire" x1="1060" y1="440" x2="1060" y2="580" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- C2 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="930" y="390">C<tspan class="sub" dy="6">2</tspan></text>
    </g>

    <!-- 기체 레이블 및 지시선 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="935" y="495">기체</text>
    </g>
    <line class="movable pointer-line" x1="975" y1="485" x2="1035" y2="415" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 피스톤 (질량 M) 레이블 및 지시선 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="1225" y="325">피스톤</text>
      <text class="korean" x="1195" y="365">(질량</text>
      <text class="math" x="1265" y="365">M</text>
      <text class="korean" x="1295" y="365">)</text>
    </g>
    <line class="movable pointer-line" x1="1145" y1="340" x2="1095" y2="345" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 실린더 레이블 및 지시선 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="1180" y="525">실린더</text>
    </g>
    <line class="movable pointer-line" x1="1135" y1="515" x2="1085" y2="445" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 7. 하단 메인 도선 -->
    <line class="movable wire" x1="155" y1="580" x2="1060" y2="580" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 8. 하단 캡션: 그림 3 - 1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="510" y="625" width="200" height="48" fill="#FFFFFF"/>
      <text class="korean-bold" x="610" y="650">그림 3 - 1</text>
    </g>
  </g>
</svg>
</body>
</html>
