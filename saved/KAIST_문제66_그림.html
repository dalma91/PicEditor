<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-66" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ==================== LEFT: 그림 1 ==================== -->
  <g transform="translate(20, 0)">
    <!-- Device 1: Electron Gun (장치 1) -->
    <!-- Filament & Battery -->
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 25 180 H 45 L 55 165 L 45 150 H 25" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="25" y1="160" x2="25" y2="170" stroke="#000000" stroke-width="2"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="22" y1="163" x2="28" y2="163" stroke="#000000" stroke-width="1.5"/>
    <!-- Cathode plate -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="65" y1="140" x2="65" y2="190" stroke="#000000" stroke-width="4"/>
    <!-- Anode slit plate -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="110" y1="130" x2="110" y2="160" stroke="#000000" stroke-width="4"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="110" y1="170" x2="110" y2="200" stroke="#000000" stroke-width="4"/>
    <!-- Accelerating voltage V battery -->
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 65 190 V 225 H 75" fill="none" stroke="#000000" stroke-width="1.2"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="75" y1="215" x2="75" y2="235" stroke="#000000" stroke-width="2"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="80" y1="220" x2="80" y2="230" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="215" x2="90" y2="235" stroke="#000000" stroke-width="2"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="95" y1="220" x2="95" y2="230" stroke="#000000" stroke-width="3"/>
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 95 225 H 110 V 200" fill="none" stroke="#000000" stroke-width="1.2"/>
    <g class="movable text-wrap" transform="translate(80, 240)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">V</text>
    </g>
    <g class="movable text-wrap" transform="translate(85, 345)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">장치 1</text>
    </g>

    <!-- Device 2: Velocity Selector (장치 2) -->
    <!-- Parallel plates -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="160" y1="120" x2="250" y2="120" stroke="#000000" stroke-width="5"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="160" y1="210" x2="250" y2="210" stroke="#000000" stroke-width="5"/>
    <!-- Electric Field E arrows pointing up -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="210" y1="205" x2="210" y2="125" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-66)"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="245" y1="205" x2="245" y2="125" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(252, 130)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">E</text>
    </g>
    <!-- Magnetic Field B symbol (out of page: circle with dot) -->
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            cx="175" cy="140" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            cx="175" cy="140" r="2.5" fill="#000000"/>
    <g class="movable text-wrap" transform="translate(185, 128)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">B</text>
    </g>
    <g class="movable text-wrap" transform="translate(205, 345)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">장치 2</text>
    </g>

    <!-- Shield Plate (차폐판) -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="330" y1="80" x2="330" y2="160" stroke="#000000" stroke-width="6"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="330" y1="170" x2="330" y2="250" stroke="#000000" stroke-width="6"/>
    <g class="movable text-wrap" transform="translate(330, 45)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">차폐판</text>
    </g>

    <!-- Horizontal Electron Beam Path -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="65" y1="165" x2="450" y2="165" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-66)"/>

    <!-- Device 3: Diffraction Crystal & Detector (장치 3) -->
    <!-- Crystal (결정) at (450, 165) angled by theta -->
    <rect class="movable" transform="translate(450,165) rotate(45) translate(-12,-6)"
          x="0" y="0" width="24" height="12" fill="#000000"/>
    <g class="movable text-wrap" transform="translate(470, 185)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">결정</text>
    </g>

    <!-- Reflected Beam at angle theta -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="450" y1="165" x2="475" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>

    <!-- Semi-circular Detector Array -->
    <rect class="movable" transform="translate(427.4,37.0) rotate(-10.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(403.4,43.6) rotate(-21.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(381.1,54.8) rotate(-32.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(361.3,69.9) rotate(-43.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(344.8,88.6) rotate(-54.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(332.2,110.1) rotate(-65.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(323.9,133.6) rotate(-76.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(320.2,158.2) rotate(-87.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(321.3,183.1) rotate(-98.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(327.1,207.3) rotate(-109.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(337.4,230.0) rotate(-120.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(351.9,250.3) rotate(-131.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(370.0,267.4) rotate(-142.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(391.0,280.8) rotate(-153.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(414.2,290.0) rotate(-164.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <rect class="movable" transform="translate(438.7,294.5) rotate(-175.0)" x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <g class="movable text-wrap" transform="translate(435, 45)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">검출기</text>
    </g>
    <g class="movable text-wrap" transform="translate(445, 345)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">장치 3</text>
    </g>

    <!-- Angle theta arcs at crystal -->
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 430 165 A 25 25 0 0 1 437 178" fill="none" stroke="#000000" stroke-width="1.2"
          marker-start="url(#arrow-66)" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(420, 175)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="17" font-style="italic" text-anchor="middle">θ</text>
    </g>
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 460 125 A 45 45 0 0 1 475 140" fill="none" stroke="#000000" stroke-width="1.2"
          marker-start="url(#arrow-66)" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(470, 110)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="17" font-style="italic" text-anchor="middle">θ</text>
    </g>

    <!-- Coordinate Axes: x, z, out-of-page y -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="580" y1="165" x2="650" y2="165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(655, 155)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">x</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="580" y1="165" x2="580" y2="90" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(572, 70)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">z</text>
    </g>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            cx="580" cy="165" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="575" y1="160" x2="585" y2="170" stroke="#000000" stroke-width="1.2"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="575" y1="170" x2="585" y2="160" stroke="#000000" stroke-width="1.2"/>
    <g class="movable text-wrap" transform="translate(572, 178)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">y</text>
    </g>

    <!-- Caption -->
    <g class="movable text-wrap" transform="translate(350, 395)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
    </g>
  </g>

  <!-- ==================== RIGHT: 그림 2 ==================== -->
  <g transform="translate(750, 0)">
    <!-- 3 Lattice Planes -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="80" y1="160" x2="480" y2="160" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4,2,4"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="80" y1="210" x2="480" y2="210" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4,2,4"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="80" y1="260" x2="480" y2="260" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4,2,4"/>

    <!-- Atoms on Planes -->
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="100" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="160" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="220" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="280" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="340" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="400" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="460" cy="160" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="100" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="160" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="220" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="280" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="340" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="400" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="460" cy="210" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="100" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="160" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="220" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="280" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="340" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="400" cy="260" r="3.5" fill="#000000"/>
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="460" cy="260" r="3.5" fill="#000000"/>
    <!-- Incident Beam 1 to (280, 160) -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="65" x2="280" y2="160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>
    <!-- Reflected Beam 1 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="280" y1="160" x2="470" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>

    <!-- Incident Beam 2 to (280, 210) -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="40" y1="90" x2="280" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>
    <!-- Reflected Beam 2 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="280" y1="210" x2="520" y2="90" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-66)"/>

    <!-- Path Difference Construction -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="280" y1="160" x2="260" y2="200" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="280" y1="160" x2="300" y2="200" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Angle theta arcs -->
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 235 210 A 45 45 0 0 1 245 192" fill="none" stroke="#000000" stroke-width="1.2"/>
    <g class="movable text-wrap" transform="translate(215, 195)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
    </g>
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 325 210 A 45 45 0 0 0 315 192" fill="none" stroke="#000000" stroke-width="1.2"/>
    <g class="movable text-wrap" transform="translate(335, 195)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
    </g>

    <!-- Lattice Spacing d dimensions -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="490" y1="160" x2="490" y2="210" stroke="#000000" stroke-width="1.2"
          marker-start="url(#arrow-66)" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(505, 175)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">d</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="490" y1="210" x2="490" y2="260" stroke="#000000" stroke-width="1.2"
          marker-start="url(#arrow-66)" marker-end="url(#arrow-66)"/>
    <g class="movable text-wrap" transform="translate(505, 225)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">d</text>
    </g>

    <!-- Caption -->
    <g class="movable text-wrap" transform="translate(280, 395)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
