<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0041_2003.182.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 800 500" width="800" height="500" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 바닥선 (원점 O에서 시작) -->
    <line class="movable" x1="40" y1="420" x2="760" y2="420" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- y축 (40, 420 -> 40, 60) -->
    <line class="movable" x1="40" y1="420" x2="40" y2="60" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 대차 (바퀴 2개) -->
    <circle class="movable" cx="370" cy="395" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="605" cy="395" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 대차 본체: 하부 직사각형(320~665, 290~375) + 상부 빗면(320, 160 -> 665, 290) -->
    <polygon class="movable" points="320,160 665,290 665,375 320,375" fill="none" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 빗면 상단 경계선 굵게 (A -> B) -->
    <line class="movable" x1="320" y1="160" x2="665" y2="290" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- B 수평 기준 점선 -->
    <line class="movable" x1="460" y1="290" x2="665" y2="290" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 각도 θ 호 -->
    <path class="movable" d="M 540,242 A 80 80 0 0 1 530,290" fill="none" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 질점 A (370, 178 경사면 위 작은 구) -->
    <circle class="movable" cx="370" cy="173" r="8" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 치수선 L (A에서 B까지 경사면 거리) -->
    <line class="movable" x1="370" y1="173" x2="400" y2="100" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="665" y1="290" x2="700" y2="200" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="400" y1="110" x2="695" y2="220" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 치수선 h (지면 ~ B 높이) -->
    <line class="movable" x1="490" y1="290" x2="490" y2="420" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 대차 이동 속도 화살표 U (좌향 블록 화살표) -->
    <polygon class="movable" points="215,280 235,270 235,277 285,277 285,283 235,283 235,290" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="30" y="45" font-family="'Times New Roman', serif" font-size="32" font-style="italic" font-weight="normal" text-anchor="start">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="8" y="435" font-family="'Times New Roman', serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="245" y="250" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="bold" text-anchor="start">U</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="355" y="215" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="625" y="320" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="505" y="275" font-family="'Times New Roman', serif" font-size="24" font-style="italic" font-weight="normal" text-anchor="start">θ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="550" y="150" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="460" y="360" font-family="'Times New Roman', serif" font-size="30" font-style="italic" font-weight="normal" text-anchor="start">h</text></g>
  </g>
</svg>
</body>
</html>
