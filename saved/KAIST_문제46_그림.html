<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-46" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Coordinate x-axis along glass column -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="160" y1="275" x2="160" y2="40" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-46)"/>

  <!-- Glass Column (유리): x=160..185, y=75..260 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="160" y="75" width="25" height="185" fill="#E8F4F8" stroke="#000000" stroke-width="2"/>

  <!-- Transducer (진동자): black block on top x=160..185, y=60..75 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="160" y="60" width="25" height="15" fill="#000000"/>

  <!-- Acoustic wave opposing arrows inside glass column -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="172" y1="95" x2="172" y2="135" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-46)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="172" y1="235" x2="172" y2="195" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-46)"/>

  <!-- Incident Monochromatic Light (단색광): from (25, 168) to (160, 168) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="25" y1="168" x2="155" y2="168" stroke="#000000" stroke-width="2" marker-end="url(#arrow-46)"/>

  <!-- Screen (스크린): vertical line at x=500, from y=45 to y=290 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="500" y1="45" x2="500" y2="290" stroke="#000000" stroke-width="2.5"/>

  <!-- Diffracted Light Beams from exit point (185, 168) to Screen -->
  <!-- m = 2: to (500, 75) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="168" x2="496" y2="76" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-46)"/>
  <!-- m = 1: to (500, 122) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="168" x2="496" y2="123" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-46)"/>
  <!-- m = 0: horizontal to (500, 168) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="168" x2="496" y2="168" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-46)"/>
  <!-- m = -1: to (500, 214) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="168" x2="496" y2="213" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-46)"/>
  <!-- m = -2: to (500, 260) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="185" y1="168" x2="496" y2="259" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-46)"/>

  <!-- Angle theta1 and theta2 arcs -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 345 168 A 160 160 0 0 0 341 144" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 390 168 A 205 205 0 0 0 376 112" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Distance L dimension line at bottom: x=160 to x=500 at y=285 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="163" y1="285" x2="497" y2="285" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-46)" marker-end="url(#arrow-46)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="160" y1="260" x2="160" y2="295" stroke="#555555" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="500" y1="260" x2="500" y2="295" stroke="#555555" stroke-width="1"/>

  <!-- Pointer line to Transducer (진동자) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="220" y1="52" x2="185" y2="68" stroke="#000000" stroke-width="1.2"/>
  <!-- Pointer line to Glass (유리) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="225" x2="160" y2="235" stroke="#000000" stroke-width="1.2"/>

  <!-- LABELS -->
  <!-- x, l, 0 -->
  <g class="movable text-wrap" transform="translate(138, 48) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>
  <g class="movable text-wrap" transform="translate(142, 75) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">l</text>
  </g>
  <g class="movable text-wrap" transform="translate(142, 260) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">0</text>
  </g>

  <!-- 진동자, 음파, 단색광, 유리, 스크린 -->
  <g class="movable text-wrap" transform="translate(245, 45) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">진동자</text>
  </g>
  <g class="movable text-wrap" transform="translate(208, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">음파</text>
  </g>
  <g class="movable text-wrap" transform="translate(90, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">단색광</text>
  </g>
  <g class="movable text-wrap" transform="translate(85, 225) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-12" width="40" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">유리</text>
  </g>
  <g class="movable text-wrap" transform="translate(460, 315) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#000000">스크린</text>
  </g>

  <!-- theta1, theta2 -->
  <g class="movable text-wrap" transform="translate(365, 155) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ<tspan font-size="13" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(420, 120) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ<tspan font-size="13" dy="3">2</tspan></text>
  </g>

  <!-- L -->
  <g class="movable text-wrap" transform="translate(330, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">L</text>
  </g>

  <!-- Screen Orders m: 2, 1, 0, -1, -2 -->
  <g class="movable text-wrap" transform="translate(525, 52) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">m</text>
  </g>
  <g class="movable text-wrap" transform="translate(525, 75) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">2</text>
  </g>
  <g class="movable text-wrap" transform="translate(525, 122) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">1</text>
  </g>
  <g class="movable text-wrap" transform="translate(525, 168) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">0</text>
  </g>
  <g class="movable text-wrap" transform="translate(525, 214) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">-1</text>
  </g>
  <g class="movable text-wrap" transform="translate(525, 260) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">-2</text>
  </g>

  <!-- 그림 2-2 -->
  <g class="movable text-wrap" transform="translate(290, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 2-2</text>
  </g>
</svg>
</body>
</html>
