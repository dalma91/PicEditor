<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.094.3.파동_그림-1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-114-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Medium Box -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="15" y="20" width="650" height="295" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="115" y="48" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">매질 (굴절률 <tspan font-family="'Times New Roman', serif" font-style="italic">n</tspan><tspan font-size="12" dy="4">0</tspan>)</text>
  </g>

  <!-- Light Source S -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="55" y="215" width="55" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">

  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="110" y1="230" x2="200" y2="230" stroke="#000000" stroke-width="1.8"/>

  <!-- Beam Splitter H1 at (200, 230) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="250" x2="220" y2="210" stroke="#000000" stroke-width="3.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="200" y="275" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">H<tspan font-size="14" dy="4">1</tspan></text>
    <text class="text-el" x="200" y="300" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">반투명 거울</text>
  </g>

  <!-- Path a (straight to M1): Dotted line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="230" x2="440" y2="230" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="240" y1="238" x2="275" y2="238" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-114-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="385" y1="238" x2="420" y2="238" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-114-1)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="260" y="265" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">광 a</text>

        x1="420" y1="250" x2="460" y2="210" stroke="#000000" stroke-width="3.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="465" y="275" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">M<tspan font-size="14" dy="4">1</tspan></text>
    <text class="text-el" x="465" y="300" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">평면거울</text>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="440" y1="230" x2="440" y2="110" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"

  <!-- Path b (up to M2, then through plates): Solid line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="230" x2="200" y2="110" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="190" y1="185" x2="190" y2="150" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-114-1)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="160" y="175" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">광 b</text>
  </g>

  <!-- Mirror M2 at (200, 110) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="130" x2="220" y2="90" stroke="#000000" stroke-width="3.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="175" y="85" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">M<tspan font-size="14" dy="4">2</tspan></text>
    <text class="text-el" x="175" y="60" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">평면거울</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="200" y1="110" x2="440" y2="110" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="230" y1="110" x2="255" y2="110" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-114-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="385" y1="110" x2="410" y2="110" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-114-1)"/>

  <!-- Two Transparent Plates of thickness d on path b -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="280" y="90" width="12" height="40" fill="#cbd5e1" stroke="#000000" stroke-width="1.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="345" y="90" width="12" height="40" fill="#cbd5e1" stroke="#000000" stroke-width="1.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="385" y="55" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">투명판 (굴절률 <tspan font-family="'Times New Roman', serif" font-style="italic">n</tspan>)</text>
  </g>
  <!-- Pointer lines to plates -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="325" y1="65" x2="286" y2="90" stroke="#000000" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="325" y1="65" x2="351" y2="90" stroke="#000000" stroke-width="1"/>

  <!-- Thickness d markers -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="286" y="150" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">d</text>
    <text class="text-el" x="351" y="150" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="middle">d</text>
  </g>

  <!-- Beam Splitter H2 at (440, 110) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="420" y1="130" x2="460" y2="90" stroke="#000000" stroke-width="3.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="435" y="75" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">H<tspan font-size="14" dy="4">2</tspan></text>
    <text class="text-el" x="435" y="52" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">반투명 거울</text>
  </g>

  <!-- Output Ray to Photodetector D -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="440" y1="110" x2="550" y2="110" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="485" y1="102" x2="515" y2="102" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-114-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="485" y1="118" x2="515" y2="118" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-114-1)"/>

  <!-- Photodetector D -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="550" y="95" width="55" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="575" y="155" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">D 광검출기</text>
  </g>

  <!-- Caption 그림 1 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="340" y="345" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">그림 1</text>
  </g>
</svg>
