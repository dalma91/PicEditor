<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-64-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Parallel Light Rays -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="55" x2="180" y2="55" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="81" x2="180" y2="81" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="107" x2="180" y2="107" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="133" x2="180" y2="133" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="159" x2="180" y2="159" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="185" x2="180" y2="185" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="70" y1="211" x2="180" y2="211" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-64-1)"/>
  <g class="movable text-wrap" transform="translate(35, 125)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">빛</text>
  </g>

  <!-- Mirror (면적 S인 거울) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="250" y="65" width="12" height="140" fill="#cbd5e1" stroke="#000000" stroke-width="1.8"/>

  <!-- Leader line to mirror -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="285" y1="50" x2="262" y2="80" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(255, 25)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15">면적 <tspan font-family="Times New Roman, serif" font-style="italic">S</tspan>인 거울</text>
  </g>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(200, 270)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>
</svg>
</body>
</html>
