<!DOCTYPE html>

    <circle class="movable" cx="20" cy="296" r="14" fill="#888888" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="130" cy="296" r="14" fill="#888888" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
