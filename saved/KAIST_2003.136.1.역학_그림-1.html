<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.136.1.역학_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1320 520" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="axis-arrow-end" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 38px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: normal; font-size: 26px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 38px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .axis-line { stroke: #000000; stroke-width: 2.2; fill: none; }
    .traj-line { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <g class="main-diagram">
    <!-- 1. 직교 좌표축 (수평 거리, 낙하 거리) -->
    <!-- 수평 거리 축 (수평선 우향 화살표) -->
    <line class="movable axis-line" x1="160" y1="65" x2="1030" y2="65" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="1155" y="65">수평 거리</text>
    </g>

    <!-- 낙하 거리 축 (수직선 하향 화살표) -->
    <line class="movable axis-line" x1="160" y1="65" x2="160" y2="340" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="160" y="395">낙하 거리</text>
    </g>

    <!-- 2. 투사 포물선 궤적 (y = c * x^2) -->
    <!-- (160, 65) -> (405, 120) -> (925, 280) -> (1045, 310) -->
    <path class="movable traj-line" d="M 160 65 Q 260 65 405 120 Q 640 195 925 280 L 1045 310" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 시간별 점 및 레이블 -->
    <!-- t = 0 위치 -->
    <circle class="movable" cx="160" cy="65" r="8" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="125" y="30">t</text>
      <text class="roman" x="160" y="30">=</text>
      <text class="roman" x="195" y="30">0</text>
    </g>

    <!-- t = t0 위치 -->
    <circle class="movable" cx="405" cy="120" r="8" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="355" y="175">t</text>
      <text class="roman" x="390" y="175">=</text>
      <text class="math" x="425" y="175">t<tspan class="sub" dy="8">0</tspan></text>
    </g>

    <!-- t = 2t0 위치 -->
    <circle class="movable" cx="925" cy="280" r="8" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="875" y="340">t</text>
      <text class="roman" x="910" y="340">=</text>
      <text class="roman" x="940" y="340">2</text>
      <text class="math" x="965" y="340">t<tspan class="sub" dy="8">0</tspan></text>
    </g>

    <!-- 4. 하단 캡션: 그림 1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="570" y="445" width="180" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="660" y="470">그림 1</text>
    </g>
  </g>
</svg>
</body>
</html>
