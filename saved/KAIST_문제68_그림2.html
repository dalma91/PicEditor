<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="100%">
  <!-- Floor line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="160" x2="500" y2="160" stroke="#000000" stroke-width="2.5"/>

  <!-- Left fixed post -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="75" x2="50" y2="160" stroke="#000000" stroke-width="5"/>

  <!-- Horizontal Spring -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 50 120 H 95
           C 105 100, 110 100, 115 120 C 120 140, 125 140, 130 120
           C 135 100, 140 100, 145 120 C 150 140, 155 140, 160 120
           C 165 100, 170 100, 175 120 C 180 140, 185 140, 190 120
           C 195 100, 200 100, 205 120 C 210 140, 215 140, 220 120
           C 225 100, 230 100, 235 120 C 240 140, 245 140, 250 120
           H 260"
        fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Block A on floor -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="260" y="85" width="165" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <g class="movable text-wrap" transform="translate(265, 90)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="22" text-anchor="middle">A</text>
  </g>

  <!-- Block B stacked on top of Block A -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="300" y="25" width="95" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <g class="movable text-wrap" transform="translate(315, 35)">
    <text class="text-el" x="12" y="18" font-family="Times New Roman, serif" font-size="22" text-anchor="middle">B</text>
  </g>
</svg>
</body>
</html>
