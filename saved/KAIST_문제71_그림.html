<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제71_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <marker id="arrow-71" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="mini-arrow-71" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Coordinate Axes -->
  <!-- z-axis: horizontal through O=(340, 200) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="200" x2="100" y2="200" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="100" y1="200" x2="560" y2="200" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="560" y1="200" x2="650" y2="200" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="650" y1="200" x2="665" y2="200" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="670" y="206" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="start">z</text>
  </g>

  <!-- x-axis: vertical up from O -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="340" y1="340" x2="340" y2="55" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="358" y="55" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">x</text>
  </g>

  <!-- y-axis: oblique down-left (30 deg to horiz => dx=200, dy=140) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="560" y1="60" x2="340" y2="200" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="340" y1="200" x2="150" y2="330" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="140" y="348" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">y</text>
  </g>

  <!-- Origin O -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="355" y="222" font-family="'Times New Roman', serif" font-size="20" text-anchor="start">O</text>
  </g>

  <!-- Left Plate S2 (centered at z = -d => x=100) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="40,115 125,50 125,285 40,350"
           fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="100" cy="200" r="3.5" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="65" y="222" width="115" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="122" y="238" font-family="'Times New Roman', serif" font-size="18" text-anchor="middle">R (0, 0, -<tspan font-style="italic">d</tspan>)</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="80" y="130" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">면 S<tspan font-size="13" dy="4">2</tspan></text>
  </g>

  <!-- Right Plate S1 (centered at z = d => x=580) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="500,115 585,50 585,285 500,350"
           fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="580" cy="200" r="3.5" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="550" y="222" width="115" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="605" y="238" font-family="'Times New Roman', serif" font-size="18" text-anchor="middle">Q (0, 0, <tspan font-style="italic">d</tspan>)</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="540" y="130" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">면 S<tspan font-size="13" dy="4">1</tspan></text>
  </g>

  <!-- Magnetic field B (pointing right) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="265" y1="80" x2="415" y2="80" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="435" y="86" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="start">B</text>
    <line x1="435" y1="68" x2="449" y2="68" stroke="#000000" stroke-width="1.2" marker-end="url(#mini-arrow-71)"/>
  </g>

  <!-- Electric field E (pointing left) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="415" y1="125" x2="265" y2="125" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="245" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="end">E</text>
    <line x1="230" y1="114" x2="244" y2="114" stroke="#000000" stroke-width="1.2" marker-end="url(#mini-arrow-71)"/>
  </g>

  <!-- Point P on y-axis: P(0, d, 0) at (230, 275) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="230" cy="275" r="4" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="270" y="305" font-family="'Times New Roman', serif" font-size="18" text-anchor="middle">P (0, <tspan font-style="italic">d</tspan>, 0)</text>
  </g>

  <!-- Velocity vector v_0 and components from P -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="230" y1="275" x2="260" y2="230" stroke="#000000" stroke-width="2.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="275" y="235" font-family="'Times New Roman', serif" font-style="italic" font-size="18" text-anchor="start">v<tspan font-size="12" dy="4">0</tspan></text>
    <line x1="275" y1="220" x2="286" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#mini-arrow-71)"/>
  </g>

  <!-- Component v_0 cos theta (parallel to +z) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="230" y1="275" x2="265" y2="275" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="305" y="282" font-family="'Times New Roman', serif" font-style="italic" font-size="17" text-anchor="middle">v<tspan font-size="11" dy="4">0</tspan><tspan dy="-4">cos</tspan>θ</text>
  </g>

  <!-- Component v_0 sin theta (parallel to +x) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="230" y1="275" x2="230" y2="230" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-71)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="235" y="220" font-family="'Times New Roman', serif" font-style="italic" font-size="17" text-anchor="middle">v<tspan font-size="11" dy="4">0</tspan><tspan dy="-4">sin</tspan>θ</text>
  </g>

  <!-- Angle arc theta -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 248 275 A 18 18 0 0 0 242 258" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="256" y="265" font-family="'Times New Roman', serif" font-style="italic" font-size="16" text-anchor="start">θ</text>
  </g>
</svg>
  </div>
</body>
</html>
