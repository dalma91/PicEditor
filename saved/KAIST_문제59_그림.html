<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" width="100%" height="100%">
  <defs>
    <marker id="arrow-59" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ==================== PANEL 1: 그림 1 ==================== -->
  <g transform="translate(20, 0)">
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="30" y1="290" x2="430" y2="290" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-59)"/>
    <g class="movable text-wrap" transform="translate(435, 280)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">x</text>
    </g>

    <!-- Origin O (음원 및 마이크) -->
    <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            cx="75" cy="290" r="8" fill="#000000"/>
    <g class="movable text-wrap" transform="translate(68, 305)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle">O</text>
    </g>

    <!-- Leader line to Origin O -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="55" y1="220" x2="72" y2="280" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-59)"/>
    <g class="movable text-wrap" transform="translate(20, 165)">
      <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">음원 및</text>
      <text class="text-el" x="0" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">마이크</text>
    </g>

    <!-- Reflector Plate (반사판) -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="375" y1="180" x2="375" y2="400" stroke="#000000" stroke-width="4.5"/>

    <!-- Leader line to Reflector -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="430" y1="180" x2="385" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-59)"/>
    <g class="movable text-wrap" transform="translate(425, 150)">
      <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">반</text>
      <text class="text-el" x="12" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">사</text>
      <text class="text-el" x="12" y="60" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">판</text>
    </g>

    <!-- Caption -->
    <g class="movable text-wrap" transform="translate(240, 420)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: 그림 2 ==================== -->
  <g transform="translate(540, 0)">
    <!-- Axes -->
    <!-- Horizontal Axis: t -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="60" y1="370" x2="470" y2="370" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-59)"/>
    <g class="movable text-wrap" transform="translate(475, 360)">
      <text class="text-el" x="8" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">t</text>
    </g>

    <!-- Vertical Axis: 음파의 진동수 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="370" x2="90" y2="345" stroke="#000000" stroke-width="1.5"/>
    <!-- Axis Break Symbol (≈) -->
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 83 345 C 87 347, 93 343, 97 345" fill="none" stroke="#000000" stroke-width="1.5"/>
    <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          d="M 83 340 C 87 342, 93 338, 97 340" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="335" x2="90" y2="40" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-59)"/>
    <g class="movable text-wrap" transform="translate(30, 20)">
      <text class="text-el" x="40" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">음파의 진동수</text>
    </g>

    <!-- Origin 0 -->
    <g class="movable text-wrap" transform="translate(75, 375)">
      <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">0</text>
    </g>

    <!-- Levels on Vertical Axis (step gap = 65) -->
    <!-- f at y=300 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="85" y1="300" x2="90" y2="300" stroke="#000000" stroke-width="1.5"/>
    <g class="movable text-wrap" transform="translate(55, 290)">
      <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">f</text>
    </g>
    <!-- f + Δf at y=235 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="85" y1="235" x2="90" y2="235" stroke="#000000" stroke-width="1.5"/>
    <g class="movable text-wrap" transform="translate(20, 225)">
      <text class="text-el" x="30" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">f</tspan> + Δ<tspan font-style="italic">f</tspan></text>
    </g>
    <!-- f + 2Δf at y=170 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="85" y1="170" x2="90" y2="170" stroke="#000000" stroke-width="1.5"/>
    <g class="movable text-wrap" transform="translate(12, 160)">
      <text class="text-el" x="35" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">f</tspan> + 2Δ<tspan font-style="italic">f</tspan></text>
    </g>
    <!-- f + 3Δf at y=105 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="85" y1="105" x2="90" y2="105" stroke="#000000" stroke-width="1.5"/>
    <g class="movable text-wrap" transform="translate(12, 95)">
      <text class="text-el" x="35" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle"><tspan font-style="italic">f</tspan> + 3Δ<tspan font-style="italic">f</tspan></text>
    </g>

    <!-- Horizontal Dotted Gridlines -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="300" x2="430" y2="300" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="235" x2="430" y2="235" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="170" x2="430" y2="170" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="105" x2="430" y2="105" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Vertical Ticks & Gridlines -->
    <!-- Δt at x=165 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="165" y1="70" x2="165" y2="370" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <g class="movable text-wrap" transform="translate(150, 375)">
      <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">Δ<tspan font-style="italic">t</tspan></text>
    </g>

    <!-- 2Δt at x=240 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="240" y1="70" x2="240" y2="370" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <g class="movable text-wrap" transform="translate(225, 375)">
      <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">2Δ<tspan font-style="italic">t</tspan></text>
    </g>

    <!-- 3Δt at x=315 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="315" y1="70" x2="315" y2="370" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <g class="movable text-wrap" transform="translate(300, 375)">
      <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">3Δ<tspan font-style="italic">t</tspan></text>
    </g>

    <!-- 4Δt at x=390 -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="390" y1="70" x2="390" y2="370" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
    <g class="movable text-wrap" transform="translate(375, 375)">
      <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="18" text-anchor="middle">4Δ<tspan font-style="italic">t</tspan></text>
    </g>

    <!-- Staircase Curve -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="300" x2="165" y2="300" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="165" y1="300" x2="165" y2="235" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="165" y1="235" x2="240" y2="235" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="240" y1="235" x2="240" y2="170" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="240" y1="170" x2="315" y2="170" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="315" y1="170" x2="315" y2="105" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="315" y1="105" x2="390" y2="105" stroke="#000000" stroke-width="3"/>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="390" y1="105" x2="390" y2="50" stroke="#000000" stroke-width="3"/>

    <!-- Caption -->
    <g class="movable text-wrap" transform="translate(240, 420)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
