<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제76_그림2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <marker id="arrow-76-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- U-shaped Cart (length L = 460) -->
  <!-- Left Wall -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="35" x2="20" y2="115" stroke="#000000" stroke-width="6"/>
  <!-- Floor -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="17" y1="115" x2="483" y2="115" stroke="#000000" stroke-width="6"/>
  <!-- Right Wall -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="480" y1="35" x2="480" y2="115" stroke="#000000" stroke-width="6"/>

  <!-- Dimension L between walls -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="50" x2="480" y2="50" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-76-2)" marker-end="url(#arrow-76-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="240" y="38" width="20" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="250" y="56" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">L</text>
  </g>

  <!-- Rollers beneath cart -->
  <!-- Left Roller at x=100, y=140 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="100" cy="142" r="24" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="100" cy="142" r="14" fill="#FFFFFF"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="100" cy="142" r="8" fill="#94a3b8"/>

  <!-- Right Roller at x=395, y=140 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="395" cy="142" r="24" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="395" cy="142" r="14" fill="#FFFFFF"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="395" cy="142" r="8" fill="#94a3b8"/>

  <!-- Sphere in cart at (280, 97) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="280" cy="97" r="15" fill="#94a3b8" stroke="#000000" stroke-width="1.8"/>

  <!-- Right Spring k2 (from x=295 to 477) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 295 100 H 310
           C 317 82, 322 82, 327 100 C 332 118, 337 118, 342 100
           C 347 82, 352 82, 357 100 C 362 118, 367 118, 372 100
           C 377 82, 382 82, 387 100 C 392 118, 397 118, 402 100
           C 407 82, 412 82, 417 100 C 422 118, 427 118, 432 100
           C 437 82, 442 82, 447 100 C 452 118, 457 118, 462 100
           H 477"
        fill="none" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="380" y="62" width="20" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="390" y="80" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">k<tspan font-size="13" dy="4">2</tspan></text>
  </g>

  <!-- Velocity Vector V0 arrow pointing right from right wall -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="495" y1="85" x2="565" y2="85" stroke="#000000" stroke-width="4" marker-end="url(#arrow-76-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="525" y="65" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">V<tspan font-size="14" dy="4">0</tspan></text>
  </g>

  <!-- Caption 그림 2 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="250" y="215" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">그림 2</text>
  </g>
</svg>
  </div>
</body>
</html>
