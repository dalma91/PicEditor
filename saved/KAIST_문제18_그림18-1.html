<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <pattern id="floor-hatch18" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <pattern id="mass-mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#000000" stroke-width="1"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-end" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Double Rail at top -->
  <line class="movable" x1="60" y1="72" x2="570" y2="72" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="60" y1="78" x2="570" y2="78" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Cart B (box on rail) -->
  <rect class="movable" x="275" y="60" width="85" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Pivot P -->
  <circle class="movable" cx="317.5" cy="100" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Horizontal Rod -->
  <line class="movable" x1="135" y1="100" x2="313" y2="100" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Mass A (cross-hatched sphere) -->
  <circle class="movable" cx="120" cy="100" r="15" fill="url(#mass-mesh)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension R -->
  <line class="movable" x1="120" y1="45" x2="317.5" y2="45" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-start)" marker-end="url(#dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="120" y1="35" x2="120" y2="85" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="317.5" y1="35" x2="317.5" y2="60" stroke="#000000" stroke-width="0.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Trajectory arc of A down to bottom -->
  <path class="movable" d="M 120 115 A 197.5 197.5 0 0 0 317.5 297.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Mass A at bottom (dashed circle) -->
  <circle class="movable" cx="317.5" cy="297.5" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical dashed line through P -->
  <line class="movable" x1="317.5" y1="104.5" x2="317.5" y2="420" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Floor line & Hatch -->
  <line class="movable" x1="40" y1="320" x2="600" y2="320" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <polygon class="movable" points="40,320 600,320 600,360 40,360" fill="url(#floor-hatch18)" stroke="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Coordinate Axis x -->
  <line class="movable" x1="317.5" y1="390" x2="400" y2="390" stroke="#000000" stroke-width="1.5" marker-end="url(#axis-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- 레일 -->
  <g class="movable text-wrap" transform="translate(520, 52) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">레일</text>
  </g>

  <!-- P -->
  <g class="movable text-wrap" transform="translate(340, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">P</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(380, 135) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(90, 125) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- R -->
  <g class="movable text-wrap" transform="translate(220, 32) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-12" width="30" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- 바닥 -->
  <g class="movable text-wrap" transform="translate(545, 300) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-25" y="-12" width="50" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">바닥</text>
  </g>

  <!-- 0 (Origin) -->
  <g class="movable text-wrap" transform="translate(332, 415) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">0</text>
  </g>

  <!-- x (Axis) -->
  <g class="movable text-wrap" transform="translate(390, 375) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">x</text>
  </g>
</svg>
</body>
</html>
