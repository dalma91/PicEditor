<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-33" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Circular Orbit (radius l = 135, center O at (175, 215)) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="175" cy="215" r="135" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Coordinate Axes -->
  <!-- x-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="215" x2="380" y2="215" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-33)"/>
  <!-- y-axis -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="175" y1="390" x2="175" y2="40" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-33)"/>

  <!-- Lowest Point A at (175, 350) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="175" y1="215" x2="175" y2="350" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="175" cy="350" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Velocity arrow v0 at A -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="186" y1="350" x2="255" y2="350" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-33)"/>

  <!-- Moving small ball at angle theta (say theta = 38 deg) -->
  <!-- x = 175 + 135*sin(38 deg) = 258, y = 215 + 135*cos(38 deg) = 321 -->
  <!-- String line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="175" y1="215" x2="258" y2="321" stroke="#000000" stroke-width="2"/>
  <!-- Small black ball -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="258" cy="321" r="11" fill="#000000"/>

  <!-- Angle theta arc between negative y-axis and string -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 175 255 A 40 40 0 0 1 199 249" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Point B at theta = 120 deg from bottom (so 30 deg above +x axis) -->
  <!-- x = 175 + 135*cos(30 deg) = 292, y = 215 - 135*sin(30 deg) = 147 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="175" y1="215" x2="292" y2="147" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="292" cy="147" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- LABELS -->
  <!-- y -->
  <g class="movable text-wrap" transform="translate(155, 48) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">y</text>
  </g>

  <!-- x -->
  <g class="movable text-wrap" transform="translate(385, 232) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(148, 230) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(175, 380) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- v0 -->
  <g class="movable text-wrap" transform="translate(270, 350) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">v₀</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(186, 268) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(320, 140) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
</svg>
</body>
</html>
