<!DOCTYPE html>

<body>

    <line class="movable" x1="15" y1="275" x2="515" y2="275" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <circle class="movable" cx="210" cy="435" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="230" y="55" font-family="'Batang', serif" font-size="34" font-weight="bold"><tspan font-family="'Times New Roman', serif" font-style="italic">y</tspan>축</text></g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="225" y="110" font-family="'Times New Roman', serif" font-size="38">C (0, <tspan font-style="italic">a</tspan>)</text></g>
