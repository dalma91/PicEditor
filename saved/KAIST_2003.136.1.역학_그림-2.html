<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.136.1.역학_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1188 380" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 동체 점박이/해치 패턴 -->
    <pattern id="fuselage-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 좌측: 방출 전 (Mn-1, Wn-1) -->
    <!-- ========================================== -->
    <!-- 로켓 동체 캡슐 (4개 펠릿 내장) -->
    <path class="movable" d="M 40 85 L 245 85 C 280 85, 295 104, 245 123 L 40 123 Z" fill="#B0B0B0" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내부 4개 백색 펠릿 -->
    <circle class="movable" cx="60" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="100" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="140" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="180" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 속도 벡터 Wn-1 -->
    <line class="movable" x1="320" y1="104" x2="395" y2="104" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="325" y="150">W<tspan class="sub" dy="8">n-1</tspan></text>
    </g>

    <!-- 질량 Mn-1 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="100" y="150">M<tspan class="sub" dy="8">n-1</tspan></text>
    </g>

    <!-- 레이블: 방출 전 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="130" y="240">방출 전</text>
    </g>

    <!-- ========================================== -->
    <!-- 2. 중앙: 방출된 작은 펠릿 (질량 m) -->
    <!-- ========================================== -->
    <circle class="movable" cx="660" cy="104" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="660" cy="104" r="8" fill="#888888" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="660" y="150" transform="translate(0,0) scale(1,1) rotate(0)">m</text>

    <!-- ========================================== -->
    <!-- 3. 우측: 방출 후 (Mn, Wn) -->
    <!-- ========================================== -->
    <!-- 로켓 동체 캡슐 (3개 펠릿 내장) -->
    <path class="movable" d="M 760 85 L 965 85 C 1000 85, 1015 104, 965 123 L 760 123 Z" fill="#B0B0B0" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 내부 3개 백색 펠릿 -->
    <circle class="movable" cx="820" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="860" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="900" cy="104" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 질량 Mn -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="850" y="150">M<tspan class="sub" dy="8">n</tspan></text>
    </g>

    <!-- 속도 벡터 Wn -->
    <line class="movable" x1="1040" y1="104" x2="1115" y2="104" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="1075" y="150">W<tspan class="sub" dy="8">n</tspan></text>
    </g>

    <!-- 레이블: 방출 후 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="840" y="240">방출 후</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 하단 캡션: 그림 2 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="500" y="300" width="160" height="48" fill="#FFFFFF"/>
      <text class="korean-bold" x="580" y="325">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
