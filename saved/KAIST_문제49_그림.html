<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-49" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Horizontal Floor BD at y=250: from x=40 to x=560 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="250" x2="560" y2="250" stroke="#000000" stroke-width="2.5"/>

  <!-- Incline Plane: from (40, 65) down to (270, 250) (smooth transition) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 40 65 L 245 235 Q 260 250 285 250" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Height h reference lines and double arrow at Point A (75, 95) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="97" x2="75" y2="248" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-49)" marker-end="url(#arrow-49)"/>

  <!-- Block I on incline at A (75, 95) tilted by -38 deg -->
  <g class="movable" transform="translate(75, 95) rotate(-38) scale(1,1)">
    <rect x="-10" y="-16" width="20" height="16" fill="#000000"/>
  </g>

  <!-- Sliding arrow along incline -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="125" x2="160" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-49)"/>

  <!-- Circular Loop: center at (380, 180), radius r = 70 -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="380" cy="180" r="70" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Bottom point B at (380, 250) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="380" y1="180" x2="380" y2="250" stroke="#000000" stroke-width="1.8"/>

  <!-- Point C on loop at angle theta (say 58 deg from downward vertical) -->
  <!-- xC = 380 + 70*sin(58 deg) = 439.4, yC = 180 + 70*cos(58 deg) = 217.1 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="380" y1="180" x2="439" y2="217" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="439" cy="217" r="3" fill="#000000"/>

  <!-- Angle theta arc at loop center -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 380 215 A 35 35 0 0 0 398 210" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Curved counter-clockwise circulation arrow at top of loop -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 412 125 A 60 60 0 0 0 350 125" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-49)"/>

  <!-- Exit arrow towards Block II -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="425" y1="243" x2="475" y2="243" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-49)"/>

  <!-- Target Block II at Point D (505, 236) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="498" y="234" width="16" height="16" fill="#000000"/>

  <!-- LABELS -->
  <!-- A, I -->
  <g class="movable text-wrap" transform="translate(40, 115) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(75, 62) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#000000">Ⅰ</text>
  </g>

  <!-- h -->
  <g class="movable text-wrap" transform="translate(62, 175) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">h</text>
  </g>

  <!-- 루프 (Korean translation of ループ) -->
  <g class="movable text-wrap" transform="translate(380, 85) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-26" y="-12" width="52" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">루프</text>
  </g>

  <!-- r (loop radius) -->
  <g class="movable text-wrap" transform="translate(366, 218) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">r</text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(402, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- B, C, D, II -->
  <g class="movable text-wrap" transform="translate(380, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(452, 222) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(506, 275) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">D</text>
  </g>
  <g class="movable text-wrap" transform="translate(506, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#000000">Ⅱ</text>
  </g>
</svg>
</body>
</html>
