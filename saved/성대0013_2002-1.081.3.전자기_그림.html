<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0013_2002-1.081.3.전자기_그림</title>
</head>
<body>
<svg viewBox="0 0 600 500" width="600" height="500" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <pattern id="cylinder-pat" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#555555" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 자기장 화살표 4개 (기울어진 평행선들) -->
    <path class="movable" d="M 120,200 L 480,30 M 115,200 L 210,160 M 175,200 L 530,30 M 170,200 L 265,160 M 225,250 L 580,80 M 220,250 L 315,210 M 275,280 L 630,110 M 270,280 L 365,240" fill="none" stroke="#000000" stroke-width="2.2" transform="translate(-25,0) scale(1,1) rotate(0)" />

    <!-- 회전체 원통 및 받침 -->
    <ellipse class="movable" cx="370" cy="275" rx="65" ry="20" fill="url(#cylinder-pat)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 305,275 L 305,340 A 65 20 0 0 0 435,340 L 435,275" fill="url(#cylinder-pat)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 하단 축 -->
    <path class="movable" d="M 350,355 L 345,385 L 395,385 L 390,355 Z" fill="#777777" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 금속봉 a-b (수직 봉) -->
    <line class="movable" x1="370" y1="50" x2="370" y2="275" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="370" cy="275" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 속도 v 화살표 (오른쪽 아래 경사) -->
    <line class="movable" x1="410" y1="310" x2="520" y2="380" stroke="#000000" stroke-width="6" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="250" y="65" font-family="'Batang', serif" font-size="34" font-weight="bold">금속봉</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="390" y="65" font-family="'Times New Roman', serif" font-size="40">a</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="390" y="245" font-family="'Times New Roman', serif" font-size="40">b</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="25" y="125" font-family="'Batang', serif" font-size="34" font-weight="bold">자속밀도 <tspan font-family="'Times New Roman', serif" font-style="italic">B</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="470" y="325" font-family="'Batang', serif" font-size="34" font-weight="bold">속도 <tspan font-family="'Times New Roman', serif" font-style="italic">v</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="330" y="465" font-family="'Batang', serif" font-size="36" font-weight="bold" text-anchor="middle">그림 3 - 1</text></g>
  </g>
</svg>
</body>
</html>
