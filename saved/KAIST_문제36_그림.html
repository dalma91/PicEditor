<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-36" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="light-gas-36" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C0C8D0" stroke-width="0.8"/>
    </pattern>
    <pattern id="comp-gas-36" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6C7A89" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#6C7A89" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- TUBE (a) (y: 50..82) -->
  <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
    <!-- Gas fill inside (a) -->
    <rect x="80" y="50" width="470" height="32" fill="url(#light-gas-36)"/>
    <!-- Tube horizontal walls -->
    <line x1="70" y1="50" x2="550" y2="50" stroke="#000000" stroke-width="2"/>
    <line x1="70" y1="82" x2="550" y2="82" stroke="#000000" stroke-width="2"/>
    <!-- Piston at O0 (x=70..80) -->
    <rect x="70" y="50" width="10" height="32" fill="#000000"/>
  </g>

  <!-- TUBE (b) (y: 140..172) -->
  <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
    <!-- Tube left empty space -->
    <line x1="70" y1="140" x2="550" y2="140" stroke="#000000" stroke-width="2"/>
    <line x1="70" y1="172" x2="550" y2="172" stroke="#000000" stroke-width="2"/>
    <!-- Compressed gas zone from O1 (128) to B1 (295) -->
    <rect x="128" y="140" width="167" height="32" fill="url(#comp-gas-36)"/>
    <!-- Stationary gas zone from B1 (295) to 550 -->
    <rect x="295" y="140" width="255" height="32" fill="url(#light-gas-36)"/>
    <!-- Boundary B1 line -->
    <line x1="295" y1="140" x2="295" y2="172" stroke="#444444" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Piston at O1 (x=118..128) -->
    <rect x="118" y="140" width="10" height="32" fill="#000000"/>
  </g>

  <!-- TUBE (c) (y: 240..272) -->
  <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
    <!-- Tube walls -->
    <line x1="70" y1="240" x2="550" y2="240" stroke="#000000" stroke-width="2"/>
    <line x1="70" y1="272" x2="550" y2="272" stroke="#000000" stroke-width="2"/>
    <!-- Compressed gas zone from O (166) to B (440) -->
    <rect x="166" y="240" width="274" height="32" fill="url(#comp-gas-36)"/>
    <!-- Stationary gas zone from B (440) to 550 -->
    <rect x="440" y="240" width="110" height="32" fill="url(#light-gas-36)"/>
    <!-- Boundary B line -->
    <line x1="440" y1="240" x2="440" y2="272" stroke="#444444" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Piston at O (x=156..166) -->
    <rect x="156" y="240" width="10" height="32" fill="#000000"/>
  </g>

  <!-- CORRESPONDENCE DASHED LINES -->
  <!-- From O0 (80, 82) to O1 (128, 140) to O (166, 240) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="80" y1="82" x2="128" y2="140" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="128" y1="172" x2="166" y2="240" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- From O0 (80, 82) down-right to B1 (295, 140) down-right to B (440, 240) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="80" y1="82" x2="295" y2="140" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="295" y1="172" x2="440" y2="240" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- A0 vertical dashed line from (220, 45) through (b) to (c) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="220" y1="50" x2="220" y2="240" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Compressed point A trajectory: from (220, 82) to (245, 140) to (280, 240) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="220" y1="82" x2="245" y2="140" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="245" y1="172" x2="280" y2="240" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- B vertical reference dashed line from (a) down to (c) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="440" y1="50" x2="440" y2="240" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- DIMENSIONS -->
  <!-- Dimension x: between O0 (80) and A0 (220) at y=110 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="80" y1="110" x2="220" y2="110" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-36)" marker-end="url(#arrow-36)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="80" y1="85" x2="80" y2="118" stroke="#555555" stroke-width="1"/>

  <!-- Dimension delta x: between A0 (220) and compressed A at (b) (280) at y=210 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="222" y1="210" x2="278" y2="210" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-36)" marker-end="url(#arrow-36)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="220" y1="185" x2="220" y2="220" stroke="#555555" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="280" y1="185" x2="280" y2="220" stroke="#555555" stroke-width="1"/>

  <!-- LABELS -->
  <!-- (a), (b), (c) -->
  <g class="movable text-wrap" transform="translate(42, 66) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">(a)</text>
  </g>
  <g class="movable text-wrap" transform="translate(42, 156) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">(b)</text>
  </g>
  <g class="movable text-wrap" transform="translate(42, 256) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">(c)</text>
  </g>

  <!-- O0, A0, B above (a) -->
  <g class="movable text-wrap" transform="translate(76, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">O<tspan font-size="14" dy="3">0</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(220, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A<tspan font-size="14" dy="3">0</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(440, 36) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- x -->
  <g class="movable text-wrap" transform="translate(150, 102) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- O1, B1 below (b) -->
  <g class="movable text-wrap" transform="translate(122, 192) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">O<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(295, 192) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B<tspan font-size="14" dy="3">1</tspan></text>
  </g>

  <!-- delta x -->
  <g class="movable text-wrap" transform="translate(248, 202) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-12" width="32" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">Δx</text>
  </g>

  <!-- O, A, B below (c) -->
  <g class="movable text-wrap" transform="translate(162, 292) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">O</text>
  </g>
  <g class="movable text-wrap" transform="translate(280, 292) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(440, 292) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>
</svg>
</body>
</html>
