<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0048_2003.206.2.열역학_그림</title>
</head>
<body>
<svg viewBox="0 0 700 450" width="700" height="450" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>
  <g class="main-diagram">
    <!-- 실린더 외부 단열재 (두꺼운 회색 테두리) -->
    <rect class="movable" x="60" y="80" width="580" height="280" fill="#AAAAAA" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 실린더 내부 빈 공간 (기체 방 A, B) -->
    <rect class="movable" x="90" y="105" width="540" height="230" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 중앙 가동 피스톤 (검은색/그라데이션 블록) -->
    <rect class="movable" x="345" y="105" width="30" height="230" fill="#333333" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 우측 고정벽/스토퍼 굵은 띠 -->
    <line class="movable" x1="630" y1="80" x2="630" y2="360" stroke="#000000" stroke-width="12" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>
  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="210" y="235" font-family="'Times New Roman', serif" font-size="38" font-style="normal" font-weight="bold" text-anchor="start">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="490" y="235" font-family="'Times New Roman', serif" font-size="38" font-style="normal" font-weight="bold" text-anchor="start">B</text></g>
  </g>
</svg>
</body>
</html>
