<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.157.1.역학_그림-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1170 460" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 지면 해칭 패턴 -->
    <pattern id="ground-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 30px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .track-line { stroke: #000000; stroke-width: 3.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 지면 해칭 블록 및 하프파이프 트랙 -->
    <!-- ========================================== -->
    <!-- 해칭 지면 (트랙 하부) -->
    <path class="movable" d="M 15 95 L 100 95 A 220 220 0 0 0 320 315 L 820 315 A 220 220 0 0 0 1040 95 L 1155 95 L 1155 420 L 15 420 Z" fill="url(#ground-pattern)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 트랙 경계선 (A -> B -> C -> D) -->
    <path class="movable track-line" d="M 15 95 L 100 95 A 220 220 0 0 0 320 315 L 820 315 A 220 220 0 0 0 1040 95 L 1155 95" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 트랙 지점 레이블 (A, B, C, D) -->
    <text class="movable roman" x="65" y="125">A</text>
    <text class="movable roman" x="300" y="345">B</text>
    <text class="movable roman" x="840" y="345">C</text>
    <text class="movable roman" x="1075" y="125">D</text>

    <!-- ========================================== -->
    <!-- 2. 점 P: 점프 전 경기자 & 스노보드 -->
    <!-- ========================================== -->
    <text class="movable roman" x="425" y="345">P</text>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <!-- 보드 데크 -->
      <path d="M 390 312 L 460 312 Q 468 307 465 302" fill="none" stroke="#000000" stroke-width="4.0" stroke-linecap="round"/>
      <!-- 사람 선화 -->
      <circle cx="430" cy="205" r="12" fill="#000000"/>
      <!-- 상체 -->
      <polygon points="415,220 445,220 440,260 420,260" fill="#FFFFFF" stroke="#000000" stroke-width="2.0"/>
      <!-- 다리 -->
      <polyline points="420,260 410,290 405,310" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="440,260 450,290 455,310" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 팔 -->
      <polyline points="415,225 395,240 390,255" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="445,225 465,240 470,255" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 점 P에서 점 Q로의 점프 궤적 (점선 포물선) -->
    <path class="movable" d="M 430 195 Q 495 110 550 170" fill="none" stroke="#000000" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 점 Q: 착지한 경기자 및 레이블 -->
    <!-- ========================================== -->
    <text class="movable roman" x="560" y="345">Q</text>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <!-- 사람 선화 (맨발 착지) -->
      <circle cx="560" cy="210" r="12" fill="#000000"/>
      <!-- 상체 -->
      <polygon points="545,225 575,225 570,265 550,265" fill="#FFFFFF" stroke="#000000" stroke-width="2.0"/>
      <!-- 다리 -->
      <polyline points="550,265 540,295 535,314" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="570,265 580,295 585,314" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 팔 벌림 -->
      <polyline points="545,230 525,250 520,265" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="575,230 595,250 600,265" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- 경기자 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="650" y="160">경기자</text>
    </g>

    <!-- ========================================== -->
    <!-- 4. 분리되어 전방 활주하는 스노보드 -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <!-- 스노보드 데크 -->
      <path d="M 660 312 L 730 312 Q 740 307 735 300" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 속도 화살표 -->
      <line x1="695" y1="270" x2="780" y2="270" stroke="#000000" stroke-width="3.0" marker-end="url(#arrow-end)"/>
    </g>
    <!-- 스노보드 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="770" y="210">스노보드</text>
    </g>

    <!-- ========================================== -->
    <!-- 5. 캡션: 그림 2 -->
    <!-- ========================================== -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="25" y="40" width="160" height="52" fill="#FFFFFF"/>
      <text class="korean-bold" x="75" y="70">그림 2</text>
    </g>
  </g>
</svg>
</body>
</html>
