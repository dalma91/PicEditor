<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <defs>
    <pattern id="metal-rail28" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333333" stroke-width="2"/>
    </pattern>
    <marker id="axis-arr28" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="b-arr28" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dim-s28" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e28" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 3D Axes at C(200, 375) -->
  <!-- x axis -->
  <line class="movable" x1="200" y1="375" x2="520" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#axis-arr28)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- y axis -->
  <line class="movable" x1="200" y1="375" x2="25" y2="295" stroke="#000000" stroke-width="1.5" marker-end="url(#axis-arr28)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- z axis -->
  <line class="movable" x1="200" y1="375" x2="200" y2="85" stroke="#000000" stroke-width="1.5" marker-end="url(#axis-arr28)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Magnetic Field B Vector -->
  <line class="movable" x1="105" y1="240" x2="105" y2="125" stroke="#000000" stroke-width="3" marker-end="url(#b-arr28)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Floor projection line for rail AB -->
  <line class="movable" x1="90" y1="320" x2="230" y2="295" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <line class="movable" x1="200" y1="375" x2="335" y2="355" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Angle 30 deg arcs -->
  <!-- At C -->
  <path class="movable" d="M 275 364 A 80 80 0 0 0 270 320" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s28)" marker-end="url(#dim-e28)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- At A -->
  <path class="movable" d="M 165 307 A 80 80 0 0 0 160 264" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s28)" marker-end="url(#dim-e28)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Metal Rails (thick bars) -->
  <!-- Upper Rail AB: A(90, 320) to B(430, 50) -->
  <line class="movable" x1="90" y1="320" x2="430" y2="50" stroke="#222222" stroke-width="5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="430" cy="50" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Lower Rail CD: C(200, 375) to D(540, 105) -->
  <line class="movable" x1="200" y1="375" x2="540" y2="105" stroke="#222222" stroke-width="5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <circle class="movable" cx="540" cy="105" r="4.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Resistor R bridging B and D at top -->
  <path class="movable" d="M 430 50 L 465 68 L 472 63 L 480 75 L 488 63 L 496 75 L 504 69 L 540 105" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Square Metal Frame abcd sliding on rails -->
  <!-- Side ad: from a(220, 217) to d(330, 272) -->
  <line class="movable" x1="220" y1="217" x2="330" y2="272" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Side bc: from b(315, 141) to c(425, 196) -->
  <line class="movable" x1="315" y1="141" x2="425" y2="196" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Side ab (along rail AB): from a(220, 217) to b(315, 141) -->
  <line class="movable" x1="220" y1="217" x2="315" y2="141" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Side dc (along rail CD): from d(330, 272) to c(425, 196) -->
  <line class="movable" x1="330" y1="272" x2="425" y2="196" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension L between rails -->
  <line class="movable" x1="380" y1="89" x2="480" y2="152" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s28)" marker-end="url(#dim-e28)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- B (Magnetic field) -->
  <g class="movable text-wrap" transform="translate(80, 180) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- x axis -->
  <g class="movable text-wrap" transform="translate(510, 345) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- y axis -->
  <g class="movable text-wrap" transform="translate(25, 315) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">y</text>
  </g>

  <!-- z axis -->
  <g class="movable text-wrap" transform="translate(200, 65) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">z</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(75, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(415, 35) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- C -->
  <g class="movable text-wrap" transform="translate(195, 395) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">C</text>
  </g>

  <!-- D -->
  <g class="movable text-wrap" transform="translate(560, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">D</text>
  </g>

  <!-- R -->
  <g class="movable text-wrap" transform="translate(500, 50) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- a, b, c, d frame vertices -->
  <!-- a -->
  <g class="movable text-wrap" transform="translate(208, 210) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">a</text>
  </g>
  <!-- b -->
  <g class="movable text-wrap" transform="translate(305, 130) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">b</text>
  </g>
  <!-- c -->
  <g class="movable text-wrap" transform="translate(440, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">c</text>
  </g>
  <!-- d -->
  <g class="movable text-wrap" transform="translate(345, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">d</text>
  </g>

  <!-- L (Rail separation) -->
  <g class="movable text-wrap" transform="translate(435, 112) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">L</text>
  </g>

  <!-- 30 deg angles -->
  <g class="movable text-wrap" transform="translate(180, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-10" width="30" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">30°</text>
  </g>
  <g class="movable text-wrap" transform="translate(295, 335) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-10" width="30" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">30°</text>
  </g>
</svg>
</body>
</html>
