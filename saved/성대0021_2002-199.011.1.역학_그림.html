<!DOCTYPE html>

  <g class="main-diagram">

    <line class="movable" x1="580" y1="310" x2="580" y2="400" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <path class="movable" d="M 625,245 A 75 75 0 0 0 540,245" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <line class="movable" x1="645" y1="388" x2="725" y2="388" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <rect class="movable" x="755" y="380" width="20" height="20" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="670" y="360" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start">C</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="580" y="435" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="middle">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="765" y="368" font-family="'Times New Roman', serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="middle">Ⅱ</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="765" y="435" font-family="'Times New Roman', serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="middle">D</text></g>
