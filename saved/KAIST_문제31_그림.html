<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-31" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Hatch Pattern for Floor -->
    <pattern id="hatch-31" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Incline Plane & Ground Structure -->
  <!-- Horizontal ground line at y=380 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="380" x2="560" y2="380" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="40" y="380" width="520" height="15" fill="url(#hatch-31)"/>

  <!-- Incline line from (50, 380) to (490, 126) -> dx=440, dy=-254 (30 deg: tan 30 = 0.577) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="50" y1="380" x2="490" y2="126" stroke="#000000" stroke-width="3"/>
  
  <!-- Vertical support at right: from (490, 126) down to (490, 380) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="490" y1="126" x2="490" y2="380" stroke="#000000" stroke-width="2.5"/>

  <!-- Stopper at bottom perpendicular to incline (angle 120 deg) at (50, 380) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="33" y1="350" x2="55" y2="388" stroke="#000000" stroke-width="4.5"/>

  <!-- Spring S: from stopper (44, 369) along incline to point P (120, 325) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 44.0 369.0 L 50.1 365.5 Q 57.2 371.7 55.4 362.4 Q 53.6 353.1 60.7 359.3 Q 67.9 365.6 66.0 356.2 Q 64.2 346.9 71.4 353.2 Q 78.5 359.4 76.7 350.1 Q 74.8 340.8 82.0 347.0 Q 89.2 353.2 87.3 343.9 Q 85.5 334.6 92.6 340.8 Q 99.8 347.1 98.0 337.8 Q 96.1 328.4 103.3 334.7 Q 110.4 340.9 108.6 331.6 Q 106.8 322.3 113.9 328.5 L 120.0 325.0" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Point P plate -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="113" y1="313" x2="127" y2="337" stroke="#000000" stroke-width="3"/>

  <!-- Horizontal reference line at P (120, 325) to x=360 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="120" y1="325" x2="360" y2="325" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Angle 30 deg arc at P -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 148 325 A 28 28 0 0 1 144 339" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Height h reference lines and double arrow -->
  <!-- Cart B reference point at (256, 261) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="256" y1="261" x2="360" y2="261" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="345" y1="263" x2="345" y2="323" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-31)" marker-end="url(#arrow-31)"/>

  <!-- Cart B with Wheels on incline -->
  <!-- We put Cart B and Block A inside a group rotated by -30 deg placed at (250, 264) -->
  <g class="movable" transform="translate(250, 264) rotate(-30) scale(1,1)">
    <!-- Cart B body: flat bed with sides -->
    <rect x="0" y="-12" width="105" height="12" fill="#E8F0FE" stroke="#000000" stroke-width="2"/>
    <!-- Wheels: circles at x=18 and x=85 -->
    <circle cx="18" cy="4" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <circle cx="18" cy="4" r="2" fill="#000000"/>
    <circle cx="85" cy="4" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <circle cx="85" cy="4" r="2" fill="#000000"/>

    <!-- Block A resting on Cart B -->
    <rect x="10" y="-44" width="38" height="32" fill="#F1F3F4" stroke="#000000" stroke-width="2"/>
    
    <!-- String from Block A going up parallel to bed -->
    <line x1="48" y1="-28" x2="280" y2="-28" stroke="#000000" stroke-width="1.8"/>
  </g>

  <!-- Pulley R at top of incline (500, 115) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="505" cy="118" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="505" cy="118" r="3" fill="#000000"/>
  <!-- Pulley axle bracket -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="490" y1="126" x2="505" y2="118" stroke="#000000" stroke-width="3"/>

  <!-- Vertical string dropping from Pulley R to Weight C -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="521" y1="118" x2="521" y2="300" stroke="#000000" stroke-width="1.8"/>
  
  <!-- Weight C -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="498" y="300" width="46" height="30" fill="#E8EAED" stroke="#000000" stroke-width="2"/>

  <!-- LABELS -->
  <!-- S -->
  <g class="movable text-wrap" transform="translate(68, 332) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#000000">S</text>
  </g>

  <!-- P -->
  <g class="movable text-wrap" transform="translate(122, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#000000">P</text>
  </g>

  <!-- 30° -->
  <g class="movable text-wrap" transform="translate(162, 345) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-16" y="-11" width="32" height="22" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">30°</text>
  </g>

  <!-- A -->
  <g class="movable text-wrap" transform="translate(230, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">A</text>
  </g>

  <!-- B -->
  <g class="movable text-wrap" transform="translate(355, 185) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">B</text>
  </g>

  <!-- h -->
  <g class="movable text-wrap" transform="translate(328, 293) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">h</text>
  </g>

  <!-- R -->
  <g class="movable text-wrap" transform="translate(505, 85) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- C -->
  <g class="movable text-wrap" transform="translate(535, 290) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" font-style="italic" fill="#000000">C</text>
  </g>
</svg>
</body>
</html>
