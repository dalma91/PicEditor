<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.065.2.열역학_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 774 980" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 피스톤 해칭 패턴 -->
    <pattern id="piston-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#888888" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wall-line { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: square; }
    .pipe-line { stroke: #000000; stroke-width: 3.0; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- 1. 용기 1 (대형 수직 실린더) -->
    <!-- 좌측 벽면 -->
    <line class="movable wall-line" x1="40" y1="20" x2="40" y2="910" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 바닥면 -->
    <line class="movable wall-line" x1="40" y1="910" x2="440" y2="910" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 벽면 상단 (파이프 입구 위) -->
    <line class="movable wall-line" x1="440" y1="20" x2="440" y2="820" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 벽면 하단 (파이프 입구 아래) -->
    <line class="movable wall-line" x1="440" y1="865" x2="440" y2="910" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 피스톤 (단면적 S) -->
    <!-- 피스톤 본체 (회색 점박이/해치 채움) -->
    <rect class="movable" x="40" y="240" width="400" height="35" fill="#C8C8C8" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 피스톤 하단 굵은 검은 밀봉선 -->
    <line class="movable" x1="40" y1="275" x2="440" y2="275" stroke="#000000" stroke-width="5.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 단면적 S 지시 화살표 및 레이블 -->
    <line class="movable" x1="495" y1="65" x2="325" y2="235" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="555" y="65">단면적</text>
      <text class="math" x="625" y="65">S</text>
    </g>

    <!-- 피스톤 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="580" y="265">피스톤</text>
    </g>

    <!-- 3. 연결 파이프 (용기 1 -> 용기 2) -->
    <line class="movable pipe-line" x1="440" y1="820" x2="600" y2="820" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable pipe-line" x1="440" y1="865" x2="600" y2="865" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 밸브 (콕) -->
    <!-- 밸브 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="535" y="705">밸브</text>
    </g>
    <!-- 밸브 핸들 (타원형) -->
    <ellipse class="movable" cx="525" cy="770" rx="36" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 밸브 지지목 -->
    <path class="movable" d="M 515 780 L 535 780 L 532 805 L 518 805 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 밸브 몸체 (파이프를 가로지르는 사다리꼴 플러그) -->
    <polygon class="movable" points="495,805 555,805 540,880 510,880" fill="#FFFFFF" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 밸브 하단 꼭지 -->
    <polygon class="movable" points="513,880 537,880 533,905 517,905" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 용기 2 (소형 사각형 상자) -->
    <rect class="movable" x="600" y="760" width="125" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 6. 하단 레이블: 용기 1, 용기 2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-bold" x="240" y="955">용기 1</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean-bold" x="662" y="955">용기 2</text>
    </g>
  </g>
</svg>
</body>
</html>
