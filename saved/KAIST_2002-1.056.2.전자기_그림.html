<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.056.2.전자기_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-108" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Accelerator Chamber on Left -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 260 160 H 130 V 105 H 55 V 275 H 130 V 220 H 260"
        fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Battery Symbol on vertical chamber wire at x=55 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="180" x2="65" y2="180" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="48" y1="186" x2="62" y2="186" stroke="#000000" stroke-width="4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="192" x2="65" y2="192" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="48" y1="198" x2="62" y2="198" stroke="#000000" stroke-width="4"/>

  <!-- Charged particle & label -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="120" cy="195" r="5" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="130" y="155" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">하전 입자</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="125" y1="195" x2="235" y2="195" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-108)"/>

  <!-- Coordinate Axes at O=(260, 195) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="260" y1="300" x2="260" y2="75" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-108)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="240" y="80" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">x</text>
  </g>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="260" y1="195" x2="640" y2="195" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-108)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="650" y="215" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">z</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="240" y="215" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">O</text>
  </g>

  <!-- Parallel Plate Electrodes -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="260" y="148" width="150" height="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="335" y="135" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">전극</text>
  </g>

  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="260" y="235" width="150" height="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="335" y="265" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">전극</text>
  </g>

  <!-- Electric Field E -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="335" y1="220" x2="335" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow-108)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="355" y="205" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">E</text>
  </g>

  <!-- Dimension d (Plate Length) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="260" y1="105" x2="410" y2="105" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-108)" marker-end="url(#arrow-108)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="100" x2="410" y2="148" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="328" y="94" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="335" y="100" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">d</text>
  </g>

  <!-- Dimension L (Distance to Screen) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="410" y1="105" x2="575" y2="105" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-108)" marker-end="url(#arrow-108)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="485" y="92" width="20" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="495" y="100" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">L</text>
  </g>

  <!-- Fluorescent Screen at x=575 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="575" y="45" width="7" height="275" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="580" y="32" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">형광판</text>
  </g>

  <!-- Detector D & Photosensor -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 590 188 A 7 7 0 0 1 590 202 Z" fill="#000000"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="610" y="198" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">D</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="605" y1="95" x2="605" y2="280" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-108)" marker-end="url(#arrow-108)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="625" y="105" width="25" height="95" fill="#FFFFFF"/>
    <text class="text-el" x="635" y="125" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">광</text>
    <text class="text-el" x="635" y="145" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">센</text>
    <text class="text-el" x="635" y="165" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">서</text>
  </g>
</svg>
  </div>
</body>
</html>
