<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제9_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 360 360" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .block-line { stroke: #000000; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    .dim-dash { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 3,2.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 바닥면 (Floor) -->
    <!-- ========================================== -->
    <line class="movable" x1="10" y1="300" x2="350" y2="300" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 사다리꼴 블록 M (A-B-C-D) -->
    <!-- D(70, 300), C(200, 300), B(200, 170), A(70, 40) -->
    <!-- ========================================== -->
    <polygon class="movable" points="70,300 200,300 200,170 70,40" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 사면 위의 원형 물체 m -->
    <!-- 빗면 A(70, 40) -> B(200, 170): dx=130, dy=130 (각도 45도) -->
    <!-- 빗면 위 접촉점 (130, 100), 수직 상향 단위벡터 (-0.707, -0.707) -->
    <!-- 반지름 r=13 -> 중심: (130 - 13*0.707, 100 - 13*0.707) = (121, 91) -->
    <!-- ========================================== -->
    <circle class="movable" cx="130" cy="85" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 치수 곡선 점선 (2l, l, l) -->
    <!-- ========================================== -->
    <!-- 좌측 높이 2l (D(70,300) ~ A(70,40)) -->
    <path class="movable dim-dash" d="M 68 298 C 52 230, 52 110, 68 42" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 우측 높이 l (C(200,300) ~ B(200,170)) -->
    <path class="movable dim-dash" d="M 198 298 C 188 265, 188 205, 198 172" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥 길이 l (D(70,300) ~ C(200,300)) -->
    <path class="movable dim-dash" d="M 72 298 C 105 288, 165 288, 198 298" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="60" y="10" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="71" y="22">A</text>
    </g>

    <!-- B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="206" y="158" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="217" y="170">B</text>
    </g>

    <!-- C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="206" y="284" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="217" y="296">C</text>
    </g>

    <!-- D -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="40" y="284" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="51" y="296">D</text>
    </g>

    <!-- m -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="120" y="48" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="131" y="60">m</text>
    </g>

    <!-- M -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="126" y="195" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="138" y="207">M</text>
    </g>

    <!-- 2l -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="30" y="158" width="28" height="24" fill="#FFFFFF"/>
      <text class="math" x="44" y="170">2<tspan font-style="italic">l</tspan></text>
    </g>

    <!-- l (우측) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="178" y="226" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="188" y="238">l</text>
    </g>

    <!-- l (하단) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="130" y="278" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="140" y="290">l</text>
    </g>
  </g>
</svg>
</body>
</html>
