<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제13_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 605 405" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 축 및 치수 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 15px; font-style: normal; }
    .korean { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 19px; fill: #000000; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .box-outer { stroke: #000000; stroke-width: 2.2; fill: #FFFFFF; fill-opacity: 0.85; stroke-linejoin: round; }
    .box-hidden { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
    .axis-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .wire-line { stroke: #000000; stroke-width: 1.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 좌표축 (z축, y축, x축) -->
    <!-- 원점 O: (340, 305) -->
    <!-- ========================================== -->
    <!-- z축 (수직 상향) -->
    <line class="movable axis-line" x1="340" y1="305" x2="340" y2="25" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- y축 (우측 수평) -->
    <line class="movable axis-line" x1="340" y1="305" x2="590" y2="305" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- x축 (좌하향 투시축, 각도 약 145도) -->
    <line class="movable axis-line" x1="340" y1="305" x2="205" y2="385" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 상자 1 (아래쪽 상자, 높이 L) -->
    <!-- 밑면 Q1: 뒤(265, 270) ~ (535, 270), 앞(135, 335) ~ (412, 335) -->
    <!-- 윗면 Q2: 뒤(265, 230) ~ (535, 230), 앞(135, 255) ~ (412, 255) -->
    <!-- ========================================== -->
    <!-- 상자 1 내부 은선(점선) -->
    <line class="movable box-hidden" x1="265" y1="270" x2="535" y2="270" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable box-hidden" x1="265" y1="270" x2="135" y2="335" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable box-hidden" x1="265" y1="270" x2="265" y2="230" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상자 1 외곽 실선 -->
    <polygon class="movable box-outer" points="135,335 412,335 412,295 135,295" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable box-outer" points="412,335 540,270 540,230 412,295" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable box-outer" points="135,295 412,295 540,230 265,230" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 상자 2 (위쪽 상자, 높이 L, 간격 d) -->
    <!-- 밑면 Q3: 뒤(265, 175) ~ (540, 175), 앞(135, 205) ~ (412, 205) -->
    <!-- 윗면 Q4: 뒤(265, 105) ~ (540, 105), 앞(135, 130) ~ (412, 130) -->
    <!-- ========================================== -->
    <!-- 상자 2 내부 은선(점선) -->
    <line class="movable box-hidden" x1="265" y1="175" x2="540" y2="175" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable box-hidden" x1="265" y1="175" x2="135" y2="205" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable box-hidden" x1="265" y1="175" x2="265" y2="105" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상자 2 외곽 실선 -->
    <polygon class="movable box-outer" points="135,205 412,205 412,175 135,175" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable box-outer" points="412,205 540,145 540,115 412,175" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable box-outer" points="135,175 412,175 540,115 265,115" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 구멍 P, 전자총 및 입사 벡터 v0 -->
    <!-- ========================================== -->
    <!-- 구멍 P: 상자 1 윗면 중심 타원 (340, 262) -->
    <ellipse class="movable" cx="340" cy="262" rx="12" ry="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전자총: 원점 O(340, 305) 부근 원통형 장치 -->
    <g class="movable" transform="translate(340, 305) rotate(35)">
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
      <line x1="-6" y1="0" x2="-6" y2="22" stroke="#000000" stroke-width="1.5"/>
      <line x1="6" y1="0" x2="6" y2="22" stroke="#000000" stroke-width="1.5"/>
      <path d="M -6 22 A 6 3 0 0 0 6 22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- 속도 벡터 v0: (340, 305)에서 각도 theta로 발사 -->
    <line class="movable" x1="340" y1="305" x2="365" y2="280" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 각도 theta 호 -->
    <path class="movable" d="M 340 290 A 15 15 0 0 1 350 293" stroke="#000000" stroke-width="1" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 회로 및 접지, 스위치, 전류계 A -->
    <!-- ========================================== -->
    <!-- 상자 1 접지선 (좌하단 외곽) -->
    <polyline class="movable wire-line" points="135,315 95,315 95,370" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="85" y1="370" x2="105" y2="370" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="88" y1="374" x2="102" y2="374" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="91" y1="378" x2="99" y2="378" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상자 2 연결선: 스위치, 전류계 A 거쳐 접지로 -->
    <line class="movable wire-line" x1="135, 185" x2="110, 185" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 스위치 (열림 상태) -->
    <circle class="movable" cx="106" cy="185" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="66" cy="185" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="68" y1="182" x2="95" y2="168" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전류계 A (직경 24) -->
    <polyline class="movable wire-line" points="66,189 48,189 48,220" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="48" cy="235" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="roman movable" x="48" y="235" font-size="20" transform="translate(0,0) scale(1,1) rotate(0)">A</text>
    <line class="movable wire-line" x1="48" y1="250" x2="48" y2="285" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전류계 접지 -->
    <line class="movable" x1="38" y1="285" x2="58" y2="285" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="41" y1="289" x2="55" y2="289" stroke="#000000" stroke-width="1.6" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="44" y1="293" x2="52" y2="293" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 치수선 (W, D, L, d, L) -->
    <!-- ========================================== -->
    <!-- W 치수선 (상자 2 상단 폭) -->
    <line class="movable" x1="265" y1="110" x2="265" y2="85" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="540" y1="110" x2="540" y2="85" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable dim-line" x1="267" y1="90" x2="538" y2="90" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- D 치수선 (상자 2 깊이) -->
    <line class="movable" x1="412" y1="170" x2="412" y2="145" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable dim-line" x1="414" y1="150" x2="480" y2="120" marker-start="url(#arrow-start)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 우측 높이 치수선 (L, d, L) -->
    <line class="movable" x1="540" y1="115" x2="565" y2="115" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="540" y1="145" x2="565" y2="145" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="540" y1="230" x2="565" y2="230" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="540" y1="270" x2="565" y2="270" stroke="#000000" stroke-width="1" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 상자 2 높이 L -->
    <line class="movable dim-line" x1="558" y1="117" x2="558" y2="143" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상자 간격 d -->
    <line class="movable dim-line" x1="558" y1="147" x2="558" y2="228" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상자 1 높이 L -->
    <line class="movable dim-line" x1="558" y1="232" x2="558" y2="268" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 7. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- z -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="350" y="14" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="360" y="26">z</text>
    </g>

    <!-- y -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="590" y="293" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="600" y="305">y</text>
    </g>

    <!-- x -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="185" y="380" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="195" y="392">x</text>
    </g>

    <!-- O -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="352" y="300" width="20" height="24" fill="#FFFFFF"/>
      <text class="roman" x="362" y="312">O</text>
    </g>

    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="355" y="250" width="20" height="24" fill="#FFFFFF"/>
      <text class="roman" x="365" y="262">P</text>
    </g>

    <!-- W -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="390" y="78" width="26" height="24" fill="#FFFFFF"/>
      <text class="math" x="403" y="90">W</text>
    </g>

    <!-- D -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="460" y="128" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="472" y="140">D</text>
    </g>

    <!-- L (상단) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="566" y="118" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="576" y="130">L</text>
    </g>

    <!-- d (간격) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="566" y="176" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="576" y="188">d</text>
    </g>

    <!-- L (하단) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="566" y="238" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="576" y="250">L</text>
    </g>

    <!-- 스위치 (한글 번역: スイッチ -> 스위치) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="30" y="140" width="65" height="24" fill="#FFFFFF"/>
      <text class="korean" x="62" y="152">스위치</text>
    </g>

    <!-- 전자총 (한글 번역: 電子銃 -> 전자총) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="290" y="360" width="65" height="24" fill="#FFFFFF"/>
      <text class="korean" x="322" y="372">전자총</text>
    </g>

    <!-- 상자 2 (한글 번역: 箱 2 -> 상자 2) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="140" y="175" width="60" height="24" fill="#FFFFFF"/>
      <text class="korean" x="170" y="187">상자 2</text>
    </g>

    <!-- 상자 1 (한글 번역: 箱 1 -> 상자 1) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="140" y="295" width="60" height="24" fill="#FFFFFF"/>
      <text class="korean" x="170" y="307">상자 1</text>
    </g>

    <!-- Q1, Q2, Q3, Q4 -->
    <text class="math movable" x="215" y="332" transform="translate(0,0) scale(1,1) rotate(0)">Q<tspan class="sub" dy="4">1</tspan></text>
    <text class="math movable" x="215" y="258" transform="translate(0,0) scale(1,1) rotate(0)">Q<tspan class="sub" dy="4">2</tspan></text>
    <text class="math movable" x="215" y="200" transform="translate(0,0) scale(1,1) rotate(0)">Q<tspan class="sub" dy="4">3</tspan></text>
    <text class="math movable" x="215" y="125" transform="translate(0,0) scale(1,1) rotate(0)">Q<tspan class="sub" dy="4">4</tspan></text>

    <!-- theta, v0 -->
    <text class="math movable" x="350" y="278" font-size="19" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>
    <text class="math movable" x="382" y="280" font-size="20" transform="translate(0,0) scale(1,1) rotate(0)">v<tspan class="sub" dy="4">0</tspan></text>
  </g>
</svg>
</body>
</html>
