<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제73_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="100%" height="100%">
  <defs>
    <marker id="arrow-73" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="wall-pat-73" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#cbd5e1"/>
      <circle cx="2" cy="2" r="0.75" fill="#475569"/>
      <circle cx="6" cy="6" r="0.75" fill="#475569"/>
    </pattern>
  </defs>

  <!-- Axes: origin O at (50, 310) -->
  <!-- x-axis (right) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="310" x2="390" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-73)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="405" y="316" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">x</text>
  </g>

  <!-- z-axis (up) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="310" x2="50" y2="45" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-73)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="35" y="55" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">z</text>
  </g>

  <!-- y-axis (oblique 35 deg up-right, dashed) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="310" x2="230" y2="215" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-73)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="225" y="202" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">y</text>
  </g>

  <!-- Origin label 0 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="40" y="328" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">0</text>
  </g>

  <!-- 3D Cube Vertices:
       Side length L = 190.
       Oblique offset for y: dx = 130, dy = -75.
       Front-Bottom-Left: (50, 310)
       Front-Bottom-Right: (240, 310)
       Front-Top-Right: (240, 120)
       Front-Top-Left: (50, 120)
       Back-Bottom-Left: (180, 235)
       Back-Bottom-Right: (370, 235)
       Back-Top-Right: (370, 45)
       Back-Top-Left: (180, 45)
  -->

  <!-- Hidden Edges (Dashed) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="235" x2="180" y2="45" stroke="#000000" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="235" x2="370" y2="235" stroke="#000000" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Right Face (Wall W, Shaded) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="240,310 370,235 370,45 240,120"
           fill="url(#wall-pat-73)" stroke="#000000" stroke-width="2.8"/>

  <!-- Top Face -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="50,120 240,120 370,45 180,45"
           fill="#FFFFFF" stroke="#000000" stroke-width="2.8"/>

  <!-- Front Face Outline -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="50,310 240,310 240,120 50,120"
           fill="none" stroke="#000000" stroke-width="2.8"/>

  <!-- Wall W Label with pointer line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="380" y1="160" x2="310" y2="160" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-73)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="382" y="148" width="60" height="25" fill="#FFFFFF"/>
    <text class="text-el" x="410" y="166" font-family="'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle">벽 W</text>
  </g>

  <!-- Dimension L marks -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="35" y="125" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">L</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="240" y="332" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">L</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="165" y="235" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">L</text>
  </g>

  <!-- Caption 그림 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="200" y="375" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">그림</text>
  </g>
</svg>
  </div>
</body>
</html>
