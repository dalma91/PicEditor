<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제1_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 500 420" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 해칭 패턴 -->
    <pattern id="hatch-pattern" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wall-line { stroke: #000000; stroke-width: 2.5; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 벽면 및 천장 (빗금 해칭) -->
    <!-- ========================================== -->
    <!-- 천장 해칭 (수평) -->
    <rect class="movable" x="50" y="48" width="430" height="12" fill="url(#hatch-pattern)" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wall-line" x1="50" y1="60" x2="480" y2="60" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 벽면 해칭 (수직) -->
    <rect class="movable" x="38" y="60" width="12" height="340" fill="url(#hatch-pattern)" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable wall-line" x1="50" y1="60" x2="50" y2="400" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 거리 L 치수선 (모서리에서 점 O까지) -->
    <line class="movable" x1="50" y1="60" x2="50" y2="20" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="180" y1="60" x2="180" y2="20" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="53" y1="28" x2="177" y2="28" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="115" y="15" transform="translate(0,0) scale(1,1) rotate(0)">L</text>

    <!-- 고정점 O -->
    <circle class="movable" cx="180" cy="60" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="195" y="45" transform="translate(0,0) scale(1,1) rotate(0)">O</text>

    <!-- ========================================== -->
    <!-- 2. 초기 위치 A (길이 2L인 팽팽한 실) -->
    <!-- ========================================== -->
    <line class="movable" x1="180" y1="60" x2="425" y2="85" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 구 A -->
    <circle class="movable" cx="433" cy="86" r="9" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="462" y="86" transform="translate(0,0) scale(1,1) rotate(0)">A</text>
    <!-- 실의 길이 2L 레이블 -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="roman" x="295" y="100">2</text>
      <text class="math" x="312" y="100">L</text>
    </g>

    <!-- 원운동 궤적 호 (A -> B, 반경 255) -->
    <path class="movable" d="M 430 100 A 255 255 0 0 1 55 285" fill="none" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 궤적 방향 화살표 (원운동 호 위) -->
    <path class="movable" d="M 230 320 L 175 320" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 충돌 위치 B -->
    <!-- ========================================== -->
    <!-- 팽팽한 실 OB -->
    <line class="movable" x1="180" y1="60" x2="55" y2="280" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 충돌 구 B -->
    <circle class="movable" cx="55" cy="280" r="9" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="22" y="280" transform="translate(0,0) scale(1,1) rotate(0)">B</text>

    <!-- ========================================== -->
    <!-- 4. 반발 후 포물선 운동 궤적 및 최고점 C -->
    <!-- ========================================== -->
    <!-- 포물선 궤적: B(55, 280) -> C(180, 230) -> 정지점 (255, 250) -->
    <path class="movable" d="M 55 280 Q 120 220 180 230 Q 220 235 255 250" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 최고점 C 표시 (X 마크) -->
    <line class="movable" x1="174" y1="225" x2="186" y2="235" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="186" y1="225" x2="174" y2="235" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable roman" x="180" y="205" transform="translate(0,0) scale(1,1) rotate(0)">C</text>

    <!-- 구 (반발 후 위치) -->
    <circle class="movable" cx="255" cy="250" r="9" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 느슨해진 실 (S자 곡선) -->
    <path class="movable" d="M 180 60 C 160 110, 170 150, 220 160 C 250 170, 245 210, 255 245" fill="none" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>
</svg>
</body>
</html>
