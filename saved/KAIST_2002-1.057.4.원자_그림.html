<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.057.4.원자_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <marker id="arrow-109" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Horizontal Trajectory Line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="20" y1="60" x2="520" y2="60" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4"/>

  <!-- Particle A -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="140" cy="60" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="140" y="90" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">A</text>
  </g>

  <!-- Velocity Vector v -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="155" y1="60" x2="225" y2="60" stroke="#000000" stroke-width="2.8" marker-end="url(#arrow-109)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="190" y="42" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">v</text>
  </g>

  <!-- Particle B (At Rest) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="390" cy="60" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="390" y="100" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">B</text>
  </g>
</svg>
  </div>
</body>
</html>
