<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.040.3.파동_그림-2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-107-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Laser Beam -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="25" y1="100" x2="100" y2="100" stroke="#000000" stroke-width="4" marker-end="url(#arrow-107-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="65" y="70" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">레이저광</text>
  </g>

  <!-- Thin Plate tilted at 45 deg -->
  <!-- Top surface corners: C=(170, 90), D=(185, 105) -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           points="65,195 170,90 185,105 80,210"
           fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="155" y="80" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="200" y="115" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">D</text>
  </g>

  <!-- Axis & Angle theta3 at plate -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="30" x2="180" y2="240" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="120" y1="100" x2="260" y2="100" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="145" y1="135" x2="230" y2="50" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Angle theta3 arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 225 100 A 45 45 0 0 0 215 65" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="240" y="85" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">θ<tspan font-size="13" dy="4">3</tspan></text>
  </g>

  <!-- Thickness d at bottom end -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="210" x2="65" y2="195" stroke="#000000" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="65" y1="225" x2="80" y2="210" stroke="#000000" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="52" y1="205" x2="72" y2="225" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-107-2)" marker-end="url(#arrow-107-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="110" y="245" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">d</text>
  </g>

  <!-- Distance L dimension to screen -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="215" x2="480" y2="215" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-107-2)" marker-end="url(#arrow-107-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="320" y="202" width="20" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="330" y="220" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">L</text>
  </g>

  <!-- Screen Line -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="480" y1="20" x2="480" y2="245" stroke="#000000" stroke-width="2"/>

  <!-- Interference Fringes on Screen -->
  <!-- 8 horizontal black bars -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="30" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="47" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="64" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="81" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="98" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="115" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="132" width="50" height="9" fill="#000000"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="490" y="149" width="50" height="9" fill="#000000"/>

  <!-- Fringe Spacing x -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="69" x2="590" y2="69" stroke="#000000" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="86" x2="590" y2="86" stroke="#000000" stroke-width="1"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="570" y1="69" x2="570" y2="86" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-107-2)" marker-end="url(#arrow-107-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="605" y="84" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">x</text>
  </g>

  <!-- Fringe Label -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="520" y1="205" x2="510" y2="165" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-107-2)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="550" y="225" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">간섭무늬</text>
    <text class="text-el" x="550" y="245" font-family="'Malgun Gothic', sans-serif" font-size="16" text-anchor="middle">(밝은 무늬)</text>
  </g>

  <!-- Caption 그림 2 -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="300" y="285" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">그림 2</text>
  </g>
</svg>
  </div>
</body>
</html>
