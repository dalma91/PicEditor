<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.037.2.전자기_그림-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1596 950" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 1 5 L 9 8 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#000000"/>
    </marker>
    <!-- 음영 스티플 패턴 -->
    <pattern id="metal-stipple" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#555555"/>
      <circle cx="6" cy="2" r="0.9" fill="#555555"/>
      <circle cx="4" cy="6" r="0.9" fill="#555555"/>
    </pattern>
    <pattern id="plate-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#444444"/>
      <circle cx="5" cy="5" r="1.1" fill="#444444"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 32px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 28px; fill: #000000; text-anchor: start; dominant-baseline: central; }
    .korean-center { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 28px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .caption { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .wire { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pointer { stroke: #000000; stroke-width: 1.8; fill: none; marker-end: url(#arrow-end); }
  </style>

  <!-- ========================================== -->
  <!-- 메인 다이어그램 레이어 (모든 요소 순수 벡터 & movable) -->
  <!-- ========================================== -->
  <g class="main-diagram">
    <!-- 1. 고전압 발생 장치 (좌측) -->
    <!-- 지지대 받침 상자 (3D 직육면체) -->
    <!-- 앞면 -->
    <polygon class="movable" points="160,510 360,455 360,635 160,690" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 옆면 -->
    <polygon class="movable" points="360,455 460,490 460,670 360,635" fill="url(#metal-stipple)" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 윗면 -->
    <polygon class="movable" points="160,510 260,475 460,490 360,455" fill="#F5F5F5" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 받침 접지선 및 접지 기호 -->
    <path class="movable wire" d="M 160,630 C 110,630 80,680 70,710" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="30" y1="710" x2="110" y2="710" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="45" y1="725" x2="95" y2="725" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="60" y1="740" x2="80" y2="740" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 절연 주름 기둥 (아코디언 형태 5단) -->
    <rect class="movable" x="245" y="270" width="90" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="290" cy="305" rx="55" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="290" cy="340" rx="55" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="290" cy="375" rx="55" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="290" cy="410" rx="55" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="290" cy="445" rx="55" ry="12" fill="#EAEAEA" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 고전압 도체 구 (상단 구체) -->
    <circle class="movable" cx="290" cy="180" r="100" fill="#E5E5E5" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="290" cy="180" r="100" fill="url(#metal-stipple)" stroke="#000000" stroke-width="3.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 연결 도선 (구체 상단에서 축전기 고정극판 상판 중앙으로) -->
    <path class="movable wire" d="M 320 85 C 480 80 650 250 800 345" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 3. 진동 극판 부착 축전기 (원형 디스크 2개) -->
    <!-- 고정 극판 A (상단) -->
    <ellipse class="movable" cx="800" cy="390" rx="160" ry="55" fill="url(#plate-stipple)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="800" cy="380" rx="160" ry="55" fill="#E5E5E5" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 상판 단자 접속점 -->
    <ellipse class="movable" cx="800" cy="345" rx="16" ry="7" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 진동 극판 B (하단) -->
    <ellipse class="movable" cx="800" cy="520" rx="160" ry="55" fill="url(#plate-stipple)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="800" cy="510" rx="160" ry="55" fill="#EAEAEA" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 하판 중앙 지지축 결합부 -->
    <ellipse class="movable" cx="800" cy="495" rx="20" ry="8" fill="#000000" stroke="#000000" stroke-width="1.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 진동기 기둥 (하판 아래 실린더) -->
    <rect class="movable" x="785" y="580" width="30" height="95" fill="url(#metal-stipple)" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <ellipse class="movable" cx="800" cy="580" rx="15" ry="6" fill="#FFFFFF" stroke="#000000" stroke-width="2.0" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 진동기 상하 진동 화살표 -->
    <line class="movable" x1="860" y1="600" x2="860" y2="710" stroke="#000000" stroke-width="3.0" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 4. 전류계 및 배선 -->
    <!-- 하판에서 전류계로 연결되는 도선 -->
    <path class="movable wire" d="M 645 525 C 600 580 610 680 600 720" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전류계 본체 상자 (3D 형태) -->
    <polygon class="movable" points="550,710 660,710 660,820 550,820" fill="#EAEAEA" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="550,710 590,670 700,670 660,710" fill="#F5F5F5" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="660,710 700,670 700,780 660,820" fill="#D5D5D5" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 전류계 눈금 창 및 바늘 -->
    <path class="movable" d="M 565 770 A 50 30 0 0 1 645 770 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="605" y1="770" x2="620" y2="745" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 전류계 접지선 및 접지 기호 -->
    <path class="movable wire" d="M 660,740 C 700,730 730,770 735,820" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="710" y1="820" x2="760" y2="820" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="720" y1="832" x2="750" y2="832" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable" x1="730" y1="844" x2="740" y2="844" stroke="#000000" stroke-width="3.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 5. 지시 화살표들 -->
    <!-- 고정 극판 가리키는 화살표 -->
    <line class="movable pointer" x1="1040" y1="365" x2="940" y2="380" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 진동 극판 가리키는 화살표 -->
    <line class="movable pointer" x1="1040" y1="535" x2="940" y2="520" transform="translate(0,0) scale(1,1) rotate(0)"/>
  </g>

  <!-- ========================================== -->
  <!-- 텍스트 레이어 (배경 차폐 박스 및 폰트 표준화)   -->
  <!-- ========================================== -->
  <g class="text-layer">
    <!-- 고전압 발생 장치 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="175" y="735" width="230" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean-center" x="290" y="755">고전압 발생 장치</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="120" y="785" width="340" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean-center" x="290" y="805">(양(+)전압 <tspan class="math">V</tspan>를 발생시킴)</text>
    </g>

    <!-- 진동 극판 부착 축전기 상단 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="840" y="160" width="300" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="850" y="180">진동 극판 부착</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="850" y="210" width="160" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="860" y="230">축전기</text>
    </g>

    <!-- 고정 극판 (축전기 A) 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1050" y="325" width="200" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="1060" y="345">고정 극판</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1070" y="375" width="240" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="1080" y="395">(축전기 A)</text>
    </g>

    <!-- 진동 극판 (축전기 B) 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1050" y="495" width="200" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="1060" y="515">진동 극판</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="1070" y="545" width="240" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="1080" y="565">(축전기 B)</text>
    </g>

    <!-- 진동기 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="895" y="630" width="120" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="905" y="650">진동기</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="915" y="685" width="360" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="925" y="705">(진동 극판을 상하로</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="925" y="735" width="300" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean" x="935" y="755">진동시키는 장치)</text>
    </g>

    <!-- 전류계 라벨 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="555" y="830" width="110" height="40" fill="#FFFFFF" stroke="none"/>
      <text class="korean-center" x="610" y="850">전류계</text>
    </g>

    <!-- 캡션 '그림 1' (원본 図 1 치환) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="740" y="885" width="120" height="45" fill="#FFFFFF" stroke="none"/>
      <text class="caption" x="800" y="908">그림 1</text>
    </g>
  </g>
</svg>
</body>
