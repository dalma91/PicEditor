<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0017_2002-1.095.4.열역학_그림</title>
</head>
<body>
<svg viewBox="0 0 650 360" width="650" height="360" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
    <pattern id="dot-piston" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#555555" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 직육면체 실린더 외곽 투시도 -->
    <path class="movable" d="M 70,165 L 215,165 L 500,75 L 355,75 Z" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 70,165 L 70,305 L 215,305 L 215,165" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <path class="movable" d="M 215,305 L 500,215 L 500,75" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 내부 점선 투시 -->
    <path class="movable" d="M 70,305 L 355,215 L 500,215 M 355,215 L 355,75" fill="none" stroke="#000000" stroke-width="2.2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 피스톤 사각 단면 (점박이 채우기) -->
    <polygon class="movable" points="168,135 168,275 315,275 315,135" fill="url(#dot-piston)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 피스톤 로드 및 x축 화살표 -->
    <line class="movable" x1="235" y1="205" x2="635" y2="70" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="550" y1="75" x2="620" y2="52" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 치수선 L들 -->
    <!-- 높이 L -->
    <line class="movable" x1="25" y1="165" x2="68" y2="165" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="25" y1="305" x2="68" y2="305" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="38" y1="165" x2="38" y2="305" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 바닥 가로 L -->
    <line class="movable" x1="70" y1="330" x2="215" y2="330" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 피스톤 위치 L -->
    <line class="movable" x1="215" y1="305" x2="315" y2="275" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="25" y="245" font-family="'Times New Roman', serif" font-size="44" font-style="italic">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="140" y="345" font-family="'Times New Roman', serif" font-size="44" font-style="italic">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="270" y="305" font-family="'Times New Roman', serif" font-size="44" font-style="italic">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="160" y="190" font-family="'Batang', serif" font-size="34" font-weight="bold">피스톤</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="460" y="280" font-family="'Batang', serif" font-size="34" font-weight="bold">실린더</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="550" y="45" font-family="'Batang', serif" font-size="34" font-weight="bold"><tspan font-family="'Times New Roman', serif" font-style="italic">x</tspan>축</text></g>
  </g>
</svg>
</body>
</html>
