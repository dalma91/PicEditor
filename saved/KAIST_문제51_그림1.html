<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>

      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Support Wedge a under A (60, 140) -->

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="152" x2="105" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51-1)"/>

  <!-- Support Wedge b under B (400, 140) -->

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="385" y1="152" x2="355" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51-1)"/>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="280" y1="140" x2="280" y2="155" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension L above rod -->

  <!-- Dimension d1 -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 60 165 Q 170 225 280 155" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension d2 -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 150 155 Q 215 190 280 155" fill="none" stroke="#000000" stroke-width="1.5"/>

  <g class="movable text-wrap" transform="translate(42, 135) scale(1,1) rotate(0)">
