<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="100%" height="100%">
  <defs>
    <marker id="arrow-axis22" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-s22" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#000000"/>
    </marker>
    <marker id="dim-e22" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Left Wall and Floor and Right Wall -->
  <!-- Top lip left wall: (25, 25) to (80, 25) down to (80, 180) -->
  <polyline class="movable" points="25,25 80,25 80,180 540,180" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-axis22)" transform="translate(0,0) scale(1,1) rotate(0)"/>
  <!-- Right wall: (510, 25) down to (510, 180), top lip to (565, 25) -->
  <polyline class="movable" points="565,25 510,25 510,180" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Spring fixed base at left wall -->
  <line class="movable" x1="80" y1="160" x2="80" y2="176" stroke="#000000" stroke-width="4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Spring -->
  <path class="movable" d="M 80.0 168.0 Q 90.0 168.0 94.3 177.0 Q 101.7 168.0 102.9 159.0 Q 104.0 168.0 111.4 177.0 Q 118.9 168.0 120.0 159.0 Q 121.1 168.0 128.6 177.0 Q 136.0 168.0 137.1 159.0 Q 138.3 168.0 145.7 177.0 Q 153.2 168.0 154.3 159.0 Q 155.4 168.0 162.9 177.0 Q 170.3 168.0 171.4 159.0 Q 172.6 168.0 180.0 177.0 Q 187.4 168.0 188.6 159.0 Q 189.7 168.0 197.1 177.0 Q 204.6 168.0 205.7 159.0 Q 210.0 168.0 220.0 168.0 L 220.0 168.0" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Plate m -->
  <rect class="movable" x="220" y="156" width="6" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Block M -->
  <rect class="movable" x="226" y="150" width="28" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Vertical dashed line for natural length O -->
  <line class="movable" x1="280" y1="75" x2="280" y2="185" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension L (Natural length) -->
  <line class="movable" x1="80" y1="80" x2="280" y2="80" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s22)" marker-end="url(#dim-e22)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension W (Total wall width) -->
  <line class="movable" x1="80" y1="40" x2="510" y2="40" stroke="#000000" stroke-width="1.2" marker-start="url(#dim-s22)" marker-end="url(#dim-e22)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- W -->
  <g class="movable text-wrap" transform="translate(295, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-12" width="30" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">W</text>
  </g>

  <!-- L -->
  <g class="movable text-wrap" transform="translate(180, 65) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-15" y="-12" width="30" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">L</text>
  </g>

  <!-- 왼쪽 벽 -->
  <g class="movable text-wrap" transform="translate(60, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-24" width="40" height="48" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-10" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">왼쪽</text>
    <text class="text-el" x="0" y="12" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">벽</text>
  </g>

  <!-- 오른쪽 벽 -->
  <g class="movable text-wrap" transform="translate(535, 95) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-20" y="-24" width="40" height="48" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-10" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">오른쪽</text>
    <text class="text-el" x="0" y="12" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">벽</text>
  </g>

  <!-- m (Plate) -->
  <g class="movable text-wrap" transform="translate(216, 138) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- M (Block) -->
  <g class="movable text-wrap" transform="translate(242, 135) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">M</text>
  </g>

  <!-- O (Origin) -->
  <g class="movable text-wrap" transform="translate(280, 202) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- x (Axis) -->
  <g class="movable text-wrap" transform="translate(555, 178) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>

  <!-- 수평이고 매끄러운 바닥면 -->
  <g class="movable text-wrap" transform="translate(130, 204) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-85" y="-12" width="170" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="16" fill="#000000">수평이고 매끄러운 바닥면</text>
  </g>
</svg>
</body>
</html>
