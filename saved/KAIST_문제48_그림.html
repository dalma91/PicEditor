<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-48" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Upper Electrode (grounded at 0): y=160, x=45..370 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="160" x2="370" y2="160" stroke="#000000" stroke-width="4.5"/>
  <!-- x-axis extension along upper electrode to right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="370" y1="160" x2="415" y2="160" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-48)"/>

  <!-- Ground symbol on left of upper electrode -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="55" y1="160" x2="55" y2="135" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="135" x2="70" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="46" y1="129" x2="64" y2="129" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="51" y1="123" x2="59" y2="123" stroke="#000000" stroke-width="1.5"/>

  <!-- Lower Electrode (potential V): y=250, x=45..370 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="250" x2="370" y2="250" stroke="#000000" stroke-width="4.5"/>

  <!-- Battery V between electrodes on left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="55" y1="160" x2="55" y2="200" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="200" x2="70" y2="200" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="46" y1="208" x2="64" y2="208" stroke="#000000" stroke-width="4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="55" y1="208" x2="55" y2="250" stroke="#000000" stroke-width="1.8"/>

  <!-- Distance d between plates -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="95" y1="165" x2="95" y2="245" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-48)" marker-end="url(#arrow-48)"/>

  <!-- Normal / y-axis through Origin O (190, 160) -->
  <!-- Normal upwards (thin line) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="160" x2="190" y2="25" stroke="#444444" stroke-width="1.2"/>
  <!-- y-axis downwards from O -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="190" y1="160" x2="190" y2="415" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-48)"/>

  <!-- Electron Incident Trajectory: from (80, 45) to O (190, 160) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="80" y1="45" x2="190" y2="160" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="108" y1="74" x2="128" y2="95" stroke="#000000" stroke-width="2" marker-end="url(#arrow-48)"/>

  <!-- Electron Mass and Charge at (80, 45) -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="80" cy="45" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Angle of incidence i arc at O -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 190 120 A 40 40 0 0 0 162 131" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Electron Refraction in Region II and exit into Region III: -->
  <!-- Exit point on lower electrode at x=235, y=250 -->
  <!-- Trajectory in Region II: parabola from (190, 160) to (235, 250) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 190 160 Q 210 210 235 250" fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- Vertical dashed normal at exit point (235, 250) downwards -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="235" y1="250" x2="235" y2="415" stroke="#444444" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Refracted ray into Region III from (235, 250) to (290, 375) (angle r to normal) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="235" y1="250" x2="290" y2="375" stroke="#000000" stroke-width="2" marker-end="url(#arrow-48)"/>

  <!-- Angle of refraction r arc -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 235 295 A 45 45 0 0 0 252 289" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- LABELS -->
  <!-- -e, m above electron -->
  <g class="movable text-wrap" transform="translate(90, 30) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" fill="#000000">⁻<tspan font-style="italic">e</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(60, 52) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- v (incident speed) -->
  <g class="movable text-wrap" transform="translate(138, 80) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">v</text>
  </g>

  <!-- i (incidence angle) -->
  <g class="movable text-wrap" transform="translate(172, 115) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">i</text>
  </g>

  <!-- O -->
  <g class="movable text-wrap" transform="translate(202, 148) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">O</text>
  </g>

  <!-- x, y -->
  <g class="movable text-wrap" transform="translate(425, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>
  <g class="movable text-wrap" transform="translate(190, 430) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">y</text>
  </g>

  <!-- 0, V potentials on left -->
  <g class="movable text-wrap" transform="translate(25, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">0</text>
  </g>
  <g class="movable text-wrap" transform="translate(25, 250) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">V</text>
  </g>

  <!-- d (distance) -->
  <g class="movable text-wrap" transform="translate(112, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">d</text>
  </g>

  <!-- r (refraction angle) -->
  <g class="movable text-wrap" transform="translate(245, 312) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-10" width="16" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">r</text>
  </g>

  <!-- Regions I, II, III -->
  <g class="movable text-wrap" transform="translate(350, 110) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#000000">Ⅰ</text>
  </g>
  <g class="movable text-wrap" transform="translate(350, 205) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#000000">Ⅱ</text>
  </g>
  <g class="movable text-wrap" transform="translate(350, 300) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#000000">Ⅲ</text>
  </g>
</svg>
</body>
</html>
