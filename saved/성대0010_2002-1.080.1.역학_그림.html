<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0010_2002-1.080.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 650 980" width="650" height="980" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
    <pattern id="wedge-dot" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#555555" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 상단 뷰: 외부 원 궤적 (실선) -->
    <circle class="movable" cx="300" cy="330" r="270" fill="none" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- 상단 뷰: 내부 원 궤적 (점선) -->
    <circle class="movable" cx="300" cy="330" r="150" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 상단 뷰: 중심점 O -->
    <circle class="movable" cx="300" cy="330" r="5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 상단 뷰: 회전 반지름 r 양방향 화살표 -->
    <line class="movable" x1="300" y1="330" x2="450" y2="330" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 상단 뷰: 물체 G (사각형) 및 속도 v 화살표 -->
    <rect class="movable" x="425" y="300" width="45" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="450" cy="330" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="450" y1="300" x2="450" y2="255" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 상단-하단 연장 수직 보조선들 -->
    <line class="movable" x1="300" y1="330" x2="300" y2="920" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="570" y1="330" x2="570" y2="805" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 뷰: 경사면 쐐기 (삼각형) -->
    <polygon class="movable" points="300,920 570,805 570,920" fill="url(#wedge-dot)" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 뷰: 경사면 위 X축 및 Y축 화살표 -->
    <line class="movable" x1="300" y1="920" x2="595" y2="795" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="440" y1="860" x2="405" y2="720" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 뷰: 경사각 alpha 호 -->
    <path class="movable" d="M 340,920 A 40 40 0 0 0 338,903" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 뷰: 물체 G (경사진 사각형) -->
    <rect class="movable" x="420" y="835" width="45" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="rotate(-23 442 850)" />
    <circle class="movable" cx="442" cy="850" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 뷰: 회전 반지름 r 양방향 화살표 -->
    <line class="movable" x1="300" y1="850" x2="442" y2="850" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="280" y="340" font-family="'Times New Roman', serif" font-size="44" text-anchor="end">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="375" y="300" font-family="'Batang', serif" font-size="30" font-weight="bold" text-anchor="middle">회전 반지름</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="375" y="325" font-family="'Times New Roman', serif" font-size="38" font-style="italic" text-anchor="middle">r</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="450" y="355" font-family="'Times New Roman', serif" font-size="32" font-weight="bold" text-anchor="middle">G</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="515" y="280" font-family="'Batang', serif" font-size="32" font-weight="bold">속도 <tspan font-family="'Times New Roman', serif" font-style="italic">v</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="295" y="955" font-family="'Times New Roman', serif" font-size="44" text-anchor="middle">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="370" y="805" font-family="'Batang', serif" font-size="28" font-weight="bold" text-anchor="middle">회전 반지름</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="370" y="840" font-family="'Times New Roman', serif" font-size="36" font-style="italic" text-anchor="middle">r</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="375" y="915" font-family="'Times New Roman', serif" font-size="32" font-style="italic">α</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="445" y="820" font-family="'Times New Roman', serif" font-size="34" font-weight="bold">G</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="600" y="825" font-family="'Times New Roman', serif" font-size="40">X</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="390" y="725" font-family="'Times New Roman', serif" font-size="40">Y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="300" y="975" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 1 - 1</text></g>
  </g>
</svg>
</body>
</html>
