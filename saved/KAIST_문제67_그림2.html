<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%">
  <defs>
    <marker id="arrow-67-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ==================== PANEL 1: t < 0 ==================== -->
  <g transform="translate(20, 0)">
    <g class="movable text-wrap" transform="translate(60, 20)">
      <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15" font-weight="bold">왼쪽으로 운동</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="90" y1="42" x2="60" y2="42" stroke="#000000" stroke-width="2" marker-end="url(#arrow-67-2)"/>

    <!-- Axes -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="20" y1="180" x2="20" y2="35" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(12, 20)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">y</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="10" y1="180" x2="190" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(195, 172)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">x</text>
    </g>

    <!-- Wedge -->
    <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
             points="45,65 45,180 170,180" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <!-- String & Block -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="45" y1="62" x2="80" y2="94" stroke="#000000" stroke-width="1.5"/>
    <rect class="movable" transform="translate(80,94) rotate(42.5) translate(-6,-9)"
          x="0" y="0" width="12" height="9" fill="#000000"/>

    <g class="movable text-wrap" transform="translate(90, 195)">
      <text class="text-el" x="0" y="18" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">t &lt; 0</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: t = 0 ==================== -->
  <g transform="translate(280, 0)">
    <g class="movable text-wrap" transform="translate(60, 20)">
      <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15" font-weight="bold">순간 정지</text>
    </g>

    <!-- Axes -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="20" y1="180" x2="20" y2="35" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(12, 20)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">y</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="10" y1="180" x2="190" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(195, 172)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">x</text>
    </g>

    <!-- Wedge -->
    <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
             points="45,65 45,180 170,180" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <!-- Cut String -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="45" y1="62" x2="72" y2="87" stroke="#000000" stroke-width="1.5"/>
    <rect class="movable" transform="translate(80,94) rotate(42.5) translate(-6,-9)"
          x="0" y="0" width="12" height="9" fill="#000000"/>
    <g class="movable text-wrap" transform="translate(95, 78)">
      <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="16">(<tspan font-style="italic">x</tspan><tspan dy="3" font-size="11">0</tspan><tspan dy="-3">, </tspan><tspan font-style="italic">y</tspan><tspan dy="3" font-size="11">0</tspan>)</text>
    </g>

    <g class="movable text-wrap" transform="translate(90, 195)">
      <text class="text-el" x="0" y="18" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">t = 0</text>
    </g>
    <!-- Caption -->
    <g class="movable text-wrap" transform="translate(90, 235)">
      <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: t > 0 ==================== -->
  <g transform="translate(540, 0)">
    <g class="movable text-wrap" transform="translate(60, 20)">
      <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="15" font-weight="bold">오른쪽으로 운동</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="60" y1="42" x2="90" y2="42" stroke="#000000" stroke-width="2" marker-end="url(#arrow-67-2)"/>

    <!-- Axes -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="20" y1="180" x2="20" y2="35" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(12, 20)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">y</text>
    </g>
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="10" y1="180" x2="190" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-67-2)"/>
    <g class="movable text-wrap" transform="translate(195, 172)">
      <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">x</text>
    </g>

    <!-- Wedge -->
    <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
             points="45,65 45,180 170,180" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <!-- Block sliding down without string -->
    <rect class="movable" transform="translate(100,115) rotate(42.5) translate(-6,-9)"
          x="0" y="0" width="12" height="9" fill="#000000"/>
    <!-- Motion arrow down the slope -->
    <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          x1="105" y1="100" x2="125" y2="118" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-67-2)"/>

    <g class="movable text-wrap" transform="translate(90, 195)">
      <text class="text-el" x="0" y="18" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">t &gt; 0</text>
    </g>
  </g>
</svg>
</body>
</html>
