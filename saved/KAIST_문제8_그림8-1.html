<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제8_그림8-1</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 545 585" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 일반 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <!-- 굵은 속도 화살표 마커 -->
    <marker id="bold-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 16px; font-style: normal; }
    .orbit-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 원형 궤도 (반경 a = 235, 중심 (270, 330)) -->
    <!-- ========================================== -->
    <circle class="movable orbit-line" cx="270" cy="330" r="235" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 행성 (반경 R = 75, 질량 M, 중심 C=(270, 330)) -->
    <!-- ========================================== -->
    <circle class="movable" cx="270" cy="330" r="75" fill="#DCDCDC" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <circle class="movable" cx="270" cy="330" r="4" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 기준 보조선 및 반경 R, a 곡선 치수선 -->
    <!-- ========================================== -->
    <!-- 중심에서 궤도 좌하단 방사선 -->
    <line class="movable dash-line" x1="270" y1="330" x2="104" y2="496" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 반경 R 표시 호 -->
    <path class="movable" d="M 270 330 C 240 330, 215 365, 217 383" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 궤도 반경 a 표시 호 -->
    <path class="movable" d="M 270 330 C 270 415, 230 520, 104 496" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 발사 수직 점선 -->
    <line class="movable dash-line" x1="270" y1="215" x2="270" y2="115" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 표면의 우주선 (질량 m, 발사 속도 V1) -->
    <!-- 위치: x=270, y=255 -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(270, 255)">
      <path d="M -15 0 L -15 -22 A 15 15 0 0 1 15 -22 L 15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <path d="M -11 -22 A 11 11 0 0 1 11 -22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M -15 -10 L -23 0 L -15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M 15 -10 L 23 0 L 15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- 속도 V1 화살표 (우측, 상향) -->
    <line class="movable" x1="325" y1="245" x2="325" y2="195" stroke="#000000" stroke-width="5" marker-end="url(#bold-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 궤도 상의 우주선 (속도 V2) -->
    <!-- 위치: x=270, y=95 -->
    <!-- ========================================== -->
    <g class="movable" transform="translate(270, 95) rotate(-90)">
      <path d="M -15 0 L -15 -22 A 15 15 0 0 1 15 -22 L 15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
      <path d="M -11 -22 A 11 11 0 0 1 11 -22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M -15 -10 L -23 0 L -15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <path d="M 15 -10 L 23 0 L 15 0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- 속도 V2 화살표 (상단, 좌향) -->
    <line class="movable" x1="290" y1="45" x2="245" y2="45" stroke="#000000" stroke-width="5" marker-end="url(#bold-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 6. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- V2 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="302" y="32" width="30" height="24" fill="#FFFFFF"/>
      <text class="math" x="317" y="44">V<tspan class="sub" dy="4">2</tspan></text>
    </g>

    <!-- m -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="220" y="218" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="231" y="230">m</text>
    </g>

    <!-- V1 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="340" y="215" width="30" height="24" fill="#FFFFFF"/>
      <text class="math" x="355" y="227">V<tspan class="sub" dy="4">1</tspan></text>
    </g>

    <!-- R -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="215" y="328" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="226" y="340">R</text>
    </g>

    <!-- C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="282" y="318" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="293" y="330">C</text>
    </g>

    <!-- M -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="352" y="332" width="24" height="24" fill="#FFFFFF"/>
      <text class="math" x="364" y="344">M</text>
    </g>

    <!-- a -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="226" y="455" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="236" y="467">a</text>
    </g>
  </g>
</svg>
</body>
</html>
