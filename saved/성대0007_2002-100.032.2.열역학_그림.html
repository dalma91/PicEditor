<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0007_2002-100.032.2.열역학_그림</title>
</head>
<body>
<svg viewBox="0 0 720 800" width="720" height="800" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <pattern id="cylinder-wall" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#666666" />
    </pattern>
    <pattern id="piston-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1.8" />
    </pattern>
  </defs>

  <g class="main-diagram">
    <!-- 실린더 본체 벽 (ㄷ자 형태) -->
    <path class="movable" d="M 110,170 L 130,170 L 130,590 L 460,590 L 460,170 L 480,170 L 480,610 L 110,610 Z" fill="url(#cylinder-wall)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <rect class="movable" x="130" y="235" width="330" height="22" fill="url(#piston-hatch)" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 피스톤 위 추 -->
    <rect class="movable" x="230" y="195" width="130" height="40" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 피스톤 지시 화살표 -->
    <line class="movable" x1="440" y1="125" x2="410" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 우측 냉각수 관 -->
    <path class="movable" d="M 540,330 L 420,330 L 420,520 L 540,520" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 냉각수 출입 화살표 -->
    <line class="movable" x1="535" y1="337" x2="600" y2="337" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="600" y1="512" x2="540" y2="512" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 발열선 (저항 지그재그) -->
    <path class="movable" d="M 170,570 L 170,545 L 195,545 L 205,520 L 220,570 L 235,520 L 250,570 L 265,520 L 280,570 L 295,520 L 310,570 L 320,545 L 355,545 L 355,570" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 하단 외부 전기 회로선 -->
    <line class="movable" x1="170" y1="570" x2="170" y2="700" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="170" y1="700" x2="230" y2="700" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 전원 (배터리 기호) -->
    <line class="movable" x1="230" y1="680" x2="230" y2="720" stroke="#000000" stroke-width="3" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="242" y1="690" x2="242" y2="710" stroke="#000000" stroke-width="4.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="242" y1="700" x2="355" y2="700" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    
    <!-- 스위치 접점 -->
    <line class="movable" x1="355" y1="700" x2="355" y2="655" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="355" cy="650" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="355" cy="615" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="355" y1="650" x2="370" y2="618" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="355" y1="615" x2="355" y2="570" stroke="#000000" stroke-width="2.2" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="295" y="170" font-family="'Batang', serif" font-size="32" font-weight="bold" text-anchor="middle">추</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="85" font-family="'Batang', serif" font-size="32" font-weight="bold">피스톤 (단면적 S)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="250" y="340" font-family="'Times New Roman', serif" font-size="44" font-style="italic">T<tspan font-size="26" dy="10">1</tspan><tspan font-size="44" dy="-10">,  V<tspan font-size="26" dy="10">1</tspan></tspan></text></g>

    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="260" y="495" font-family="'Batang', serif" font-size="34" font-weight="bold" text-anchor="middle">발열선</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="580" y="450" font-family="'Batang', serif" font-size="36" font-weight="bold">냉각수</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="390" y="640" font-family="'Batang', serif" font-size="32" font-weight="bold">스위치</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="235" y="760" font-family="'Batang', serif" font-size="34" font-weight="bold" text-anchor="middle">전원</text></g>
