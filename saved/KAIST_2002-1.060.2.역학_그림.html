<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2002-1.060.2.역학_그림</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }
    .svg-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" height="100%">
  <defs>
    <marker id="arrow-110" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Floor Line: from x=15 to 615 at y=190 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="15" y1="190" x2="615" y2="190" stroke="#000000" stroke-width="2"/>

  <!-- Incline 30 deg to Floor at P=(210, 190) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="15" y1="80" x2="210" y2="190" stroke="#000000" stroke-width="2.5"/>

  <!-- Incline Angle Arc 30 deg -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 180 190 A 30 30 0 0 1 168 168" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="135" y="185" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">30°</text>
  </g>

  <!-- Vertical Wall at Q=(580, 190) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="580" y1="190" x2="580" y2="30" stroke="#000000" stroke-width="2.5"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="602" y="70" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="20" text-anchor="middle">벽</text>
  </g>

  <!-- Points P, O, Q on Floor -->
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="210" y="225" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">P</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="395" y="225" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">O</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="580" y="225" font-family="'Times New Roman', serif" font-size="22" text-anchor="middle">Q</text>
  </g>

  <!-- Block A of mass m at height h on incline -->
  <g class="movable" transform="translate(68, 110) rotate(-29)">
    <rect x="-14" y="-28" width="28" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="85" y="60" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">m</text>
  </g>

  <!-- Height h Dimension -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="15" y1="110" x2="68" y2="110" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="35" y1="110" x2="35" y2="190" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-110)" marker-end="url(#arrow-110)"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="26" y="142" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="35" y="158" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">h</text>
  </g>

  <!-- Block B of mass M at Point O -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="380" y="160" width="30" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="395" y="182" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <text class="text-el" x="395" y="150" font-family="'Times New Roman', serif" font-style="italic" font-size="22" text-anchor="middle">M</text>
  </g>

  <!-- Curved Distance l Brackets -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 210 190 Q 302 220 395 190" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="295" y="196" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="303" y="212" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">l</text>
  </g>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 395 190 Q 487 220 580 190" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="482" y="196" width="16" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="490" y="212" font-family="'Times New Roman', serif" font-style="italic" font-size="20" text-anchor="middle">l</text>
  </g>
</svg>
  </div>
</body>
</html>
