<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-35" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Hatch Pattern for Floor -->
    <pattern id="hatch-35" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#777777" stroke-width="1.2"/>
    </pattern>
    <!-- Crosshatch for Block A -->
    <pattern id="crosshatch-35" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#444444" stroke-width="1"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#444444" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Left Wall -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="20" x2="45" y2="140" stroke="#000000" stroke-width="3"/>

  <!-- Floor line at y=140 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="45" y1="140" x2="520" y2="140" stroke="#000000" stroke-width="2.5"/>
  <!-- Floor hatching -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="45" y="140" width="455" height="18" fill="url(#hatch-35)"/>

  <!-- Coordinate x-axis along the floor line pointing right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="450" y1="140" x2="540" y2="140" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-35)"/>

  <!-- Spring: horizontal zigzag from (45, 115) to (420, 115) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 45 115 L 60 115 L 67.8 101.0 L 75.7 115.0 L 83.5 129.0 L 91.4 115.0 L 99.2 101.0 L 107.0 115.0 L 114.9 129.0 L 122.7 115.0 L 130.6 101.0 L 138.4 115.0 L 146.3 129.0 L 154.1 115.0 L 161.9 101.0 L 169.8 115.0 L 177.6 129.0 L 185.5 115.0 L 193.3 101.0 L 201.1 115.0 L 209.0 129.0 L 216.8 115.0 L 224.7 101.0 L 232.5 115.0 L 240.3 129.0 L 248.2 115.0 L 256.0 101.0 L 263.9 115.0 L 271.7 129.0 L 279.5 115.0 L 287.4 101.0 L 295.2 115.0 L 303.1 129.0 L 310.9 115.0 L 318.8 101.0 L 326.6 115.0 L 334.4 129.0 L 342.3 115.0 L 350.1 101.0 L 358.0 115.0 L 365.8 129.0 L 373.6 115.0 L 381.5 101.0 L 389.3 115.0 L 397.2 129.0 L 405.0 115.0 L 420 115" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Block A at (420, 88), width 52, height 52 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="420" y="88" width="52" height="52" fill="url(#crosshatch-35)" stroke="#000000" stroke-width="2"/>

  <!-- Axis Ticks & Position Marks -->
  <!-- x1 tick at x=230 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="230" y1="135" x2="230" y2="145" stroke="#000000" stroke-width="2"/>
  <!-- 0 (Equilibrium) tick at x=330 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="330" y1="135" x2="330" y2="145" stroke="#000000" stroke-width="2"/>
  <!-- x0 tick at x=446 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="446" y1="135" x2="446" y2="145" stroke="#000000" stroke-width="2"/>

  <!-- LABELS -->
  <!-- A -->
  <g class="movable text-wrap" transform="translate(446, 68) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" font-weight="bold" fill="#000000">A</text>
  </g>

  <!-- x1 -->
  <g class="movable text-wrap" transform="translate(230, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">x<tspan font-size="14" dy="3">1</tspan></text>
  </g>

  <!-- 0 -->
  <g class="movable text-wrap" transform="translate(330, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" fill="#000000">0</text>
  </g>

  <!-- x0 -->
  <g class="movable text-wrap" transform="translate(446, 168) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">x<tspan font-size="14" dy="3">0</tspan></text>
  </g>

  <!-- x axis label -->
  <g class="movable text-wrap" transform="translate(545, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">x</text>
  </g>
</svg>
</body>
</html>
