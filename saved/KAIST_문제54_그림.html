<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-54" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ==================== PANEL 1: 그림 1 ==================== -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 175 42 C 160 55, 148 65, 138 72 C 132 76, 128 82, 132 87 C 136 91, 142 88, 146 82 L 152 74 C 158 84, 168 70, 185 52"
        fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="140" cy="80" r="3" fill="#000000"/>

  <!-- Two hanging strings -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="140" y1="80" x2="105" y2="295" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="140" y1="80" x2="175" y2="295" stroke="#000000" stroke-width="2"/>

  <!-- Balls of mass m -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="105" cy="305" r="14" fill="#000000"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="175" cy="305" r="14" fill="#000000"/>

  <g class="movable text-wrap" transform="translate(95, 330)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">m</text>
  </g>
  <g class="movable text-wrap" transform="translate(165, 330)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">m</text>
  </g>

  <!-- Dimension arcs for string lengths l -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 132 85 C 105 150, 95 230, 100 285" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <g class="movable text-wrap" transform="translate(100, 175)">
    <rect class="text-bg-rect" x="0" y="0" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="9" y="17" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">l</text>
  </g>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 148 85 C 175 150, 185 230, 180 285" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <g class="movable text-wrap" transform="translate(168, 175)">
    <rect class="text-bg-rect" x="0" y="0" width="18" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="9" y="17" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">l</text>
  </g>

  <!-- Caption 그림 1 -->
  <g class="movable text-wrap" transform="translate(140, 380)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 1</text>
  </g>


  <!-- ==================== PANEL 2: 그림 2 ==================== -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 465 175 C 450 185, 438 193, 428 199 C 423 203, 420 208, 424 212 C 428 215, 433 213, 436 208 L 442 201 C 448 209, 458 198, 475 183"
        fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="430" cy="205" r="3" fill="#000000"/>

  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="430" y1="50" x2="430" y2="360" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="430" cy="205" r="150" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Left string & ball -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="430" y1="205" x2="324" y2="311" stroke="#000000" stroke-width="2.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="324" cy="311" r="12" fill="#000000"/>

  <!-- Right string & ball -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="430" y1="205" x2="536" y2="311" stroke="#000000" stroke-width="2.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
          cx="536" cy="311" r="12" fill="#000000"/>

  <!-- Motion arrows along circular arc -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="310" y1="330" x2="295" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-54)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="550" y1="330" x2="565" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-54)"/>

  <!-- Angle theta arcs -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 430 270 A 65 65 0 0 1 384 251" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-54)" marker-end="url(#arrow-54)"/>
  <g class="movable text-wrap" transform="translate(390, 260)">
    <text class="text-el" x="10" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 430 270 A 65 65 0 0 0 476 251" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-54)" marker-end="url(#arrow-54)"/>
  <g class="movable text-wrap" transform="translate(450, 260)">
    <text class="text-el" x="10" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <!-- Caption 그림 2 -->
  <g class="movable text-wrap" transform="translate(430, 380)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 2</text>
  </g>
</svg>
</body>
</html>
