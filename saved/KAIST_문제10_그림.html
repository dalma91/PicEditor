<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제10_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 600 390" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 양방향 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 24px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .ceiling-line { stroke: #000000; stroke-width: 3; fill: none; }
    .floor-line { stroke: #000000; stroke-width: 1.8; fill: none; }
    .string-line { stroke: #000000; stroke-width: 1.8; fill: none; }
    .dim-line { stroke: #000000; stroke-width: 1.2; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. 천장 및 바닥면 -->
    <!-- ========================================== -->
    <line class="movable ceiling-line" x1="15" y1="45" x2="585" y2="45" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable floor-line" x1="15" y1="365" x2="585" y2="365" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 2. 진자 A (V자형 2줄 지지 진자) -->
    <!-- 천장 고정점 P(55, 45), Q(470, 45) -->
    <!-- 공 A: (262, 240) -->
    <!-- ========================================== -->
    <line class="movable string-line" x1="55" y1="45" x2="262" y2="240" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <line class="movable string-line" x1="470" y1="45" x2="262" y2="240" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 수직 중심 점선 -->
    <line class="movable dash-line" x1="262" y1="120" x2="262" y2="240" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 각도 theta 호 -->
    <!-- 좌측 각도 theta (반경 55) -->
    <path class="movable" d="M 223 203 A 55 55 0 0 1 262 185" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 우측 각도 theta (반경 55) -->
    <path class="movable" d="M 262 185 A 55 55 0 0 1 301 203" stroke="#000000" stroke-width="1.2" fill="none" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 공 A (반지름 12, 회색 음영) -->
    <circle class="movable" cx="262" cy="240" r="12" fill="#888888" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 진자줄 길이 l 치수선 (우측 줄과 평행) -->
    <!-- 줄 벡터: (470-262, 45-240) = (208, -195), 법선: (195, 208) 정규화 -> 오프셋 약 25px -->
    <!-- 평행 치수선: (297, 273) ~ (498, 85) -->
    <line class="movable dim-line" x1="297" y1="273" x2="498" y2="85" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 충돌 궤적 및 바닥의 용수철-두 공 진동자 -->
    <!-- ========================================== -->
    <!-- A의 충돌 낙하 궤적 (점선 호 -> B) -->
    <path class="movable dash-line" d="M 350 325 C 410 335, 445 350, 465 353" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥의 공 B: x=480, y=353, r=12 -->
    <circle class="movable" cx="480" cy="353" r="12" fill="#888888" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 공 B와 C 사이의 용수철 (x=492 ~ 556, 중심 y=353) -->
    <path class="movable" d="M 492 353 L 498 353 L 502 344 L 507 362 L 512 344 L 517 362 L 522 344 L 527 362 L 532 344 L 537 362 L 542 344 L 546 362 L 550 353 L 556 353" stroke="#000000" stroke-width="1.8" fill="none" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 바닥의 공 C: x=568, y=353, r=12 -->
    <circle class="movable" cx="568" cy="353" r="12" fill="#888888" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 천장-바닥 높이 l 치수선 (좌측 외곽) -->
    <!-- ========================================== -->
    <line class="movable dim-line" x1="24" y1="47" x2="24" y2="363" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 5. 텍스트 라벨 (text-wrap & text-bg-rect) -->
    <!-- ========================================== -->
    <!-- P -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="44" y="16" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="55" y="28">P</text>
    </g>

    <!-- Q -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="459" y="16" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="470" y="28">Q</text>
    </g>

    <!-- theta (좌측) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="220" y="158" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="231" y="170">θ</text>
    </g>

    <!-- theta (우측) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="282" y="158" width="22" height="24" fill="#FFFFFF"/>
      <text class="math" x="293" y="170">θ</text>
    </g>

    <!-- A -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="251" y="260" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="262" y="272">A</text>
    </g>

    <!-- 줄 길이 l -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="405" y="172" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="415" y="184">l</text>
    </g>

    <!-- 높이 l (좌측) -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="32" y="195" width="20" height="24" fill="#FFFFFF"/>
      <text class="math" x="42" y="207">l</text>
    </g>

    <!-- B -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="469" y="316" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="480" y="328">B</text>
    </g>

    <!-- C -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="557" y="316" width="22" height="24" fill="#FFFFFF"/>
      <text class="roman" x="568" y="328">C</text>
    </g>
  </g>
</svg>
</body>
</html>
