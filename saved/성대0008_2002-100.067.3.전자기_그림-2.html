<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0008_2002-100.067.3.전자기_그림-2</title>
</head>
<body>
<svg viewBox="0 0 600 550" width="600" height="550" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <g class="main-diagram">
    <!-- x축 및 y축 화살표 -->
    <line class="movable" x1="10" y1="265" x2="540" y2="265" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="270" y1="465" x2="270" y2="60" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 전하 점 A (-a, 0), 점 B (a, 0) -->
    <circle class="movable" cx="65" cy="265" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <circle class="movable" cx="480" cy="265" r="7" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 점 P(x,0)에 놓인 전하 Q (빈 원) -->
    <circle class="movable" cx="330" cy="265" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="555" y="275" font-family="'Times New Roman', serif" font-size="44" font-style="italic">x</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="270" y="50" font-family="'Times New Roman', serif" font-size="44" font-style="italic" text-anchor="middle">y</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="65" y="245" font-family="'Times New Roman', serif" font-size="42" font-style="italic" text-anchor="middle">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="80" y="320" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">A (-<tspan font-style="italic">a</tspan>, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="245" y="255" font-family="'Times New Roman', serif" font-size="42">O</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="330" y="245" font-family="'Times New Roman', serif" font-size="42" font-style="italic" text-anchor="middle">Q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="350" y="320" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">P (<tspan font-style="italic">x</tspan>, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="245" font-family="'Times New Roman', serif" font-size="42" font-style="italic" text-anchor="middle">q</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="480" y="320" font-family="'Times New Roman', serif" font-size="42" text-anchor="middle">B (<tspan font-style="italic">a</tspan>, 0)</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="270" y="525" font-family="'Batang', serif" font-size="38" font-weight="bold" text-anchor="middle">그림 2</text></g>
  </g>
</svg>
</body>
</html>
