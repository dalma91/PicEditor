<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-51-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Vertical Rod: x=115..130, y=40..320 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="115" y="40" width="15" height="280" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Pivot Point A with center pin -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="115" y="175" width="15" height="12" fill="#F1F3F4" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="122.5" cy="181" r="2.5" fill="#000000"/>

  <!-- Rotation curved arrow on right -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 135 105 A 75 75 0 0 1 135 255" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51-2)"/>

  <!-- Speed vector v at bottom tip pointing left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="110" y1="318" x2="70" y2="318" stroke="#000000" stroke-width="2" marker-end="url(#arrow-51-2)"/>

  <!-- LABELS -->
  <g class="movable text-wrap" transform="translate(122, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(95, 181) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(95, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">v</text>
  </g>
  <g class="movable text-wrap" transform="translate(122, 355) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 1-2</text>
  </g>
</svg>
</body>
</html>
