<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%">
  <defs>
    <marker id="arrow-58" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Central Horizontal Axis (중심축) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="55" y1="230" x2="555" y2="230" stroke="#000000" stroke-width="1.5" stroke-dasharray="7,4,2,4"/>
  <g class="movable text-wrap" transform="translate(570, 205)">
    <text class="text-el" x="12" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16">중</text>
    <text class="text-el" x="12" y="38" font-family="KoPubWorld Dotum, sans-serif" font-size="16">심</text>
    <text class="text-el" x="12" y="60" font-family="KoPubWorld Dotum, sans-serif" font-size="16">축</text>
  </g>

  <!-- Labels on right: 위, 아래 -->
  <g class="movable text-wrap" transform="translate(570, 35)">
    <text class="text-el" x="12" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">위</text>
  </g>
  <g class="movable text-wrap" transform="translate(570, 395)">
    <text class="text-el" x="12" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">아래</text>
  </g>

  <!-- Screen S (형광판) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="520" y1="40" x2="520" y2="420" stroke="#000000" stroke-width="4"/>
  <g class="movable text-wrap" transform="translate(510, 15)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">S</text>
  </g>

  <!-- Slit Electrode A3 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="135" x2="250" y2="225" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="235" x2="250" y2="325" stroke="#000000" stroke-width="3"/>
  <g class="movable text-wrap" transform="translate(235, 110)">
    <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan dy="3" font-size="14">3</tspan></text>
  </g>

  <!-- Electron Gun F2, A2 (Upper) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="132" x2="250" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 55 125 L 85 142 L 75 152" fill="none" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(25, 100)">
    <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan dy="3" font-size="14">2</tspan></text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="132" y1="135" x2="108" y2="178" stroke="#000000" stroke-width="2.5"/>
  <g class="movable text-wrap" transform="translate(140, 105)">
    <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan dy="3" font-size="14">2</tspan></text>
  </g>
  <!-- Battery V for upper gun -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 60 145 V 170 H 75" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="75" y1="162" x2="75" y2="178" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="166" x2="80" y2="174" stroke="#000000" stroke-width="3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 80 170 H 100 L 115 165" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="90" y1="170" x2="90" y2="185" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="84" y1="185" x2="96" y2="185" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="87" y1="189" x2="93" y2="189" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(42, 175)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">V</text>
  </g>


  <!-- Electron Gun F1, A1 (Lower) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="328" x2="250" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 55 335 L 85 318 L 75 308" fill="none" stroke="#000000" stroke-width="1.8"/>
  <g class="movable text-wrap" transform="translate(25, 345)">
    <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan dy="3" font-size="14">1</tspan></text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="132" y1="325" x2="108" y2="282" stroke="#000000" stroke-width="2.5"/>
  <g class="movable text-wrap" transform="translate(140, 260)">
    <text class="text-el" x="15" y="18" font-family="Times New Roman, serif" font-size="20" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan dy="3" font-size="14">1</tspan></text>
  </g>
  <!-- Battery V for lower gun -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 60 315 V 290 H 75" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="75" y1="282" x2="75" y2="298" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="80" y1="286" x2="80" y2="294" stroke="#000000" stroke-width="3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 80 290 H 100 L 115 295" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="90" y1="290" x2="90" y2="305" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="84" y1="305" x2="96" y2="305" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="87" y1="309" x2="93" y2="309" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(42, 280)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">V</text>
  </g>

  <!-- Beams passing through A3 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="230" x2="310" y2="195" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="230" x2="310" y2="265" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Angle theta arcs -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 305 230 A 55 55 0 0 0 298 199" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-58)" marker-end="url(#arrow-58)"/>
  <g class="movable text-wrap" transform="translate(315, 195)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 305 230 A 55 55 0 0 1 298 261" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-58)" marker-end="url(#arrow-58)"/>
  <g class="movable text-wrap" transform="translate(315, 245)">
    <text class="text-el" x="8" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <!-- Magnetic Field Direction Arrow (자기장의 방향) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="315" y1="90" x2="455" y2="90" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-58)"/>
  <g class="movable text-wrap" transform="translate(325, 60)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">자기장의 방향</text>
  </g>

  <!-- Magnetic Field Region (L) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="325" x2="250" y2="425" stroke="#000000" stroke-width="1.2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="250" y1="410" x2="520" y2="410" stroke="#000000" stroke-width="1.5"
        marker-start="url(#arrow-58)" marker-end="url(#arrow-58)"/>
  <g class="movable text-wrap" transform="translate(375, 378)">
    <rect class="text-bg-rect" x="0" y="0" width="22" height="24" fill="#FFFFFF"/>
    <text class="text-el" x="11" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">L</text>
  </g>
  <g class="movable text-wrap" transform="translate(265, 420)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="14">자기장이 존재하는 범위</text>
  </g>
</svg>
</body>
</html>
