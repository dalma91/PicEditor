<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-51" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ================= PANEL 1-1: 그림 1-1 ================= -->
  <!-- Horizontal Rod AB: x=60..400, y=145..160, length L -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="60" y="145" width="340" height="15" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Support Wedge a under A (60, 160): triangle -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)" points="60,160 50,185 70,185" fill="#000000"/>
  <!-- Velocity arrow for a moving right -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="75" y1="172" x2="105" y2="172" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51)"/>

  <!-- Support Wedge b under B (400, 160): triangle -->
  <polygon class="movable" transform="translate(0,0) scale(1,1) rotate(0)" points="400,160 390,185 410,185" fill="#000000"/>
  <!-- Velocity arrow for b moving left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="385" y1="172" x2="355" y2="172" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51)"/>

  <!-- Marks D and C on rod -->
  <!-- D at x=150, C at x=280 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="150" y1="160" x2="150" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="280" y1="160" x2="280" y2="175" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension L above rod: from (60, 145) to (400, 145) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 60 145 Q 230 95 400 145" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension d1: from a (60, 185) to C (280, 175) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 60 185 Q 170 245 280 175" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Dimension d2: from D (150, 175) to C (280, 175) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 150 175 Q 215 210 280 175" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- LABELS Panel 1-1 -->
  <g class="movable text-wrap" transform="translate(42, 155) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(418, 155) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(60, 202) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">a</text>
  </g>
  <g class="movable text-wrap" transform="translate(400, 202) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">b</text>
  </g>
  <g class="movable text-wrap" transform="translate(145, 190) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">D</text>
  </g>
  <g class="movable text-wrap" transform="translate(285, 190) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">C</text>
  </g>
  <g class="movable text-wrap" transform="translate(230, 110) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" font-weight="bold" fill="#000000">L</text>
  </g>
  <g class="movable text-wrap" transform="translate(170, 240) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">d<tspan font-size="14" dy="3">1</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(215, 205) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">d<tspan font-size="14" dy="3">2</tspan></text>
  </g>
  <g class="movable text-wrap" transform="translate(230, 280) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 1-1</text>
  </g>

  <!-- ================= PANEL 1-2: 그림 1-2 ================= -->
  <!-- Vertical Rod: x=535..550, y=40..320 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="535" y="40" width="15" height="280" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Pivot Point A with center pin -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="535" y="175" width="15" height="12" fill="#F1F3F4" stroke="#000000" stroke-width="1.5"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="542.5" cy="181" r="2.5" fill="#000000"/>

  <!-- Rotation curved arrow on right: from horizontal around (542, 181) to vertical -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 555 105 A 75 75 0 0 1 555 255" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-51)"/>

  <!-- Speed vector v at bottom tip pointing left -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="530" y1="318" x2="490" y2="318" stroke="#000000" stroke-width="2" marker-end="url(#arrow-51)"/>

  <!-- LABELS Panel 1-2 -->
  <g class="movable text-wrap" transform="translate(542, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <g class="movable text-wrap" transform="translate(518, 181) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(515, 305) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">v</text>
  </g>
  <g class="movable text-wrap" transform="translate(555, 355) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-36" y="-12" width="72" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 1-2</text>
  </g>
</svg>
</body>
</html>
