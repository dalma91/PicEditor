<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성대0018_2002-100.094.1.역학_그림</title>
</head>
<body>
<svg viewBox="0 0 550 400" width="550" height="400" class="select-mode">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
  </defs>

  <g class="main-diagram">
    <!-- 빗면 직각삼각형 ABC -->
    <polygon class="movable" points="80,85 500,320 80,320" fill="none" stroke="#000000" stroke-width="2.8" transform="translate(0,0) scale(1,1) rotate(0)" />
    <!-- C점 직각 기호 -->
    <rect class="movable" x="80" y="310" width="10" height="10" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 각도 theta 호 -->
    <path class="movable" d="M 465,320 A 40 40 0 0 0 460,305" fill="none" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 꼭대기 A점 위 질점 m 및 수평 속도 v0 화살표 -->
    <circle class="movable" cx="80" cy="80" r="9" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="90" y1="80" x2="140" y2="80" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 높이 h 치수 화살표 -->
    <line class="movable" x1="20" y1="85" x2="80" y2="85" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="20" y1="320" x2="80" y2="320" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="45" y1="85" x2="45" y2="320" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />

    <!-- 밑변 L 치수 화살표 -->
    <line class="movable" x1="80" y1="320" x2="80" y2="375" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="500" y1="320" x2="500" y2="375" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)" />
    <line class="movable" x1="80" y1="350" x2="500" y2="350" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow)" transform="translate(0,0) scale(1,1) rotate(0)" />
  </g>

  <g class="text-layer">
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="50" y="65" font-family="'Times New Roman', serif" font-size="44">A</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="80" y="55" font-family="'Times New Roman', serif" font-size="40" font-style="italic">m</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="120" y="65" font-family="'Times New Roman', serif" font-size="38" font-style="italic">v<tspan font-size="24" dy="8">0</tspan></text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="55" y="355" font-family="'Times New Roman', serif" font-size="44">C</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="510" y="335" font-family="'Times New Roman', serif" font-size="44">B</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="35" y="210" font-family="'Times New Roman', serif" font-size="46" font-style="italic">h</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2" fill="#FFFFFF"></rect><text class="text-el" x="290" y="360" font-family="'Times New Roman', serif" font-size="46" font-style="italic">L</text></g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)"><rect class="text-bg-rect" rx="2"></rect><text class="text-el" x="430" y="315" font-family="'Times New Roman', serif" font-size="36" font-style="italic">θ</text></g>
  </g>
</svg>
</body>
</html>
