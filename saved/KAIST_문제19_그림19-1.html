<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .movable {
    cursor: move;
  }
  .text-wrap {
    cursor: move;
  }
  .text-bg-rect {
    fill: #ffffff;
  }
  .text-el {
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg id="svg-editor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 290" width="100%" height="100%">
  <defs>
    <pattern id="rough-ground-dot" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#666666"/>
      <circle cx="5" cy="5" r="0.8" fill="#666666"/>
    </pattern>
    <marker id="rot-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="rad-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Rough Surface (shaded ellipse) -->
  <ellipse class="movable" cx="280" cy="175" rx="270" ry="95" fill="url(#rough-ground-dot)" stroke="#000000" stroke-width="1.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Inner Smooth Surface (white ellipse) -->
  <ellipse class="movable" cx="280" cy="175" rx="205" ry="70" fill="#FFFFFF" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius R Arrow from center (280, 175) to perimeter -->
  <line class="movable" x1="280" y1="175" x2="197" y2="238" stroke="#000000" stroke-width="1.5" marker-end="url(#rad-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dashed Orbit Ellipse of mass m -->
  <ellipse class="movable" cx="280" cy="175" rx="80" ry="25" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Central Vertical Post from (280, 175) to O(280, 40) -->
  <line class="movable" x1="280" y1="175" x2="280" y2="25" stroke="#000000" stroke-width="1.8" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Top Point O -->
  <circle class="movable" cx="280" cy="40" r="3.5" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Dimension l0 curve on left of post -->
  <path class="movable" d="M 280 43 C 255 75 255 140 280 172" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Radius r vector from center to mass m -->
  <line class="movable" x1="280" y1="175" x2="350" y2="168" stroke="#000000" stroke-width="1.5" marker-end="url(#rad-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Angle theta arc at O -->
  <path class="movable" d="M 280 75 A 35 35 0 0 1 296 68" fill="none" stroke="#000000" stroke-width="1.2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Helical Spring from O(280, 40) to mass m(355, 168) -->
  <!-- 7 coils drawn as smooth parametric path -->
  <path class="movable" d="M 280 40 
           C 285 45 292 48 290 52 C 286 56 280 54 283 58
           C 295 62 302 65 300 69 C 296 73 290 71 293 75
           C 305 79 312 82 310 86 C 306 90 300 88 303 92
           C 315 96 322 99 320 103 C 316 107 310 105 313 109
           C 325 113 332 116 330 120 C 326 124 320 122 323 126
           C 335 130 342 133 340 137 C 336 141 330 139 333 143
           C 345 147 352 150 350 154 L 355 168" fill="none" stroke="#000000" stroke-width="2" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Mass m (solid black circle) -->
  <circle class="movable" cx="355" cy="168" r="6" fill="#000000" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Rotation Direction Arrow -->
  <path class="movable" d="M 375 165 C 380 180 375 195 360 205" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#rot-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

  <!-- Text Labels -->
  <!-- O -->
  <g class="movable text-wrap" transform="translate(268, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">O</text>
  </g>

  <!-- l0 -->
  <g class="movable text-wrap" transform="translate(265, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">l<tspan font-size="14" dy="4">0</tspan></text>
  </g>

  <!-- theta -->
  <g class="movable text-wrap" transform="translate(290, 85) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">θ</text>
  </g>

  <!-- k (Spring constant) -->
  <g class="movable text-wrap" transform="translate(345, 105) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">k</text>
  </g>

  <!-- m -->
  <g class="movable text-wrap" transform="translate(372, 150) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">m</text>
  </g>

  <!-- r (Radius) -->
  <g class="movable text-wrap" transform="translate(315, 160) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-10" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">r</text>
  </g>

  <!-- R (Outer radius) -->
  <g class="movable text-wrap" transform="translate(205, 215) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-12" y="-12" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">R</text>
  </g>

  <!-- 거친 면 -->
  <g class="movable text-wrap" transform="translate(120, 100) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-32" y="-14" width="64" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" fill="#000000">거친 면</text>
  </g>

  <!-- 매끄러운 면 -->
  <g class="movable text-wrap" transform="translate(145, 185) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-45" y="-20" width="90" height="40" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="-8" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">매끄러운</text>
    <text class="text-el" x="0" y="12" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">면</text>
  </g>

  <!-- 회전 방향 -->
  <g class="movable text-wrap" transform="translate(425, 190) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-38" y="-14" width="76" height="28" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="17" fill="#000000">회전 방향</text>
  </g>
</svg>
</body>
</html>
