<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제2_그림2-2</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 450 430" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="thick-arrow-end" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#000000"/>
    </marker>
    <!-- 도선 해칭 패턴 -->
    <pattern id="loop-pattern" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#555555" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .roman { font-family: 'Times New Roman', serif; font-style: normal; font-size: 26px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .sub { font-family: 'Times New Roman', serif; font-style: italic; font-size: 18px; fill: #000000; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 22px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <g class="main-diagram">
    <!-- ========================================== -->
    <!-- 1. z축 (연직 중심선) -->
    <!-- ========================================== -->
    <line class="movable" x1="195" y1="380" x2="195" y2="20" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="215" y="15" transform="translate(0,0) scale(1,1) rotate(0)">z</text>

    <!-- ========================================== -->
    <!-- 2. 정사각형 도선 (3D 투시 평행사변형) -->
    <!-- ========================================== -->
    <polygon class="movable" points="90,120 370,120 310,310 30,310" fill="none" stroke="url(#loop-pattern)" stroke-width="10" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <polygon class="movable" points="90,120 370,120 310,310 30,310" fill="none" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 3. 좌측 도선 분해 벡터들 (위쪽 및 우측) -->
    <!-- ========================================== -->
    <!-- 연직 성분 화살표 -->
    <line class="movable" x1="60" y1="215" x2="60" y2="95" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 수평 성분 화살표 -->
    <line class="movable" x1="60" y1="215" x2="115" y2="215" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- ========================================== -->
    <!-- 4. 우측 도선 자기장 벡터 B 및 분해 성분 Bx, Bz -->
    <!-- ========================================== -->
    <!-- 자기장 합성 벡터 B (굵은 경사 화살표) -->
    <line class="movable" x1="340" y1="215" x2="275" y2="90" stroke="#000000" stroke-width="4.5" marker-end="url(#thick-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- B 벡터 레이블 (화살표 포함) -->
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <line x1="260" y1="50" x2="280" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-end)"/>
      <text class="math" x="270" y="70">B</text>
    </g>

    <!-- 연직 성분 Bz 화살표 -->
    <line class="movable" x1="340" y1="215" x2="340" y2="95" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="365" y="90">B<tspan class="sub" dy="6">z</tspan></text>
    </g>

    <!-- 수평 성분 Bx 화살표 -->
    <line class="movable" x1="340" y1="215" x2="280" y2="215" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="math" x="285" y="245">B<tspan class="sub" dy="6">x</tspan></text>
    </g>

    <!-- ========================================== -->
    <!-- 5. 정사각형 도선 지시 레이블 -->
    <!-- ========================================== -->
    <line class="movable" x1="355" y1="365" x2="320" y2="315" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="325" y="385">정사각형 도선</text>
    </g>
  </g>
</svg>
</body>
</html>
