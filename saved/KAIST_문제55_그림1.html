<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%">
  <defs>
    <marker id="arrow-55-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Water Surface (해면) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="30" y1="120" x2="590" y2="120" stroke="#000000" stroke-width="2"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="50" y1="130" x2="100" y2="130" stroke="#000000" stroke-width="1.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="60" y1="138" x2="90" y2="138" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(35, 88)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">해면</text>
  </g>

  <!-- Ship (배) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 270 120 L 275 138 L 325 138 L 330 120 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x="285" y="102" width="30" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="300" y1="102" x2="300" y2="92" stroke="#000000" stroke-width="1.8"/>

  <!-- Direction of ship motion -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="300" y1="70" x2="440" y2="70" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-55-1)"/>
  <g class="movable text-wrap" transform="translate(300, 42)">
    <text class="text-el" x="0" y="16" font-family="KoPubWorld Dotum, sans-serif" font-size="16" font-weight="bold">배가 나아가는 방향</text>
  </g>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="300" y1="120" x2="390" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow-55-1)"/>
  <g class="movable text-wrap" transform="translate(365, 95)">
    <text class="text-el" x="10" y="18" font-family="Times New Roman, serif" font-size="20" font-style="italic" text-anchor="middle">u</text>
  </g>

  <!-- Downward arrow v -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="300" y1="138" x2="300" y2="165" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-55-1)"/>
  <g class="movable text-wrap" transform="translate(285, 140)">
    <text class="text-el" x="0" y="16" font-family="Times New Roman, serif" font-size="16" font-style="italic">v</text>
  </g>

  <!-- Vertical dashed centerline -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="300" y1="138" x2="300" y2="390" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Seabed (해저) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="25" y1="365" x2="595" y2="365" stroke="#000000" stroke-width="6"/>
  <g class="movable text-wrap" transform="translate(30, 335)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold">해저</text>
  </g>

  <!-- Forward Beam: 발신음 1 to (410, 365) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="312" y1="155" x2="408" y2="340" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow-55-1)"/>
  <!-- Return Beam 1: 반사음 1 from (400, 350) back towards ship -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="385" y1="330" x2="330" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>

  <!-- Backward Beam: 발신음 2 to (190, 365) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="288" y1="155" x2="192" y2="340" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow-55-1)"/>
  <!-- Return Beam 2: 반사음 2 from (200, 350) back towards ship -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="215" y1="330" x2="270" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>

  <!-- Angle theta arcs -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 300 205 A 55 55 0 0 1 324 195" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-1)" marker-end="url(#arrow-55-1)"/>
  <g class="movable text-wrap" transform="translate(305, 172)">
    <text class="text-el" x="10" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 300 205 A 55 55 0 0 0 276 195" fill="none" stroke="#000000" stroke-width="1.2"
        marker-start="url(#arrow-55-1)" marker-end="url(#arrow-55-1)"/>
  <g class="movable text-wrap" transform="translate(275, 172)">
    <text class="text-el" x="10" y="16" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle">θ</text>
  </g>

  <!-- Labels on Beams: Distinct positions on left and right -->
  <!-- Right: 발신음 1 (outside), 반사음 1 (inside) -->
  <g class="movable text-wrap" transform="translate(365, 230) rotate(58)">
    <rect class="text-bg-rect" x="-5" y="-12" width="65" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="KoPubWorld Dotum, sans-serif" font-size="14" font-weight="bold">발신음 1</text>
  </g>
  <g class="movable text-wrap" transform="translate(330, 275) rotate(58)">
    <rect class="text-bg-rect" x="-5" y="-12" width="65" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="KoPubWorld Dotum, sans-serif" font-size="14">반사음 1</text>
  </g>

  <!-- Left: 발신음 2 (outside), 반사음 2 (inside) -->
  <g class="movable text-wrap" transform="translate(195, 230) rotate(-58)">
    <rect class="text-bg-rect" x="-5" y="-12" width="65" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="KoPubWorld Dotum, sans-serif" font-size="14" font-weight="bold">발신음 2</text>
  </g>
  <g class="movable text-wrap" transform="translate(240, 275) rotate(-58)">
    <rect class="text-bg-rect" x="-5" y="-12" width="65" height="20" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="KoPubWorld Dotum, sans-serif" font-size="14">반사음 2</text>
  </g>

  <!-- Diffuse reflection scattering at seabed -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 160 365 A 30 30 0 0 1 220 365" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 145 365 A 45 45 0 0 1 235 365" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="185" y1="355" x2="135" y2="305" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="180" y1="360" x2="105" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>

  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 380 365 A 30 30 0 0 1 440 365" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 365 365 A 45 45 0 0 1 455 365" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="415" y1="355" x2="465" y2="305" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="420" y1="360" x2="495" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-55-1)"/>

  <!-- Caption -->
  <g class="movable text-wrap" transform="translate(300, 425)">
    <text class="text-el" x="0" y="18" font-family="KoPubWorld Dotum, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">그림 4</text>
  </g>
</svg>
</body>
</html>
