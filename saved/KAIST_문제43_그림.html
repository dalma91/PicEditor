<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-43" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <pattern id="hatch-43" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#777777" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ================= PANEL 1: 그림 1 ================= -->
  <!-- Floor line at y=155 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="155" x2="480" y2="155" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="40" y="155" width="440" height="14" fill="url(#hatch-43)"/>

  <!-- Lower Plate A: fixed on floor at y=150..155, x=100..360 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="100" y="149" width="260" height="6" fill="#E8F0FE" stroke="#000000" stroke-width="1.8"/>

  <!-- Upper Plate B: at y=95..101, x=100..360 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="100" y="95" width="260" height="6" fill="#E8F0FE" stroke="#000000" stroke-width="1.8"/>

  <!-- Dimension l between plates -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="125" y1="103" x2="125" y2="147" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-43)" marker-end="url(#arrow-43)"/>

  <!-- Circuit for Panel 1 -->
  <!-- From Plate B right end (350, 98) up to switch -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="350" y1="98" x2="350" y2="48" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="350" y1="48" x2="385" y2="48" stroke="#000000" stroke-width="1.8"/>
  <!-- Switch S: open contact -->
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="385" cy="48" r="2" fill="#000000"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="385" y1="48" x2="415" y2="35" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="425" cy="48" r="2" fill="#000000"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="425" y1="48" x2="445" y2="48" stroke="#000000" stroke-width="1.8"/>
  <!-- Down to battery V0 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="445" y1="48" x2="445" y2="82" stroke="#000000" stroke-width="1.8"/>
  <!-- Battery V0 plates: long line (+), short thick line (-) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="432" y1="82" x2="458" y2="82" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="438" y1="90" x2="452" y2="90" stroke="#000000" stroke-width="4"/>
  <!-- Wire from battery (-) curving down to plate A right end (360, 152) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 445 90 L 445 120 Q 445 152 360 152" fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- LABELS Panel 1 -->
  <!-- A, B -->
  <g class="movable text-wrap" transform="translate(80, 150) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(80, 98) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <!-- l -->
  <g class="movable text-wrap" transform="translate(142, 125) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-8" y="-12" width="16" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">l</text>
  </g>
  <!-- S -->
  <g class="movable text-wrap" transform="translate(405, 25) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">S</text>
  </g>
  <!-- V0 -->
  <g class="movable text-wrap" transform="translate(485, 86) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">0</tspan></text>
  </g>
  <!-- 그림 1 -->
  <g class="movable text-wrap" transform="translate(230, 195) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-32" y="-12" width="64" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 1</text>
  </g>

  <!-- ================= PANEL 2: 그림 2 ================= -->
  <!-- Floor line at y=375 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="40" y1="375" x2="480" y2="375" stroke="#000000" stroke-width="2.5"/>
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="40" y="375" width="440" height="14" fill="url(#hatch-43)"/>

  <!-- Lower Plate A on floor: y=369..375 -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="100" y="369" width="260" height="6" fill="#E8F0FE" stroke="#000000" stroke-width="1.8"/>

  <!-- Upper Plate B: at y=328..334 (distance 3/4 l = 41px) -->
  <rect class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x="100" y="328" width="260" height="6" fill="#E8F0FE" stroke="#000000" stroke-width="1.8"/>

  <!-- Vertical helical spring between plates at center x=230 -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 230 334 L 230 338 Q 239.0 339.7 230.0 341.4 Q 221.0 343.1 230.0 344.8 Q 239.0 346.4 230.0 348.1 Q 221.0 349.8 230.0 351.5 Q 239.0 353.2 230.0 354.9 Q 221.0 356.6 230.0 358.2 Q 239.0 359.9 230.0 361.6 Q 221.0 363.3 230.0 365.0 L 230 369" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Dimension 3/4 l between plates -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="125" y1="336" x2="125" y2="367" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow-43)" marker-end="url(#arrow-43)"/>

  <!-- Circuit for Panel 2 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="350" y1="331" x2="350" y2="268" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="350" y1="268" x2="385" y2="268" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="385" cy="268" r="2" fill="#000000"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="385" y1="268" x2="415" y2="255" stroke="#000000" stroke-width="1.8"/>
  <circle class="movable" transform="translate(0,0) scale(1,1) rotate(0)" cx="425" cy="268" r="2" fill="#000000"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="425" y1="268" x2="445" y2="268" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="445" y1="268" x2="445" y2="302" stroke="#000000" stroke-width="1.8"/>
  <!-- Battery V0 -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="432" y1="302" x2="458" y2="302" stroke="#000000" stroke-width="2.5"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)" x1="438" y1="310" x2="452" y2="310" stroke="#000000" stroke-width="4"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)" d="M 445 310 L 445 340 Q 445 372 360 372" fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- LABELS Panel 2 -->
  <!-- A, B -->
  <g class="movable text-wrap" transform="translate(80, 370) scale(1,1) rotate(0)">
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">A</text>
  </g>
  <g class="movable text-wrap" transform="translate(80, 331) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">B</text>
  </g>
  <!-- 3/4 l -->
  <g class="movable text-wrap" transform="translate(152, 350) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="18" font-style="italic" fill="#000000">¾<tspan font-style="italic">l</tspan></text>
  </g>
  <!-- S -->
  <g class="movable text-wrap" transform="translate(405, 245) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-10" y="-12" width="20" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#000000">S</text>
  </g>
  <!-- V0 -->
  <g class="movable text-wrap" transform="translate(485, 306) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-14" y="-12" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#000000">V<tspan font-size="14" dy="3">0</tspan></text>
  </g>
  <!-- 그림 2 -->
  <g class="movable text-wrap" transform="translate(230, 415) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="-32" y="-12" width="64" height="24" rx="2" fill="#FFFFFF"/>
    <text class="text-el" x="0" y="0" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#000000">그림 2</text>
  </g>
</svg>
</body>
</html>
