<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2003.101.4.원자_그림</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-editor" viewBox="0 0 1212 1320" class="select-mode" width="100%" height="100%">
  <!-- 배경 백색 사각형 -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="axis-arrow-end" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#000000"/>
    </marker>
    <marker id="ray-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 6 L 0 10.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 44px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .greek { font-family: 'Times New Roman', serif; font-style: italic; font-size: 46px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 40px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .korean-bold { font-family: 'KoPubWorld Dotum', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 42px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .axis-line { stroke: #000000; stroke-width: 3.5; fill: none; }
    .ray-line { stroke: #000000; stroke-width: 6.0; fill: none; stroke-linecap: round; }
  </style>

  <g class="main-diagram">
    <!-- 1. 경계면 및 직교 좌표축 -->
    <!-- x축 (매질 1과 매질 2의 경계면) -->
    <line class="movable" x1="20" y1="560" x2="1140" y2="560" stroke="#000000" stroke-width="6.5" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="1080" y="520" transform="translate(0,0) scale(1,1) rotate(0)">x</text>

    <!-- y축 (경계면의 법선) -->
    <line class="movable axis-line" x1="606" y1="1050" x2="606" y2="50" marker-end="url(#axis-arrow-end)" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable math" x="660" y="65" transform="translate(0,0) scale(1,1) rotate(0)">y</text>

    <!-- 원점 직각 기호 -->
    <polyline class="movable" points="606,480 690,480 690,560" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 2. 매질 레이블 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="930" y="150">매질 1</text>
    </g>
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <text class="korean" x="930" y="800">매질 2</text>
    </g>

    <!-- 3. 입사 광선 (매질 1) -->
    <!-- 입사선: (265, 150) -> (606, 560), 각도 약 40도 -->
    <line class="movable ray-line" x1="265" y1="150" x2="606" y2="560" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 입사 방향 화살표 -->
    <line class="movable" x1="380" y1="288" x2="400" y2="312" stroke="#000000" stroke-width="4.0" marker-end="url(#ray-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 입사각 theta 호 및 레이블 -->
    <path class="movable" d="M 480 408 A 200 200 0 0 1 606 360" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="505" y="270" transform="translate(0,0) scale(1,1) rotate(0)">θ</text>

    <!-- 4. 굴절 광선 (매질 2) -->
    <!-- 굴절선: (606, 560) -> (805, 1010), 각도 약 24도 -->
    <line class="movable ray-line" x1="606" y1="560" x2="805" y2="1010" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <!-- 굴절 방향 화살표 -->
    <line class="movable" x1="720" y1="818" x2="745" y2="874" stroke="#000000" stroke-width="4.0" marker-end="url(#ray-arrow)" transform="translate(0,0) scale(1,1) rotate(0)"/>

    <!-- 굴절각 phi 호 및 레이블 -->
    <path class="movable" d="M 606 760 A 200 200 0 0 0 690 750" fill="none" stroke="#000000" stroke-width="2.5" transform="translate(0,0) scale(1,1) rotate(0)"/>
    <text class="movable greek" x="650" y="830" transform="translate(0,0) scale(1,1) rotate(0)">ϕ</text>

    <!-- 5. 하단 캡션: 그림 4 -->
    <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
      <rect class="text-bg-rect" x="510" y="1235" width="200" height="58" fill="#FFFFFF"/>
      <text class="korean-bold" x="606" y="1265">그림 4</text>
    </g>
  </g>
</svg>
</body>
</html>
