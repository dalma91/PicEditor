<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <defs>
    <marker id="arrow-68-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Turntable Disk 3D Perspective -->
  <!-- Disk Top Rim: cx=290, cy=180, rx=240, ry=115 -->
  <!-- Disk Skirt: down 20px -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 50 180 A 240 115 0 0 0 530 180 V 202 A 240 115 0 0 1 50 202 Z"
        fill="#e2e8f0" stroke="#000000" stroke-width="2"/>
  <ellipse class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
           cx="290" cy="180" rx="240" ry="115" fill="#f8fafc" stroke="#000000" stroke-width="2"/>

  <!-- Rectangular Groove passing through center O (290, 180) -->
  <!-- Slanted slot: from (120, 240) to (430, 120), width 24 -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 115 255 L 425 135 L 440 148 L 130 268 Z"
        fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <!-- Groove depth lines -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="115" y1="255" x2="115" y2="270" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="130" y1="268" x2="130" y2="283" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="115" y1="270" x2="130" y2="283" stroke="#000000" stroke-width="1.8"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="115" y1="270" x2="425" y2="150" stroke="#000000" stroke-width="1.2"/>

  <!-- Center Post at (275, 193) -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="275" y1="205" x2="275" y2="180" stroke="#000000" stroke-width="3"/>

  <!-- Horizontal Spring in Groove -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 275 190
           C 285 186, 282 178, 290 184
           C 298 180, 295 172, 303 178
           C 311 174, 308 166, 316 172
           C 324 168, 321 160, 329 166
           L 335 164"
        fill="none" stroke="#000000" stroke-width="1.8"/>

  <!-- Block A in Groove (3D box) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 335 160 L 365 148 L 375 156 L 345 168 Z" fill="#e2e8f0" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 335 160 L 345 168 V 180 L 335 172 Z" fill="#cbd5e1" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 345 168 L 375 156 V 168 L 345 180 Z" fill="#94a3b8" stroke="#000000" stroke-width="1.5"/>

  <!-- Block B stacked on top of Block A (3D box) -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 342 145 L 372 133 L 382 141 L 352 153 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 342 145 L 352 153 V 165 L 342 157 Z" fill="#e2e8f0" stroke="#000000" stroke-width="1.5"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 352 153 L 382 141 V 153 L 352 165 Z" fill="#cbd5e1" stroke="#000000" stroke-width="1.5"/>

  <!-- Labels A, B -->
  <polyline class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            points="322,125 336,125 342,152" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="304" y="112" width="16" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="312" y="130" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">A</text>
  </g>
  <polyline class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
            points="332,95 348,95 362,135" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g class="movable text-wrap" transform="translate(0,0) scale(1,1) rotate(0)">
    <rect class="text-bg-rect" x="314" y="82" width="16" height="22" fill="#FFFFFF"/>
    <text class="text-el" x="322" y="100" font-family="'Times New Roman', serif" font-size="20" text-anchor="middle">B</text>
  </g>

  <!-- Drive Shaft extending down -->
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="288" y1="202" x2="288" y2="400" stroke="#000000" stroke-width="3"/>
  <line class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        x1="294" y1="202" x2="294" y2="400" stroke="#000000" stroke-width="3"/>
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 288 400 A 3 2 0 0 0 294 400" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Rotation Arrow around shaft -->
  <path class="movable" transform="translate(0,0) scale(1,1) rotate(0)"
        d="M 255 330 C 265 350, 315 350, 325 315" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow-68-1)"/>
</svg>
</body>
</html>
